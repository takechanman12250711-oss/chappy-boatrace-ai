# GitHub Pages（ブランチ公開）の設定。
# 2026-11-03: 公開物が10GBを超えてPages反映が失敗していたため、
# アプリ画面が読み込まない大きな保存データ・開発用ファイルを公開対象から外す。
# リポジトリ内のファイルは削除・変更しない（公開サイトへコピーしないだけ）。
# 画面が使うもの（index.html, js, css, assets, config, data/predictions の
# summaries・index-shards・index系JSON・calibration・improvement-review,
# data/stats, data/config, data/analysis, data/note-drafts）は残す。
# 変更時は node scripts/test-pages-publish-scope.js を実行する。
exclude:
  # 日付ごとの全予想原本（各約100MB）。画面は summaries/ を優先して読み、
  # 全日付に summaries があることをテストで確認する。
  - "data/predictions/20[0-9][0-9][0-1][0-9][0-3][0-9].json"
  - data/predictions/source-archives
  - data/results
  - data/outer-attack-sources
  - data/independent-autonomous-forward
  - data/independent-head-forward-v2
  - data/verification-coverage
  - data/external-reference
  - data/experiments
  - docs
  - scripts
  - tests
  - tools
  - workflows
  - api
  - package.json
  - "*.md"
