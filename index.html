<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>チャッピーボートレースAI</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <header class="app-header">
    <div>
      <h1>🚤 チャッピーボートレースAI</h1>
      <p>情報 → 展開 → スコア → フォーメーション → 解説</p>
    </div>
  </header>

  <main class="app">

    <section class="panel control-panel">
      <h2>レース選択</h2>

      <div class="form-grid">
        <label>
          場
          <select id="placeSelect">
            <option value="桐生">桐生</option>
            <option value="戸田">戸田</option>
            <option value="江戸川">江戸川</option>
            <option value="平和島">平和島</option>
            <option value="多摩川">多摩川</option>
            <option value="浜名湖">浜名湖</option>
            <option value="蒲郡">蒲郡</option>
            <option value="常滑">常滑</option>
            <option value="津">津</option>
            <option value="三国">三国</option>
            <option value="びわこ">びわこ</option>
            <option value="住之江">住之江</option>
            <option value="尼崎">尼崎</option>
            <option value="鳴門">鳴門</option>
            <option value="丸亀">丸亀</option>
            <option value="児島">児島</option>
            <option value="宮島">宮島</option>
            <option value="徳山">徳山</option>
            <option value="下関">下関</option>
            <option value="若松">若松</option>
            <option value="芦屋">芦屋</option>
            <option value="福岡">福岡</option>
            <option value="唐津">唐津</option>
            <option value="大村">大村</option>
          </select>
        </label>

        <label>
          レース
          <select id="raceSelect">
            <option value="1R">1R</option>
            <option value="2R">2R</option>
            <option value="3R">3R</option>
            <option value="4R">4R</option>
            <option value="5R">5R</option>
            <option value="6R">6R</option>
            <option value="7R">7R</option>
            <option value="8R">8R</option>
            <option value="9R">9R</option>
            <option value="10R">10R</option>
            <option value="11R">11R</option>
            <option value="12R">12R</option>
          </select>
        </label>

        <label>
          日付
          <input id="dateInput" type="date" />
        </label>
      </div>

      <div class="button-row">
        <button id="fetchRaceBtn" class="primary-btn">出走表取得して予想</button>
        <button id="refreshOddsBtn" class="sub-btn">オッズ更新</button>
        <button id="reloadRaceBtn" class="sub-btn">再取得</button>
      </div>

      <div id="statusArea" class="status">待機中</div>
    </section>

    <section id="errorArea"></section>

    <section class="layout-grid">
      <div id="raceListArea"></div>
      <div id="engineArea"></div>
    </section>
        <section class="layout-grid">

      <div id="raceFlowArea"></div>

      <div id="mainSheetArea"></div>

    </section>

    <section class="layout-grid">

      <div id="formationArea"></div>

      <div id="manshuSheetArea"></div>

    </section>

    <section class="layout-grid">

      <div id="oddsArea"></div>

      <div id="alertArea"></div>

    </section>

    <section class="layout-grid">

      <div id="finalCommentArea"></div>

      <div id="statsArea"></div>

    </section>

    <section class="layout-grid">

      <div class="panel">

        <h2>🎯 レース結果登録</h2>

        <div class="form-grid">

          <label>
            レース結果
            <input
              id="raceResultInput"
              type="text"
              placeholder="例：1-2-3"
            >
          </label>

          <label>
            オッズ
            <input
              id="oddsInput"
              type="number"
              step="0.1"
            >
          </label>

          <label>
            購入金額
            <input
              id="betAmountInput"
              type="number"
              value="1000"
            >
          </label>

        </div>

        <div id="autoPayoutText">
          払戻金：0円
        </div>

        <div class="button-row result-buttons">

          <button
            id="saveResultBtn"
            class="primary-btn"
          >
            成績保存
          </button>

          <button
            id="undoResultBtn"
            class="sub-btn"
          >
            1件取り消し
          </button>

        </div>

      </div>

      <div class="panel">

        <h2>📈 AIダッシュボード</h2>

        <div id="aiIndexArea"></div>

        <div id="theoryArea"></div>

        <div id="weatherArea"></div>

        <div id="venueArea"></div>

      </div>

    </section>
        <section class="layout-grid">

      <div id="raceFlowArea" class="panel">
        <h2>🌊 展開予想</h2>
      </div>

      <div id="mainSheetArea" class="panel blue-panel">
        <h2>🎯 青シート（本命予想）</h2>
      </div>

    </section>

    <section class="layout-grid">

      <div id="formationArea" class="panel">
        <h2>📋 フォーメーション</h2>
      </div>

      <div id="manshuSheetArea" class="panel pink-panel">
        <h2>💣 ピンクシート（万舟予想）</h2>
      </div>

    </section>

    <section class="layout-grid">

      <div id="alertArea" class="panel">
        <h2>🚨 AI・理論アラート</h2>
      </div>

      <div id="oddsArea" class="panel">
        <h2>💴 オッズ・期待値</h2>
      </div>

    </section>

    <section class="layout-grid">

      <div class="panel">
        <h2>🤖 チャッピーAI指数</h2>
        <div id="aiIndexArea"></div>
      </div>

      <div class="panel">
        <h2>🧠 舟券太郎理論</h2>
        <div id="theoryArea"></div>
      </div>

    </section>

    <section class="layout-grid">

      <div class="panel">
        <h2>⚙ モーター・ボート評価</h2>
        <div id="materialArea"></div>
      </div>

      <div class="panel">
        <h2>🌤 水面・気象情報</h2>
        <div id="weatherArea"></div>
      </div>

    </section>

    <section class="panel">

      <h2>🏁 最終コメント</h2>

      <div id="finalCommentArea"></div>

    </section>

    <section class="panel">

      <h2>📈 成績管理</h2>

      <div class="result-input">

        <input
          id="raceResultInput"
          type="text"
          placeholder="例：1-2-3">

        <input
          id="oddsInput"
          type="number"
          placeholder="オッズ">

        <input
          id="betAmountInput"
          type="number"
          value="100"
          placeholder="購入金額">

      </div>

      <div id="autoPayoutText">
        払戻金：0円
      </div>

      <div class="button-row result-buttons">

        <button id="saveResultBtn">
          成績保存
        </button>

        <button id="undoResultBtn">
          取り消し
        </button>

      </div>

      <div id="statsArea"></div>

    </section>
      </main>

  <script src="./script.js"></script>
</body>
</html>
