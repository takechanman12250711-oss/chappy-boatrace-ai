name: Note paid UI smoke once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/note-paid-ui-smoke-once.yml'

permissions:
  contents: read

jobs:
  paid-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X_LOGIN_ID: ${{ secrets.X_LOGIN_ID }}
      X_PASSWORD: ${{ secrets.X_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify transport tests
        run: node scripts/note-github-ui-transport.test.js
      - name: Run unpublished paid UI smoke
        run: node scripts/note-paid-ui-smoke.js
