name: Note paid UI smoke once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/note-paid-ui-smoke-once.yml'

permissions:
  contents: read

jobs:
  paid-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTE_STATE_JSON_BASE64: ${{ secrets.NOTE_STATE_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify transport tests
        run: node scripts/note-github-ui-transport.test.js
      - name: Run unpublished paid UI smoke from saved state
        run: xvfb-run -a node scripts/note-paid-ui-smoke.js
