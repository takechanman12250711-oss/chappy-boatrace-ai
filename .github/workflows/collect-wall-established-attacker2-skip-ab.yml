name: Collect wall-established attacker2 skip A/B

on:
  pull_request:
    paths:
      - "config/wall-purchase-approval.json"
      - "scripts/test-wall-purchase-policy.js"
      - "js/practical-selection.js"
      - "data/experiments/wall-established-attacker2-skip-preregistration.json"
      - "scripts/build-wall-established-attacker2-skip-ab-report.js"
      - "scripts/theory-validation-phase6-prospective-integration.cjs"
      - "scripts/theory-validation-phase7-lifecycle.cjs"
      - "scripts/theory-validation-phase8-cycle.cjs"
      - "tests/theory-validation-phase6-prospective-integration.test.cjs"
      - "tests/theory-validation-phase7-lifecycle.test.cjs"
      - "tests/theory-validation-phase8-cycle.test.cjs"
      - ".github/workflows/collect-wall-established-attacker2-skip-ab.yml"
      - "scripts/result-report-checkpoint.cjs"
      - "scripts/test-water-wall-report-save.cjs"
      - "scripts/persist-theory-validation-cycle.cjs"
      - "scripts/test-phase8-single-writer.cjs"
  push:
    branches:
      - main
    paths:
      - "config/wall-purchase-approval.json"
      - "scripts/theory-validation-phase7-lifecycle.cjs"
      - "scripts/theory-validation-phase8-cycle.cjs"
      - "data/results/**"
      - ".github/workflows/collect-wall-established-attacker2-skip-ab.yml"
      - "scripts/result-report-checkpoint.cjs"
      - "scripts/test-water-wall-report-save.cjs"
      - "scripts/persist-theory-validation-cycle.cjs"
      - "scripts/test-phase8-single-writer.cjs"
  workflow_run:
    workflows:
      - "Collect official race results"
    types:
      - completed
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-main', github.workflow) }}
  cancel-in-progress: false

jobs:
  verify-and-collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.reports.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify prospective A/B and theory lifecycle contracts
        run: |
          node --check scripts/build-wall-established-attacker2-skip-ab-report.js
          node scripts/test-wall-established-attacker2-skip-ab-report.js
          node scripts/test-water-wall-report-save.cjs
          node scripts/test-phase8-single-writer.cjs
          node scripts/test-wall-purchase-policy.js
          node tests/theory-validation-phase6-prospective-integration.test.cjs
          node scripts/theory-validation-phase6-prospective-integration.cjs
          node tests/theory-validation-phase7-lifecycle.test.cjs
          node scripts/theory-validation-phase7-lifecycle.cjs
          node tests/theory-validation-phase8-cycle.test.cjs
          node scripts/theory-validation-phase8-cycle.cjs

      - name: Restore canonical prediction sources and build reports
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-wall-established-attacker2-skip-ab-report.js
          node scripts/theory-validation-phase6-prospective-integration.cjs --output=data/stats/theory-validation-phase6-prospective.json
          node scripts/theory-validation-phase7-lifecycle.cjs --output=data/stats/theory-validation-phase7-lifecycle.json
          node scripts/prepare-daily-prediction-git-save.js --all

      - name: Package verified wall and lifecycle reports
        if: github.event_name != 'pull_request'
        run: node scripts/result-report-checkpoint.cjs pack wall-prospective-lifecycle "$RUNNER_TEMP/wall-report/checkpoint.json"

      - name: Upload verified wall and lifecycle reports
        if: github.event_name != 'pull_request'
        id: reports
        uses: actions/upload-artifact@v4
        with:
          name: wall-prospective-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wall-report/checkpoint.json
          retention-days: 3
          if-no-files-found: error

  publish_reports:
    needs: verify-and-collect
    if: github.event_name != 'pull_request' && needs.verify-and-collect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    outputs:
      saved_sha: ${{ steps.save_reports.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/stats
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download verified wall and lifecycle reports
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-collect.outputs.artifact_id }}
          path: ${{ runner.temp }}/wall-report
          merge-multiple: true
      - name: Publish verified wall and lifecycle reports
        id: save_reports
        env:
          BASE_SHA: ${{ needs.verify-and-collect.outputs.source_sha }}
        run: node scripts/result-report-checkpoint.cjs publish wall-prospective-lifecycle "$RUNNER_TEMP/wall-report/checkpoint.json" "$BASE_SHA"

  refresh_cycle:
    needs: publish_reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    outputs:
      saved_sha: ${{ steps.refresh.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            js
            api
            config
            data/stats
            data/experiments
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh saved phase8 from current main
        id: refresh
        run: node scripts/persist-theory-validation-cycle.cjs
