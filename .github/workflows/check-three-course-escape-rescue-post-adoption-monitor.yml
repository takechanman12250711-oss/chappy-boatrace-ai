name: Check three-course escape rescue post-adoption monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "js/practical-selection.js"
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/evaluated-scenario-candidates.js"
      - "js/three-course-escape-rescue-fixed5.js"
      - "scripts/monitor-three-course-escape-rescue.js"
      - "scripts/test-escape-rescue-post-adoption-monitor-writer-contract.js"
      - "scripts/restore-daily-prediction-source.js"
      - "scripts/strong-escape-monitor-sources.cjs"
      - "scripts/daily-prediction-source-archive.js"
      - "scripts/test-escape-rescue-canonical-sources.cjs"
      - "scripts/fixtures/three-course-escape-rescue-before-source-streaming.js"
      - "scripts/fixtures/four-kado-escape-rescue-before-source-streaming.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-three-course-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/check-four-kado-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/collect-results.yml"
  push:
    branches: [main]
    paths:
      - "js/practical-selection.js"
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/evaluated-scenario-candidates.js"
      - "js/three-course-escape-rescue-fixed5.js"
      - "scripts/monitor-three-course-escape-rescue.js"
      - "scripts/test-escape-rescue-post-adoption-monitor-writer-contract.js"
      - "scripts/restore-daily-prediction-source.js"
      - "scripts/strong-escape-monitor-sources.cjs"
      - "scripts/daily-prediction-source-archive.js"
      - "scripts/test-escape-rescue-canonical-sources.cjs"
      - "scripts/fixtures/three-course-escape-rescue-before-source-streaming.js"
      - "scripts/fixtures/four-kado-escape-rescue-before-source-streaming.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-three-course-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/check-four-kado-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/collect-results.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          # Fetch every canonical input without duplicate archive-backed raw blobs.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/predictions/
            !/data/predictions/20??????.json
            /data/stats/three-course-escape-rescue-post-adoption-monitor.json
      - name: Include every unarchived prediction source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const base = 'data/predictions/';
          const daily = execFileSync('git', ['ls-tree', '--name-only', 'HEAD:data/predictions'], { encoding: 'utf8' })
            .trim().split('\n').filter(name => /^\d{8}\.json$/.test(name));
          const unarchived = daily.filter(name => {
            const date = name.slice(0, 8);
            return !['.json.gz', '.meta.json'].every(suffix => fs.existsSync(base + 'source-archives/' + date + suffix));
          }).map(name => '/' + base + name);
          if (unarchived.length) execFileSync('git', ['sparse-checkout', 'add', '--stdin'], { input: unarchived.join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'] });
          console.log('Kept all archives and ' + unarchived.length + ' unarchived daily sources. Archive-backed raw JSON is restored with SHA checks by the existing test.');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify canonical rescue source parity
        run: node scripts/test-escape-rescue-canonical-sources.cjs
      - name: Build read-only real diagnostics
        run: |
          node --check scripts/monitor-three-course-escape-rescue.js
          node scripts/monitor-three-course-escape-rescue.js --canonical-sources
          node scripts/test-escape-rescue-post-adoption-monitor-writer-contract.js
          node scripts/check-charter.js
          git diff --check
