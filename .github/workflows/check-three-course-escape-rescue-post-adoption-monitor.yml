name: Check three-course escape rescue post-adoption monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "js/practical-selection.js"
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/evaluated-scenario-candidates.js"
      - "js/three-course-escape-rescue-fixed5.js"
      - "scripts/monitor-three-course-escape-rescue.js"
      - "scripts/test-escape-rescue-post-adoption-monitor-writer-contract.js"
      - "scripts/restore-daily-prediction-source.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-three-course-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/check-four-kado-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/collect-results.yml"
  push:
    branches: [main]
    paths:
      - "js/practical-selection.js"
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/evaluated-scenario-candidates.js"
      - "js/three-course-escape-rescue-fixed5.js"
      - "scripts/monitor-three-course-escape-rescue.js"
      - "scripts/test-escape-rescue-post-adoption-monitor-writer-contract.js"
      - "scripts/restore-daily-prediction-source.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-three-course-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/check-four-kado-escape-rescue-post-adoption-monitor.yml"
      - ".github/workflows/collect-results.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Build read-only real diagnostics
        run: |
          node --check scripts/monitor-three-course-escape-rescue.js
          node scripts/monitor-three-course-escape-rescue.js
          node scripts/test-escape-rescue-post-adoption-monitor-writer-contract.js
          node scripts/check-charter.js
          git diff --check
