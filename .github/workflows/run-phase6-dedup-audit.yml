name: Run corrected Phase6 audit once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-phase6-dedup-audit.yml"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase6-cross-source-dedup
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild audit inputs and report
        run: |
          node scripts/build-result-review.js
          node scripts/build-theory-evaluations.js
          node scripts/build-miss-cause-analysis.js
          node scripts/build-improvement-proposal-report.js
          node scripts/build-theory-performance-report.js
          node scripts/build-theory-adoption-phase5.js
          node scripts/build-phase6-data-audit.js
      - name: Save stats only
        run: |
          git add data/stats
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Save corrected Phase6 live audit"
          git push origin fix/phase6-cross-source-dedup
