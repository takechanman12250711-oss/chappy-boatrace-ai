name: TinyFish CDP Driver

on:
  pull_request:
    paths:
      - 'scripts/tinyfish-cdp-config.js'
      - 'scripts/test-tinyfish-cdp-config.js'
      - 'scripts/tinyfish-browser-session.js'
      - 'scripts/test-tinyfish-browser-session.js'
      - '.github/workflows/tinyfish-cdp-driver.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-tinyfish-cdp-config.js
      - run: node scripts/test-tinyfish-browser-session.js
