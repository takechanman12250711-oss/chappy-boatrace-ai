name: Check theory validation phase7 lifecycle

on:
  pull_request:
    paths:
      - 'scripts/theory-validation-phase7-lifecycle.cjs'
      - 'tests/theory-validation-phase7-lifecycle.test.cjs'
      - 'data/stats/theory-validation-phase7-lifecycle.json'
      - '.github/workflows/check-theory-validation-phase7-lifecycle.yml'
      - '.github/workflows/collect-wall-established-attacker2-skip-ab.yml'
      - 'scripts/theory-validation-phase6-prospective-integration.cjs'
      - 'data/stats/theory-validation-phase6-prospective.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify lifecycle contract
        run: |
          node --check scripts/theory-validation-phase7-lifecycle.cjs
          node tests/theory-validation-phase7-lifecycle.test.cjs
          node scripts/theory-validation-phase7-lifecycle.cjs
      - name: Guard production prediction files
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(prediction\.js|js/prediction\.js|js/ai-core\.js|ai-core\.js)$'; then
            echo 'Phase7 validation PR must not modify production prediction logic.'
            exit 1
          fi
      - name: Verify project charter
        run: node scripts/check-charter.js
      - name: Ensure generated checks are clean
        run: git diff --exit-code
