name: Check escape three-attack one-ticket rescue
on:
  pull_request:
    paths:
      - 'scripts/analyze-escape-threeattack-one-ticket-rescue.js'
      - '.github/workflows/check-escape-threeattack-one-ticket-rescue.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-escape-threeattack-one-ticket-rescue.js
      - run: node scripts/analyze-escape-threeattack-one-ticket-rescue.js
