name: Diagnose formula builder in WebKit

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-formula-builder-webkit.yml"
      - "scripts/diagnose-formula-builder-webkit.mjs"
      - "index.html"
      - "js/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start branch static server
        run: |
          python3 -m http.server 4173 > /tmp/chappy-formula-builder.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chappy-formula-builder.log
          exit 1

      - name: Trace formula-builder source
        env:
          APP_URL: http://127.0.0.1:4173/
          RACE_PLACE: 桐生
          RACE_NO: "1"
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            node scripts/diagnose-formula-builder-webkit.mjs \
            2>&1 | tee /tmp/formula-builder-trace.log
          status=${PIPESTATUS[0]}
          echo "diagnostic_exit_status=$status" | tee -a /tmp/formula-builder-trace.log
          exit 0

      - name: Post compact WebKit trace to this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          grep -aE \
            'FORMULA_DIAG_(ERROR|REJECTION|SCRIPT|FUNCTION)|\[PAGEERROR\]|\[FATAL\]|diagnostic_exit_status' \
            /tmp/formula-builder-trace.log \
            | tail -n 250 \
            > /tmp/formula-builder-filtered.txt || true

          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          let trace = fs.readFileSync(
            "/tmp/formula-builder-filtered.txt",
            "utf8"
          );
          if (!trace.trim()) trace = "No matching trace lines.";
          if (trace.length > 45000) {
            trace = `${trace.slice(0, 45000)}\n...truncated`;
          }
          fs.writeFileSync(
            "/tmp/formula-builder-comment.md",
            [
              "## Formula builder WebKit source trace",
              "",
              "```text",
              trace,
              "```"
            ].join("\n"),
            "utf8"
          );
          NODE

          gh pr comment "$PR_URL" \
            --body-file /tmp/formula-builder-comment.md
