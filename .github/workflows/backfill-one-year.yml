name: Backfill one year of official race results

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-official-results
  cancel-in-progress: false

jobs:
  backfill:
    name: ${{ matrix.period.from }} - ${{ matrix.period.to }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        period:
          - from: "20250720"
            to: "20250731"
          - from: "20250801"
            to: "20250831"
          - from: "20250901"
            to: "20250930"
          - from: "20251001"
            to: "20251031"
          - from: "20251101"
            to: "20251130"
          - from: "20251201"
            to: "20251231"
          - from: "20260101"
            to: "20260131"
          - from: "20260201"
            to: "20260228"
          - from: "20260301"
            to: "20260331"
          - from: "20260401"
            to: "20260430"
          - from: "20260501"
            to: "20260531"
          - from: "20260601"
            to: "20260630"
          - from: "20260701"
            to: "20260719"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backfill official results
        run: |
          node scripts/backfill-results.js \
            --from="${{ matrix.period.from }}" \
            --to="${{ matrix.period.to }}"

      - name: Commit collected results
        run: |
          git add data/results data/stats

          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Backfill official race results ${{ matrix.period.from }}-${{ matrix.period.to }}"
          git pull --rebase origin main
          git push origin HEAD:main