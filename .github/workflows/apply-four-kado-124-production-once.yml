name: Apply four-kado 1-2-4 production once

on:
  push:
    branches: [feat/four-kado-124-rescue-production-20260823]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/four-kado-124-rescue-production-20260823
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Wire approved rescue into browser and collector
        run: |
          node <<'NODE'
          const fs=require('fs');
          function patch(path,fn){const before=fs.readFileSync(path,'utf8');const after=fn(before);if(after===before) throw new Error(`no change: ${path}`);fs.writeFileSync(path,after);}
          const oldV='20260823-three-course-134-v1';
          const newV='20260823-four-kado-124-v1';
          patch('js/prediction-runtime-loader.js',s=>{
            s=s.replace(`const VERSION = "${oldV}";`,`const VERSION = "${newV}";`);
            if(!s.includes('"js/four-kado-escape-rescue-fixed5.js"')) s=s.replace('    "js/three-course-escape-rescue-fixed5.js",','    "js/three-course-escape-rescue-fixed5.js",\n    "js/four-kado-escape-rescue-fixed5.js",');
            return s;
          });
          patch('scripts/collect-predictions.js',s=>s.replace(
`const practicalSelectionApi =
  require("../js/three-course-escape-rescue-fixed5").install(
    require("../js/practical-selection")
  );`,
`const practicalSelectionApi =
  require("../js/four-kado-escape-rescue-fixed5").install(
    require("../js/three-course-escape-rescue-fixed5").install(
      require("../js/practical-selection")
    )
  );`
          ));
          patch('index.html',s=>s.replaceAll(`prediction-runtime-loader.js?v=${oldV}`,`prediction-runtime-loader.js?v=${newV}`));
          for(const name of fs.readdirSync('scripts')){
            if(!/^test-.*\.js$/.test(name)) continue;
            const p=`scripts/${name}`;
            const before=fs.readFileSync(p,'utf8');
            const after=before.replaceAll(oldV,newV);
            if(after!==before) fs.writeFileSync(p,after);
          }
          NODE
      - name: Validate production wiring
        run: |
          node --check js/four-kado-escape-rescue-fixed5.js
          node --check scripts/collect-predictions.js
          node scripts/test-three-course-escape-rescue-fixed5.js
          node scripts/test-four-kado-escape-rescue-fixed5.js
          node scripts/test-load-performance.js
          node scripts/test-odds-lightweight-path.js
          node scripts/test-phase6-integration.js
          node scripts/test-prediction-loading-watchdog.js
          node scripts/test-startup-critical-path.js
          node scripts/test-ticket-accordion-render-path.js
          node scripts/check-charter.js
          git diff --check
      - name: Commit production wiring
        run: |
          rm .github/workflows/apply-four-kado-124-production-once.yml
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire approved 4-kado 1-2-4 rescue into production"
          git push origin HEAD:feat/four-kado-124-rescue-production-20260823
