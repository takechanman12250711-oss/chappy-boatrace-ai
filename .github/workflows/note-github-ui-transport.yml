name: Note GitHub UI Transport

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auth = verify saved note state, draft = fill current iphone handoff and configure paid settings without publishing'
        required: true
        default: auth
        type: choice
        options:
          - auth
          - draft

permissions:
  contents: read

jobs:
  note-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTE_STATE_JSON_BASE64: ${{ secrets.NOTE_STATE_JSON_BASE64 }}
      NOTE_UI_MODE: ${{ inputs.mode }}
      NOTE_IPHONE_HANDOFF: data/note-publish/iphone.json
    steps:
      - name: Require saved note state
        shell: bash
        run: |
          if [ -z "$NOTE_STATE_JSON_BASE64" ]; then
            echo "NOTE_UI_TRANSPORT_BLOCKED=note_state_missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify transport gate
        run: node scripts/note-github-ui-transport.test.js
      - name: Run note UI transport
        run: xvfb-run -a node scripts/note-github-ui-transport.js
