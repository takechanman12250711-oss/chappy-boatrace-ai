name: Note GitHub UI Transport

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'auth = verify saved Browser Use note profile, draft = fill current iphone handoff and configure paid settings without publishing'
        required: true
        default: auth
        type: choice
        options:
          - auth
          - draft

permissions:
  contents: read

jobs:
  note-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
      BROWSER_USE_PROFILE_ID: ${{ secrets.BROWSER_USE_PROFILE_ID }}
      NOTE_UI_MODE: ${{ inputs.mode }}
      NOTE_IPHONE_HANDOFF: data/note-publish/iphone.json
    steps:
      - name: Require Browser Use connection
        shell: bash
        run: |
          if [ -z "$BROWSER_USE_API_KEY" ]; then
            echo "NOTE_UI_TRANSPORT_BLOCKED=browser_use_api_key_missing"
            exit 1
          fi
          if [ -z "$BROWSER_USE_PROFILE_ID" ]; then
            echo "NOTE_UI_TRANSPORT_BLOCKED=browser_use_profile_id_missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Verify transport gate
        run: node scripts/note-github-ui-transport.test.js
      - name: Run note UI transport
        run: node scripts/note-github-ui-transport.js
