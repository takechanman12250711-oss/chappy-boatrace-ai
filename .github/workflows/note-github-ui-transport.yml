name: Note GitHub UI Transport

on:
  workflow_run:
    workflows: ['Build note publish handoff']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'auth = verify saved Browser Use note profile, draft = fill current iphone handoff and configure paid settings without publishing'
        required: true
        default: auth
        type: choice
        options:
          - auth
          - draft

permissions:
  contents: read

concurrency:
  group: note-ui-transport
  cancel-in-progress: false

jobs:
  note-ui:
    if: >-
      github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTE_UI_MODE: ${{ github.event_name == 'workflow_run' && 'draft' || inputs.mode }}
      NOTE_IPHONE_HANDOFF: data/note-publish/iphone.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record checked-out revision
        run: echo "NOTE_CLAIM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify transport gate
        run: node scripts/note-github-ui-transport.test.js
      - name: Check current handoff before opening a browser
        id: preflight
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { loadHandoff, preflightDraft } = require('./scripts/note-github-ui-transport');
          (async () => {
            const mode = process.env.NOTE_UI_MODE;
            if (!['auth', 'draft'].includes(mode)) throw new Error('unsupported_note_ui_mode');
            const gate = mode === 'auth' ? { ok: true } : await preflightDraft(loadHandoff(process.env.NOTE_IPHONE_HANDOFF).payload);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${gate.ok}\n`);
            const reason = String(gate.reason || 'ready').replace(/[^a-zA-Z0-9_-]/g, '_');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Note transport: ${gate.ok ? 'ready' : 'skipped'} (${reason}). Final publication is disabled.\n`);
            console.log(`NOTE_UI_PREFLIGHT=${JSON.stringify({ ok: gate.ok, reason })}`);
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
      - name: Require Browser Use connection
        if: steps.preflight.outputs.ready == 'true'
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSER_USE_PROFILE_ID: ${{ secrets.BROWSER_USE_PROFILE_ID }}
        shell: bash
        run: |
          if [ -z "$BROWSER_USE_API_KEY" ]; then
            echo "NOTE_UI_TRANSPORT_BLOCKED=browser_use_api_key_missing"
            exit 1
          fi
          if [ -z "$BROWSER_USE_PROFILE_ID" ]; then
            echo "NOTE_UI_TRANSPORT_BLOCKED=browser_use_profile_id_missing"
            exit 1
          fi
      - name: Install Playwright
        if: steps.preflight.outputs.ready == 'true'
        run: npm install --no-save playwright@1.55.0
      - name: Run note UI transport
        if: steps.preflight.outputs.ready == 'true'
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSER_USE_PROFILE_ID: ${{ secrets.BROWSER_USE_PROFILE_ID }}
          NOTE_CLAIM_TOKEN: ${{ github.token }}
        run: node scripts/note-github-ui-transport.js
