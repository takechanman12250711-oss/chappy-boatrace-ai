name: Collect external three-source references
on:
  pull_request:
    paths:
      - "scripts/external-reference-three-source.cjs"
      - "scripts/external-reference-source-adapters.cjs"
      - "scripts/collect-external-reference-three-source.cjs"
      - "scripts/test-external-reference-source-adapters.cjs"
      - "scripts/test-collect-external-reference-three-source.cjs"
      - ".github/workflows/collect-external-three-source-reference.yml"
  workflow_run:
    workflows: ["Collect automatic race predictions"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: external-three-source-reference
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Verify contracts
        run: |
          node --check scripts/external-reference-three-source.cjs
          node --check scripts/external-reference-source-adapters.cjs
          node --check scripts/collect-external-reference-three-source.cjs
          node --test scripts/test-external-reference-three-source.cjs
          node --test scripts/test-external-reference-source-adapters.cjs
          node --test scripts/test-collect-external-reference-three-source.cjs
          node scripts/check-charter.js
      - name: Collect public pre-race references
        if: github.event_name != 'pull_request'
        run: node scripts/collect-external-reference-three-source.cjs
      - name: Save immutable captures and capability report
        if: github.event_name != 'pull_request'
        run: |
          git add data/external-reference data/stats/external-reference-collector-v1.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect external three-source references"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
