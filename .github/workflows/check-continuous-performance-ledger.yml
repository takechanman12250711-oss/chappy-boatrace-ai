name: Check continuous performance ledger

on:
  pull_request:
    paths:
      - 'scripts/build-continuous-performance-ledger.cjs'
      - 'scripts/build-outer-attack-gate-dropoff.cjs'
      - 'scripts/build-playful-link-position-forward.cjs'
      - 'scripts/report-input-projection.cjs'
      - 'tests/report-input-compaction.test.cjs'
      - 'tests/helpers/report-input-fixture.cjs'
      - 'tests/outer-attack-gate-dropoff.test.cjs'
      - 'tests/playful-link-position-forward.test.cjs'
      - 'tests/continuous-performance-ledger.test.cjs'
      - 'scripts/persist-continuous-performance-ledger.cjs'
      - 'tests/continuous-ledger-persistence.test.cjs'
      - '.github/workflows/build-continuous-performance-ledger.yml'
      - '.github/workflows/check-continuous-performance-ledger.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate continuous performance ledger
        run: |
          node --check scripts/build-continuous-performance-ledger.cjs
          node --check tests/continuous-performance-ledger.test.cjs
          node --test tests/continuous-ledger-persistence.test.cjs
          node tests/main-data-writer-concurrency.test.cjs
          node tests/continuous-performance-ledger.test.cjs
          node tests/outer-attack-gate-dropoff.test.cjs
          node tests/playful-link-position-forward.test.cjs
          node tests/report-input-compaction.test.cjs
          node scripts/build-continuous-performance-ledger.cjs
          node -e "const x=require('./data/stats/continuous-performance-ledger.json'); console.log(JSON.stringify({diagnostics:x.diagnostics,cumulative:x.cumulative,rolling100:x.rolling100,generationBreakdown:x.generationBreakdown},null,2))"
