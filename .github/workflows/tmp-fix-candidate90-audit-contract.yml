name: Fix candidate90 audit contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-fix-candidate90-audit-contract.js'
      - '.github/workflows/tmp-fix-candidate90-audit-contract.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/candidate90-production
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply audit-contract patch
        run: node scripts/tmp-fix-candidate90-audit-contract.js
      - name: Run practical selection regression
        run: node scripts/test-practical-selection.js
      - name: Run evaluated scenario consistency
        run: node scripts/test-evaluated-scenario-consistency.js
      - name: Run 341R candidate90 regression
        run: node scripts/test-candidate90-regression.js
      - name: Commit audit-contract fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/practical-selection.js scripts/test-evaluated-scenario-consistency.js
          if git diff --cached --quiet; then
            echo "No production/test diff to commit"
          else
            git commit -m "Preserve candidate-only audit semantics for priority 90 promotion"
            git push origin HEAD:agent/candidate90-production
          fi
