      - "scripts/build-race-stats.js"
      - "scripts/repair-recent-results.js"
      - "scripts/test-repair-recent-results.js"
      - "scripts/test-missing-numbers.js"
      - "js/odds-insights.js"
      - "scripts/test-odds-insights.js"
      - "js/history-insights.js"
      - "js/venue-race-analysis.js"
      - "scripts/test-history-insights.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charter:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check js/script.js
          node --check js/ai-core.js
          node --check js/prediction.js
          node --check js/render.js
          node --check js/prediction-flow-priority.js
          node --check js/prediction-st-exhibition-support.js
          node --check js/prediction-venue-water-support.js
          node --check js/prediction-skill-local-support.js
          node --check js/prediction-motor-engine-support.js
          node --check js/prediction-engine-integration.js
          node --check js/prediction-simple-evaluation.js
          node --check js/hiyori-runtime-loader.js
          node --check js/motor-maintenance-insights.js
          node --check scripts/test-exhibition-performance.js
          node --check scripts/test-double-time.js
          node --check scripts/test-new-sam.js
          node --check tools/test-motor-maintenance-theory-v2.js
          node --check js/note-generator.js
          node --check js/practical-selection.js
          node --check scripts/check-charter.js
          node --check scripts/collect-predictions.js
          node --check scripts/test-shadow-predictions.js
          node --check scripts/match-predictions.js
          node --check scripts/test-match-predictions.js
          node --check js/prediction-verification.js
          node --check js/prediction-conditions.js
          node --check scripts/test-prediction-conditions.js
          node --check scripts/test-prediction-verification.js
          node --check scripts/build-prediction-index.js
          node --check scripts/test-build-prediction-index.js
          node --check js/auto-stats.js
          node --check js/collection-health.js
          node --check scripts/test-collection-health.js
          node --check scripts/test-auto-stats.js
          node --check js/verification-readiness.js
          node --check scripts/test-verification-readiness.js
          node --check js/improvement-suggestions.js
          node --check scripts/test-improvement-suggestions.js
          node --check scripts/test-practical-selection.js
          node --check scripts/test-ai-core-formations.js
          node --check scripts/test-race-scenarios.js
          node --check scripts/test-scenario-marks.js
          node --check scripts/test-scenario-formations.js
          node --check api/missing.js
          node --check scripts/build-race-stats.js
          node --check scripts/repair-recent-results.js
          node --check scripts/test-repair-recent-results.js
          node --check scripts/test-missing-numbers.js
          node --check js/odds-insights.js
          node --check scripts/test-odds-insights.js
          node --check js/history-insights.js
          node --check js/race-history.js
          node --check js/venue-race-analysis.js
          node --check scripts/test-history-insights.js

      - name: Enforce charter
        run: |
          node scripts/check-charter.js
          node scripts/test-shadow-predictions.js
          node scripts/test-match-predictions.js
          node scripts/test-prediction-verification.js
          node scripts/test-prediction-conditions.js
          node scripts/test-build-prediction-index.js
          node scripts/test-auto-stats.js
          node scripts/test-collection-health.js
          node scripts/test-verification-readiness.js
          node scripts/test-improvement-suggestions.js
          node scripts/test-practical-selection.js
          node scripts/test-ai-core-formations.js
          node scripts/test-exhibition-performance.js
          node scripts/test-double-time.js
          node scripts/test-new-sam.js
          node tools/test-motor-maintenance-theory-v2.js
          node scripts/test-race-scenarios.js
          node scripts/test-scenario-marks.js
          node scripts/test-scenario-formations.js
          node scripts/test-repair-recent-results.js
          node scripts/test-missing-numbers.js
          node scripts/test-odds-insights.js
          node scripts/test-history-insights.js