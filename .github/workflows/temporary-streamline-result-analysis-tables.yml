name: Temporary streamline result analysis tables

on:
  push:
    branches:
      - agent/streamline-result-analysis-tables

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Streamline result analysis tables
        run: node scripts/streamline-result-analysis-tables.js
      - name: Syntax check
        run: node --check js/stats.js
      - name: Verification tests
        run: node scripts/test-prediction-verification.js
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/stats.js
          git diff --cached --quiet || git commit -m "結果分析の下部表を整理"
          git push
