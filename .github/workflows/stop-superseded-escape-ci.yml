name: Stop superseded escape PR checks
on:
  push:
    branches: [maintenance/cancel-superseded-escape-ci]
    paths: ['.github/workflows/stop-superseded-escape-ci.yml']
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel only explicit superseded commits of PR 1042
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const obsolete = new Set(["d2a22fcd4fe07edd798f6b392f658b8900fe0c05","7b27b35964aa676e3dcddd8e02d5a2ed87fe734f","b97c7137108d9c716d5e4a310df0cee1933b471c","40cf9f5486dfdb67aeab4ab9b1a5c04af1a4abca","cf46b0ec7ae0c8896490c0eee6c1b23d3d2dbed4","ea13ed5b33a7f11c2d9d9fbd69af492aebab74dd","c93c936829b213c23d33991ea622a9852ab2f850"]);
          const root = 'https://api.github.com/repos/takechanman12250711-oss/chappy-boatrace-ai/actions/runs';
          const headers = {Authorization: 'Bearer ' + process.env.GH_TOKEN, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'};
          (async () => {
            const found = [];
            for (let page = 1; page <= 10; page++) {
              const r = await fetch(root + '?branch=fix%2Fescape-evaluation-evidence&per_page=100&page=' + page, {headers});
              if (!r.ok) throw new Error('list status ' + r.status);
              const rows = (await r.json()).workflow_runs;
              found.push(...rows.filter(x => obsolete.has(x.head_sha) && ['pull_request','push'].includes(x.event) && ['queued','in_progress','waiting','pending','requested'].includes(x.status)));
              if (rows.length < 100) break;
            }
            found.sort((a,b) => (a.status === 'in_progress' ? 0 : 1) - (b.status === 'in_progress' ? 0 : 1));
            console.log('Superseded runs: ' + found.length + '; latest commit is never in the allowlist.');
            for (const r of found) {
              const response = await fetch(root + '/' + r.id + '/cancel', {method:'POST',headers});
              if (![202,409].includes(response.status)) throw new Error('cancel ' + r.id + ': ' + response.status);
              console.log(r.id + ' ' + response.status);
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          })().catch(e => { console.error(e.message); process.exitCode=1; });
          NODE
