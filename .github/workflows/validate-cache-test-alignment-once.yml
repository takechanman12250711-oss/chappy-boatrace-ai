name: Validate cache test alignment once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/validate-cache-test-alignment-once.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate cache generation alignment
        run: |
          node --check scripts/test-load-performance.js
          node --check scripts/test-auto-stats.js
          node scripts/test-load-performance.js
          node scripts/test-auto-stats.js
          git diff --check
