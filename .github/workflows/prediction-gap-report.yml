name: Build prediction gap report

on:
  workflow_dispatch:
  schedule:
    - cron: "45 15 * * *" # 00:45 JST・結果照合後
  pull_request:
    paths:
      - "js/improvement-review.js"
      - "scripts/build-improvement-review.js"
      - "scripts/test-improvement-review.js"
      - "scripts/build-prediction-gap-report.js"
      - "scripts/test-prediction-gap-report.js"
      - "scripts/restore-daily-prediction-source.js"
      - ".github/workflows/prediction-gap-report.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore canonical prediction sources
        run: |
          node scripts/restore-daily-prediction-source.js --all
      - name: Verify extractor
        run: |
          node --check scripts/build-improvement-review.js
          node --check scripts/build-prediction-gap-report.js
          node scripts/test-improvement-review.js
          node scripts/test-prediction-gap-report.js
      - name: Build report
        run: |
          node scripts/build-improvement-review.js --output=data/stats/improvement-review.json
          node scripts/build-prediction-gap-report.js
