name: Check remain pickup branch
on:
  pull_request:
    paths:
      - "scripts/build-remain-pickup-branch-report.js"
      - "scripts/test-remain-pickup-branch-report.js"
      - ".github/workflows/check-remain-pickup-branch.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify remain pickup branch analyzer
        run: |
          node --check scripts/build-remain-pickup-branch-report.js
          node scripts/test-remain-pickup-branch-report.js
          node scripts/check-charter.js
