name: Audit post-330 three-attack discrimination
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-three-attack-discrimination.js'
      - '.github/workflows/tmp-post330-missing-candidate-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-three-attack-discrimination.js
      - uses: actions/upload-artifact@v4
        with:
          name: post330-three-attack-discrimination
          path: tmp-analysis-output/post330-three-attack-discrimination.json
