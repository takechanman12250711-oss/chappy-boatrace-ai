name: Audit post-330 one-to-three scenario shape
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-one-to-three-head-miss.js'
      - '.github/workflows/tmp-post330-missing-candidate-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-one-to-three-head-miss.js
      - uses: actions/upload-artifact@v4
        with:
          name: post330-one-to-three-head-miss
          path: tmp-analysis-output/post330-one-to-three-head-miss.json
