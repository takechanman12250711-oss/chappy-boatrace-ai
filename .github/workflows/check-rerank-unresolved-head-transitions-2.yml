name: Check unresolved head transitions rerank 2
on:
  pull_request:
    paths:
      - 'scripts/rerank-unresolved-head-transitions-2.js'
      - '.github/workflows/check-rerank-unresolved-head-transitions-2.yml'
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/rerank-unresolved-head-transitions-2.js
      - run: node scripts/rerank-unresolved-head-transitions-2.js
