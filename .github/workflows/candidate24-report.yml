name: Build candidate24 performance
on:
  push:
    branches: [main]
    paths: ['scripts/build-candidate24-report.js', '.github/workflows/candidate24-report.yml']
  pull_request:
    paths: ['scripts/build-candidate24-report.js', 'scripts/test-exhibition-candidate24.js', '.github/workflows/candidate24-report.yml']
  workflow_run:
    workflows: ['Collect official race results']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: candidate24-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          sparse-checkout: |
            scripts
            js
            config
            data/predictions
            data/results
            data/note-drafts
            data/stats/candidate24-report.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-exhibition-candidate24.js
      - run: node scripts/build-candidate24-report.js
      - name: Save derived report only
        if: github.event_name != 'pull_request' && github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/stats/candidate24-report.json
          git diff --cached --quiet && exit 0
          git commit --only -m 'Update candidate24 performance report' -- data/stats/candidate24-report.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
          done
          exit 1
