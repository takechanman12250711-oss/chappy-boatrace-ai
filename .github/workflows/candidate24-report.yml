name: Build candidate24 performance
on:
  push:
    branches: [main]
    paths: ['scripts/build-candidate24-report.js', 'scripts/build-race-review-progress.js', 'scripts/refresh-race-review-results.js', 'scripts/race-review-evidence.js', 'scripts/test-race-review-progress.js', 'scripts/test-review-report-save.js', '.github/workflows/candidate24-report.yml']
  pull_request:
    paths: ['scripts/build-candidate24-report.js', 'scripts/build-race-review-progress.js', 'scripts/refresh-race-review-results.js', 'scripts/race-review-evidence.js', 'scripts/test-race-review-progress.js', 'scripts/test-review-report-save.js', 'scripts/test-exhibition-candidate24.js', '.github/workflows/candidate24-report.yml']
  workflow_run:
    workflows: ['Collect official race results', 'Collect live note independently']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: candidate24-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          sparse-checkout: |
            .github/workflows/candidate24-report.yml
            scripts
            api
            js
            config
            data/predictions
            data/results
            data/note-drafts
            data/stats/candidate24-report.json
            data/stats/race-review-progress.json
            data/stats/race-review-results.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-exhibition-candidate24.js
      - run: node scripts/test-race-review-progress.js
      - run: node scripts/test-review-report-save.js
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node scripts/build-candidate24-report.js
      - run: node scripts/refresh-race-review-results.js
        if: github.event_name != 'pull_request'
      - run: node scripts/build-race-review-progress.js
      - name: Save derived report only
        id: save
        if: github.event_name != 'pull_request' && github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' && github.ref == 'refs/heads/main'
        run: |
          # Archive restoration is a temporary read model, never a source-data commit.
          git restore --worktree -- data/predictions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/stats/candidate24-report.json data/stats/race-review-progress.json data/stats/race-review-results.json
          git diff --cached --quiet && exit 0
          git commit --only -m 'Update candidate24 performance report' -- data/stats/candidate24-report.json data/stats/race-review-progress.json data/stats/race-review-results.json
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1
      - name: Publish updated review data
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"
