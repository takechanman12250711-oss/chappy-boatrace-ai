name: Check phase6 integration

on:
  pull_request:
    paths:
      - "index.html"
      - "js/home-dashboard-v2.js"
      - "js/app-runtime-loader.js"
      - "js/prediction-runtime-loader.js"
      - "js/race-flow-result-panel.js"
      - "js/stats-runtime-loader.js"
      - "js/reference-tag-report.js"
      - "js/prediction-index-loader.js"
      - "data/predictions/index-manifest.json"
      - "data/predictions/index-shards/**"
      - "data/analysis/reference-tag-effectiveness.json"
      - "js/stats.js"
      - "js/render.js"
      - "js/script.js"
      - "js/result-ui-phase5.js"
      - "js/result-void-compat.js"
      - "js/theory-performance-report.js"
      - "js/reference-tags.js"
      - "scripts/test-reference-tags.js"
      - "js/prediction-conditions.js"
      - "scripts/test-prediction-conditions.js"
      - "scripts/test-api-history-no-browser-fallback.js"
      - "scripts/test-initial-odds-enrichment.js"
      - "scripts/test-race-flow-result-panel.js"
      - "scripts/test-schedule-request-cache.js"
      - "scripts/test-phase6-integration.js"
      - "scripts/test-result-void-compat.js"
      - "scripts/test-final-odds-schedule.js"
      - "scripts/test-scheduled-analysis-workflows.js"
      - "scripts/analysis-input-contract.js"
      - "scripts/restore-daily-prediction-source.js"
      - "scripts/analyze-reference-tag-effectiveness.js"
      - "scripts/test-reference-tag-effectiveness.js"
      - "scripts/test-reference-tag-report.js"
      - "scripts/test-analysis-input-contract.js"
      - "scripts/build-learning-analysis-pipeline.js"
      - "scripts/collect-predictions.js"
      - "scripts/collect-results.js"
      - "scripts/build-prediction-index-shards.js"
      - "scripts/test-build-prediction-index-shards.js"
      - "scripts/test-prediction-index-loader.js"
      - "scripts/apply-current-cache-test-alignment.js"
      - ".github/workflows/analyze-reference-tags.yml"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/settle-purchases.yml"
      - ".github/workflows/prediction-gap-report.yml"
      - ".github/workflows/build-learning-analysis-pipeline.yml"
      - ".github/workflows/check-phase6-integration.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: |
          node --check js/prediction-runtime-loader.js
          node --check js/prediction-index-loader.js
          node --check scripts/build-prediction-index-shards.js
          node --check js/script.js
          node --check js/result-void-compat.js
          node --check scripts/test-phase6-integration.js
          node --check scripts/test-result-void-compat.js
          node --check scripts/test-final-odds-schedule.js
          node --check scripts/test-scheduled-analysis-workflows.js
          node --check scripts/analysis-input-contract.js
          node --check scripts/restore-daily-prediction-source.js
          node --check scripts/analyze-reference-tag-effectiveness.js
          node --check scripts/test-reference-tag-effectiveness.js
          node --check scripts/test-reference-tag-report.js
          node --check scripts/test-analysis-input-contract.js
          node --check scripts/test-reference-tags.js
          node --check scripts/test-prediction-conditions.js
          node --check scripts/test-build-prediction-index-shards.js
          node --check scripts/test-prediction-index-loader.js
          node --check scripts/apply-current-cache-test-alignment.js
      - name: Run Phase6 integration test
        run: node scripts/test-phase6-integration.js
      - name: Run result void compatibility test
        run: node scripts/test-result-void-compat.js
      - name: Run final odds schedule regression
        run: node scripts/test-final-odds-schedule.js
      - name: Run scheduled analysis workflow regressions
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/test-scheduled-analysis-workflows.js
          node scripts/test-reference-tag-effectiveness.js
          node scripts/test-reference-tag-report.js
          node scripts/test-analysis-input-contract.js
          node scripts/test-reference-tags.js
          node scripts/test-prediction-conditions.js
      - name: Run load performance regression
        run: |
          node scripts/apply-current-cache-test-alignment.js
          node scripts/test-build-prediction-index-shards.js
          node scripts/test-prediction-index-loader.js
          node scripts/test-load-performance.js
      - name: Run race flow and API enrichment regressions
        run: |
          node scripts/test-api-history-no-browser-fallback.js
          node scripts/test-initial-odds-enrichment.js
          node scripts/test-race-flow-result-panel.js
          node scripts/test-schedule-request-cache.js
