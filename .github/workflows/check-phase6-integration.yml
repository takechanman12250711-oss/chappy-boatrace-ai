name: Check phase6 integration

on:
  pull_request:
    paths:
      - "index.html"
      - "js/home-dashboard-v2.js"
      - "js/app-runtime-loader.js"
      - "js/prediction-runtime-loader.js"
      - "js/race-flow-result-panel.js"
      - "js/stats-runtime-loader.js"
      - "js/render.js"
      - "js/script.js"
      - "js/result-ui-phase5.js"
      - "js/result-void-compat.js"
      - "scripts/test-api-history-no-browser-fallback.js"
      - "scripts/test-initial-odds-enrichment.js"
      - "scripts/test-race-flow-result-panel.js"
      - "scripts/test-schedule-request-cache.js"
      - "scripts/test-phase6-integration.js"
      - "scripts/test-result-void-compat.js"
      - "scripts/test-final-odds-schedule.js"
      - ".github/workflows/settle-purchases.yml"
      - ".github/workflows/check-phase6-integration.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: |
          node --check js/prediction-runtime-loader.js
          node --check js/script.js
          node --check js/result-void-compat.js
          node --check scripts/test-phase6-integration.js
          node --check scripts/test-result-void-compat.js
          node --check scripts/test-final-odds-schedule.js
      - name: Run Phase6 integration test
        run: node scripts/test-phase6-integration.js
      - name: Run result void compatibility test
        run: node scripts/test-result-void-compat.js
      - name: Run final odds schedule regression
        run: node scripts/test-final-odds-schedule.js
      - name: Run load performance regression
        run: node scripts/test-load-performance.js
      - name: Run race flow and API enrichment regressions
        run: |
          node scripts/test-api-history-no-browser-fallback.js
          node scripts/test-initial-odds-enrichment.js
          node scripts/test-race-flow-result-panel.js
          node scripts/test-schedule-request-cache.js
