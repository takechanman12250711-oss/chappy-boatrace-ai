name: Check scenario AI v6 reproducibility

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-scenario-ai-v6-reproducibility-gate.js"
      - "scripts/test-scenario-ai-v6-reproducibility-gate.js"
      - ".github/workflows/check-scenario-ai-v6-reproducibility.yml"
  pull_request:
    paths:
      - "scripts/build-scenario-ai-v6-reproducibility-gate.js"
      - "scripts/test-scenario-ai-v6-reproducibility-gate.js"
      - ".github/workflows/check-scenario-ai-v6-reproducibility.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify scenario AI v6 reproducibility gate
        run: |
          node --check scripts/build-scenario-ai-v6-reproducibility-gate.js
          node scripts/test-scenario-ai-v6-reproducibility-gate.js
          node scripts/check-charter.js
