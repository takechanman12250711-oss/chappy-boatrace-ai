name: Check third-place 1-2-4 rescue fixed5
on:
  pull_request:
    paths:
      - 'js/third-place-rescue-12-4-fixed5.js'
      - 'scripts/test-third-place-rescue-12-4-fixed5.js'
      - 'js/prediction-runtime-loader.js'
      - '.github/workflows/check-third-place-rescue-12-4-fixed5.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/third-place-rescue-12-4-fixed5.js
      - run: node scripts/test-third-place-rescue-12-4-fixed5.js
