name: Check sashi tiebreak loss analysis
on:
  pull_request:
    paths:
      - 'scripts/build-sashi-tiebreak-loss-analysis.js'
      - '.github/workflows/check-sashi-tiebreak-loss-analysis.yml'
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/build-sashi-tiebreak-loss-analysis.js
      - run: node scripts/build-sashi-tiebreak-loss-analysis.js
