name: Audit post-325 inner independent profit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-post325-inner-independent-profit.js'
      - 'scripts/tmp-audit-post325-weak-two-head-prune.js'
      - '.github/workflows/tmp-post325-inner-independent-profit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-post325-inner-independent-profit.js
      - run: node scripts/tmp-audit-post325-weak-two-head-prune.js
      - uses: actions/upload-artifact@v4
        with:
          name: post325-inner-independent-profit
          path: tmp-analysis-output/*.json
