name: Run role ticket marginal cap v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/report-input-projection.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'scripts/analyze-ticket-expansion-payout-v2.cjs'
      - 'scripts/analyze-role-ticket-marginal-cap-v1.cjs'
      - '.github/workflows/run-role-ticket-marginal-cap-v1.yml'
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * *'
  pull_request:
    paths:
      - 'scripts/report-input-projection.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'scripts/analyze-ticket-expansion-payout-v2.cjs'
      - 'scripts/analyze-role-ticket-marginal-cap-v1.cjs'
      - '.github/workflows/run-role-ticket-marginal-cap-v1.yml'
      - 'data/predictions/202609*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run marginal cap audit
        run: node scripts/analyze-role-ticket-marginal-cap-v1.cjs > role-ticket-marginal-cap-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('role-ticket-marginal-cap-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({eligibleSettledRaceCount:r.eligibleSettledRaceCount,cumulativeByCap:r.cumulativeByCap,marginalByAddedPosition:r.marginalByAddedPosition,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: role-ticket-marginal-cap-v1
          path: role-ticket-marginal-cap-v1.json
          retention-days: 90
