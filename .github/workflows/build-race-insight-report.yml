name: Build race insight report
# Research-only: 荒れる／堅め classification check, tilt, motor and venue
# breakdowns. Runs after the existing nightly ledger; adds no new schedule and
# never changes predictions or tickets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-race-insight-report.yml
      - config/race-roughness-v1.json
      - scripts/build-race-insight-report.cjs
      - scripts/persist-race-insight-report.cjs
      - tests/race-insight-report.test.cjs
  workflow_run:
    workflows:
      - Build continuous performance ledger
    types: [completed]
permissions:
  contents: write
concurrency:
  group: race-insight-report
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.name == 'Build continuous performance ledger' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/race-insight-report.test.cjs
      - name: Persist race insight report from current main
        run: node scripts/persist-race-insight-report.cjs
