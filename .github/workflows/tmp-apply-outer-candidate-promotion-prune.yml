name: Apply outer candidate promotion prune
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prune-outer-candidate-promotions
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-apply-outer-candidate-promotion-prune.js
      - run: node -c js/practical-selection.js
      - run: node scripts/test-outer-candidate-promotion-prune-regression.js
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/practical-selection.js
          git diff --cached --quiet || git commit -m 'Prune outer-head candidate promotions'
          git push origin HEAD:agent/prune-outer-candidate-promotions
