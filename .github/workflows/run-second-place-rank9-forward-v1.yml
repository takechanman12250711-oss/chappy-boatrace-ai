name: Run second-place rank9 forward v1
on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * *'
  pull_request:
    paths:
      - 'scripts/audit-second-place-rank9-forward-v1.cjs'
      - '.github/workflows/run-second-place-rank9-forward-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run preregistered second-place rank9 forward audit
        run: node scripts/audit-second-place-rank9-forward-v1.cjs > second-place-rank9-forward-v1.json
      - name: Validate frozen research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('second-place-rank9-forward-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.frozenRule.rank!==9||r.frozenRule.winningBoatMustExistInBaseline7!==true||r.frozenRule.actualPrefixMustBeMissingFromBaseline7!==true) process.exit(1);
          console.log(JSON.stringify({settled:r.settledRaceCountAfterActivation,eligibleMisses:r.eligibleSecondPlaceMisses,eligible:r.eligibleAddedTickets,rescues:r.rescueCount,roi:r.roiPercent,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: second-place-rank9-forward-v1
          path: second-place-rank9-forward-v1.json
          retention-days: 90
