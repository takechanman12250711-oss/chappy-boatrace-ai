name: Run forward research status v1

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *'
  pull_request:
    paths:
      - 'scripts/build-forward-research-status-v1.cjs'
      - '.github/workflows/run-forward-research-status-v1.yml'
      - 'scripts/build-forward-research-scoreboard-v1.cjs'
      - 'scripts/evaluate-forward-research-decision-gate-v1.cjs'
      - 'data/predictions/202609*.json'
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build consolidated forward research status
        run: node scripts/build-forward-research-status-v1.cjs > forward-research-status-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('forward-research-status-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({commonSettledRaceCount:r.commonSettledRaceCount,nextGate:r.nextGate,progressPercent:r.progressPercent,decisionStatus:r.decisionStatus,reachedGate:r.reachedGate,passedCandidateCount:r.passedCandidateCount,recommendation:r.recommendation},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forward-research-status-v1
          path: forward-research-status-v1.json
          retention-days: 90
