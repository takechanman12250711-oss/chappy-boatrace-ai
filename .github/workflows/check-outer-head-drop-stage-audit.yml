name: Check outer head drop stage audit
on:
  pull_request:
    paths:
      - "scripts/build-outer-head-drop-stage-audit.js"
      - "scripts/local-water-daily-input.cjs"
      - "scripts/test-outer-head-drop-stage-memory.cjs"
      - "scripts/test-outer-head-drop-stage-audit.js"
      - ".github/workflows/check-outer-head-drop-stage-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-outer-head-drop-stage-audit.js"
      - "scripts/local-water-daily-input.cjs"
      - "scripts/test-outer-head-drop-stage-memory.cjs"
      - ".github/workflows/check-outer-head-drop-stage-audit.yml"
  workflow_run:
    workflows: ["Collect official race results"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: chappy-outer-head-drop-stage-audit-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  queue: max
  cancel-in-progress: false

jobs:
  diagnostics:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.event != 'pull_request_target')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_id: ${{ steps.reports.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node --check scripts/build-outer-head-drop-stage-audit.js
          node scripts/test-outer-head-drop-stage-audit.js
          node scripts/test-outer-head-drop-stage-memory.cjs
          node scripts/test-local-water-outer-head-stage-audit.js
      - name: Build real diagnostic
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-outer-head-drop-stage-audit.js
          node scripts/prepare-daily-prediction-git-save.js --all
      - name: Package verified diagnostic
        if: github.event_name != 'pull_request'
        run: node scripts/result-report-checkpoint.cjs pack outer-head-drop-stage-audit "$RUNNER_TEMP/audit-report/checkpoint.json"
      - name: Upload verified diagnostic
        if: github.event_name != 'pull_request'
        id: reports
        uses: actions/upload-artifact@v4
        with:
          name: outer-head-drop-stage-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/audit-report/checkpoint.json
          retention-days: 3
          if-no-files-found: error

  publish_reports:
    needs: diagnostics
    if: github.event_name != 'pull_request' && needs.diagnostics.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    outputs:
      saved_sha: ${{ steps.save_reports.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            data/stats
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download verified diagnostic
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.diagnostics.outputs.artifact_id }}
          path: ${{ runner.temp }}/audit-report
          merge-multiple: true
      - name: Publish verified diagnostic
        id: save_reports
        env:
          BASE_SHA: ${{ needs.diagnostics.outputs.source_sha }}
        run: node scripts/result-report-checkpoint.cjs publish outer-head-drop-stage-audit "$RUNNER_TEMP/audit-report/checkpoint.json" "$BASE_SHA"
