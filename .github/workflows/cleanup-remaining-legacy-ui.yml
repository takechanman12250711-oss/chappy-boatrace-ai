name: Cleanup remaining legacy UI

on:
  push:
    branches:
      - agent/remove-remaining-legacy-ui
    paths:
      - ".github/workflows/cleanup-remaining-legacy-ui.yml"
      - "scripts/cleanup-remaining-legacy-ui.js"
      - "js/render.js"
      - "scripts/check-charter.js"

permissions:
  contents: write

concurrency:
  group: cleanup-remaining-legacy-ui
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/remove-remaining-legacy-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Remove remaining legacy UI code
        run: node scripts/cleanup-remaining-legacy-ui.js

      - name: Validate cleanup
        run: |
          node --check js/render.js
          node --check scripts/check-charter.js
          node scripts/check-charter.js
          node scripts/test-theory-integration.js

      - name: Commit cleanup
        run: |
          git add js/render.js scripts/check-charter.js

          if git diff --cached --quiet; then
            echo "追加の残骸整理はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "非表示の旧理論描画残骸を削除"
          git pull --rebase origin agent/remove-remaining-legacy-ui
          git push origin agent/remove-remaining-legacy-ui
