name: Check theory improvement dashboard

on:
  pull_request:
    paths:
      - "js/theory-improvement-dashboard.js"
      - "js/stats-runtime-loader.js"
      - "scripts/test-theory-improvement-dashboard.js"
      - ".github/workflows/theory-improvement-dashboard.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify theory improvement dashboard
        run: |
          node --check js/theory-improvement-dashboard.js
          node --check js/stats-runtime-loader.js
          node scripts/test-theory-improvement-dashboard.js
          node scripts/check-charter.js
