name: Check weak 2-head independent pruning
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/practical-selection.js'
      - 'scripts/test-weak-two-head-independent-prune-regression.js'
      - '.github/workflows/test-weak-two-head-independent-pruning.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-weak-two-head-independent-prune-regression.js
