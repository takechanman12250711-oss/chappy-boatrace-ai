name: Rebuild corrected flow miss reports once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-flow-miss-reports-once.yml"
      - "scripts/rebuild-flow-miss-reports-after-classification-fix.js"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TARGET_BRANCH: fix/flow-reading-miss-classification-20260823
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Rebuild corrected analysis
        run: |
          node scripts/test-miss-cause-analysis.js
          node scripts/rebuild-flow-miss-reports-after-classification-fix.js
          git diff --check
      - name: Persist derived reports and remove one-time helpers
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/improvement-proposal-phase3.json data/stats/flow-reading-miss-breakdown.json
          git rm .github/workflows/rebuild-flow-miss-reports-once.yml scripts/rebuild-flow-miss-reports-after-classification-fix.js data/stats/flow-miss-classification-fix-note.txt
          git commit -m "Rebuild flow miss analysis after classification guard"
          git push origin "HEAD:${TARGET_BRANCH}"
