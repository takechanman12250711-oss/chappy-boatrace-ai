name: Check flow odds tabs

on:
  pull_request:
    paths:
      - "js/flow-odds-tabs.js"
      - "js/app-runtime-loader.js"
      - "scripts/test-flow-odds-tabs.js"
      - ".github/workflows/check-flow-odds-tabs.yml"
  push:
    branches:
      - main
    paths:
      - "js/flow-odds-tabs.js"
      - "js/app-runtime-loader.js"
      - "scripts/test-flow-odds-tabs.js"
      - ".github/workflows/check-flow-odds-tabs.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/flow-odds-tabs.js
      - run: node --check js/app-runtime-loader.js
      - run: node scripts/test-flow-odds-tabs.js
