name: Check escape trim regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/ai-core.js'
      - 'js/boat-identity.js'
      - 'js/evaluated-scenario-candidates.js'
      - 'js/prediction.js'
      - 'js/practical-selection.js'
      - 'data/predictions/202607*.json'
      - 'data/predictions/2026080*.json'
      - 'data/predictions/2026081?.json'
      - 'scripts/test-strong-escape-trim-regression.js'
      - 'scripts/test-very-strong-escape-trim-regression.js'
      - '.github/workflows/check-escape-trim-regressions.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-strong-escape-trim-regression.js
      - run: node scripts/test-very-strong-escape-trim-regression.js
