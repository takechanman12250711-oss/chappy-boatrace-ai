name: Run rescue dimension ROI v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-rescue-dimension-roi-v1.cjs'
      - '.github/workflows/run-rescue-dimension-roi-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run rescue dimension ROI
        run: node scripts/analyze-rescue-dimension-roi-v1.cjs > rescue-dimension-roi-v1.json
      - name: Validate non-production audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('rescue-dimension-roi-v1.json','utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          console.log(JSON.stringify(r.metrics, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-dimension-roi-v1
          path: rescue-dimension-roi-v1.json
          retention-days: 90
