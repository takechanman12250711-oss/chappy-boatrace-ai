name: Browserbase Usage Check

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/browserbase-usage-check.yml'

permissions:
  contents: read

jobs:
  usage-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
    steps:
      - name: Check Browserbase usage
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\nHTTP_STATUS=%{http_code}\n' \
            -H "X-BB-API-Key: $BROWSERBASE_API_KEY" \
            "https://api.browserbase.com/v1/projects/$BROWSERBASE_PROJECT_ID/usage")
          echo "$response"
