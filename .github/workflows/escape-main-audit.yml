name: Audit escape main across 24 venues
on:
  push:
    branches: [main, fix/escape-evaluation-evidence]
    paths:
      - 'scripts/audit-escape-main.cjs'
      - 'scripts/test-escape-main-audit.cjs'
      - 'js/prediction-conditions.js'
      - '.github/workflows/escape-main-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 21 * * *'
permissions:
  contents: write
concurrency:
  group: escape-main-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check snapshot and audit contracts
        run: |
          node scripts/test-prediction-conditions.js
          node scripts/test-prediction-conditions-missing-series.js
          node scripts/test-escape-main-audit.cjs
          node scripts/check-charter.js
      - name: Analyze immutable saved inputs and official results
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/audit-escape-main.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: escape-main-audit
          path: data/stats/escape-main-audit.json
      - name: Save derived report only
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git restore --worktree -- data/predictions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats/escape-main-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update all-venue escape main audit'
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1
