name: Audit escape main across 24 venues
on:
  push:
    branches: [main, fix/escape-evaluation-evidence]
    paths:
      - 'scripts/audit-escape-main.cjs'
      - 'scripts/research-escape-partners.cjs'
      - 'scripts/partner-forward.cjs'
      - 'scripts/test-partner-forward.cjs'
      - 'config/partner-forward.json'
      - 'config/independent-rule-forward.json'
      - 'scripts/independent-rule-forward.cjs'
      - 'scripts/independent-rule-forward.test.cjs'
      - 'scripts/independent-role-selector.cjs'
      - 'scripts/independent-rule-shadow.cjs'
      - 'scripts/test-escape-partner-history.cjs'
      - 'scripts/test-escape-main-audit.cjs'
      - 'js/prediction-conditions.js'
      - 'js/ai-core.js'
      - 'scripts/test-escape-skill-role.cjs'
      - 'scripts/note-draft-bundle.js'
      - '.github/workflows/escape-main-audit.yml'
  pull_request:
    paths:
      - 'scripts/research-escape-partners.cjs'
      - 'scripts/partner-forward.cjs'
      - 'scripts/test-partner-forward.cjs'
      - 'config/partner-forward.json'
      - 'config/independent-rule-forward.json'
      - 'scripts/independent-rule-forward.cjs'
      - 'scripts/independent-rule-forward.test.cjs'
      - 'scripts/independent-role-selector.cjs'
      - 'scripts/independent-rule-shadow.cjs'
      - 'scripts/test-escape-partner-history.cjs'
      - '.github/workflows/escape-main-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 21 * * *'
permissions:
  contents: write
concurrency:
  group: escape-main-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check snapshot and audit contracts
        run: |
          node scripts/test-prediction-conditions.js
          node scripts/test-prediction-conditions-missing-series.js
          node scripts/test-escape-main-audit.cjs
          node --test scripts/test-escape-partner-history.cjs
          node --test scripts/test-partner-forward.cjs scripts/independent-role-selector.test.cjs scripts/independent-rule-forward.test.cjs
          node scripts/test-note-draft-bundle.js
          node scripts/test-escape-skill-role.cjs
          node scripts/test-racer-skill-theory.js
          node scripts/test-racer-skill-core-integration.js
          node scripts/check-charter.js
      - name: Analyze immutable saved inputs and official results
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          node scripts/audit-escape-main.cjs
          node scripts/research-escape-partners.cjs
          node scripts/partner-forward.cjs report
          node scripts/independent-rule-forward.cjs report
      - uses: actions/upload-artifact@v4
        with:
          name: escape-main-audit
          path: |
            data/stats/escape-main-audit.json
            data/stats/escape-partner-history-research.json
            data/stats/partner-forward-report.json
            data/stats/independent-rule-report.json
      - name: Save derived report only
        if: github.event_name != 'pull_request'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git restore --worktree -- data/predictions
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/stats/escape-main-audit.json data/stats/escape-partner-history-research.json data/stats/partner-forward-report.json data/stats/independent-rule-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update all-venue escape main audit'
          for attempt in 1 2 3; do
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH"
            if git push origin "HEAD:$TARGET_BRANCH"; then exit 0; fi
          done
          exit 1

