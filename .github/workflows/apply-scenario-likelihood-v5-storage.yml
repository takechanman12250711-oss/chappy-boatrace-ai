name: Check scenario likelihood v5 storage

on:
  pull_request:
    paths:
      - "scripts/collect-predictions.js"
      - "js/scenario-likelihood-v5.js"
      - "scripts/test-scenario-likelihood-v5-storage.js"
      - ".github/workflows/apply-scenario-likelihood-v5-storage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify shadow storage
        run: |
          node --check scripts/collect-predictions.js
          node --check js/scenario-likelihood-v5.js
          node --check scripts/test-scenario-likelihood-v5-storage.js
          node scripts/test-scenario-likelihood-v5-storage.js
          node scripts/test-scenario-likelihood-v5.js
          node scripts/check-charter.js
