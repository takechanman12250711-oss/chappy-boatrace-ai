name: Note Browserbase Live View

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-live-view:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Create Browserbase session and Live View
        run: node scripts/note-browserbase-session.js
