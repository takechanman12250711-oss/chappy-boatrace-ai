name: Note Browserbase Live View

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-live-view:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      X_LOGIN_ID: ${{ secrets.X_LOGIN_ID }}
      X_PASSWORD: ${{ secrets.X_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CDP client
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify X login helper
        run: node scripts/note-browserbase-x-login.test.js
      - name: Create Browserbase note auth session
        run: node scripts/note-browserbase-auth-session.js
