name: Check korogashi first race ST research
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-korogashi-first-race-st.cjs'
      - 'scripts/korogashi-first-race-st.test.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/build-continuous-performance-ledger.cjs'
      - 'config/korogashi-first-race-st-v1.json'
      - 'data/stats/korogashi-first-race-st-v1.json'
      - '.github/workflows/check-korogashi-first-race-st.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /tests/
            /js/
            /config/
            /data/stats/korogashi-first-race-st-v1.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/korogashi-first-race-st.test.cjs tests/continuous-performance-ledger.test.cjs
      - run: git diff --check
