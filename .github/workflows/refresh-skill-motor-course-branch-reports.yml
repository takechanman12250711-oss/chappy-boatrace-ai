name: Refresh skill motor course branch reports
on:
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build read-only branch reports
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-skill-branch-report.js
          node scripts/build-motor-course-branch-report.js
          node scripts/test-skill-motor-course-writer-contract.js
