name: Run pre-race theory context v1

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *'
  pull_request:
    paths:
      - 'scripts/analyze-prerace-theory-context-v1.cjs'
      - '.github/workflows/run-prerace-theory-context-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run contextual theory audit
        run: node scripts/analyze-prerace-theory-context-v1.cjs > prerace-theory-context-v1.json
      - name: Validate research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('prerace-theory-context-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false)process.exit(1);
          console.log(JSON.stringify({eligibleSettledRaceCount:r.eligibleSettledRaceCount,attack:r.attackLeaderInnerOuter,flow:r.flowLeaderInnerOuter,water:r.byWaterClass},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: prerace-theory-context-v1
          path: prerace-theory-context-v1.json
          retention-days: 90
