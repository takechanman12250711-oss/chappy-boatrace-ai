name: Collect automatic race predictions

on:
  push:
    branches:
      - main
      - fix/note-role-conflict-direct
    paths:
      - ".github/workflows/collect-predictions.yml"
      - "config/chappy-charter.json"
      - "scripts/check-charter.js"
      - "scripts/collect-predictions.js"
      - "scripts/build-prediction-index.js"
      - "scripts/test-build-prediction-index.js"
      - "scripts/build-prediction-summaries.js"
      - "scripts/test-prediction-summaries.js"
      - "scripts/test-load-performance.js"
      - "js/stats-runtime-loader.js"
      - "scripts/test-prediction-runtime-loader.js"
      - "js/prediction-runtime-loader.js"
      - "scripts/test-shadow-predictions.js"
      - "scripts/test-shadow-selection-v2.js"
      - "scripts/test-prediction-conditions.js"
      - "scripts/test-race-parser.js"
      - "scripts/test-theory-integration.js"
      - "scripts/test-boat-identity.js"
      - "scripts/test-auto-selection.js"
      - "js/collection-health.js"
      - "scripts/test-collection-health.js"
      - "api/schedule.js"
      - "api/race.js"
      - "api/_history.js"
      - "api/_parser.js"
      - "scripts/test-api-history.js"
      - "scripts/test-api-client-cache.js"
      - "js/ai-core.js"
      - "js/evaluated-scenario-candidates.js"
      - "js/history-insights.js"
      - "js/history-insights-base.js"
      - "js/motor-maintenance-insights.js"
      - "js/prediction.js"
      - "js/boat-identity.js"
      - "js/note-generator.js"
      - "js/practical-selection.js"
      - "js/prediction-conditions.js"
      - "js/shadow-selection-v2.js"
      - "js/theory-input.js"

  schedule:
    - cron: "*/15 22-23 * * *" # 07:00-08:45 JST
    - cron: "*/15 0-13 * * *" # 09:00-22:45 JST

  workflow_dispatch:
    inputs:
      date:
        description: "予想日（YYYYMMDD・空欄なら本日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect-automatic-predictions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize-note-role-fix:
    if: github.ref == 'refs/heads/fix/note-role-conflict-direct'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/note-role-conflict-direct
          fetch-depth: 0

      - name: Remove accidental public API and validate
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('js/note-generator.js')
          text = path.read_text()
          old = '    compactTicketComment,\n    contradictoryRoleBoats\n  };'
          new = '    compactTicketComment\n  };'
          if old not in text:
              raise SystemExit('公開API削除対象が見つかりません')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f scripts/test-note-role-conflict-scope.js
          node --check js/note-generator.js
          node scripts/test-theory-integration.js
          node scripts/check-charter.js

      - name: Restore workflow and commit validated source
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/collect-predictions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/note-generator.js scripts/test-note-role-conflict-scope.js .github/workflows/collect-predictions.yml
          git commit -m "note役割重複判定のスコープを修正"
          git push origin HEAD:fix/note-role-conflict-direct

  predict:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check charter and source
        run: |
          node --check scripts/collect-predictions.js
          node --check js/boat-identity.js
          node --check js/evaluated-scenario-candidates.js
          node --check js/shadow-selection-v2.js
          node scripts/test-shadow-predictions.js
          node scripts/test-shadow-selection-v2.js
          node scripts/test-prediction-conditions.js
          node scripts/test-race-parser.js
          node scripts/test-theory-integration.js
          node scripts/test-boat-identity.js
          node scripts/test-auto-selection.js
          node scripts/test-evaluated-scenario-consistency.js
          node scripts/test-api-history.js
          node scripts/test-api-client-cache.js
          node scripts/test-prediction-summaries.js
          node scripts/test-build-prediction-index.js
          node scripts/test-load-performance.js
          node scripts/test-prediction-runtime-loader.js
          node scripts/test-collection-health.js
          node scripts/check-charter.js

      - name: Compare and predict live races
        env:
          PREDICT_DATE: ${{ inputs.date }}
        run: |
          node scripts/collect-predictions.js
          node scripts/build-prediction-index.js
          node scripts/build-prediction-summaries.js
          node scripts/test-load-performance.js
          node scripts/test-prediction-runtime-loader.js

      - name: Save predictions and note drafts
        run: |
          git add data/predictions

          if [ -d data/notes ]; then
            git add data/notes
          fi

          if git diff --cached --quiet; then
            echo "保存する新しい予想はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect automatic race prediction"
          git pull --rebase origin main
          git push origin main
