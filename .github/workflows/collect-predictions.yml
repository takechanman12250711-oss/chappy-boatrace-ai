name: Collect automatic race predictions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/collect-predictions.yml"
      - ".github/workflows/collect-frame-rise-fall-shadow-ab.yml"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/build-learning-analysis-pipeline.yml"
      - "config/chappy-charter.json"
      - "scripts/check-charter.js"
      - "scripts/collect-predictions.js"
      - "scripts/compact-frame-rise-fall-shadow-inline.js"
      - "scripts/test-compact-frame-rise-fall-shadow-inline.js"
      - "scripts/minify-daily-prediction.js"
      - "scripts/test-minify-daily-prediction.js"
      - "scripts/daily-prediction-source-archive.js"
      - "scripts/restore-daily-prediction-source.js"
      - "scripts/prepare-daily-prediction-git-save.js"
      - "scripts/test-daily-prediction-source-archive.js"
      - "scripts/test-daily-prediction-source-archive-idempotency.js"
      - "scripts/test-post-save-source-restore-order.js"
      - "js/frame-rise-fall-replay-preload.js"
      - "js/practical-priority-shadow.js"
      - "js/practical-priority-shadow-report.js"
      - "scripts/build-practical-priority-shadow-report.js"
      - "scripts/test-practical-priority-shadow.js"
      - "scripts/test-practical-priority-shadow-artifact.js"
      - "scripts/build-scenario-ai-v6-snapshots.js"
      - "scripts/test-scenario-ai-v6-storage.js"
      - "js/scenario-ai-v6-shadow.js"
      - "js/scenario-ai-v6-shadow-ab.js"
      - "scripts/build-prediction-index.js"
      - "scripts/build-prediction-index-shards.js"
      - "scripts/test-build-prediction-index-shards.js"
      - "scripts/compact-prediction-index.js"
      - "scripts/test-compact-prediction-index.js"
      - "scripts/test-build-prediction-index.js"
      - "scripts/build-prediction-summaries.js"
      - "scripts/test-prediction-summaries.js"
      - "scripts/build-current-prediction-summary.js"
      - "scripts/test-current-prediction-summary.js"
      - "scripts/test-load-performance.js"
      - "js/stats-runtime-loader.js"
      - "js/prediction-index-loader.js"
      - "scripts/test-prediction-index-loader.js"
      - "scripts/test-prediction-runtime-loader.js"
      - "js/prediction-runtime-loader.js"
      - "js/hiyori-runtime-loader.js"
      - "js/prediction-flow-priority.js"
      - "js/theory.js"
      - "js/render.js"
      - "scripts/test-collector-theory-support-wiring.js"
      - "scripts/test-st-slit.js"
      - "scripts/test-double-time.js"
      - "scripts/test-new-sam.js"
      - "scripts/test-prediction-transparency-ui.js"
      - "scripts/test-shadow-predictions.js"
      - "scripts/test-shadow-selection-v2.js"
      - "scripts/test-race-scenarios.js"
      - "scripts/test-ai-core-formations.js"
      - "scripts/test-prediction-conditions.js"
      - "scripts/test-race-parser.js"
      - "scripts/test-original-exhibition.js"
      - "scripts/test-theory-integration.js"
      - "scripts/test-theory-tag-catalog-reachability.js"
      - "scripts/test-frame-rise-sink-formal-evidence.js"
      - "scripts/test-double-time-formal-evidence.js"
      - "scripts/test-boat-identity.js"
      - "scripts/test-auto-selection.js"
      - "js/collection-health.js"
      - "scripts/test-collection-health.js"
      - "api/schedule.js"
      - "api/_schedule-parser.js"
      - "api/race.js"
      - "api/_history.js"
      - "api/_parser.js"
      - "api/_original-exhibition.js"
      - "scripts/test-api-history.js"
      - "scripts/test-api-client-cache.js"
      - "js/ai-core.js"
      - "js/theory-tag-snapshot.js"
      - "js/evaluated-scenario-candidates.js"
      - "js/history-insights.js"
      - "js/history-insights-base.js"
      - "js/motor-maintenance-insights.js"
      - "js/prediction.js"
      - "js/prediction-st-exhibition-support.js"
      - "js/boat-identity.js"
      - "js/note-generator.js"
      - "js/practical-selection.js"
      - "js/prediction-conditions.js"
      - "js/shadow-selection-v2.js"
      - "js/theory-input.js"

  schedule:
    - cron: "45 21 * * *" # 06:45 JST・当日要約を先に初期化
    - cron: "*/15 22-23 * * *" # 07:00-08:45 JST
    - cron: "*/15 0-13 * * *" # 09:00-22:45 JST

  workflow_dispatch:
    inputs:
      date:
        description: "予想日（YYYYMMDD・空欄なら本日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  queue: max
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check collector-critical source
        run: |
          node --check scripts/collect-predictions.js
          node --check scripts/compact-frame-rise-fall-shadow-inline.js
          node scripts/test-compact-frame-rise-fall-shadow-inline.js
          node --check scripts/minify-daily-prediction.js
          node scripts/test-minify-daily-prediction.js
          node --check scripts/daily-prediction-source-archive.js
          node --check scripts/test-daily-prediction-source-archive-idempotency.js
          node --check scripts/restore-daily-prediction-source.js
          node --check scripts/prepare-daily-prediction-git-save.js
          node scripts/test-daily-prediction-source-archive-idempotency.js
          node scripts/test-daily-prediction-source-archive.js
          node scripts/test-post-save-source-restore-order.js
          node --check scripts/build-prediction-summaries.js
          node --check scripts/build-current-prediction-summary.js
          node scripts/test-current-prediction-summary.js
          node --check js/frame-rise-fall-replay-preload.js
          node --check js/practical-priority-shadow.js
          node --check js/practical-priority-shadow-report.js
          node --check scripts/build-practical-priority-shadow-report.js
          node scripts/test-practical-priority-shadow.js
          node --check scripts/build-scenario-ai-v6-snapshots.js
          node --check scripts/build-prediction-index-shards.js
          node --check js/prediction-index-loader.js
          node scripts/test-build-prediction-index-shards.js
          node scripts/test-prediction-index-loader.js
          node --check scripts/compact-prediction-index.js
          node scripts/test-compact-prediction-index.js
          node --check api/schedule.js
          node --check api/_schedule-parser.js
          node --check api/race.js
          node --check api/_original-exhibition.js
          node scripts/test-schedule-parser.js
          node scripts/test-race-parser.js
          node scripts/test-original-exhibition.js
          node scripts/test-theory-integration.js
          node scripts/test-theory-tag-catalog-reachability.js
          node scripts/test-collector-theory-support-wiring.js
          node scripts/test-frame-rise-sink-formal-evidence.js
          node scripts/test-double-time-formal-evidence.js
          node scripts/test-shadow-predictions.js
          node scripts/test-st-slit.js
          node scripts/test-double-time.js
          node scripts/test-new-sam.js
          node scripts/test-prediction-transparency-ui.js
          node scripts/test-scenario-ai-v6-shadow.js
          node scripts/test-scenario-ai-v6-storage.js
          node scripts/test-race-scenarios.js
          node scripts/test-ai-core-formations.js
          node scripts/test-shadow-selection-v2.js
          node scripts/test-boat-identity.js
          node scripts/check-charter.js

      - name: Compare and predict live races
        env:
          PREDICT_DATE: ${{ inputs.date }}
          NODE_OPTIONS: --require ./js/frame-rise-fall-replay-preload.js
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/collect-predictions.js
          node scripts/build-scenario-ai-v6-snapshots.js
          node scripts/build-prediction-index-shards.js
          node scripts/build-practical-priority-shadow-report.js
          node scripts/compact-frame-rise-fall-shadow-inline.js
          node scripts/minify-daily-prediction.js
          node scripts/build-current-prediction-summary.js

      - name: Validate generated prediction artifacts
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all
          node scripts/test-load-performance.js
          node scripts/test-practical-priority-shadow-artifact.js
          git diff --exit-code -- data/predictions/index.json

      - name: Save predictions and note drafts
        env:
          PREDICT_DATE: ${{ inputs.date }}
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all

          if [ -d data/notes ]; then
            git add data/notes
          fi

          git add data/stats/practical-priority-shadow-report.json

          if git diff --cached --quiet; then
            echo "保存する新しい予想はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect automatic race prediction"
          git pull --rebase origin main
          git push origin main

      - name: Run noncritical regression checks
        continue-on-error: true
        env:
          PREDICT_DATE: ${{ inputs.date }}
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/test-load-performance.js
          node scripts/test-prediction-runtime-loader.js
          node --check js/scenario-ai-v6-shadow.js
          node --check js/evaluated-scenario-candidates.js
          node --check js/shadow-selection-v2.js
          node scripts/test-scenario-ai-v6-shadow.js
          node scripts/test-scenario-ai-v6-storage.js
          node scripts/test-shadow-selection-v2.js
          node scripts/test-prediction-conditions.js
          node scripts/test-auto-selection.js
          node scripts/test-evaluated-scenario-consistency.js
          node scripts/test-api-history.js
          node scripts/test-api-client-cache.js
          node scripts/test-prediction-summaries.js
          node scripts/test-current-prediction-summary.js
          node scripts/test-daily-prediction-source-archive-idempotency.js
          node scripts/test-daily-prediction-source-archive.js
          node scripts/test-post-save-source-restore-order.js
          node scripts/test-build-prediction-index.js
          node scripts/test-build-prediction-index-shards.js
          node scripts/test-prediction-index-loader.js
          node scripts/test-compact-prediction-index.js
          node scripts/test-collection-health.js
