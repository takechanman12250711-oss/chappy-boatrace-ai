name: Check index hotfix 20260806

on:
  push:
    branches: [hotfix/restore-index-20260806]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate index
        run: |
          grep -q '<link rel="stylesheet" href="style.css?v=20260806-venue24-hotfix2" />' index.html
          grep -q '<script src="js/app-runtime-loader.js?v=20260806-venue24-hotfix2"></script>' index.html
          ! grep -q 'legacy test marker: style.css?v=20260806-venue24-1"stylesheet"' index.html
          ! grep -q 'legacy test marker: js/app-runtime-loader.js?v=20260806-venue24-1"js/app-runtime-loader' index.html
          node scripts/check-charter.js
