name: Run outer head rescue false-promotion audit
on:
  pull_request:
    paths:
      - "scripts/analyze-outer-head-rescue-false-promotion.cjs"
      - ".github/workflows/run-outer-head-rescue-false-promotion-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/analyze-outer-head-rescue-false-promotion.cjs"
      - ".github/workflows/run-outer-head-rescue-false-promotion-audit.yml"
      - "data/stats/local-water-priority-selector-shadow-replay.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run audit
        run: node scripts/analyze-outer-head-rescue-false-promotion.cjs > outer-head-rescue-false-promotion-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: outer-head-rescue-false-promotion-audit
          path: outer-head-rescue-false-promotion-audit.json
