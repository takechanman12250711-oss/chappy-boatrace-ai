      - "scripts/test-prediction-index-loader.js"
      - "scripts/test-collect-results.js"
      - "scripts/test-repair-recent-results.js"
  schedule:
    - cron: "30 14 * * *" # 23:30 JST
    - cron: "15 15 * * *" # 00:15 JST・遅延結果と後追加予想を再照合

  workflow_dispatch:
    inputs:
      date:
        description: "収集日（YYYYMMDD・空欄なら本日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify result merge safety
        run: |
          node --check scripts/collect-results.js
          node --check scripts/repair-recent-results.js
          node --check scripts/daily-prediction-source-archive.js
          node --check scripts/restore-daily-prediction-source.js
          node --check scripts/prepare-daily-prediction-git-save.js
          node scripts/test-daily-prediction-source-archive.js
          node scripts/test-result-source-archive-order.js
          node --check js/frame-rise-fall-shadow-result-report.js
          node --check scripts/build-frame-rise-fall-shadow-result-report.js
          node scripts/test-frame-rise-fall-shadow-result-report.js
          node --check scripts/build-frame-rise-fall-negative-clip-result-report.js
          node scripts/test-frame-rise-fall-negative-clip-result-report.js
          node --check scripts/build-race-flow-in-first-outside-alert-skip-ab-report.js
          node scripts/test-race-flow-in-first-outside-alert-skip-ab-report.js
          node --check scripts/build-race-flow-4kado-alert-skip-ab-report.js
          node scripts/test-race-flow-4kado-alert-skip-ab-report.js
          node --check scripts/build-race-flow-3course-alert-skip-ab-report.js
          node scripts/test-race-flow-3course-alert-skip-ab-report.js
          node --check scripts/build-race-flow-2course-sashi-skip-ab-report.js
          node scripts/test-race-flow-2course-sashi-skip-ab-report.js
          node --check scripts/build-race-flow-outside-push-skip-ab-report.js
          node scripts/test-race-flow-outside-push-skip-ab-report.js
          node --check scripts/build-remain-pickup-hold3-shadow-ab.js
          node scripts/test-remain-pickup-hold3-shadow-ab.js
          node --check scripts/build-unified-improvement-decision-gate.js
          node scripts/test-unified-improvement-decision-gate.js
          node --check scripts/build-phase3-learning-handoff.js
          node scripts/test-phase3-learning-handoff.js
          node scripts/test-phase3-refresh-contract.js
          node --check scripts/build-learning-analysis-pipeline.js
          node --check scripts/build-phase4-daily-cycle-gate.js
          node --check scripts/build-phase4-historical-cycle-proof.js
          node scripts/test-phase4-daily-cycle-gate.js
          node --check scripts/build-skill-branch-report.js
          node scripts/test-skill-branch-report.js
          node --check scripts/build-motor-course-branch-report.js
          node scripts/test-finish-skill-motor-course-observability.js
          node scripts/test-skill-motor-course-writer-contract.js
          node --check scripts/build-st-slit-branch-profit-report.js
          node scripts/test-st-slit-branch-profit-report.js
          node scripts/test-st-slit-writer-contract.js
          node --check scripts/build-exhibition-foot-branch-report.js
          node scripts/test-exhibition-foot-branch-report.js
          node scripts/test-exhibition-foot-writer-contract.js
          node --check scripts/build-exhibition-rank3plus-breakdown.js
          node --check scripts/build-wall-boat-branch-profit-report.js
          node scripts/test-wall-boat-branch-profit-report.js
          node --check scripts/build-wall-established-breakdown.js
          node scripts/test-breakdown-writer-contract.js
          node --check scripts/build-race-flow-branch-profit-report.js
          node scripts/test-race-flow-branch-profit-report.js
          node scripts/test-race-flow-branch-profit-writer-contract.js
          node --check js/practical-priority-shadow.js
          node --check js/practical-priority-shadow-report.js
          node --check scripts/build-practical-priority-shadow-report.js
          node scripts/test-practical-priority-shadow.js
          node scripts/test-practical-priority-shadow-report.js
          node --check scripts/build-result-review.js
          node --check js/theory-evaluation-engine.js
          node --check scripts/build-theory-evaluations.js
          node --check js/miss-cause-analysis.js
          node --check scripts/build-miss-cause-analysis.js
          node --check js/improvement-proposal-engine.js
          node --check scripts/build-improvement-proposal-report.js
          node --check scripts/build-learning-pipeline-gate.js
          node --check scripts/build-phase6-data-audit.js
          node --check scripts/test-improvement-proposal-input-contract.js
          node --check js/theory-adoption-phase5.js
          node --check scripts/build-theory-adoption-phase5.js
          node --check scripts/build-prediction-index-shards.js
          node --check js/prediction-index-loader.js
          node scripts/test-build-prediction-index-shards.js
          node scripts/test-prediction-index-loader.js
          node --check scripts/compact-prediction-index.js
          node scripts/test-compact-prediction-index.js
          node scripts/test-collect-results.js
          node scripts/test-repair-recent-results.js
          node scripts/test-result-review.js
          node scripts/test-theory-evaluation-engine.js
          node scripts/test-miss-cause-analysis.js
          node scripts/test-improvement-proposal-engine.js
          node scripts/test-theory-adoption-phase5.js

      - name: Collect official results
        env:
          COLLECT_DATE: ${{ inputs.date }}
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/repair-recent-results.js
          node scripts/build-exhibition-foot-branch-report.js
          node scripts/build-race-flow-branch-profit-report.js
          node scripts/build-exhibition-rank3plus-breakdown.js
          node scripts/build-wall-boat-branch-profit-report.js
          node scripts/build-wall-established-breakdown.js
          node scripts/build-skill-branch-report.js
          node scripts/build-motor-course-branch-report.js
          node scripts/build-st-slit-branch-profit-report.js
          node scripts/build-frame-rise-fall-shadow-result-report.js
          node scripts/build-frame-rise-fall-negative-clip-result-report.js
          node scripts/build-race-flow-4kado-alert-skip-ab-report.js
          node scripts/build-race-flow-3course-alert-skip-ab-report.js
          node scripts/build-race-flow-2course-sashi-skip-ab-report.js
          node scripts/build-race-flow-outside-push-skip-ab-report.js
          node scripts/build-race-flow-in-first-outside-alert-skip-ab-report.js
          node scripts/build-remain-pickup-hold3-shadow-ab.js
          node scripts/build-unified-improvement-decision-gate.js
          node scripts/build-learning-analysis-pipeline.js
          node scripts/test-improvement-proposal-input-contract.js
          node scripts/test-analysis-input-contract.js
          node scripts/test-theory-candidate-branch-analysis-phase9-artifact.js
          node scripts/build-phase3-learning-handoff.js
          node scripts/build-phase4-daily-cycle-gate.js
          node scripts/build-scenario-ai-v6-verification.js
          node scripts/build-practical-priority-shadow-report.js
          node scripts/test-practical-priority-shadow-artifact.js
          node scripts/build-prediction-index-shards.js

      - name: Validate result prediction artifacts
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all
          node scripts/test-load-performance.js
          git diff --exit-code -- data/predictions/index.json

      - name: Save official results before calibration
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all
          git add data/results data/stats data/analysis/reference-tag-effectiveness.json

          if git diff --cached --quiet; then
            echo "先行保存する公式結果はありません"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Collect official race results"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Build prediction calibration
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/test-match-predictions.js
          node scripts/test-repair-recent-results.js
          node scripts/test-prediction-verification.js
          node scripts/test-prediction-calibration.js
          node scripts/test-result-review.js
          node scripts/test-theory-evaluation-engine.js
          node scripts/test-miss-cause-analysis.js
          node scripts/test-improvement-proposal-engine.js
          node scripts/test-theory-adoption-phase5.js
          node scripts/test-scenario-ai-v6-verification.js
          node scripts/test-scenario-ai-v6-learning-report.js
          node scripts/build-scenario-ai-v6-learning-report.js
          node scripts/test-scenario-ai-v6-reproducibility-gate.js
          node scripts/build-scenario-ai-v6-reproducibility-gate.js
          node scripts/test-scenario-ai-v6-ab-report.js
          node scripts/build-scenario-ai-v6-ab-report.js
          node scripts/test-scenario-ai-v6-adoption-review.js
          node scripts/build-scenario-ai-v6-adoption-review.js
          node scripts/test-scenario-ai-v6-approval.js
          node scripts/build-scenario-ai-v6-approval-status.js
          node scripts/test-scenario-ai-v6-rollout-status.js
          node scripts/build-scenario-ai-v6-rollout-status.js
          node scripts/test-scenario-ai-v6-stop-decision.js
          node scripts/build-scenario-ai-v6-stop-decision.js
          node scripts/build-prediction-calibration.js
          node scripts/test-improvement-review.js
          node scripts/build-improvement-review.js
          node scripts/test-scenario-likelihood-v5-verification.js
          node scripts/test-scenario-likelihood-v5-calibration.js
          node scripts/build-scenario-likelihood-v5-calibration.js
          node scripts/test-scenario-likelihood-v5-ab-verification.js
          node scripts/test-build-scenario-likelihood-v5-ab-report.js
          node scripts/build-scenario-likelihood-v5-ab-report.js
          node scripts/test-theory-performance-report.js
          node scripts/build-theory-performance-report.js
          node scripts/test-theory-improvement-proposals.js
          node scripts/build-theory-improvement-proposals.js
          node scripts/test-theory-shadow-ab-verification.js
          node scripts/test-build-theory-shadow-ab-report.js
          node scripts/build-theory-shadow-ab-report.js
          node scripts/test-theory-shadow-production-gate.js
          node scripts/build-theory-shadow-production-gate.js
          node scripts/test-theory-adoption-review-report.js
          node scripts/build-theory-adoption-review-report.js
          node scripts/test-theory-adoption-approval.js
          node scripts/build-theory-adoption-approval-status.js
          node scripts/test-theory-adoption-monitor.js
          node scripts/build-theory-adoption-monitor.js
          node scripts/test-theory-stop-decision-report.js
          node scripts/build-theory-stop-decision-report.js
          node scripts/test-build-prediction-index.js
          node scripts/test-build-prediction-index-shards.js
          node scripts/test-prediction-index-loader.js
          node scripts/build-prediction-index-shards.js

      - name: Validate calibrated prediction artifacts
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all
          node scripts/test-load-performance.js
          git diff --exit-code -- data/predictions/index.json

      - name: Save calibration and derived data
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all
          git add data/results data/stats data/analysis/reference-tag-effectiveness.json

          if git diff --cached --quiet; then
            echo "追加保存する校正・集計データはありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update result calibration and reports"
          git pull --rebase origin main
          git push origin main

      - name: Run noncritical performance check
        continue-on-error: true
        run: node scripts/test-load-performance.js
