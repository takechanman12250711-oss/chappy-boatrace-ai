name: Collect official race results

on:
  schedule:
    - cron: "30 14 * * *" # 23:30 JST
    - cron: "15 15 * * *" # 00:15 JST・遅延結果と後追加予想を再照合

  workflow_dispatch:
    inputs:
      date:
        description: "収集日（YYYYMMDD・空欄なら本日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: collect-official-results
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify result merge safety
        run: |
          node --check scripts/collect-results.js
          node --check scripts/repair-recent-results.js
          node --check scripts/build-result-review.js
          node scripts/test-collect-results.js
          node scripts/test-repair-recent-results.js
          node scripts/test-result-review.js

      - name: Collect official results
        env:
          COLLECT_DATE: ${{ inputs.date }}
        run: |
          node scripts/repair-recent-results.js
          node scripts/build-result-review.js
          node scripts/build-scenario-ai-v6-verification.js

      - name: Build prediction calibration
        run: |
          node scripts/test-match-predictions.js
          node scripts/test-repair-recent-results.js
          node scripts/test-prediction-verification.js
          node scripts/test-prediction-calibration.js
          node scripts/test-result-review.js
          node scripts/test-scenario-ai-v6-verification.js
          node scripts/test-scenario-ai-v6-learning-report.js
          node scripts/build-scenario-ai-v6-learning-report.js
          node scripts/build-prediction-calibration.js
          node scripts/test-improvement-review.js
          node scripts/build-improvement-review.js
          node scripts/test-scenario-likelihood-v5-verification.js
          node scripts/test-scenario-likelihood-v5-calibration.js
          node scripts/build-scenario-likelihood-v5-calibration.js
          node scripts/test-scenario-likelihood-v5-ab-verification.js
          node scripts/test-build-scenario-likelihood-v5-ab-report.js
          node scripts/build-scenario-likelihood-v5-ab-report.js
          node scripts/test-theory-performance-report.js
          node scripts/build-theory-performance-report.js
          node scripts/test-theory-improvement-proposals.js
          node scripts/test-theory-improvement-approval-gate.js
          node scripts/build-theory-improvement-proposals.js
          node scripts/test-theory-shadow-ab-verification.js
          node scripts/test-build-theory-shadow-ab-report.js
          node scripts/build-theory-shadow-ab-report.js
          node scripts/test-theory-shadow-production-gate.js
          node scripts/build-theory-shadow-production-gate.js
          node scripts/test-theory-adoption-review-report.js
          node scripts/build-theory-adoption-review-report.js
          node scripts/test-theory-adoption-approval.js
          node scripts/build-theory-adoption-approval-status.js
          node scripts/test-theory-adoption-monitor.js
          node scripts/build-theory-adoption-monitor.js
          node scripts/test-theory-stop-decision-report.js
          node scripts/build-theory-stop-decision-report.js
          node scripts/test-build-prediction-index.js
          node scripts/build-prediction-index.js
          node scripts/test-load-performance.js

      - name: Save collected results
        run: |
          git add data/results data/predictions data/stats

          if git diff --cached --quiet; then
            echo "保存する変更はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect official race results"
          git pull --rebase origin main
          git push origin main
