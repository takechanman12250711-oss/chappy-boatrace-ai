name: Check home dashboard v2

on:
  pull_request:
    paths:
      - "index.html"
      - "js/app-runtime-loader.js"
      - "js/home-dashboard-v2.js"
      - "js/home-venue-tap-hotfix.js"
      - "js/prediction-loading-watchdog.js"
      - "js/prediction-runtime-loader.js"
      - "js/script.js"
      - "js/home-recommendation-reliability.js"
      - "css/home-dashboard-v2.css"
      - "scripts/test-home-dashboard-v2.js"
      - "scripts/test-home-review-night-hotfix.js"
      - "scripts/test-home-review-night-safety.js"
      - "scripts/test-prediction-loading-watchdog.js"
      - "scripts/test-prediction-loading-terminal-state.js"
      - "scripts/test-home-recommendation-reliability.js"
      - ".github/workflows/check-home-dashboard-v2.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify home dashboard v2
        run: |
          node --check js/app-runtime-loader.js
          node --check js/home-dashboard-v2.js
          node --check js/home-venue-tap-hotfix.js
          node --check js/prediction-loading-watchdog.js
          node --check js/prediction-runtime-loader.js
          node --check js/script.js
          node --check js/home-recommendation-reliability.js
          node scripts/test-home-dashboard-v2.js
          node scripts/test-home-review-night-hotfix.js
          node scripts/test-home-review-night-safety.js
          node scripts/test-prediction-loading-watchdog.js
          node scripts/test-prediction-loading-terminal-state.js
          node scripts/test-home-recommendation-reliability.js
