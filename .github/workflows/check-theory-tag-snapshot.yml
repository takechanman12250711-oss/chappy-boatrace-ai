name: Check theory tag snapshot

on:
  pull_request:
    paths:
      - "js/prediction-venue-water-support.js"
      - "js/prediction-st-exhibition-support.js"
      - "js/theory-input.js"
      - "js/ai-core.js"
      - "js/theory-evaluation-engine.js"
      - "js/theory-tag-snapshot.js"
      - "scripts/collect-predictions.js"
      - "scripts/test-local-water-theory-tag.js"
      - "scripts/test-frame-rise-sink-formal-evidence.js"
      - "scripts/test-collector-theory-support-wiring.js"
      - "scripts/test-shadow-predictions.js"
      - "scripts/test-theory-tag-snapshot.js"
      - ".github/workflows/check-theory-tag-snapshot.yml"
  push:
    paths:
      - "js/prediction-venue-water-support.js"
      - "js/prediction-st-exhibition-support.js"
      - "js/theory-input.js"
      - "js/ai-core.js"
      - "js/theory-evaluation-engine.js"
      - "js/theory-tag-snapshot.js"
      - "scripts/collect-predictions.js"
      - "scripts/test-local-water-theory-tag.js"
      - "scripts/test-frame-rise-sink-formal-evidence.js"
      - "scripts/test-collector-theory-support-wiring.js"
      - "scripts/test-shadow-predictions.js"
      - "scripts/test-theory-tag-snapshot.js"
      - ".github/workflows/check-theory-tag-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify theory tag snapshots
        run: |
          node --check js/prediction-venue-water-support.js
          node --check js/prediction-st-exhibition-support.js
          node --check js/theory-tag-snapshot.js
          node --check scripts/collect-predictions.js
          node --check scripts/test-collector-theory-support-wiring.js
          node scripts/test-collector-theory-support-wiring.js
          node scripts/test-shadow-predictions.js
          node scripts/test-theory-tag-snapshot.js
          node scripts/test-local-water-theory-tag.js
          node scripts/test-frame-rise-sink-formal-evidence.js
          node scripts/check-charter.js
