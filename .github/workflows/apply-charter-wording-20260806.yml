name: Apply charter wording 20260806

on:
  push:
    branches:
      - agent/display-polish-20260806
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/display-polish-20260806' || github.ref_name == 'agent/display-polish-20260806'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/display-polish-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/apply-charter-wording-20260806.js
      - run: |
          node --check js/render.js
          node scripts/check-charter.js
      - name: Commit generated change
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/render.js
          git commit -m "実戦厳選の必須説明を簡潔に保つ"
          git pull --rebase origin agent/display-polish-20260806
          git push origin HEAD:agent/display-polish-20260806
