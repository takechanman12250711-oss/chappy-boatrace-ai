name: Update note marketing

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-note-marketing.yml'
      - 'config/note-marketing.json'
      - 'config/note-social.json'
      - 'scripts/send-note-social*'
      - 'scripts/note-marketing-*.js'
      - 'scripts/update-note-marketing.js'
      - 'scripts/note-linked-body.js'
  workflow_run:
    workflows: ['Note GitHub UI Transport']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: note-ui-transport
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' &&
      ((github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            config
            js
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record checked-out revision
        run: echo "NOTE_CLAIM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify marketing safeguards
        run: node --test scripts/note-marketing.test.js scripts/note-marketing-reports.test.js scripts/send-note-social.test.cjs
      - run: npm install --no-save playwright@1.55.0
      - name: Update and verify free guide and daily index
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSER_USE_PROFILE_ID: ${{ secrets.BROWSER_USE_PROFILE_ID }}
          NOTE_CLAIM_TOKEN: ${{ github.token }}
        run: node scripts/update-note-marketing.js
      - name: Dispatch verified hit reports to X and LINE together
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/send-note-social.cjs
