name: Update note marketing

on:
  workflow_dispatch:
    inputs:
      korogashi_first_publication_key:
        description: 'コロがし開始元（例 20261006-15-6:escape）。空欄なら通常更新のみ'
        type: string
        required: false
      korogashi_targets:
        description: '目標保有額・円（カンマ区切り。10万円単位）'
        type: string
        default: '100000,200000,300000'
      korogashi_max_legs:
        description: '初回を含む最大レース数'
        type: choice
        options: ['2', '3']
        default: '3'
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-note-marketing.yml'
      - 'config/note-marketing.json'
      - 'config/note-social.json'
      - 'scripts/send-note-social*'
      - 'scripts/send-note-buffer*'
      - 'scripts/note-marketing-*.js'
      - 'scripts/note-result-card*'
      - 'scripts/note-public-results*'
      - 'scripts/note-published-ticket-sections*'
      - 'scripts/note-publication-source*'
      - 'scripts/note-readable-article*'
      - 'scripts/update-note-marketing.js'
      - 'scripts/note-linked-body.js'
      - 'scripts/note-korogashi*.cjs'
      - 'config/note-korogashi.json'
  workflow_run:
    workflows: ['Note GitHub UI Transport']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: note-ui-transport
  queue: max
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' &&
      ((github.event_name != 'workflow_run' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: |
            scripts
            config
            js
            api
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Record checked-out revision
        run: echo "NOTE_CLAIM_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic result-card renderer
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Verify marketing safeguards
        run: node --test scripts/note-public-results.test.js scripts/note-published-ticket-sections.test.js scripts/note-marketing-expiry.test.js scripts/note-marketing.test.js scripts/note-marketing-reports.test.js scripts/note-marketing-measurement.test.js scripts/send-note-social.test.cjs scripts/send-note-buffer.test.cjs scripts/note-korogashi*.test.cjs
      - name: Prepare requested korogashi courses and settle saved legs
        id: korogashi-prepare
        continue-on-error: true
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          KOROGASHI_FIRST_PUBLICATION_KEY: ${{ inputs.korogashi_first_publication_key }}
          KOROGASHI_TARGETS: ${{ inputs.korogashi_targets }}
          KOROGASHI_MAX_LEGS: ${{ inputs.korogashi_max_legs }}
        run: node scripts/note-korogashi-run.cjs prepare /tmp/note-korogashi-stage.json
      - name: Register course snapshots on GitHub before deadline
        id: korogashi-artifact
        if: steps.korogashi-prepare.outcome == 'success' && steps.korogashi-prepare.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: note-korogashi-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/note-korogashi-stage.json
          retention-days: 90
          if-no-files-found: error
      - name: Confirm external registration before advancing courses
        id: korogashi-confirm
        if: steps.korogashi-artifact.outputs.artifact-id != ''
        continue-on-error: true
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          KOROGASHI_ARTIFACT_ID: ${{ steps.korogashi-artifact.outputs.artifact-id }}
          KOROGASHI_ARTIFACT_DIGEST: ${{ steps.korogashi-artifact.outputs.artifact-digest }}
        run: node scripts/note-korogashi-run.cjs confirm /tmp/note-korogashi-stage.json
      - name: Verify Buffer connection without posting
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {client} = require('./scripts/note-marketing-store');
          const {ledger,transport,blockers} = require('./scripts/send-note-buffer.cjs');
          const config = JSON.parse(fs.readFileSync('config/note-social.json','utf8'));
          (async () => {
            const reasons = blockers(config,process.env,Date.now());
            if (reasons.length) throw Error('buffer_connection_conditions_missing');
            await transport(process.env,config,ledger(client(process.env))).channel();
            console.log('BUFFER_CONNECTION=verified_chappy_boat_ai_no_post_created');
          })().catch(error => {
            const safe = /^buffer_[a-z0-9_]+$/.test(error.message) ? error.message : 'buffer_connection_failed';
            console.error('BUFFER_CONNECTION=' + safe);
            process.exitCode = 1;
          });
          NODE
      - run: npm install --no-save playwright@1.55.0
      - name: Update and verify free guide and daily index
        env:
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSER_USE_PROFILE_ID: ${{ secrets.BROWSER_USE_PROFILE_ID }}
          NOTE_CLAIM_TOKEN: ${{ github.token }}
        run: node scripts/update-note-marketing.js
      - name: Verify result-card safeguards
        run: node --test scripts/note-result-card.test.cjs scripts/note-marketing-image.test.js
      - name: Dispatch verified hit reports through Buffer Free
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: node scripts/send-note-buffer.cjs
      - name: Surface course registration failures after normal updates
        if: always() && (steps.korogashi-prepare.outcome == 'failure' || steps.korogashi-artifact.outcome == 'failure' || steps.korogashi-confirm.outcome == 'failure')
        run: exit 1
