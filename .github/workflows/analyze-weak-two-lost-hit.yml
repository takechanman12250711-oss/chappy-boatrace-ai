name: Analyze weak two-head lost hit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/analyze-weak-two-lost-hit.js'
      - 'scripts/analyze-weak-two-pruned-cohort.js'
      - 'scripts/validate-weak-two-inside-hold-exception.js'
      - '.github/workflows/analyze-weak-two-lost-hit.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: |
          node --check scripts/analyze-weak-two-lost-hit.js
          node --check scripts/analyze-weak-two-pruned-cohort.js
          node --check scripts/validate-weak-two-inside-hold-exception.js
      - run: node scripts/analyze-weak-two-lost-hit.js
      - run: node scripts/analyze-weak-two-pruned-cohort.js
      - run: node scripts/validate-weak-two-inside-hold-exception.js
