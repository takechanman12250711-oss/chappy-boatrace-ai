name: Check ticket accordion render path

on:
  pull_request:
    paths:
      - "index.html"
      - "js/ticket-accordion-bootstrap-v2.js"
      - "js/ticket-accordion-render.js"
      - "js/prediction-runtime-loader.js"
      - "scripts/test-ticket-accordion-render-path.js"
      - ".github/workflows/check-ticket-accordion-render-path.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/ticket-accordion-bootstrap-v2.js"
      - "js/ticket-accordion-render.js"
      - "js/prediction-runtime-loader.js"
      - "scripts/test-ticket-accordion-render-path.js"
      - ".github/workflows/check-ticket-accordion-render-path.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check js/ticket-accordion-bootstrap-v2.js
      - run: node --check js/ticket-accordion-render.js
      - run: node --check js/prediction-runtime-loader.js
      - run: node scripts/test-ticket-accordion-render-path.js
