name: Check fixed5 rescue sideeffect attribution
on:
  pull_request:
    paths:
      - 'scripts/audit-fixed5-rescue-sideeffect-attribution.js'
      - '.github/workflows/check-fixed5-rescue-sideeffect-attribution.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/audit-fixed5-rescue-sideeffect-attribution.js
      - run: node scripts/audit-fixed5-rescue-sideeffect-attribution.js | tee fixed5-rescue-sideeffect-attribution.json
      - uses: actions/upload-artifact@v4
        with:
          name: fixed5-rescue-sideeffect-attribution
          path: fixed5-rescue-sideeffect-attribution.json