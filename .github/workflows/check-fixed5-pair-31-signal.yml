name: Check fixed5 pair 3-1 signal
on:
  pull_request:
    paths:
      - 'scripts/analyze-fixed5-pair-31-signal.js'
      - '.github/workflows/check-fixed5-pair-31-signal.yml'
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-fixed5-pair-31-signal.js
      - run: node scripts/analyze-fixed5-pair-31-signal.js