name: Check escape role partner shadow
on:
  pull_request:
    paths:
      - js/escape-role-partner-shadow.js
      - scripts/test-escape-role-partner-shadow.js
      - scripts/build-escape-role-partner-shadow-report.js
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/test-escape-role-partner-shadow.js
      - run: node scripts/build-escape-role-partner-shadow-report.js
      - uses: actions/upload-artifact@v4
        with:
          name: escape-role-partner-shadow-report
          path: tmp-shadow/escape-role-partner-shadow-report.json
