name: Collect playful link-position forward monitor
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Collect automatic race predictions
      - Collect official race results
    types: [completed]
  pull_request:
    paths:
      - scripts/build-playful-link-position-forward.cjs
      - tests/playful-link-position-forward.test.cjs
      - data/experiments/playful-link-position-v1.json
      - .github/workflows/collect-playful-link-position-forward.yml
permissions:
  contents: write
concurrency:
  group: playful-link-position-forward
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/playful-link-position-forward.test.cjs
      - if: github.event_name != 'pull_request'
        run: node scripts/build-playful-link-position-forward.cjs
      - name: Persist report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats/playful-link-position-forward-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Update playful link-position forward monitor"
          git pull --rebase origin main
          git push origin HEAD:main
