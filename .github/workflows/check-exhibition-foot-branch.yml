name: Check exhibition foot branch
on:
  pull_request:
    paths:
      - "scripts/build-exhibition-foot-branch-report.js"
      - "scripts/test-exhibition-foot-branch-report.js"
      - "scripts/test-exhibition-foot-writer-contract.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/refresh-exhibition-foot-branch-report.yml"
      - ".github/workflows/check-exhibition-foot-branch.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-exhibition-foot-branch-report.js"
      - ".github/workflows/check-exhibition-foot-branch.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify exhibition foot branch analyzer
        run: |
          node --check scripts/build-exhibition-foot-branch-report.js
          node scripts/test-exhibition-foot-branch-report.js
          node scripts/test-exhibition-foot-writer-contract.js
      - name: Build read-only real diagnostics
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-exhibition-foot-branch-report.js
