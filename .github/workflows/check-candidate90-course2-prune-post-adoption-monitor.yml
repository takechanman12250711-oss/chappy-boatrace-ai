name: Check candidate90 course2 prune post-adoption monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/practical-selection.js"
      - "scripts/build-candidate90-course2-prune-post-adoption-monitor.js"
      - "scripts/restore-daily-prediction-source.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-candidate90-course2-prune-post-adoption-monitor.yml"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          # Fetch every canonical input without duplicate archive-backed raw blobs.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/data/
            /data/predictions/
            !/data/predictions/20??????.json
      - name: Include every unarchived prediction source
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const base = 'data/predictions/';
          const daily = execFileSync('git', ['ls-tree', '--name-only', 'HEAD:data/predictions'], { encoding: 'utf8' })
            .trim().split('\n').filter(name => /^\d{8}\.json$/.test(name));
          const unarchived = daily.filter(name => {
            const date = name.slice(0, 8);
            return !['.json.gz', '.meta.json'].every(suffix => fs.existsSync(base + 'source-archives/' + date + suffix));
          }).map(name => '/' + base + name);
          if (unarchived.length) execFileSync('git', ['sparse-checkout', 'add', '--stdin'], { input: unarchived.join('\n') + '\n', stdio: ['pipe', 'inherit', 'inherit'] });
          console.log('Kept all archives and ' + unarchived.length + ' unarchived daily sources. Archive-backed raw JSON is restored with SHA checks by the existing test.');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Check syntax
        run: node --check scripts/build-candidate90-course2-prune-post-adoption-monitor.js
      - name: Build exact post-adoption comparison
        run: node scripts/build-candidate90-course2-prune-post-adoption-monitor.js
