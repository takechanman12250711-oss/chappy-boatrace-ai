name: Check candidate90 course2 prune post-adoption monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/practical-selection.js"
      - "scripts/build-candidate90-course2-prune-post-adoption-monitor.js"
      - "scripts/restore-daily-prediction-source.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-candidate90-course2-prune-post-adoption-monitor.yml"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Check syntax
        run: node --check scripts/build-candidate90-course2-prune-post-adoption-monitor.js
      - name: Build exact post-adoption comparison
        run: node scripts/build-candidate90-course2-prune-post-adoption-monitor.js
