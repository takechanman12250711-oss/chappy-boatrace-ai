name: Apply scenario likelihood v5 result match

on:
  pull_request:
    paths:
      - "scripts/apply-scenario-likelihood-v5-result-match.js"
      - "js/scenario-likelihood-v5-verification.js"
      - "scripts/test-scenario-likelihood-v5-verification.js"
      - ".github/workflows/apply-scenario-likelihood-v5-result-match.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply patch
        run: node scripts/apply-scenario-likelihood-v5-result-match.js
      - name: Verify
        run: |
          node --check scripts/match-predictions.js
          node --check js/scenario-likelihood-v5-verification.js
          node scripts/test-scenario-likelihood-v5-verification.js
          node scripts/test-match-predictions.js
          node scripts/check-charter.js
      - name: Commit applied source
        run: |
          if git diff --quiet -- scripts/match-predictions.js; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/match-predictions.js
          git commit -m "Match scenario likelihood v5 with official results"
          git push
