name: Run third-place prefix rescue v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-third-place-prefix-rescue-v1.cjs'
      - '.github/workflows/run-third-place-prefix-rescue-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run third-place prefix rescue audit
        run: node scripts/analyze-third-place-prefix-rescue-v1.cjs > third-place-prefix-rescue-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('third-place-prefix-rescue-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          for (const mode of Object.values(r.modes || {})) {
            if (mode.rescueCount > 0 && mode.returnYen <= 0) process.exit(1);
            if (mode.missingPayoutRescueCount > 0) process.exit(1);
          }
          console.log(JSON.stringify(r.modes,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: third-place-prefix-rescue-v1
          path: third-place-prefix-rescue-v1.json
          retention-days: 90
