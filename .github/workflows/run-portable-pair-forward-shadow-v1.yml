name: Run portable pair forward shadow v1

on:
  workflow_dispatch:
  schedule:
    - cron: '35 15 * * *'
  pull_request:
    paths:
      - 'scripts/analyze-portable-pair-forward-shadow-v1.cjs'
      - '.github/workflows/run-portable-pair-forward-shadow-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frozen portable pair shadow
        run: node scripts/analyze-portable-pair-forward-shadow-v1.cjs > portable-pair-forward-shadow-v1.json
      - name: Validate shadow-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('portable-pair-forward-shadow-v1.json', 'utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          if (r.freezeAt !== '2026-09-01T08:45:00Z') process.exit(1);
          if (r.rule?.id !== 'inner-plus-outer-signal-nonrough-9') process.exit(1);
          if (!r.baseline || !r.sourcePair || !r.challenger || !r.gates) process.exit(1);
          console.log(JSON.stringify({
            freezeAt: r.freezeAt,
            diagnostics: r.diagnostics,
            baseline: r.baseline,
            sourcePair: r.sourcePair,
            challenger: r.challenger,
            challengerDeltaVsBaseline: r.challengerDeltaVsBaseline,
            challengerDeltaVsSourcePair: r.challengerDeltaVsSourcePair,
            gates: r.gates
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: portable-pair-forward-shadow-v1
          path: portable-pair-forward-shadow-v1.json
          retention-days: 90
