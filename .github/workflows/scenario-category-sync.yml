name: Apply scenario category sync

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
  push:
    branches:
      - agent/scenario-category-sync

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/scenario-category-sync
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply patch
        run: |
          node scripts/apply-scenario-category-sync.js
          sed -i 's/hole: "万舟"/hole: "万舟・穴"/g' js/evaluated-scenario-candidates.js js/practical-selection.js
          node <<'NODE'
          const fs = require('fs');
          const path = 'js/practical-selection.js';
          let source = fs.readFileSync(path, 'utf8');
          source = source.replace(`  const CATEGORY_LABELS = Object.freeze({
            main: "本線",
            cover: "押さえ",
            flow: "流し",
            hole: "万舟・穴",
            possibility: "展開候補"
          });
`, '');
          source = source.replace(`    const sourceCategory =
            explicitSourceCategory ||
            categoryKey(
              original.sourceCategory ||
              original.displayCategory ||
              original.category ||
              category
            );`, `    const sourceCategory =
            explicitSourceCategory ||
            categoryKey(category);`);
          source = source.replace(`      category:
            CATEGORY_LABELS[sourceCategory] ||
            category,
          sourceCategory,`, `      category,
          displayCategory:
            original.displayCategory ||
            original.category ||
            category,
          sourceCategory,`);
          fs.writeFileSync(path, source, 'utf8');
          NODE

      - name: Syntax checks
        run: |
          node --check js/evaluated-scenario-candidates.js
          node --check js/practical-selection.js
          node --check js/render.js
          node --check scripts/test-scenario-category-sync.js

      - name: Focused regressions
        run: |
          node scripts/test-scenario-category-sync.js
          node scripts/test-practical-selection.js
          node scripts/test-scenario-formations.js
          node scripts/test-edogawa-fourth-boat-scenario.js
          node scripts/test-evaluated-scenario-consistency.js

      - name: Charter check
        run: node scripts/check-charter.js

      - name: Commit generated changes
        run: |
          git config user.name 'Chappy BoatRace AI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m '展開シナリオ分類と表示コメントを同期'
          git push origin HEAD:agent/scenario-category-sync
