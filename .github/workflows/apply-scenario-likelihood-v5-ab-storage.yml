name: Apply scenario likelihood v5 A/B storage

on:
  pull_request:
    paths:
      - "js/scenario-likelihood-v5-ab.js"
      - "scripts/test-scenario-likelihood-v5-ab.js"
      - "scripts/apply-scenario-likelihood-v5-ab-storage.js"
      - ".github/workflows/apply-scenario-likelihood-v5-ab-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply A/B storage patch
        run: node scripts/apply-scenario-likelihood-v5-ab-storage.js
      - name: Verify
        run: |
          node --check js/scenario-likelihood-v5-ab.js
          node --check scripts/collect-predictions.js
          node scripts/test-scenario-likelihood-v5-ab.js
          node scripts/test-scenario-likelihood-v5-storage.js
          node scripts/check-charter.js
      - name: Commit applied source
        run: |
          if git diff --quiet -- scripts/collect-predictions.js; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/collect-predictions.js
          git commit -m "Store scenario likelihood v5 shadow A/B snapshots"
          git push
