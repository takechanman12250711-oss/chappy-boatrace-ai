name: Refresh unified improvement gate once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-unified-gate-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: verify/refresh-unified-gate-now-20260823
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild current unified gate
        run: |
          node scripts/build-unified-improvement-decision-gate.js
          node scripts/build-phase3-learning-handoff.js
          git diff --check

      - name: Commit refreshed gate and remove one-time workflow
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/unified-improvement-decision-gate.json data/stats/phase3-learning-handoff.json
          git rm .github/workflows/refresh-unified-gate-once.yml
          git commit -m "Refresh unified improvement gate from latest reports"
          git push origin "HEAD:${TARGET_BRANCH}"
