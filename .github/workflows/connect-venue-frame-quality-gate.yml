name: Connect venue frame quality gate

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/connect-venue-frame-quality-gate.js"
      - ".github/workflows/connect-venue-frame-quality-gate.yml"

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/connect-venue-frame-quality-gate.js
      - name: Commit connection
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect venue frame quality gate"
          git push
