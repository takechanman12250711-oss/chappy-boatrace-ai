name: Run structured formation backtest v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-structured-formation-backtest-v1.cjs'
      - '.github/workflows/run-structured-formation-backtest-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run structured formation backtest
        run: node scripts/analyze-structured-formation-backtest-v1.cjs > structured-formation-backtest-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('structured-formation-backtest-v1.json', 'utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          console.log(JSON.stringify({ diagnostics: r.diagnostics, ranking: r.ranking, results: r.results }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: structured-formation-backtest-v1
          path: structured-formation-backtest-v1.json
          retention-days: 90
