name: Check durable external reference workflow

on:
  pull_request:
    paths:
      - "package.json"
      - "workflows/external-reference-research.mjs"
      - "api/external-reference-workflow.mjs"
      - "docs/external-reference-durable-workflow.md"
      - ".github/workflows/check-external-reference-durable.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: node --check workflows/external-reference-research.mjs
      - run: node --check api/external-reference-workflow.mjs
      - name: Verify workflow import target exists
        run: |
          test -f workflows/external-reference-research.mjs
          grep -F '../workflows/external-reference-research.mjs' api/external-reference-workflow.mjs
      - run: node scripts/check-charter.js
