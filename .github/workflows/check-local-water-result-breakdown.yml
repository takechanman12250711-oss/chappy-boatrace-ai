name: Check local water result breakdown

on:
  pull_request:
    paths:
      - "scripts/build-local-water-result-breakdown.js"
      - "scripts/test-local-water-result-breakdown.js"
      - ".github/workflows/check-local-water-result-breakdown.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-local-water-result-breakdown.js"
      - "scripts/test-local-water-result-breakdown.js"
      - ".github/workflows/check-local-water-result-breakdown.yml"
  workflow_run:
    workflows:
      - "Collect official race results"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false

jobs:
  verify-and-build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify local-water result breakdown
        run: |
          node --check scripts/build-local-water-result-breakdown.js
          node scripts/test-local-water-result-breakdown.js
      - name: Build real result breakdown
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-local-water-result-breakdown.js
          node scripts/prepare-daily-prediction-git-save.js --all
      - name: Save result breakdown
        if: github.event_name != 'pull_request'
        run: |
          git add data/stats/local-water-result-breakdown.json
          if git diff --cached --quiet; then
            echo "local-water result breakdown unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update local water result breakdown"
          git pull --rebase origin main
          git push origin main
