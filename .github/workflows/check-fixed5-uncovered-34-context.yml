name: Check fixed5 uncovered 3-4 context
on:
  pull_request:
    paths:
      - 'scripts/audit-fixed5-uncovered-34-context.js'
      - '.github/workflows/check-fixed5-uncovered-34-context.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/audit-fixed5-uncovered-34-context.js
      - run: node scripts/audit-fixed5-uncovered-34-context.js | tee uncovered-34-context.json
      - uses: actions/upload-artifact@v4
        with:
          name: uncovered-34-context
          path: uncovered-34-context.json