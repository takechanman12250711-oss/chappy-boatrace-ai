name: Apply weak outer-head prune
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-apply-outer-prune.js'
      - 'scripts/test-outer-independent-prune-regression.js'
      - '.github/workflows/tmp-apply-outer-prune.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prune-weak-outer-independent-heads
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-apply-outer-prune.js
      - run: node -c js/practical-selection.js
      - run: node scripts/test-practical-selection.js
      - run: node scripts/test-outer-independent-prune-regression.js
      - name: Commit production patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/practical-selection.js
          git diff --cached --quiet || git commit -m 'Prune weak outer-head independent additions'
          git push origin HEAD:agent/prune-weak-outer-independent-heads
