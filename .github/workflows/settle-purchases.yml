name: Settle purchased tickets

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settle-purchases
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call purchase settlement API
        env:
          API_BASE_URL: ${{ secrets.CHAPPY_API_BASE_URL }}
          SYNC_TOKEN: ${{ secrets.CHAPPY_PURCHASE_SYNC_TOKEN }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$SYNC_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${API_BASE_URL%/}/api/settle-purchases"
      - name: Collect final odds
        env:
          API_BASE_URL: ${{ secrets.CHAPPY_API_BASE_URL }}
          SYNC_TOKEN: ${{ secrets.CHAPPY_PURCHASE_SYNC_TOKEN }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$SYNC_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${API_BASE_URL%/}/api/collect-final-odds"
