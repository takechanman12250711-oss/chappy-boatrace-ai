name: Check ST slit branch profit
on:
  pull_request:
    paths:
      - "scripts/build-st-slit-branch-profit-report.js"
      - "scripts/test-st-slit-branch-profit-report.js"
      - "scripts/test-st-slit-writer-contract.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/check-st-slit-branch-profit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-st-slit-branch-profit-report.js"
      - ".github/workflows/check-st-slit-branch-profit.yml"
      - "data/predictions/**"
      - "data/results/**"
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify ST slit branch analyzer
        run: |
          node --check scripts/build-st-slit-branch-profit-report.js
          node scripts/test-st-slit-branch-profit-report.js
          node scripts/test-st-slit-writer-contract.js
      - name: Build read-only real diagnostics
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-st-slit-branch-profit-report.js
