name: Check ST slit branch profit
on:
  pull_request:
    paths:
      - "scripts/build-st-slit-branch-profit-report.js"
      - "scripts/test-st-slit-branch-profit-report.js"
      - ".github/workflows/check-st-slit-branch-profit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-st-slit-branch-profit-report.js"
      - ".github/workflows/check-st-slit-branch-profit.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          node --check scripts/build-st-slit-branch-profit-report.js
          node scripts/test-st-slit-branch-profit-report.js
          node scripts/build-st-slit-branch-profit-report.js
      - name: Save ST slit branch profit report
        if: github.event_name != 'pull_request'
        run: |
          git add data/stats/st-slit-branch-profit-report.json
          if git diff --cached --quiet; then
            echo "ST/slit branch report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update ST slit branch profit report"
          git pull --rebase origin main
          git push origin main
