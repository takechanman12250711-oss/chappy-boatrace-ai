name: One-off apply coherent 100R active generation fix

on:
  push:
    branches:
      - audit/100r-active-generation
    paths:
      - .github/workflows/oneoff-100r-active-generation-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/100r-active-generation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply focused builder fix and regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/build-improvement-review.js')
          s=p.read_text()
          anchor='''function selectShadowV2Snapshot(\n  snapshots,\n  record\n) {'''
          helper='''function predictionEvidenceOf(record) {\n  const prediction =\n    record?.prediction || {};\n  return (\n    prediction\n      .verificationEvidence ||\n    prediction\n      .practicalSelection\n      ?.verificationEvidence ||\n    null\n  );\n}\n\nfunction predictionGenerationOf(record) {\n  const generation =\n    calibration\n      ?.normalizeGeneration?.(\n        predictionEvidenceOf(record)\n          ?.generation\n      ) || {};\n  const key =\n    calibration\n      ?.generationKey?.(\n        generation\n      ) || \"\";\n  return key ? generation : null;\n}\n\nfunction predictionRecordTimestamp(record) {\n  return [\n    record?.selectedAt,\n    record?.capturedAt,\n    record?.deadlineAt,\n    record?.result?.settledAt\n  ]\n    .map(value =>\n      Date.parse(value || \"\")\n    )\n    .find(Number.isFinite) || 0;\n}\n\nfunction inferActiveGenerationForSelectorCohort(\n  records,\n  selectorSnapshot\n) {\n  const cohortKey =\n    String(\n      selectorSnapshot\n        ?.cohortKey || \"\"\n    );\n  if (!cohortKey) return null;\n\n  const selectorRecordKey =\n    String(\n      selectorSnapshot\n        ?.recordKey || \"\"\n    );\n  const candidates =\n    (Array.isArray(records)\n      ? records\n      : [])\n      .map(record => ({\n        record,\n        generation:\n          predictionGenerationOf(\n            record\n          )\n      }))\n      .filter(candidate =>\n        candidate.generation &&\n        String(\n          candidate\n            .record\n            ?.shadowV2\n            ?.cohortKey || \"\"\n        ) === cohortKey\n      );\n\n  const newest = rows =>\n    [...rows].sort(\n      (left, right) =>\n        predictionRecordTimestamp(\n          right.record\n        ) -\n        predictionRecordTimestamp(\n          left.record\n        )\n    )[0] || null;\n\n  const exact =\n    selectorRecordKey\n      ? newest(\n          candidates.filter(\n            candidate =>\n              String(\n                candidate\n                  .record\n                  ?.shadowV2\n                  ?.recordKey || \"\"\n              ) ===\n              selectorRecordKey\n          )\n        )\n      : null;\n\n  return (\n    exact?.generation ||\n    newest(candidates)\n      ?.generation ||\n    null\n  );\n}\n\n'''
          if helper.strip() not in s:
              if anchor not in s:
                  raise SystemExit('helper anchor not found')
              s=s.replace(anchor,helper+anchor,1)
          old='''  const builtWithArchives =\n    improvementReview\n      .buildImprovementReview(\n        collected.records,\n        {\n          activeGeneration:\n            options\n              .activeGeneration ||\n            calibration\n              .DEFAULT_GENERATION,'''
          new='''  const inferredActiveGeneration =\n    inferActiveGenerationForSelectorCohort(\n      collected.records,\n      latestSelectorSnapshot\n    );\n  const builtWithArchives =\n    improvementReview\n      .buildImprovementReview(\n        collected.records,\n        {\n          activeGeneration:\n            options\n              .activeGeneration ||\n            inferredActiveGeneration ||\n            calibration\n              .DEFAULT_GENERATION,'''
          if old not in s:
              raise SystemExit('active generation block not found')
          s=s.replace(old,new,1)
          old_export='''  collectPredictionRecords,\n  selectShadowV2Snapshot,'''
          new_export='''  collectPredictionRecords,\n  inferActiveGenerationForSelectorCohort,\n  selectShadowV2Snapshot,'''
          if old_export not in s:
              raise SystemExit('export block not found')
          s=s.replace(old_export,new_export,1)
          p.write_text(s)

          t=Path('tests/build-improvement-review-active-generation.test.js')
          t.write_text(r'''"use strict";
const assert=require("node:assert/strict");
const calibration=require("../js/prediction-calibration");
const {inferActiveGenerationForSelectorCohort}=require("../scripts/build-improvement-review.js");

const generation=version=>({
  logicFingerprint:"evaluated-scenarios-v1",
  confidenceDefinitionVersion:"internal-score-v1",
  ticketPolicyVersion:version
});
const record=(ticketPolicyVersion,cohortKey,shadowRecordKey,selectedAt)=>({
  selectedAt,
  prediction:{verificationEvidence:{generation:generation(ticketPolicyVersion)}},
  shadowV2:{cohortKey,recordKey:shadowRecordKey}
});

const rows=[
  record("old-policy","cohort-current","other-shadow","2026-09-19T08:00:00.000Z"),
  record("current-policy","cohort-current","selector-shadow","2026-09-19T07:00:00.000Z"),
  record("newer-unrelated-policy","other-cohort","unrelated-shadow","2026-09-19T09:00:00.000Z")
];
const exact=inferActiveGenerationForSelectorCohort(rows,{cohortKey:"cohort-current",recordKey:"selector-shadow"});
assert.equal(calibration.generationKey(exact),calibration.generationKey(generation("current-policy")),"exact selector snapshot identity must determine the coherent prediction generation");

const fallback=inferActiveGenerationForSelectorCohort(rows,{cohortKey:"cohort-current",recordKey:"missing-shadow"});
assert.equal(calibration.generationKey(fallback),calibration.generationKey(generation("old-policy")),"same-cohort newest valid record is the fallback when exact selector identity is unavailable");

assert.equal(inferActiveGenerationForSelectorCohort(rows,{cohortKey:"missing-cohort"}),null,"unrelated cohorts must never be used to infer the active generation");
console.log("coherent 100R active generation inference passed");
''')
          PY
      - name: Restore temporary diagnostics to main versions
        run: |
          git fetch origin main
          git checkout origin/main -- scripts/audit-improvement-shadowv2.js tests/audit-improvement-shadowv2.test.js
      - name: Verify fix on real data
        run: |
          node --check scripts/build-improvement-review.js
          node tests/build-improvement-review-active-generation.test.js
          node tests/build-improvement-review-shadow-reference.test.js
          node scripts/build-improvement-review.js --output=/tmp/improvement-review-coherent.json
          node - <<'NODE'
          const r=require('/tmp/improvement-review-coherent.json');
          console.log(JSON.stringify({activeGeneration:r.activeGeneration,activeGenerationKey:r.activeGenerationKey,source:r.source,progress:r.progress},null,2));
          if (!(r.source.eligibleCount > 0)) throw new Error('100R review is still stuck at zero selected eligible records');
          NODE
          node scripts/check-charter.js
      - name: Commit focused fix only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/oneoff-100r-active-generation-fix.yml
          git add scripts/build-improvement-review.js tests/build-improvement-review-active-generation.test.js scripts/audit-improvement-shadowv2.js tests/audit-improvement-shadowv2.test.js
          git commit -m 'Fix coherent 100R active generation inference [skip ci]'
          git push origin HEAD:audit/100r-active-generation
