name: Check free X and LINE navigation
on:
  pull_request:
    paths:
      - 'scripts/send-note-social*'
      - 'scripts/send-note-buffer*'
      - 'scripts/setup-line-menu*'
      - 'scripts/render-line-menu.py'
      - '.github/workflows/setup-line-menu.yml'
      - 'scripts/note-marketing-*'
      - 'config/note-social.json'
      - '.github/workflows/update-note-marketing.yml'
      - '.github/workflows/check-note-social.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/send-note-social*'
      - 'scripts/send-note-buffer*'
      - 'scripts/setup-line-menu*'
      - 'scripts/render-line-menu.py'
      - '.github/workflows/setup-line-menu.yml'
      - 'scripts/note-marketing-*'
      - 'config/note-social.json'
      - '.github/workflows/update-note-marketing.yml'
      - '.github/workflows/check-note-social.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/note-marketing.test.js scripts/note-marketing-reports.test.js scripts/check-line-connection.test.cjs scripts/send-note-social.test.cjs scripts/send-note-buffer.test.cjs scripts/setup-line-menu.test.cjs
      - run: node scripts/note-github-ui-transport.test.js
      - run: node scripts/check-note-skills.js
