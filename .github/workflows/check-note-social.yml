name: Check free X and LINE navigation
on:
  pull_request:
    paths:
      - 'scripts/send-note-social*'
      - 'scripts/send-note-buffer*'
      - 'scripts/setup-line-menu*'
      - 'scripts/render-line-menu.py'
      - '.github/workflows/setup-line-menu.yml'
      - 'scripts/note-marketing-*'
      - 'scripts/note-result-card*'
      - 'scripts/note-result-presentation*'
      - 'scripts/note-public-results*'
      - 'scripts/note-published-ticket-sections*'
      - 'scripts/note-publication-source*'
      - 'scripts/note-readable-article*'
      - 'config/note-social.json'
      - '.github/workflows/update-note-marketing.yml'
      - '.github/workflows/check-note-social.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/send-note-social*'
      - 'scripts/send-note-buffer*'
      - 'scripts/setup-line-menu*'
      - 'scripts/render-line-menu.py'
      - '.github/workflows/setup-line-menu.yml'
      - 'scripts/note-marketing-*'
      - 'scripts/note-result-card*'
      - 'scripts/note-result-presentation*'
      - 'scripts/note-public-results*'
      - 'scripts/note-published-ticket-sections*'
      - 'scripts/note-publication-source*'
      - 'scripts/note-readable-article*'
      - 'config/note-social.json'
      - '.github/workflows/update-note-marketing.yml'
      - '.github/workflows/check-note-social.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install result-card test renderer
        run: |
          python -m pip install --disable-pip-version-check Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: node --test scripts/note-public-results.test.js scripts/note-published-ticket-sections.test.js scripts/note-marketing-expiry.test.js scripts/note-marketing.test.js scripts/note-marketing-reports.test.js scripts/check-line-connection.test.cjs scripts/send-note-social.test.cjs scripts/send-note-buffer.test.cjs scripts/setup-line-menu.test.cjs scripts/note-result-card.test.cjs scripts/note-marketing-image.test.js
      - run: node scripts/note-publication-source.test.js
      - run: node --test scripts/note-readable-article.test.js
      - run: node scripts/note-github-ui-transport.test.js
      - run: node scripts/check-note-skills.js
