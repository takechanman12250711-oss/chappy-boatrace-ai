name: Check inner upset pre-race signals
on:
  pull_request:
    paths:
      - 'scripts/analyze-inner-upset-prerace-signals.cjs'
      - 'tests/inner-upset-prerace-signals.test.cjs'
      - '.github/workflows/check-inner-upset-prerace-signals.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/analyze-inner-upset-prerace-signals.cjs'
      - 'tests/inner-upset-prerace-signals.test.cjs'
      - '.github/workflows/check-inner-upset-prerace-signals.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test fixed Discovery target
        run: node tests/inner-upset-prerace-signals.test.cjs
      - name: Print pre-race signal report
        run: node scripts/analyze-inner-upset-prerace-signals.cjs
      - name: Check charter
        run: node scripts/check-charter.js
      - name: Confirm no tracked files were mutated
        run: git diff --exit-code
