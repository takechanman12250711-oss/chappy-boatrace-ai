name: Refresh shadow artifact PR471
on:
  pull_request:
    paths:
      - '.github/workflows/refresh-shadow-artifact-pr471.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const p='data/stats/practical-priority-shadow-report.json';
          const j=JSON.parse(fs.readFileSync(p,'utf8'));
          if(j.cohortCount!==60) throw new Error(`expected 60, got ${j.cohortCount}`);
          j.generatedAt=new Date().toISOString();
          fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');
          NODE
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/stats/practical-priority-shadow-report.json
          git commit -m 'chore: refresh 60-race priority shadow artifact'
          git push
