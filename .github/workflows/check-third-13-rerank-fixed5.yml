name: Check third 1-3 rerank fixed5
on:
  pull_request:
    paths:
      - 'scripts/analyze-third-13-rerank-fixed5.js'
      - '.github/workflows/check-third-13-rerank-fixed5.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-third-13-rerank-fixed5.js
      - run: node scripts/analyze-third-13-rerank-fixed5.js
