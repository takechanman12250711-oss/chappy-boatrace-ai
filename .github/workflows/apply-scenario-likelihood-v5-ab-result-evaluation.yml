name: Apply scenario likelihood v5 A/B result evaluation

on:
  pull_request:
    paths:
      - "js/scenario-likelihood-v5-ab-verification.js"
      - "scripts/test-scenario-likelihood-v5-ab-verification.js"
      - "scripts/apply-scenario-likelihood-v5-ab-result-evaluation.js"
      - ".github/workflows/apply-scenario-likelihood-v5-ab-result-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply A/B result evaluation patch
        run: node scripts/apply-scenario-likelihood-v5-ab-result-evaluation.js
      - name: Verify
        run: |
          node --check js/scenario-likelihood-v5-ab-verification.js
          node --check scripts/match-predictions.js
          node scripts/test-scenario-likelihood-v5-ab-verification.js
          node scripts/test-match-predictions.js
          node scripts/check-charter.js
      - name: Commit applied source
        run: |
          if git diff --quiet -- scripts/match-predictions.js; then
            echo "No source change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/match-predictions.js
          git commit -m "Evaluate scenario likelihood v5 A/B against results"
          git push
