name: Update weak 2-head snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-update-weak-two-head-snapshot.js'
      - '.github/workflows/tmp-update-weak-two-head-snapshot.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prune-weak-two-head-independent
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-update-weak-two-head-snapshot.js
      - run: node scripts/test-evaluated-scenario-consistency.js
      - run: node scripts/test-weak-two-head-independent-prune-regression.js
      - name: Commit snapshot
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/test-evaluated-scenario-consistency.js
          git diff --cached --quiet || git commit -m 'Update selection snapshot for weak 2-head prune'
          git push origin HEAD:agent/prune-weak-two-head-independent
