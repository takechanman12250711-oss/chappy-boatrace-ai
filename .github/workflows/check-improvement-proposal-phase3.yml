name: Check improvement proposal phase3

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/improvement-proposal-phase3]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      # Derived reports in main can lag independently saved race results.
      # Build workspace-only reports from this exact checkout before comparing
      # their semantics. Keep every existing input-contract assertion; do not
      # commit reports, change source records, or alter prediction/adoption gates.
      - name: Build matching reports in the test workspace only
        run: |
          node scripts/build-improvement-proposal-report.js
          node scripts/build-learning-pipeline-gate.js
          node scripts/build-phase6-data-audit.js
      - name: Validate improvement proposal phase3
        run: |
          node --check js/improvement-proposal-engine.js
          node --check scripts/build-improvement-proposal-report.js
          node --check scripts/test-improvement-proposal-engine.js
          node --check scripts/test-improvement-proposal-input-contract.js
          node scripts/test-improvement-proposal-engine.js
          node scripts/test-improvement-proposal-input-contract.js
          node scripts/check-charter.js
