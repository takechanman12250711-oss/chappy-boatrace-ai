name: Analyze official-compatible reference tags

on:
  workflow_dispatch:
  schedule:
    - cron: "35 18 * * *"

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  queue: max
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test analyzer
        run: |
          node scripts/test-reference-tag-effectiveness.js

      - name: Restore canonical prediction sources
        run: |
          node scripts/restore-daily-prediction-source.js --all

      - name: Build effectiveness report
        run: node scripts/analyze-reference-tag-effectiveness.js --output data/analysis/reference-tag-effectiveness.json

      - name: Verify built report
        run: |
          node scripts/test-analysis-input-contract.js

      - name: Restore Git-safe prediction sources
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all

      - name: Commit report when changed
        run: |
          git add -- data/analysis/reference-tag-effectiveness.json
          if git diff --cached --quiet -- data/analysis/reference-tag-effectiveness.json; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update official-compatible reference tag report"
          git pull --rebase origin main
          git push origin main
