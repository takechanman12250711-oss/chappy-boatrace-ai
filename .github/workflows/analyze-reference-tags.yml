name: Analyze official-compatible reference tags

on:
  workflow_dispatch:
  schedule:
    - cron: "35 18 * * *"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test analyzer
        run: |
          node scripts/test-reference-tag-effectiveness.js
          node scripts/test-analysis-input-contract.js

      - name: Build effectiveness report
        run: node scripts/analyze-reference-tag-effectiveness.js --output data/analysis/reference-tag-effectiveness.json

      - name: Commit report when changed
        run: |
          git add -- data/analysis/reference-tag-effectiveness.json
          if git diff --cached --quiet -- data/analysis/reference-tag-effectiveness.json; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update official-compatible reference tag report"
          git push
