name: Build boat data checks
# ボートデータ帳：公式結果の収集が終わったら、朝に保存した見立てを答え合わせする。
# 既存の結果収集の後に続けて動くだけで、新しい定期実行は追加しない。
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Collect official race results
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/build-boat-data-checks.yml
      - scripts/data-site/build-checks.cjs
permissions:
  contents: write
concurrency:
  group: boat-data-checks
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/data-site.test.cjs
      - name: Grade the saved lookouts (skips quietly until the first graded day exists)
        run: |
          if ls data/site/days/*.json >/dev/null 2>&1 && node scripts/data-site/build-checks.cjs; then
            git checkout -- data/site/checks.json 2>/dev/null || rm -f data/site/checks.json
            node scripts/data-site/persist.cjs checks
          else
            echo "No graded day yet"
          fi
