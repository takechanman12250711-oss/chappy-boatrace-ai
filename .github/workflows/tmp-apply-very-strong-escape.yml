name: Apply very strong escape production patch
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-patch-very-strong-escape.js'
      - 'scripts/test-very-strong-escape-trim-regression.js'
      - '.github/workflows/tmp-apply-very-strong-escape.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-patch-very-strong-escape.js
      - run: node --check js/practical-selection.js
      - run: node scripts/test-practical-selection.js
      - run: node scripts/test-very-strong-escape-trim-regression.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/practical-selection.js scripts/test-very-strong-escape-trim-regression.js
          git diff --cached --quiet || git commit -m "Trim alternate head in very strong escapes"
          git push
