name: Check trifecta popularity ROI

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-trifecta-popularity-roi.cjs'
      - 'scripts/test-trifecta-popularity-roi.cjs'
      - '.github/workflows/check-trifecta-popularity-roi.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-trifecta-popularity-roi.cjs
