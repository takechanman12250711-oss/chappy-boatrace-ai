name: Check practical max7 boundary

on:
  pull_request:
    paths:
      - "js/practical-selection-max7.js"
      - "js/prediction-runtime-loader.js"
      - "scripts/test-practical-max7.js"
      - ".github/workflows/check-practical-max7.yml"
  push:
    branches: [main]
    paths:
      - "js/practical-selection-max7.js"
      - "js/prediction-runtime-loader.js"
      - "scripts/test-practical-max7.js"
      - ".github/workflows/check-practical-max7.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check syntax
        run: |
          node --check js/practical-selection-max7.js
          node --check js/prediction-runtime-loader.js
          node --check scripts/test-practical-max7.js
      - name: Run max7 regression
        run: node scripts/test-practical-max7.js
