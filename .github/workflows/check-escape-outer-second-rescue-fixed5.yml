name: Check escape outer-second rescue fixed5
on:
  pull_request:
    paths:
      - 'js/escape-outer-second-rescue-fixed5.js'
      - 'js/prediction-runtime-loader.js'
      - 'scripts/test-escape-outer-second-rescue-fixed5.js'
      - '.github/workflows/check-escape-outer-second-rescue-fixed5.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/escape-outer-second-rescue-fixed5.js
      - run: node scripts/test-escape-outer-second-rescue-fixed5.js
