name: Install reference tag report

on:
  push:
    paths:
      - "js/reference-tag-report.js"
      - "scripts/install-reference-tag-report.js"
      - ".github/workflows/install-reference-tag-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Connect report UI
        run: node scripts/install-reference-tag-report.js

      - name: Check JavaScript syntax
        run: node --check js/reference-tag-report.js

      - name: Commit connection when changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No connection changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect reference tag effectiveness report"
          git push
