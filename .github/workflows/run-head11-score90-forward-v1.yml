name: Run head11 score90 forward v1
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
  pull_request:
    paths:
      - 'scripts/audit-head11-score90-forward-v1.cjs'
      - '.github/workflows/run-head11-score90-forward-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run preregistered head11 score90 forward audit
        run: node scripts/audit-head11-score90-forward-v1.cjs > head11-score90-forward-v1.json
      - name: Validate frozen research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('head11-score90-forward-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.frozenRule.rank!==11||r.frozenRule.newHeadMustBeAbsentFromBaseline7!==true||r.frozenRule.minScoreInclusive!==90) process.exit(1);
          console.log(JSON.stringify({settled:r.settledRaceCountAfterActivation,eligibleHeadMisses:r.eligibleHeadMisses,eligible:r.eligibleAddedTickets,rescues:r.rescueCount,manboat:r.manboatRescueCount,roi:r.roiPercent,removeTop1:r.removeTop1,removeTop2:r.removeTop2,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: head11-score90-forward-v1
          path: head11-score90-forward-v1.json
          retention-days: 90
