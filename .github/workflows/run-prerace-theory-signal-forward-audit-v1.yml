name: Run pre-race theory signal forward audit v1

on:
  workflow_dispatch:
  schedule:
    - cron: '20 15 * * *'
  pull_request:
    paths:
      - 'scripts/audit-prerace-theory-signal-forward-v1.cjs'
      - '.github/workflows/run-prerace-theory-signal-forward-audit-v1.yml'
      - 'data/predictions/202609*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit theory signal availability
        run: node scripts/audit-prerace-theory-signal-forward-v1.cjs > prerace-theory-signal-forward-v1.json
      - name: Validate observation-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('prerace-theory-signal-forward-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({eligibleSnapshotCount:r.eligibleSnapshotCount,availability:r.availability,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: prerace-theory-signal-forward-v1
          path: prerace-theory-signal-forward-v1.json
          retention-days: 90
