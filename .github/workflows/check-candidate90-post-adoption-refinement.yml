name: Check candidate90 post-adoption refinement

on:
  pull_request:
    branches: [main]
    paths:
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/practical-selection.js"
      - "scripts/analyze-candidate90-post-adoption-refinement.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-candidate90-post-adoption-refinement.yml"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Check syntax
        run: node --check scripts/analyze-candidate90-post-adoption-refinement.js
      - name: Analyze candidate90 marginal segments
        run: node scripts/analyze-candidate90-post-adoption-refinement.js
