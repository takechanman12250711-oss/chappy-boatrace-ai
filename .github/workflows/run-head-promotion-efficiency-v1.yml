name: Run head promotion efficiency v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-head-promotion-efficiency-v1.cjs'
      - '.github/workflows/run-head-promotion-efficiency-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run head promotion efficiency audit
        run: node scripts/analyze-head-promotion-efficiency-v1.cjs > head-promotion-efficiency-v1.json
      - name: Validate research boundary and report
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('head-promotion-efficiency-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.targetHeadAbsentCount<=0) process.exit(1);
          console.log(JSON.stringify({target:r.targetHeadAbsentCount,rules:r.rules},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: head-promotion-efficiency-v1
          path: head-promotion-efficiency-v1.json
          retention-days: 90
