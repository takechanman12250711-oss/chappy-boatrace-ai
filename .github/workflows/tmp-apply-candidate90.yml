name: Apply candidate90 production patch
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-apply-candidate90.js'
      - 'scripts/test-candidate90-regression.js'
      - '.github/workflows/tmp-apply-candidate90.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/candidate90-production
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply approved production patch
        run: node scripts/tmp-apply-candidate90.js
      - name: Run 341R candidate90 regression
        run: node scripts/test-candidate90-regression.js
      - name: Commit approved production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/practical-selection.js
          if git diff --cached --quiet; then
            echo "No production diff to commit"
          else
            git commit -m "Promote grounded candidate-only tickets at priority 90"
            git push origin HEAD:agent/candidate90-production
          fi
