name: Build profit priority ranking

on:
  schedule:
    - cron: "45 15 * * *" # 00:45 JST・公式結果収集後
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-profit-priority-ranking
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build ranking
        run: |
          node scripts/test-profit-priority-ranking.js
          node scripts/build-profit-priority-ranking.js
          node scripts/check-charter.js
      - name: Save ranking
        run: |
          git add data/stats/profit-priority-ranking.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build profit priority ranking"
          git pull --rebase origin main
          git push origin main
