name: Build boat data pre-race info
# ボートデータ帳：日中20分ごとに、締切まで50分以内のレースの直前情報（展示・チルト・進入・風）を
# 公式から取り、締切前に保存する。新しく取れた分がなければ何も書かない。
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 0-12 * * *" # 09:00-21:40 JST
permissions:
  contents: write
concurrency:
  group: boat-data-before
  queue: max
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/data-site.test.cjs
      - name: Pre-race info for races closing within 50 minutes
        run: node scripts/data-site/persist.cjs before
