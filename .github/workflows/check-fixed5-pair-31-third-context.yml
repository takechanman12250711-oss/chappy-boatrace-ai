name: Check fixed5 pair 3-1 third context

on:
  pull_request:
    paths:
      - 'scripts/audit-fixed5-pair-31-third-context.js'
      - '.github/workflows/check-fixed5-pair-31-third-context.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/audit-fixed5-pair-31-third-context.js
      - run: node scripts/audit-fixed5-pair-31-third-context.js
      - name: Validate audit artifact JSON
        run: |
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(
              fs.readFileSync(
                "fixed5-pair-31-third-context.json",
                "utf8"
              )
            );
            for (const period of Object.values(report.periods)) {
              if (!Object.values(period.checks).every(Boolean)) {
                throw new Error("audit invariant failed");
              }
            }
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed5-pair-31-third-context
          path: fixed5-pair-31-third-context.json
          if-no-files-found: error
