name: Check ST slit shadow reference report
on:
  pull_request:
    paths:
      - "scripts/build-st-slit-shadow-reference-report.js"
      - ".github/workflows/check-st-slit-shadow-reference-report.yml"
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/build-st-slit-shadow-reference-report.js
      - run: node scripts/build-st-slit-shadow-reference-report.js
      - run: git diff --check
