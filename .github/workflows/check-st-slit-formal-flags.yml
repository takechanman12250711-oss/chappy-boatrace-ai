name: Check ST slit formal flags
on:
  pull_request:
    paths:
      - "scripts/diagnose-st-slit-formal-flags.js"
      - ".github/workflows/check-st-slit-formal-flags.yml"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node scripts/diagnose-st-slit-formal-flags.js
