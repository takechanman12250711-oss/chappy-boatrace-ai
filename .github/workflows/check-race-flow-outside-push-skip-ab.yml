name: Check race flow outside push skip A/B
on:
  pull_request:
    paths:
      - "scripts/build-race-flow-outside-push-skip-ab-report.js"
      - "scripts/test-race-flow-outside-push-skip-ab-report.js"
      - "scripts/test-race-flow-ab-workflow-concurrency.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/check-race-flow-outside-push-skip-ab.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || 'chappy-main-data-writers' }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify outside push skip A/B analyzer
        run: |
          node --check scripts/build-race-flow-outside-push-skip-ab-report.js
          node scripts/test-race-flow-outside-push-skip-ab-report.js
          node scripts/test-race-flow-ab-workflow-concurrency.js
      - name: Restore canonical sources and build report
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-race-flow-outside-push-skip-ab-report.js
          node scripts/prepare-daily-prediction-git-save.js --all
      - name: Save outside push skip A/B report
        if: github.event_name != 'pull_request'
        run: |
          git add data/stats/race-flow-outside-push-skip-ab-report.json
          if git diff --cached --quiet; then
            echo "outside push skip A/B report unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update outside push skip prospective A/B report"
          git pull --rebase origin main
          git push origin main
