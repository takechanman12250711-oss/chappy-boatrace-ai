name: Build frame rise and sink statistics

on:
  pull_request:
    paths:
      - "scripts/build-frame-rise-sink-stats.js"
      - "scripts/test-frame-rise-sink-stats.js"
      - "scripts/test-frame-rise-sink-writer-contract.js"
      - ".github/workflows/build-frame-rise-sink-stats.yml"
      - ".github/workflows/collect-results.yml"

  push:
    branches:
      - main
    paths:
      - "scripts/build-frame-rise-sink-stats.js"
      - "scripts/test-frame-rise-sink-stats.js"
      - "scripts/test-frame-rise-sink-writer-contract.js"
      - ".github/workflows/build-frame-rise-sink-stats.yml"
      - ".github/workflows/collect-results.yml"

  schedule:
    - cron: "45 15 * * *" # 00:45 JST

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test frame analysis
        run: |
          node --check scripts/build-frame-rise-sink-stats.js
          node scripts/test-frame-rise-sink-stats.js
          node scripts/test-frame-rise-sink-writer-contract.js

      - name: Build read-only frame analysis
        run: |
          node scripts/build-frame-rise-sink-stats.js
