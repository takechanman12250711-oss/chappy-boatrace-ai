name: Build frame rise and sink statistics

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build-frame-rise-sink-stats.js"
      - "scripts/test-frame-rise-sink-stats.js"
      - ".github/workflows/build-frame-rise-sink-stats.yml"

  schedule:
    - cron: "45 15 * * *" # 00:45 JST

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-frame-rise-sink-statistics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test frame analysis
        run: |
          node --check scripts/build-frame-rise-sink-stats.js
          node scripts/test-frame-rise-sink-stats.js

      - name: Build frame analysis
        run: |
          node scripts/build-frame-rise-sink-stats.js

      - name: Save frame analysis
        run: |
          git add data/stats/frame-rise-sink-patterns.json

          if git diff --cached --quiet; then
            echo "保存する枠別浮沈率の変更はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build frame rise and sink statistics"
          git pull --rebase origin main
          git push origin main
