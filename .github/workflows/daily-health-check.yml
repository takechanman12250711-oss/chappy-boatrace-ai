name: Daily health check

# 毎日の健康チェック（チャッピー・boatrace-ev）。読み取りのみ。
# 以前は Claude の予約タスクで行っていたものを、使用量の上限に左右されないよう GitHub Actions に移した。
# 異常があれば「🩺 毎日の健康チェック：異常あり」という Issue を1つだけ開き、翌日以降は同じ Issue に追記する。
# すべて元に戻ったら、その Issue に一言書いて自動で閉じる。

on:
  schedule:
    - cron: "7 12 * * *" # 日本時間 21:07（その日のレースがほぼ終わったころ）
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/daily-health-check.yml"
      - "scripts/daily-health-check.cjs"
      - "scripts/test-daily-health-check.cjs"
      - ".github/workflows/deploy-pages.yml"
      - "scripts/test-pages-deploy.cjs"
      - ".github/workflows/live-note.yml"

permissions:
  contents: read
  actions: read
  pages: read
  issues: write

concurrency:
  group: daily-health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/daily-health-check.cjs
            /scripts/test-daily-health-check.cjs
            /scripts/test-pages-deploy.cjs
            /.github/workflows/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Test the checker
        run: node --test scripts/test-daily-health-check.cjs
      - name: Test Pages deployment triggers
        run: node --test scripts/test-pages-deploy.cjs
      - name: Run health check
        env:
          GH_TOKEN: ${{ github.token }}
          # PR のときは確認結果を表示するだけで、Issue は作らない
          HEALTH_CHECK_NOTIFY: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        run: node scripts/daily-health-check.cjs
