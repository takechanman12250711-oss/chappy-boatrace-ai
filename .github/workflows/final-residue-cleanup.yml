name: Final residue cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "scripts/final-residue-cleanup.js"
      - "style.css"
      - "scripts/check-charter.js"
      - ".github/workflows/cleanup-remaining-legacy-ui.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/complete-legacy-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply final cleanup
        run: node scripts/final-residue-cleanup.js
      - name: Remove temporary cleanup script
        run: rm -f scripts/final-residue-cleanup.js
      - name: Syntax check
        run: |
          node --check js/render.js
          node --check scripts/check-charter.js
      - name: Charter check
        run: node scripts/check-charter.js
      - name: Theory integration test
        run: node scripts/test-theory-integration.js
      - name: Residue grep check
        run: |
          if grep -R "v3-theory-\|renderTheoryPanel\|THEORY_LABELS\|cleanup-remaining-legacy-ui" index.html style.css js scripts .github/workflows --exclude=check-charter.js --exclude=final-residue-cleanup.yml; then
            echo "旧残骸が残っています"
            exit 1
          fi
      - name: Commit cleanup
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "追加変更なし"
            exit 0
          fi
          git commit -m "残っていた旧UI残骸を完全削除"
          git push origin HEAD:${{ github.head_ref }}
