name: Final residue cleanup

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "scripts/final-residue-cleanup.js"
      - "style.css"
      - "scripts/check-charter.js"
      - ".github/workflows/cleanup-remaining-legacy-ui.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/complete-legacy-cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply final cleanup
        run: node scripts/final-residue-cleanup.js
      - name: Remove temporary cleanup script
        run: rm -f scripts/final-residue-cleanup.js
      - name: Save cleanup result to branch
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "追加変更なし"
          else
            git commit -m "残っていた旧UI残骸を完全削除"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Syntax check
        run: |
          node --check js/render.js
          node --check scripts/check-charter.js
      - name: Charter check with diagnostics
        run: |
          if ! node scripts/check-charter.js; then
            echo "--- v3-theory CSS remaining ---"
            grep -n "v3-theory-" style.css || true
            echo "--- one-time files remaining ---"
            ls -l .github/workflows/cleanup-remaining-legacy-ui.yml scripts/cleanup-remaining-legacy-ui.js 2>/dev/null || true
            exit 1
          fi
      - name: Theory integration test
        run: node scripts/test-theory-integration.js
      - name: Residue grep check
        run: |
          if grep -R "v3-theory-\|renderTheoryPanel\|THEORY_LABELS\|cleanup-remaining-legacy-ui" index.html style.css js scripts .github/workflows --exclude=check-charter.js --exclude=final-residue-cleanup.yml; then
            echo "旧残骸が残っています"
            exit 1
          fi
