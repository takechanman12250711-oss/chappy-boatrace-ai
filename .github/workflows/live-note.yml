name: Collect live note independently

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-note.yml'
      - 'scripts/collect-predictions.js'
      - 'scripts/collect-all-race-notes.js'
      - 'scripts/outer-attack-research.js'
      - 'scripts/verification-coverage.js'
      - 'scripts/outer-attack-live-source.js'
      - 'scripts/save-live-verification-sources.js'
      - 'scripts/test-outer-attack-research.js'
      - 'scripts/note-exhibition.js'
      - 'js/note-generator.js'
      - 'scripts/note-publication-audit.js'
      - 'scripts/dispatch-ready-note.js'
      - 'scripts/prepare-note-input.js'
      - 'scripts/omura-reference.cjs'
      - 'scripts/collect-omura-reference.cjs'
      - 'scripts/test-omura-reference.cjs'
  pull_request:
    paths:
      - '.github/workflows/live-note.yml'
      - 'scripts/collect-predictions.js'
      - 'scripts/collect-all-race-notes.js'
      - 'scripts/outer-attack-research.js'
      - 'scripts/verification-coverage.js'
      - 'scripts/outer-attack-live-source.js'
      - 'scripts/save-live-verification-sources.js'
      - 'scripts/test-outer-attack-research.js'
      - 'scripts/note-exhibition.js'
      - 'js/note-generator.js'
      - 'scripts/note-publication-audit.js'
      - 'scripts/dispatch-ready-note.js'
      - 'scripts/test-note-source-concurrency.js'
      - 'scripts/prepare-note-input.js'
      - 'scripts/omura-reference.cjs'
      - 'scripts/collect-omura-reference.cjs'
      - 'scripts/test-omura-reference.cjs'
      - 'js/note-generator.js'
  schedule:
    # Offset from the busiest minute boundary; cadence and JST window stay the same.
    - cron: '2-57/5 22-23 * * *' # 07:02-08:57 JST
    - cron: '2-57/5 0-13 * * *' # 09:02-22:57 JST
  workflow_dispatch:

permissions:
  contents: read

# This process writes only immutable note sources. Central prediction/result/
# calibration data continues to use its existing shared writer queue.
concurrency:
  group: chappy-live-note-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  live-note:
    if: github.event_name == 'pull_request' || (github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          sparse-checkout: |
            api
            config
            js
            scripts
            data/stats
            data/note-drafts
            data/outer-attack-sources
            data/verification-coverage
            data/note-publish
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify isolated collector and source preservation
        run: |
          node scripts/test-note-source-concurrency.js
          node --test scripts/test-omura-reference.cjs
          node scripts/test-note-pipeline.js
          node scripts/test-all-race-notes.js
          node scripts/test-outer-attack-research.js
          node scripts/test-exhibition-candidate24.js
          node scripts/test-note-publication-audit.js
          node --require ./js/frame-rise-fall-replay-preload.js -e "const c = require('./scripts/collect-predictions'); for (const k of ['SHADOW_LOGIC_FINGERPRINT', 'SHADOW_REFERENCE_DATA_FINGERPRINT', 'SHADOW_REFERENCE_GENERATION_ID']) if (!c[k] || c[k] === 'unavailable') throw new Error(k);"
      - name: Verify current official inputs without saving or publishing
        if: github.event_name == 'pull_request'
        env:
          NODE_OPTIONS: --require ./js/frame-rise-fall-replay-preload.js
        run: node scripts/collect-predictions.js --note-only --dry-run
      - name: Collect current note without waiting for result processing
        if: github.event_name != 'pull_request'
        env:
          NODE_OPTIONS: --require ./js/frame-rise-fall-replay-preload.js
        run: node scripts/collect-predictions.js --note-only
      - name: Save immutable evidence independently of publication audit
        if: always() && github.event_name != 'pull_request'
        run: node scripts/save-live-verification-sources.js
      - name: Save only audited note source and start existing publisher
        if: github.event_name != 'pull_request'
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          NOTE_SOURCE_ISOLATED: 'true'
        run: node scripts/dispatch-ready-note.js

  omura-reference:
    # Public-site latency/failure must not delay the existing publisher handoff.
    needs: live-note
    if: always() && github.event_name != 'pull_request' && github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts
            js
            config
            data/note-drafts
            data/omura-reference
            data/results
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Capture prospective reporter reference and join saved official results
        run: node scripts/collect-omura-reference.cjs
      - name: Preserve immutable reference evidence
        if: always()
        run: node scripts/save-live-verification-sources.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omura-reporter-reference
          path: ${{ runner.temp }}/omura-reference/report.json
          if-no-files-found: error
          retention-days: 30
