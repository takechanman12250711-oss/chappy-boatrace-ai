name: Collect live note independently

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-note.yml'
      - 'scripts/collect-predictions.js'
      - 'api/_official-start-rank.js'
      - 'scripts/official-start-rank-cache.cjs'
      - 'scripts/official-start-rank-cache.test.cjs'
      - 'scripts/collect-all-race-notes.js'
      - 'scripts/outer-attack-research.js'
      - 'scripts/verification-coverage.js'
      - 'scripts/outer-attack-live-source.js'
      - 'scripts/save-live-verification-sources.js'
      - 'scripts/partner-forward.cjs'
      - 'scripts/test-partner-forward.cjs'
      - 'config/partner-forward.json'
      - 'config/partner-forward-cohorts.json'
      - 'config/independent-autonomous-forward.json'
      - 'scripts/independent-autonomous-candidate.cjs'
      - 'scripts/independent-judgment-context.cjs'
      - 'scripts/independent-autonomous-forward.cjs'
      - 'config/independent-flow-study-v1.json'
      - 'scripts/independent-flow-roles-v1.cjs'
      - 'scripts/independent-flow-study-report.cjs'
      - 'scripts/independent-flow-roles.test.cjs'
      - 'config/independent-partner-study-v1.json'
      - 'scripts/independent-partner-context-v1.cjs'
      - 'scripts/independent-partner-selector-v1.cjs'
      - 'scripts/independent-partner-study-report.cjs'
      - 'scripts/independent-partner-selector.test.cjs'
      - 'config/independent-route-water-study-v1.json'
      - 'scripts/independent-route-water-v1.cjs'
      - 'scripts/independent-partner-selector-v2.cjs'
      - 'scripts/independent-route-water-report.cjs'
      - 'scripts/independent-route-water.test.cjs'
      - 'scripts/independent-autonomous.test.cjs'
      - 'config/independent-rule-forward.json'
      - 'scripts/independent-role-selector.cjs'
      - 'scripts/independent-rule-shadow.cjs'
      - 'scripts/independent-rule-forward.cjs'
      - 'scripts/independent-rule-forward.test.cjs'
      - 'scripts/test-outer-attack-research.js'
      - 'scripts/note-exhibition.js'
      - 'js/note-generator.js'
      - 'scripts/note-publication-audit.js'
      - 'scripts/dispatch-ready-note.js'
      - 'scripts/prepare-note-input.js'
      - 'scripts/omura-reference.cjs'
      - 'scripts/collect-omura-reference.cjs'
      - 'scripts/test-omura-reference.cjs'
  pull_request:
    paths:
      - '.github/workflows/live-note.yml'
      - 'scripts/collect-predictions.js'
      - 'api/_official-start-rank.js'
      - 'scripts/official-start-rank-cache.cjs'
      - 'scripts/official-start-rank-cache.test.cjs'
      - 'scripts/collect-all-race-notes.js'
      - 'scripts/outer-attack-research.js'
      - 'scripts/verification-coverage.js'
      - 'scripts/outer-attack-live-source.js'
      - 'scripts/save-live-verification-sources.js'
      - 'scripts/partner-forward.cjs'
      - 'scripts/test-partner-forward.cjs'
      - 'config/partner-forward.json'
      - 'config/partner-forward-cohorts.json'
      - 'config/independent-autonomous-forward.json'
      - 'scripts/independent-autonomous-candidate.cjs'
      - 'scripts/independent-judgment-context.cjs'
      - 'scripts/independent-autonomous-forward.cjs'
      - 'config/independent-flow-study-v1.json'
      - 'scripts/independent-flow-roles-v1.cjs'
      - 'scripts/independent-flow-study-report.cjs'
      - 'scripts/independent-flow-roles.test.cjs'
      - 'config/independent-partner-study-v1.json'
      - 'scripts/independent-partner-context-v1.cjs'
      - 'scripts/independent-partner-selector-v1.cjs'
      - 'scripts/independent-partner-study-report.cjs'
      - 'scripts/independent-partner-selector.test.cjs'
      - 'config/independent-route-water-study-v1.json'
      - 'scripts/independent-route-water-v1.cjs'
      - 'scripts/independent-partner-selector-v2.cjs'
      - 'scripts/independent-route-water-report.cjs'
      - 'scripts/independent-route-water.test.cjs'
      - 'scripts/independent-autonomous.test.cjs'
      - 'config/independent-rule-forward.json'
      - 'scripts/independent-role-selector.cjs'
      - 'scripts/independent-rule-shadow.cjs'
      - 'scripts/independent-rule-forward.cjs'
      - 'scripts/independent-rule-forward.test.cjs'
      - 'scripts/test-outer-attack-research.js'
      - 'scripts/note-exhibition.js'
      - 'js/note-generator.js'
      - 'scripts/note-publication-audit.js'
      - 'scripts/dispatch-ready-note.js'
      - 'scripts/test-note-source-concurrency.js'
      - 'scripts/prepare-note-input.js'
      - 'scripts/omura-reference.cjs'
      - 'scripts/collect-omura-reference.cjs'
      - 'scripts/test-omura-reference.cjs'
      - 'js/note-generator.js'
  schedule:
    # Offset from the busiest minute boundary; cadence and JST window stay the same.
    - cron: '2-57/5 22-23 * * *' # 07:02-08:57 JST
    - cron: '2-57/5 0-13 * * *' # 09:02-22:57 JST
  workflow_run:
    workflows: [Collect automatic race predictions]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This process writes immutable note sources and the derived official-rank cache.
# Central prediction/result/
# calibration data continues to use its existing shared writer queue.
concurrency:
  group: chappy-live-note-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  live-note:
    if: >-
      github.event_name == 'pull_request' ||
      (github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' &&
       ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         github.event.workflow_run.head_branch == 'main') ||
        (github.event_name != 'workflow_run' && github.ref == 'refs/heads/main')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
          sparse-checkout: |
            .github/workflows
            api
            config
            js
            scripts
            data/stats
            data/note-drafts
            data/official-start-rank-cache
            data/partner-forward
            data/independent-autonomous-forward
            data/independent-rule-forward
            data/outer-attack-sources
            data/verification-coverage
            data/note-publish
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify isolated collector and source preservation
        run: |
          node scripts/test-note-source-concurrency.js
          node --test scripts/official-start-rank-cache.test.cjs
          node --test scripts/test-partner-forward.cjs scripts/independent-role-selector.test.cjs scripts/independent-rule-forward.test.cjs scripts/independent-autonomous.test.cjs
          node --test scripts/independent-flow-roles.test.cjs scripts/independent-partner-selector.test.cjs scripts/independent-route-water.test.cjs
          node --test scripts/test-omura-reference.cjs
          node scripts/test-note-pipeline.js
          node scripts/test-all-race-notes.js
          node scripts/test-outer-attack-research.js
          node scripts/test-exhibition-candidate24.js
          node scripts/test-note-publication-audit.js
          node --require ./js/frame-rise-fall-replay-preload.js -e "const c = require('./scripts/collect-predictions'); for (const k of ['SHADOW_LOGIC_FINGERPRINT', 'SHADOW_REFERENCE_DATA_FINGERPRINT', 'SHADOW_REFERENCE_GENERATION_ID']) if (!c[k] || c[k] === 'unavailable') throw new Error(k);"
      - name: Verify current official inputs without saving or publishing
        if: github.event_name == 'pull_request'
        env:
          NODE_OPTIONS: --require ./js/frame-rise-fall-replay-preload.js
        run: node scripts/collect-predictions.js --note-only --dry-run
      - name: Collect current note without waiting for result processing
        if: github.event_name != 'pull_request'
        env:
          NODE_OPTIONS: --require ./js/frame-rise-fall-replay-preload.js
          INDEPENDENT_CANDIDATE_DIR: /tmp/independent-autonomous
          OFFICIAL_START_RANK_STAGE: /tmp/official-start-rank-cache.json
        run: node scripts/collect-predictions.js --note-only
      - name: Save immutable evidence independently of publication audit
        if: always() && github.event_name != 'pull_request'
        run: node scripts/save-live-verification-sources.js
      - name: Save only audited note source and start existing publisher
        if: github.event_name != 'pull_request'
        env:
          NOTE_CLAIM_TOKEN: ${{ github.token }}
          NOTE_SOURCE_ISOLATED: 'true'
        run: node scripts/dispatch-ready-note.js

      - name: Prepare autonomous research snapshots after publication handoff
        id: autonomous-prepare
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/independent-autonomous-forward.cjs prepare /tmp/independent-autonomous
      - name: Seal autonomous candidates and skips before deadline
        id: autonomous-artifact
        if: always() && github.event_name != 'pull_request' && steps.autonomous-prepare.outcome == 'success' && steps.autonomous-prepare.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: independent-autonomous-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/independent-autonomous/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Confirm autonomous remote timestamp
        id: autonomous-confirm
        if: always() && github.event_name != 'pull_request' && steps.autonomous-artifact.outputs.artifact-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          AUTONOMOUS_ARTIFACT_ID: ${{ steps.autonomous-artifact.outputs.artifact-id }}
          AUTONOMOUS_ARTIFACT_DIGEST: ${{ steps.autonomous-artifact.outputs.artifact-digest }}
        run: node scripts/independent-autonomous-forward.cjs seal /tmp/independent-autonomous
      - name: Save autonomous research receipts
        if: always() && github.event_name != 'pull_request'
        run: node scripts/save-live-verification-sources.js

      - name: Capture fixed partner candidates without results
        id: partner-capture
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/partner-forward.cjs capture /tmp/partner-forward-seal
      - name: Seal partner candidates on GitHub before deadline
        id: partner-artifact
        if: github.event_name != 'pull_request' && steps.partner-capture.outputs.count != '0' && steps.partner-capture.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: partner-forward-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/partner-forward-seal/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Confirm remote seal time before admitting forward races
        id: partner-confirm
        if: github.event_name != 'pull_request' && steps.partner-artifact.outputs.artifact-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PARTNER_ARTIFACT_ID: ${{ steps.partner-artifact.outputs.artifact-id }}
          PARTNER_ARTIFACT_DIGEST: ${{ steps.partner-artifact.outputs.artifact-digest }}
        run: node scripts/partner-forward.cjs seal /tmp/partner-forward-seal
      - name: Persist sealed partner evidence after publication handoff
        if: always() && github.event_name != 'pull_request'
        run: node scripts/save-live-verification-sources.js
      - name: Report partner capture failures after preserving notes
        if: always() && (steps.partner-capture.outcome == 'failure' || steps.partner-artifact.outcome == 'failure' || steps.partner-confirm.outcome == 'failure')
        run: exit 1

      - name: Capture independent role selections and explicit skips
        id: independent-capture
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/independent-rule-forward.cjs capture /tmp/independent-rule-seal
      - name: Seal independent comparison on GitHub before deadline
        id: independent-artifact
        if: github.event_name != 'pull_request' && steps.independent-capture.outcome == 'success' && steps.independent-capture.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@v4
        with:
          name: independent-rule-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/independent-rule-seal/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Confirm independent remote timestamp and preserve receipt
        id: independent-confirm
        if: github.event_name != 'pull_request' && steps.independent-artifact.outputs.artifact-id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INDEPENDENT_ARTIFACT_ID: ${{ steps.independent-artifact.outputs.artifact-id }}
          INDEPENDENT_ARTIFACT_DIGEST: ${{ steps.independent-artifact.outputs.artifact-digest }}
        run: node scripts/independent-rule-forward.cjs seal /tmp/independent-rule-seal
      - name: Save immutable independent comparison receipts only
        if: always() && github.event_name != 'pull_request'
        run: node scripts/save-live-verification-sources.js
      - name: Surface independent research failures after preserving notes
        if: always() && (steps.independent-capture.outcome == 'failure' || steps.independent-artifact.outcome == 'failure' || steps.independent-confirm.outcome == 'failure')
        run: exit 1
      - name: Surface autonomous capture failures after other evidence is preserved
        if: always() && github.event_name != 'pull_request'
        env:
          PREPARE_OUTCOME: ${{ steps.autonomous-prepare.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.autonomous-artifact.outcome }}
          CONFIRM_OUTCOME: ${{ steps.autonomous-confirm.outcome }}
        run: |
          test ! -s /tmp/independent-autonomous.errors
          test "$PREPARE_OUTCOME" != failure
          test "$ARTIFACT_OUTCOME" != failure
          test "$CONFIRM_OUTCOME" != failure
      - name: Share fetched official ranks after publication and evidence preservation
        if: always() && github.event_name != 'pull_request'
        run: |
          node scripts/official-start-rank-cache.cjs /tmp/official-start-rank-cache.json
          test ! -s /tmp/official-start-rank-cache.json.errors
