name: Check open partner shadow
on:
  pull_request:
    paths:
      - "scripts/open-partner*.cjs"
      - "scripts/open-partner*.json"
      - "scripts/test-open-partner*.cjs"
      - "scripts/replay-open-partner*.cjs"
      - ".github/workflows/check-open-partner-shadow.yml"
permissions:
  contents: read
concurrency:
  group: open-partner-shadow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            js
            scripts
            config
            .github
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test scripts/test-open-partner-candidates-shadow.cjs
      - name: Read pinned source data without modifying production
        uses: actions/checkout@v4
        with:
          ref: 6fb160175071b3e354ac45073662362bf5b5e153
          path: .partner-reference
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/predictions/2026092[4-7].json
            /data/predictions/source-archives/2026092[4-7].meta.json
            /data/predictions/source-archives/2026092[4-7].json.gz
            /data/results/2026092[4-7].json
      - name: Replay baseline gate-only and individual-score prototype
        run: node scripts/replay-open-partner-ab.cjs .partner-reference /tmp/open-partner-evidence
      - name: Preserve exact evaluation source for independent replay
        if: always()
        run: |
          mkdir -p /tmp/open-partner-evidence
          tar -czf /tmp/open-partner-evidence/evaluation-source.tar.gz js scripts config
      - name: Upload replay results and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-partner-replay-evidence
          path: /tmp/open-partner-evidence/
          retention-days: 14
          if-no-files-found: error
