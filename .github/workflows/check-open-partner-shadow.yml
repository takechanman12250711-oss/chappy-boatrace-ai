name: Check open partner shadow
on:
  pull_request:
    paths:
      - "scripts/open-partner-candidates-shadow.cjs"
      - "scripts/test-open-partner-candidates-shadow.cjs"
      - "scripts/replay-open-partner*.cjs"
      - ".github/workflows/check-open-partner-shadow.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test scripts/test-open-partner-candidates-shadow.cjs
      - name: Read pinned source data without modifying production
        uses: actions/checkout@v4
        with:
          ref: 6fb160175071b3e354ac45073662362bf5b5e153
          path: .partner-reference
          persist-credentials: false
      - name: Extract stored pre-race records and provenance
        shell: bash
        run: |
          mkdir -p /tmp/open-partner-evidence
          node <<'NODE'
          const fs = require('node:fs'), path = require('node:path'), zlib = require('node:zlib'), crypto = require('node:crypto');
          const root = path.resolve('.partner-reference');
          const source = require('./scripts/eight-ticket-promotion-report-source.cjs');
          const all = source.load(root, '20260924');
          const records = all.records.filter(r => String(r.date || r.raceKey || '').slice(0,8) <= '20260927');
          const results = {};
          for (const date of ['20260924','20260925','20260926','20260927']) {
            const p = path.join(root, 'data/results', date+'.json');
            if (fs.existsSync(p)) results[date] = JSON.parse(fs.readFileSync(p, 'utf8'));
          }
          const data = { referenceCommit:'6fb160175071b3e354ac45073662362bf5b5e153', records, results, diagnostics:all.diagnostics };
          const bytes = Buffer.from(JSON.stringify(data));
          fs.writeFileSync('/tmp/open-partner-evidence/stored-inputs.json.gz', zlib.gzipSync(bytes));
          const summary = { referenceCommit:data.referenceCommit, records:records.length, bytes:bytes.length, sha256:crypto.createHash('sha256').update(bytes).digest('hex'), diagnostics:all.diagnostics,
            shapes:records.slice(0,2).map(r => ({raceKey:r.raceKey,keys:Object.keys(r),predictionKeys:Object.keys(r.prediction||{}),auditKeys:Object.keys(r.practicalSelectionAudit||r.prediction?.practicalSelectionAudit||{}),conditionKeys:Object.keys(r.prediction?.preRaceConditions||{})})) };
          fs.writeFileSync('/tmp/open-partner-evidence/input-manifest.json', JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          if (all.diagnostics.errors.length) throw Error('Source integrity errors: see artifact');
          NODE
      - name: Preserve exact evaluation source for local independent replay
        shell: bash
        run: |
          tar -czf /tmp/open-partner-evidence/evaluation-source.tar.gz js scripts config package.json package-lock.json
      - name: Upload read-only replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-partner-replay-inputs
          path: /tmp/open-partner-evidence/
          retention-days: 14
          if-no-files-found: error
