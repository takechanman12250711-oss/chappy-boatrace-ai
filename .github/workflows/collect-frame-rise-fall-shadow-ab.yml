name: Collect frame rise fall shadow A/B

on:
  pull_request:
    paths:
      - "scripts/frame-shadow-save-handoff.cjs"
      - "tests/frame-shadow-save-handoff.test.cjs"
      - "js/frame-rise-fall-shadow-storage.js"
      - "js/frame-rise-fall-shadow-replay.js"
      - "js/frame-rise-fall-replay-preload.js"
      - "scripts/build-frame-rise-fall-shadow-snapshots.js"
      - "scripts/minify-daily-prediction.js"
      - "scripts/test-minify-daily-prediction.js"
      - "scripts/daily-prediction-source-archive.js"
      - "scripts/restore-daily-prediction-source.js"
      - "scripts/prepare-daily-prediction-git-save.js"
      - "scripts/test-daily-prediction-source-archive.js"
      - "scripts/test-post-save-source-restore-order.js"
      - "scripts/build-prediction-summaries.js"
      - "scripts/build-current-prediction-summary.js"
      - "scripts/test-current-prediction-summary.js"
      - "scripts/test-frame-rise-fall-shadow-storage.js"
      - "scripts/test-frame-rise-fall-shadow-replay.js"
      - "scripts/test-frame-rise-fall-shadow-replay-preload.js"
      - ".github/workflows/collect-frame-rise-fall-shadow-ab.yml"
      - ".github/workflows/collect-predictions.yml"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/build-learning-analysis-pipeline.yml"
  workflow_run:
    workflows: ["Collect automatic race predictions"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "予想日（YYYYMMDD・空欄なら本日）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  queue: max
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify shadow storage
        run: |
          node tests/frame-shadow-save-handoff.test.cjs
          node --check js/frame-rise-fall-shadow-storage.js
          node --check js/frame-rise-fall-shadow-replay.js
          node --check js/frame-rise-fall-replay-preload.js
          node --check scripts/build-frame-rise-fall-shadow-snapshots.js
          node --check scripts/minify-daily-prediction.js
          node scripts/test-minify-daily-prediction.js
          node --check scripts/daily-prediction-source-archive.js
          node --check scripts/restore-daily-prediction-source.js
          node --check scripts/prepare-daily-prediction-git-save.js
          node scripts/test-daily-prediction-source-archive.js
          node scripts/test-post-save-source-restore-order.js
          node --check scripts/build-prediction-summaries.js
          node --check scripts/build-current-prediction-summary.js
          node scripts/test-current-prediction-summary.js
          node scripts/test-frame-rise-fall-shadow-off.js
          node scripts/test-frame-rise-fall-replay-preload.js
          node scripts/test-frame-rise-fall-shadow-replay.js
          node scripts/test-frame-rise-fall-shadow-storage.js
      - name: Verify frozen Phase10 state
        if: github.event_name != 'pull_request'
        run: |
          node scripts/test-theory-ab-phase10-approval.js
          node scripts/build-theory-ab-phase10.js
      - name: Freeze frame source date
        if: github.event_name != 'pull_request'
        id: target
        env:
          PREDICT_DATE: ${{ inputs.date }}
        run: node scripts/frame-shadow-save-handoff.cjs freeze
      - name: Capture prospective shadow snapshots
        if: github.event_name != 'pull_request'
        env:
          PREDICT_DATE: ${{ steps.target.outputs.date }}
        run: |
          node scripts/restore-daily-prediction-source.js
          node scripts/build-frame-rise-fall-shadow-snapshots.js
          node scripts/minify-daily-prediction.js
          node scripts/build-current-prediction-summary.js
      - name: Save shadow snapshots
        if: github.event_name != 'pull_request'
        env:
          PREDICT_DATE: ${{ steps.target.outputs.date }}
        run: |
          node scripts/prepare-daily-prediction-git-save.js
          git add data/stats/frame-rise-fall-shadow-snapshot-archive.json data/stats/theory-ab-phase10.json
          if git diff --cached --quiet; then
            echo "保存する枠別浮沈Shadowはありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect frame rise fall shadow A/B snapshot"
          git pull --rebase origin main
          git push origin main

      - name: Attest saved frame source
        if: github.event_name == 'workflow_run'
        env:
          PREDICT_DATE: ${{ steps.target.outputs.date }}
          FROZEN_AT: ${{ steps.target.outputs.frozen_at }}
          CAPTURE_SHA: ${{ steps.target.outputs.capture_sha }}
        run: node scripts/frame-shadow-save-handoff.cjs receipt "$RUNNER_TEMP/frame-shadow-save/frame-shadow-save.json"
      - name: Preserve exact frame save receipt
        if: github.event_name == 'workflow_run'
        uses: actions/upload-artifact@v4
        with:
          name: frame-shadow-save-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/frame-shadow-save/frame-shadow-save.json
          retention-days: 3
          if-no-files-found: error
