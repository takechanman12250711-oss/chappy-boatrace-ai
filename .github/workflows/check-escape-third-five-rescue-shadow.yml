name: Check escape third-five rescue shadow
on:
  pull_request:
    paths:
      - 'scripts/analyze-escape-third-five-rescue-shadow.js'
      - '.github/workflows/check-escape-third-five-rescue-shadow.yml'
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-escape-third-five-rescue-shadow.js
      - run: node scripts/analyze-escape-third-five-rescue-shadow.js
