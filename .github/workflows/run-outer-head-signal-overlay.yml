name: Run outer head signal overlay audit
on:
  pull_request:
    paths:
      - "scripts/analyze-outer-head-signal-overlay.cjs"
      - ".github/workflows/run-outer-head-signal-overlay.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run audit
        run: node scripts/analyze-outer-head-signal-overlay.cjs > outer-head-signal-overlay.json
      - uses: actions/upload-artifact@v4
        with:
          name: outer-head-signal-overlay
          path: outer-head-signal-overlay.json
