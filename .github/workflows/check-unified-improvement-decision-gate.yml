name: Check unified improvement decision gate
on:
  pull_request:
    paths:
      - "scripts/build-unified-improvement-decision-gate.js"
      - "scripts/test-unified-improvement-decision-gate.js"
      - ".github/workflows/check-unified-improvement-decision-gate.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-unified-improvement-decision-gate.js"
      - ".github/workflows/check-unified-improvement-decision-gate.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node --check scripts/build-unified-improvement-decision-gate.js
          node scripts/test-unified-improvement-decision-gate.js
          node scripts/build-unified-improvement-decision-gate.js
      - name: Save gate report
        if: github.event_name != 'pull_request'
        run: |
          git add data/stats/unified-improvement-decision-gate.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update unified improvement decision gate"
          git pull --rebase origin main
          git push origin main
