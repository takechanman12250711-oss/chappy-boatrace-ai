name: Manshu forward weekly

# ツムギ：note記事の「💥 万舟狙い」を分けた場合の成績を、これからのレースで記録する（読み取りのみ）。
# 以前は Claude の予約タスクで計算していたものを、使用量を節約するため GitHub Actions に移した。
# 本番の記事・予想・買い目は一切変えない。結果の表を「💥 万舟狙いの前向き記録（自動）」Issue にコメントする。
# 開始日は固定の 20261029（期間を都合で変えない）。PR のときは表を表示するだけで Issue には書かない。

on:
  schedule:
    - cron: "13 22 * * 0" # 毎週月曜 日本時間 7:13 ごろ
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/manshu-forward-weekly.yml"
      - "scripts/manshu-forward.cjs"
      - "scripts/manshu-forward-report.cjs"

permissions:
  contents: read
  issues: write

concurrency:
  group: manshu-forward-weekly
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          # 計算に使うのは scripts と、開始日以降の保存原稿・公式結果だけ
          sparse-checkout: |
            /scripts/
            /data/results/2026102[89]*
            /data/results/2026103*
            /data/results/20261[12]*
            /data/results/202[7-9]*
            /data/note-drafts/2026102[89]/
            /data/note-drafts/2026103*/
            /data/note-drafts/20261[12]*/
            /data/note-drafts/202[7-9]*/
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch note-published tags
        # 公開記録のタグ（receipt.json だけの小さなコミット）を取得する
        run: git fetch -q --no-tags --depth=1 --filter=blob:limit=10m origin '+refs/tags/note-published/*:refs/tags/note-published/*'
      - name: Compute forward record
        run: |
          node scripts/manshu-forward.cjs 20261029 > "$RUNNER_TEMP/manshu-forward.json"
          node scripts/manshu-forward-report.cjs "$RUNNER_TEMP/manshu-forward.json" > "$RUNNER_TEMP/manshu-forward.md"
          cat "$RUNNER_TEMP/manshu-forward.md"
          cat "$RUNNER_TEMP/manshu-forward.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "💥 万舟狙いの前向き記録（自動）"
        run: |
          num=$(gh api -X GET "repos/$GITHUB_REPOSITORY/issues" -f state=open -f per_page=100 --paginate \
            --jq ".[] | select(.pull_request == null and .title == env.TITLE) | .number" | head -1)
          if [ -z "$num" ]; then
            num=$(gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="$TITLE" \
              -f body="ツムギの「💥 万舟狙い」を分けた場合の前向き記録です。毎週月曜に自動で表を追記します（読み取りのみ・本番の記事や買い目は変えません）。" --jq .number)
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" -F body=@"$RUNNER_TEMP/manshu-forward.md" --jq .html_url
