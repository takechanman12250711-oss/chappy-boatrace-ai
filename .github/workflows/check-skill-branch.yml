name: Check skill branch
on:
  pull_request:
    paths:
      - "scripts/build-skill-branch-report.js"
      - "scripts/test-skill-branch-report.js"
      - "scripts/test-skill-motor-course-writer-contract.js"
      - ".github/workflows/check-skill-branch.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-skill-branch-report.js"
      - ".github/workflows/check-skill-branch.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node --check scripts/build-skill-branch-report.js
          node scripts/test-skill-branch-report.js
          node scripts/test-skill-motor-course-writer-contract.js
      - name: Build real diagnostics
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-skill-branch-report.js
