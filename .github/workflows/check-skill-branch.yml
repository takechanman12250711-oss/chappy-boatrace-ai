name: Check skill branch
on:
  pull_request:
    paths:
      - "scripts/build-skill-branch-report.js"
      - "scripts/test-skill-branch-report.js"
      - ".github/workflows/check-skill-branch.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-skill-branch-report.js"
      - ".github/workflows/check-skill-branch.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node --check scripts/build-skill-branch-report.js
          node scripts/test-skill-branch-report.js
      - name: Build real diagnostics
        if: github.event_name != 'pull_request'
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-skill-branch-report.js
          node scripts/prepare-daily-prediction-git-save.js --all
      - name: Save diagnostics
        if: github.event_name != 'pull_request'
        run: |
          git add data/stats/skill-branch-report.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update skill branch report"
          git pull --rebase origin main
          git push origin main
