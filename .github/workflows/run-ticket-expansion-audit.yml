name: Run ticket expansion audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-ticket-expansion-audit.yml'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'data/predictions/**'
      - 'data/results/**'
      - 'data/analysis/**'
      - 'data/stats/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run 7/12/18/24 audit
        run: |
          set -o pipefail
          node scripts/analyze-ticket-expansion-7-12-18-24.cjs | tee ticket-expansion-audit-output.txt
      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: ticket-expansion-audit
          path: |
            ticket-expansion-audit-output.txt
            data/stats/*ticket*expansion*.json
          if-no-files-found: warn
