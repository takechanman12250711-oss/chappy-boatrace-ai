name: Check final display activation

on:
  pull_request:
    paths:
      - "index.html"
      - "js/result-void-compat.js"
      - "js/final-display-owner-v2.js"
      - "css/final-display-controller.css"
      - "scripts/test-final-display-semantics.js"
      - "scripts/test-final-display-ownership.js"
      - "scripts/test-final-mobile-ui-contract.js"
      - "scripts/test-practical-tag-manshu-visibility.js"
      - ".github/workflows/check-final-display-preactivation.yml"

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: |
          node --check js/result-void-compat.js
          node --check js/final-display-owner-v2.js
          node --check scripts/test-final-display-semantics.js
          node --check scripts/test-final-display-ownership.js
          node --check scripts/test-final-mobile-ui-contract.js
          node --check scripts/test-practical-tag-manshu-visibility.js
      - name: Verify approved formation and purchase separation
        run: node scripts/test-final-display-semantics.js
      - name: Verify only one final display owner is active
        run: node scripts/test-final-display-ownership.js
      - name: Verify mobile bootstrap contract
        run: node scripts/test-final-mobile-ui-contract.js
      - name: Verify practical tags and visible manshu tickets
        run: node scripts/test-practical-tag-manshu-visibility.js
