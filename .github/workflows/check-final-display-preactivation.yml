name: Check final display preactivation

on:
  pull_request:
    paths:
      - "js/final-display-owner-v2.js"
      - "css/final-display-controller.css"
      - "scripts/test-final-display-semantics.js"
      - ".github/workflows/check-final-display-preactivation.yml"

permissions:
  contents: read

jobs:
  preactivation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: |
          node --check js/final-display-owner-v2.js
          node --check scripts/test-final-display-semantics.js
      - name: Verify approved formation and purchase separation
        run: node scripts/test-final-display-semantics.js
