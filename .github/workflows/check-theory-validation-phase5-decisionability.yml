name: Check theory validation phase5 decisionability
on:
  pull_request:
    paths:
      - 'scripts/theory-validation-phase5-decisionability.cjs'
      - 'scripts/theory-validation-phase4-terminal-audit.cjs'
      - 'tests/theory-validation-phase5-decisionability.test.cjs'
      - 'data/stats/frame-rise-fall-shadow-result-report.json'
      - 'data/stats/wall-established-attacker2-skip-ab-report.json'
      - 'data/stats/theory-evidence-coverage-phase7.json'
      - 'data/stats/theory-evidence-growth-monitor.json'
      - 'data/stats/st-slit-branch-profit-report.json'
      - 'data/stats/exhibition-foot-branch-report.json'
      - 'data/stats/local-water-branch-report.json'
      - 'data/stats/skill-branch-report.json'
      - 'data/stats/motor-course-branch-report.json'
      - '.github/workflows/check-theory-validation-phase5-decisionability.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/theory-validation-phase5-decisionability.test.cjs
      - run: node scripts/theory-validation-phase5-decisionability.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
