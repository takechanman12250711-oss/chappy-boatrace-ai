name: Apply direct render accordion

on:
  push:
    branches:
      - agent/direct-render-accordion

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/direct-render-accordion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply direct render patch
        run: node scripts/apply-direct-render-accordion.js
      - name: Validate syntax and markers
        run: |
          node --check js/render.js
          grep -q 'render-ui-v3.3.0-direct-accordion' js/render.js
          grep -q 'name="chappy-ticket-accordion"' js/render.js
          grep -q 'direct-render ticket accordion v1' style.css
          ! grep -q 'ticket-accordion-render.js' js/prediction-runtime-loader.js
      - name: Commit generated render changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/render.js style.css
          git commit -m "本命・押さえ・流し・万舟をrender.jsで直接折りたたみ化"
          git push origin HEAD:agent/direct-render-accordion
