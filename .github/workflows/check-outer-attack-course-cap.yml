name: Check outer attack course cap
on:
  pull_request:
    paths: ['scripts/test-outer-attack-course-cap.cjs','tests/outer-attack-course-cap.test.cjs','.github/workflows/check-outer-attack-course-cap.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/outer-attack-course-cap.test.cjs
      - run: node scripts/test-outer-attack-course-cap.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
