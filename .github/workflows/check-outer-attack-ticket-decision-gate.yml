name: Check outer attack ticket decision gate
on:
  pull_request:
    paths:
      - 'config/outer-attack-ticket-decision-gate-v1.json'
      - 'js/outer-attack-ticket-shadow.js'
      - 'js/outer-attack-ticket-settlement.js'
      - 'js/outer-attack-ticket-decision-gate.js'
      - 'js/stats-runtime-loader.js'
      - 'scripts/test-stats-runtime-loader.js'
      - 'tests/outer-attack-ticket-shadow.test.cjs'
      - 'tests/outer-attack-ticket-settlement.test.cjs'
      - 'tests/outer-attack-ticket-decision-gate.test.cjs'
      - 'docs/outer-attack-ticket-decision-gate-v1.md'
      - '.github/workflows/check-outer-attack-ticket-decision-gate.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/outer-attack-ticket-decision-gate.js
      - run: node --check js/stats-runtime-loader.js
      - run: node --check scripts/test-stats-runtime-loader.js
      - run: node --check tests/outer-attack-ticket-decision-gate.test.cjs
      - run: node tests/outer-attack-ticket-shadow.test.cjs
      - run: node tests/outer-attack-ticket-settlement.test.cjs
      - run: node tests/outer-attack-ticket-decision-gate.test.cjs
      - run: node scripts/test-stats-runtime-loader.js
      - run: node scripts/test-startup-critical-path.js
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
