name: Run outer head forward shadow v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/report-input-projection.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'scripts/analyze-ticket-expansion-payout-v2.cjs'
      - 'scripts/evaluate-outer-head-forward-shadow-v1.cjs'
      - '.github/workflows/run-outer-head-forward-shadow-v1.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/report-input-projection.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'scripts/analyze-ticket-expansion-payout-v2.cjs'
      - 'config/outer-head-forward-shadow-v1.json'
      - 'scripts/evaluate-outer-head-forward-shadow-v1.cjs'
      - 'scripts/analyze-outer-head-signal-overlay.cjs'
      - '.github/workflows/run-outer-head-forward-shadow-v1.yml'
  schedule:
    - cron: '20 13 * * *'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Evaluate frozen forward shadow
        run: node scripts/evaluate-outer-head-forward-shadow-v1.cjs > outer-head-forward-shadow-v1.json
      - name: Validate report is non-mutating
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('outer-head-forward-shadow-v1.json','utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          console.log(JSON.stringify({start:r.prospectiveStartDate, rows:r.totalForwardPromotionRows, days:r.observedDays, rules:Object.fromEntries(Object.entries(r.rules).map(([k,v])=>[k,v.summary]))}, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: outer-head-forward-shadow-v1
          path: outer-head-forward-shadow-v1.json
          retention-days: 90
