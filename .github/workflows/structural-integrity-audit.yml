name: Structural integrity audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "js/**"
      - "scripts/audit-structural-integrity.js"
      - "scripts/remove-purchase-preview-css.js"
      - ".github/workflows/structural-integrity-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/structural-integrity-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Remove orphan purchase CSS
        run: node scripts/remove-purchase-preview-css.js
      - name: Run structural audit
        run: node scripts/audit-structural-integrity.js
      - name: Remove temporary scripts
        run: |
          rm -f scripts/remove-purchase-preview-css.js
          rm -f scripts/audit-structural-integrity.js
      - name: Commit changes and report
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "追加変更なし"
            exit 0
          fi
          git commit -m "旧購入CSS削除と構造整合性監査"
          git push origin HEAD:${{ github.head_ref }}
