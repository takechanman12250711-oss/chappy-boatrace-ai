name: Check inner attack penalty simulation
on:
  pull_request:
    paths:
      - 'scripts/simulate-inner-attack-penalty.cjs'
      - 'tests/inner-attack-penalty-simulation.test.cjs'
      - '.github/workflows/check-inner-attack-penalty-simulation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/simulate-inner-attack-penalty.cjs'
      - 'tests/inner-attack-penalty-simulation.test.cjs'
      - '.github/workflows/check-inner-attack-penalty-simulation.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test Discovery penalty simulation
        run: node tests/inner-attack-penalty-simulation.test.cjs
      - name: Print penalty simulation
        run: node scripts/simulate-inner-attack-penalty.cjs
      - name: Check charter
        run: node scripts/check-charter.js
      - name: Confirm no tracked files were mutated
        run: git diff --exit-code
