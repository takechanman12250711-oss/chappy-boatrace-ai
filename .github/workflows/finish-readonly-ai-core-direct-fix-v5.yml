name: Finish direct readonly AI core fix v5

on:
  pull_request:
    paths:
      - ".github/workflows/finish-readonly-ai-core-direct-fix-v5.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finish-readonly-ai-core-direct-v5-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-merge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Synchronize latest branch
        run: |
          git fetch origin "${GITHUB_HEAD_REF}"
          git reset --hard "origin/${GITHUB_HEAD_REF}"

      - name: Apply readonly-safe source fix
        run: |
          node --check scripts/apply-readonly-ai-core-direct-fix-v2.js
          node scripts/apply-readonly-ai-core-direct-fix-v2.js

          node <<'NODE'
          "use strict";
          const fs = require("node:fs");

          function replaceOnce(source, before, after, label) {
            if (source.includes(after)) return source;
            const count = source.split(before).length - 1;
            if (count !== 1) {
              throw new Error(`${label}: count=${count}`);
            }
            return source.replace(before, after);
          }

          function patchInstaller(file, indent) {
            let source = fs.readFileSync(file, "utf8");
            const helper = `${indent}function canInstallCoreInPlace(core) {
${indent}  if (
${indent}    !Object.isExtensible(core) ||
${indent}    Object.isFrozen(core)
${indent}  ) {
${indent}    return false;
${indent}  }

${indent}  return [
${indent}    "buildPredictionData",
${indent}    "analyze",
${indent}    "buildBoatAnalyses"
${indent}  ].every((key) => {
${indent}    const descriptor =
${indent}      Object.getOwnPropertyDescriptor(core, key);

${indent}    if (!descriptor) return true;
${indent}    if (
${indent}      Object.prototype.hasOwnProperty.call(
${indent}        descriptor,
${indent}        "value"
${indent}      )
${indent}    ) {
${indent}      return descriptor.writable !== false;
${indent}    }
${indent}    return typeof descriptor.set === "function";
${indent}  });
${indent}}

`;
            source = replaceOnce(
              source,
              `${indent}function cloneCoreForInstall(core) {`,
              helper + `${indent}function cloneCoreForInstall(core) {`,
              `${file} can-install helper`
            );
            source = replaceOnce(
              source,
              `${indent}  const target = cloneCoreForInstall(core);`,
              `${indent}  const target =
${indent}    canInstallCoreInPlace(core)
${indent}      ? core
${indent}      : cloneCoreForInstall(core);`,
              `${file} conditional clone`
            );
            fs.writeFileSync(file, source, "utf8");
          }

          patchInstaller(
            "js/history-insights-base.js",
            "  "
          );
          patchInstaller(
            "js/motor-maintenance-insights.js",
            "    "
          );

          const target =
            "scripts/test-readonly-ai-core-assignment.js";
          let test = fs.readFileSync(target, "utf8");
          const before = `const broken = createContext();
installCore(broken);
run(broken, "js/local-water-v2-tiebreak.js");
assert.throws(
  () => run(
    broken,
    "js/third-six-rescue-fixed5.js"
  ),
  /read only|readonly|Cannot assign/i,
  "旧接続方式ではfreeze済みAIコアの再代入を再現する"
);`;
          const after = `const direct = createContext();
installCore(direct);
run(direct, "js/local-water-v2-tiebreak.js");
assert.doesNotThrow(
  () => run(
    direct,
    "js/third-six-rescue-fixed5.js"
  ),
  "本体installerだけでfreeze済みAIコアを安全に再公開する"
);
assert.equal(
  Object.isFrozen(direct.ChappyAICore),
  true,
  "本体直接修正でも固定5点freeze契約を維持する"
);`;
          test = replaceOnce(
            test,
            before,
            after,
            "readonly regression direct expectation"
          );
          fs.writeFileSync(target, test, "utf8");
          NODE

          git diff --check

      - name: Verify readonly and existing in-place contracts
        run: |
          node --check js/history-insights-base.js
          node --check js/motor-maintenance-insights.js
          node --check js/ai-core-assignment-compat.js
          node --check js/prediction-runtime-loader.js
          node --check scripts/test-readonly-ai-core-direct.js
          node --check scripts/test-readonly-ai-core-assignment.js
          node scripts/test-readonly-ai-core-direct.js
          node scripts/test-readonly-ai-core-assignment.js
          node tools/test-local-water-theory-v2.js
          node tools/test-motor-maintenance-theory-v2.js

      - name: Verify runtime and fixed-ticket regressions
        run: |
          node scripts/test-prediction-runtime-loader.js
          node scripts/test-startup-critical-path.js
          node scripts/test-prediction-loading-watchdog.js
          node scripts/test-odds-lightweight-path.js
          node scripts/test-ticket-accordion-render-path.js
          node scripts/test-phase6-integration.js
          node scripts/test-current-cache-test-alignment.js
          node scripts/test-load-performance.js
          node scripts/test-third-six-rescue-fixed5.js
          node scripts/test-three-course-escape-rescue-fixed5.js
          node scripts/test-four-kado-escape-rescue-fixed5.js
          node scripts/test-pair-31-rescue-fixed5.js
          node scripts/test-pair-32-rescue-fixed5.js
          node scripts/test-third-place-rescue-14-fixed5.js
          node scripts/test-third-place-rescue-12-4-fixed5.js
          node scripts/test-escape-outer-second-rescue-fixed5.js
          node scripts/test-formation-display-contract-current.js
          node scripts/check-charter.js

      - name: Commit final production files
        run: |
          rm -f \
            .github/workflows/finish-readonly-ai-core-direct-fix-v5.yml \
            .github/workflows/finish-readonly-ai-core-direct-fix-v4.yml \
            .github/workflows/finish-readonly-ai-core-direct-fix-v3.yml \
            .github/workflows/finish-readonly-ai-core-direct-fix-v2.yml \
            .github/workflows/finish-readonly-ai-core-direct-fix.yml \
            .github/workflows/apply-readonly-ai-core-direct-fix.yml \
            scripts/apply-readonly-ai-core-direct-fix.js \
            scripts/apply-readonly-ai-core-direct-fix-v2.js

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make AI core installers readonly-safe"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Squash merge verified direct fix
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" \
            --squash \
            --delete-branch \
            --admin \
            --subject "Fix readonly AI core at the source installers (#${{ github.event.pull_request.number }})" \
            --body "Keep mutable AI cores installed in place, but clone readonly or frozen cores before Local/Water V2 and Motor V2 wrap them. Preserve fixed-ticket freeze state and bump the production runtime cache generation. Prediction logic, scoring, tickets, UI and odds calculation are unchanged."
