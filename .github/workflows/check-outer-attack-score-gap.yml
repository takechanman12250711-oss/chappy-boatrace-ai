name: Check outer attack score gap
on:
  pull_request:
    paths:
      - 'scripts/analyze-outer-attack-score-gap.cjs'
      - 'tests/outer-attack-score-gap.test.cjs'
      - '.github/workflows/check-outer-attack-score-gap.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/outer-attack-score-gap.test.cjs
      - run: node scripts/analyze-outer-attack-score-gap.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
