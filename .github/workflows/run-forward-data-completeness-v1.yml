name: Run forward data completeness v1
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
  pull_request:
    paths:
      - 'scripts/audit-forward-data-completeness-v1.cjs'
      - '.github/workflows/run-forward-data-completeness-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run forward data completeness audit
        run: node scripts/audit-forward-data-completeness-v1.cjs > forward-data-completeness-v1.json
      - name: Validate research boundary and report
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('forward-data-completeness-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.counts.settledAfterActivation>0 && r.counts.completeForCombinedAudit>r.counts.settledAfterActivation) process.exit(1);
          console.log(JSON.stringify({counts:r.counts,rates:r.rates,examples:r.examples},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forward-data-completeness-v1
          path: forward-data-completeness-v1.json
          retention-days: 90
