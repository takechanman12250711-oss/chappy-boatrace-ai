name: Weekly stats

# 週次集計（チャッピー成績・3割案の前向き比較・boatrace-ev 試運転成績）。読み取りと集計のみ。
# Claude の週次タスクが毎回重い計算をして使用量の上限で失敗していたため、計算だけ先に GitHub Actions で行う。
# 結果は「📊 週次集計（自動）」Issue にコメントとして残し、Claude はそれを読んでまとめる。

on:
  schedule:
    - cron: "23 21 * * 0" # 日本時間 月曜 6:23（先週の月〜日を集計）
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/weekly-stats.yml"
      - "scripts/weekly-stats.cjs"
      - "scripts/test-weekly-stats.cjs"

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORWARD_START: "20261029"
    steps:
      - name: Get only the files needed
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 --no-single-branch "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git fetch -q --depth 1 --filter=blob:none origin "$REF"
          {
            echo /scripts/weekly-stats.cjs
            echo /scripts/test-weekly-stats.cjs
            echo /scripts/build-hold-pickup-data-shadow-ab.js
            echo /scripts/hold-pickup-data-shadow.js
            echo /config/hold-pickup-data-shadow-forward-v1.json
            echo /data/stats/continuous-performance-ledger.json
            # 3割案の比較は 10/29 以降の予想と結果だけを使う
            git ls-tree --name-only FETCH_HEAD data/predictions/ data/results/ \
              | awk -v s="$FORWARD_START" -F/ '$3 ~ /^[0-9]{8}\.json$/ && substr($3,1,8) >= s { print "/" $0 }'
          } > ../sparse.txt
          wc -l ../sparse.txt
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone --stdin < ../sparse.txt
          git checkout -q FETCH_HEAD

      - name: Get boatrace-ev data (read only)
        run: |
          git clone -q --filter=blob:none --no-checkout --depth 1 https://github.com/takechanman12250711-oss/boatrace-ev.git boatrace-ev
          cd boatrace-ev
          git sparse-checkout set --no-cone '/docs/data/2*.json'
          git checkout -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test the calculator
        working-directory: repo
        run: node --test scripts/test-weekly-stats.cjs

      - name: Compare the 30% data plan (forward)
        working-directory: repo
        # 評価コードが変わっていると終了コード1で止まる仕様。その場合も集計は続け、報告に「集計停止」と出す
        continue-on-error: true
        run: node --max-old-space-size=6000 scripts/build-hold-pickup-data-shadow-ab.js --forward

      - name: Build weekly stats
        working-directory: repo
        run: node scripts/weekly-stats.cjs --ev-dir ../boatrace-ev/docs/data --out-dir ../weekly-stats-out

      - uses: actions/upload-artifact@v4
        with:
          name: weekly-stats
          path: weekly-stats-out/
          retention-days: 90

      - name: Post to the weekly stats issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "📊 週次集計（自動）"
        run: |
          num=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .number' | head -1)
          if [ -z "$num" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "毎週月曜の朝に、先週の成績の集計をこの Issue にコメントで追加します（自動）。閉じないでください。"
            num=$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
              --jq '.[] | select(.pull_request == null and .title == env.TITLE) | .number' | head -1)
          fi
          gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body-file weekly-stats-out/comment.md
