name: Check phase10 live operation verification
on:
  pull_request:
    paths:
      - 'scripts/phase10-live-operation-verification.cjs'
      - 'tests/phase10-live-operation-verification.test.cjs'
      - '.github/workflows/check-phase10-live-operation-verification.yml'
      - 'scripts/phase9-live-improvement-cycle.cjs'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node --check scripts/phase10-live-operation-verification.cjs
      - run: node tests/phase10-live-operation-verification.test.cjs
      - run: node scripts/phase10-live-operation-verification.cjs
      - name: Guard production prediction files
        shell: bash
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(prediction\\.js|js/prediction\\.js|js/ai-core\\.js|ai-core\\.js)$'; then exit 1; fi
      - run: node scripts/check-charter.js
