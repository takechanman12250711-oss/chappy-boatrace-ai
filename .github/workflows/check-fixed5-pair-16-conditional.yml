name: Check fixed5 pair 1-6 conditional A/B
on:
  pull_request:
    paths:
      - 'scripts/ab-fixed5-pair-16-conditional.js'
      - '.github/workflows/check-fixed5-pair-16-conditional.yml'
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/ab-fixed5-pair-16-conditional.js
      - run: node scripts/ab-fixed5-pair-16-conditional.js
