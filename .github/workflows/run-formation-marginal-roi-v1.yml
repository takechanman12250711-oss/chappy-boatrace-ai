name: Run formation marginal ROI v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-formation-marginal-roi-v1.cjs'
      - '.github/workflows/run-formation-marginal-roi-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run marginal formation ROI audit
        run: node scripts/analyze-formation-marginal-roi-v1.cjs > formation-marginal-roi-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('formation-marginal-roi-v1.json', 'utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          console.log(JSON.stringify({ byBand: r.byBand, byBandRole: r.byBandRole, efficientCells: r.efficientCells }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: formation-marginal-roi-v1
          path: formation-marginal-roi-v1.json
          retention-days: 90
