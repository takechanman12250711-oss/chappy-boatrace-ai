name: Check candidate90 head2 prune validation

on:
  pull_request:
    branches: [main]
    paths:
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/practical-selection.js"
      - "scripts/validate-candidate90-head2-prune.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-candidate90-head2-prune-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Check syntax
        run: node --check scripts/validate-candidate90-head2-prune.js
      - name: Validate head2 candidate90 prune
        run: node scripts/validate-candidate90-head2-prune.js
