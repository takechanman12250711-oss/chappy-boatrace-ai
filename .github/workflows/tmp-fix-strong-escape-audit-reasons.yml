name: Fix strong escape audit reasons
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-fix-strong-escape-audit-reasons.js'
      - '.github/workflows/tmp-fix-strong-escape-audit-reasons.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-escape-alternate-trim
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-fix-strong-escape-audit-reasons.js
      - run: |
          node --check js/practical-selection.js
          node scripts/test-practical-selection.js
          node scripts/test-strong-escape-trim-regression.js
          node scripts/test-evaluated-scenario-consistency.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/practical-selection.js
          git commit -m 'Keep post-trim exclusion reasons truthful' || exit 0
          git push origin HEAD:agent/strong-escape-alternate-trim
