name: Check sashi role rescue shadow
on:
  pull_request:
    paths:
      - 'scripts/analyze-sashi-role-rescue-shadow.js'
      - '.github/workflows/check-sashi-role-rescue-shadow.yml'
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-sashi-role-rescue-shadow.js
      - run: node scripts/analyze-sashi-role-rescue-shadow.js
