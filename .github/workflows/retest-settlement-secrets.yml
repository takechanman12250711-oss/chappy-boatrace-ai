name: Retest purchase settlement secrets

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required secrets
        env:
          API_BASE_URL: ${{ secrets.CHAPPY_API_BASE_URL }}
          SYNC_TOKEN: ${{ secrets.CHAPPY_PURCHASE_SYNC_TOKEN }}
        run: |
          test -n "$API_BASE_URL"
          test -n "$SYNC_TOKEN"
      - name: Call settlement API
        env:
          API_BASE_URL: ${{ secrets.CHAPPY_API_BASE_URL }}
          SYNC_TOKEN: ${{ secrets.CHAPPY_PURCHASE_SYNC_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            "${API_BASE_URL%/}/api/settle-purchases"
