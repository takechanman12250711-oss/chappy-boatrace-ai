name: Check priority-gate post-adoption monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/practical-selection.js"
      - "scripts/build-priority-gate-post-adoption-monitor.js"
      - "data/predictions/**"
      - ".github/workflows/check-priority-gate-post-adoption-monitor.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Check syntax
        run: node --check scripts/build-priority-gate-post-adoption-monitor.js
      - name: Build post-adoption comparison
        run: node scripts/build-priority-gate-post-adoption-monitor.js
