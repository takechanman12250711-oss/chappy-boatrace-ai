name: Check outer attack ticket progress panel

on:
  pull_request:
    branches: [main]
    paths:
      - "js/outer-attack-ticket-progress-panel.js"
      - "js/outer-attack-ticket-decision-gate.js"
      - "js/stats-runtime-loader.js"
      - "js/app-runtime-loader.js"
      - "scripts/test-stats-runtime-loader.js"
      - "scripts/test-startup-critical-path.js"
      - "tests/outer-attack-ticket-decision-gate.test.cjs"
      - "tests/outer-attack-ticket-progress-panel.test.cjs"
      - ".github/workflows/check-outer-attack-ticket-progress-panel.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/outer-attack-ticket-progress-panel.js
      - run: node --check js/stats-runtime-loader.js
      - run: node --check scripts/test-stats-runtime-loader.js
      - run: node --check tests/outer-attack-ticket-progress-panel.test.cjs
      - run: node tests/outer-attack-ticket-progress-panel.test.cjs
      - run: node tests/outer-attack-ticket-decision-gate.test.cjs
      - run: node scripts/test-stats-runtime-loader.js
      - run: node scripts/test-startup-critical-path.js
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
