name: Build wake crossing head gate
on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Collect automatic race predictions
    types: [completed]
  pull_request:
    paths:
      - js/wake-crossing-head-gate.js
      - scripts/build-wake-crossing-head-gate-report.cjs
      - tests/wake-crossing-head-gate.test.cjs
      - .github/workflows/build-wake-crossing-head-gate.yml
permissions:
  contents: write
concurrency:
  group: wake-crossing-head-gate
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/wake-crossing-head-gate.test.cjs
      - if: github.event_name != 'pull_request'
        run: node --max-old-space-size=6144 scripts/build-wake-crossing-head-gate-report.cjs
      - name: Persist report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats/wake-crossing-head-gate-v1.json
          git diff --cached --quiet && exit 0
          git commit -m "Update wake crossing head gate report"
          git pull --rebase origin main
          git push origin HEAD:main
