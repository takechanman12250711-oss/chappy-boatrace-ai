name: Build scenario AI v6 monitor

on:
  schedule:
    - cron: "30 15 * * *" # 00:30 JST・公式結果収集後
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build read-only monitor report
        run: |
          node scripts/test-scenario-ai-v6-monitor.js
          node scripts/test-scenario-ai-v6-monitor-writer-contract.js
          node scripts/build-scenario-ai-v6-monitor.js
          node scripts/check-charter.js
