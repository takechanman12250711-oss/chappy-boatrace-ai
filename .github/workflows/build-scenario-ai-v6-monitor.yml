name: Build scenario AI v6 monitor

on:
  schedule:
    - cron: "30 15 * * *" # 00:30 JST・公式結果収集後
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-scenario-ai-v6-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build monitor report
        run: |
          node scripts/test-scenario-ai-v6-monitor.js
          node scripts/build-scenario-ai-v6-monitor.js
          node scripts/check-charter.js
      - name: Save monitor report
        run: |
          git add data/stats/scenario-ai-v6-monitor.json
          if git diff --cached --quiet; then
            echo "監視レポートに変更はありません"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update scenario AI v6 monitor"
          git pull --rebase origin main
          git push origin main
