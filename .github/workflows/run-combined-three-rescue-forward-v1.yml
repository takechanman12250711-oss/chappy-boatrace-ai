name: Run combined three rescue forward v1
on:
  workflow_dispatch:
  schedule:
    - cron: '15 16 * * *'
  pull_request:
    paths:
      - 'scripts/audit-combined-three-rescue-forward-v1.cjs'
      - '.github/workflows/run-combined-three-rescue-forward-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run combined forward audit
        run: node scripts/audit-combined-three-rescue-forward-v1.cjs > combined-three-rescue-forward-v1.json
      - name: Validate frozen research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('combined-three-rescue-forward-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.frozenRules.third.rank!==8||r.frozenRules.second.rank!==9||r.frozenRules.head.rank!==11) process.exit(1);
          if(r.frozenRules.second.headMustExistInBaseline7!==true||r.frozenRules.second.prefixMustBeNew!==true) process.exit(1);
          console.log(JSON.stringify({settled:r.settledRaceCountAfterActivation,baseline:r.baseline,byRule:r.byRule,combined:r.combined,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: combined-three-rescue-forward-v1
          path: combined-three-rescue-forward-v1.json
          retention-days: 90
