name: LINE owner onboarding test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/line-onboarding-test.yml'
      - 'scripts/send-line-onboarding-test.cjs'
      - 'scripts/send-line-onboarding-test.test.cjs'
  pull_request:
    paths:
      - '.github/workflows/line-onboarding-test.yml'
      - 'scripts/send-line-onboarding-test.cjs'
      - 'scripts/send-line-onboarding-test.test.cjs'
permissions:
  contents: read
concurrency:
  group: line-owner-onboarding-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check-line-connection.cjs
            scripts/check-line-connection.test.cjs
            scripts/send-line-onboarding-test.cjs
            scripts/send-line-onboarding-test.test.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/check-line-connection.test.cjs scripts/send-line-onboarding-test.test.cjs
  send:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'takechanman12250711-oss/chappy-boatrace-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/check-line-connection.cjs
            scripts/send-line-onboarding-test.cjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Send one test to the owner, with permanent duplicate prevention
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TEST_USER_ID: ${{ secrets.LINE_TEST_USER_ID }}
          LINE_TEST_CLAIM_TOKEN: ${{ github.token }}
        run: node scripts/send-line-onboarding-test.cjs
