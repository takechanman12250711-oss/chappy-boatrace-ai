name: Diagnose full review function stages in WebKit

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-full-review-function-stages-webkit.yml"
      - "scripts/diagnose-full-review-function-stages-webkit.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/chappy-function-stage.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/chappy-function-stage.log
          exit 1
      - name: Trace full review flow
        env:
          APP_URL: http://127.0.0.1:4173/
        run: node scripts/diagnose-full-review-function-stages-webkit.mjs
