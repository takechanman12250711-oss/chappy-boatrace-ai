name: Run attack flow role v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-attack-flow-role-v1.cjs'
      - '.github/workflows/run-attack-flow-role-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run role audit
        run: node scripts/analyze-attack-flow-role-v1.cjs > attack-flow-role-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('attack-flow-role-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({eligible:r.eligibleSettledRaceCount,metrics:r.metrics,oneBoatLoss:r.oneBoatLossWhenAttackLeader3or4,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: attack-flow-role-v1
          path: attack-flow-role-v1.json
          retention-days: 90
