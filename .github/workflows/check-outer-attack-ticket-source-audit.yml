name: Check outer attack ticket source audit
on:
  pull_request:
    paths:
      - 'scripts/audit-outer-attack-ticket-sources.cjs'
      - 'tests/outer-attack-ticket-source-audit.test.cjs'
      - '.github/workflows/check-outer-attack-ticket-source-audit.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/outer-attack-ticket-source-audit.test.cjs
      - run: node scripts/audit-outer-attack-ticket-sources.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
