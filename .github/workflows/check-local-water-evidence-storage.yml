name: Check local water evidence storage
on:
  pull_request:
    paths:
      - "scripts/apply-local-water-evidence-storage.js"
      - "scripts/test-local-water-evidence-storage.js"
      - ".github/workflows/check-local-water-evidence-storage.yml"
  push:
    branches: [main]
    paths:
      - "scripts/apply-local-water-evidence-storage.js"
      - ".github/workflows/check-local-water-evidence-storage.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify local water evidence storage patch
        run: node scripts/test-local-water-evidence-storage.js
      - name: Apply storage patch on main
        if: github.event_name != 'pull_request'
        run: node scripts/apply-local-water-evidence-storage.js
      - name: Save collector update
        if: github.event_name != 'pull_request'
        run: |
          git add scripts/collect-predictions.js
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Store local water verification evidence"
          git pull --rebase origin main
          git push origin main
