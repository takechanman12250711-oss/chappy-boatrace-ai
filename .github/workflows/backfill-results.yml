name: Backfill official race results

on:
  workflow_dispatch:
    inputs:
      from:
        description: "開始日（YYYYMMDD）"
        required: true
        type: string

      to:
        description: "終了日（YYYYMMDD・最大31日）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: collect-official-results
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backfill official results
        env:
          BACKFILL_FROM: ${{ inputs.from }}
          BACKFILL_TO: ${{ inputs.to }}
        run: |
          node scripts/backfill-results.js \
            --from="$BACKFILL_FROM" \
            --to="$BACKFILL_TO"

      - name: Save backfilled results
        env:
          BACKFILL_FROM: ${{ inputs.from }}
          BACKFILL_TO: ${{ inputs.to }}
        run: |
          git add data/results data/stats

          if git diff --cached --quiet; then
            echo "保存する変更はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m \
            "Backfill official race results ${BACKFILL_FROM}-${BACKFILL_TO}"

          git pull --rebase origin main
          git push origin HEAD:main