name: Diagnose post-prediction stage in WebKit
# Temporary read-only verification branch; never merge into main.
on:
  push:
    branches: [verify/escape-partner-live-20261003]
    paths: [.github/workflows/diagnose-post-prediction-stage-webkit.yml]
permissions:
  contents: read
jobs:
  saved-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/note-drafts/20261003/
            /data/note-publish/latest.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspect persisted original evidence only
        run: |
          mkdir -p artifacts-source
          git rev-parse HEAD > artifacts-source/source-commit.txt
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const dir='data/note-drafts/20261003',deployment=Date.parse('2026-10-03T11:37:32Z');
          const tk=v=>typeof v==='string'?v:String(v?.ticket||'');
          const valid=v=>/^[1-6]-[1-6]-[1-6]$/.test(tk(v))&&new Set(tk(v).split('-')).size===3;
          const scan=(o,p='',out=[])=>{if(!o||typeof o!=='object')return out;for(const [k,v] of Object.entries(o)){
            const q=p?p+'.'+k:k;
            if(k==='ticketPolicyVersion'&&typeof v==='string')out.push({kind:'policy',path:q,value:v});
            if(Array.isArray(v)&&v.length>0&&v.length<=24&&v.every(valid)&&/practical|baseline|verificationEvidence\.tickets|final/i.test(q))out.push({kind:'tickets',path:q,value:v.map(tk)});
            if(v&&typeof v==='object')scan(v,q,out);
          }return out;};
          const rows=[];
          for(const name of fs.readdirSync(dir).filter(n=>n.endsWith('.json')).sort()){
            const raw=fs.readFileSync(dir+'/'+name),b=JSON.parse(raw),r=b.record||{},p=r.prediction||{},e=r.practicalSelectionEvidence||{};
            const surfaces=scan(b);
            const baseline=Array.isArray(b.baselinePracticalTickets)?b.baselinePracticalTickets.map(tk):[];
            const article=b.article||{};
            const selected=Date.parse(r.selectedAt||b.capturedAt||'');
            const deadline=Date.parse(r.deadlineAt||'');
            const series=b.monitor?.kind||article.articleSeries||'normal';
            rows.push({file:name,sha256:crypto.createHash('sha256').update(raw).digest('hex'),raceKey:r.raceKey,series,capturedAt:b.capturedAt||null,selectedAt:r.selectedAt||null,deadlineAt:r.deadlineAt||null,sourceCommit:b.sourceCommit||null,preDeadline:Number.isFinite(selected)&&Number.isFinite(deadline)&&selected<deadline,afterDeployment:Number.isFinite(selected)&&selected>deployment,newPolicy:surfaces.some(x=>x.kind==='policy'&&x.value.includes('escape-role-partner-v1.3')),baseline,articleKeys:Object.keys(article),predictionKeys:Object.keys(p),evidenceKeys:Object.keys(e),stageKeys:Object.keys(e.stageHistory||{}),surfaces});
          }
          const normals=rows.filter(r=>r.series==='normal');
          const report={checkedAt:new Date().toISOString(),sourceCommit:fs.readFileSync('artifacts-source/source-commit.txt','utf8').trim(),deploymentAt:'2026-10-03T11:37:32Z',count:rows.length,normalCount:normals.length,afterDeploymentNormalCount:normals.filter(r=>r.afterDeployment).length,newPolicyNormalCount:normals.filter(r=>r.newPolicy).length,latestNormal:normals.sort((a,b)=>Date.parse(b.selectedAt||b.capturedAt)-Date.parse(a.selectedAt||a.capturedAt))[0]||null,rows};
          const handoffPath='data/note-publish/latest.json';
          if(fs.existsSync(handoffPath)){const h=JSON.parse(fs.readFileSync(handoffPath,'utf8'));report.handoff={generatedAt:h.generatedAt,candidateCount:h.candidateCount,candidates:(h.candidates||[]).map(x=>({raceKey:x.raceKey,series:x.articleSeries,selectedAt:x.selectedAt,sourcePath:x.sourcePath}))};}
          fs.writeFileSync('artifacts-source/saved-note-audit.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({checkedAt:report.checkedAt,sourceCommit:report.sourceCommit,count:report.count,normalCount:report.normalCount,afterDeploymentNormalCount:report.afterDeploymentNormalCount,newPolicyNormalCount:report.newPolicyNormalCount,latestNormal:report.latestNormal?{raceKey:report.latestNormal.raceKey,selectedAt:report.latestNormal.selectedAt,deadlineAt:report.latestNormal.deadlineAt,preDeadline:report.latestNormal.preDeadline,afterDeployment:report.latestNormal.afterDeployment}:null}));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escape-partner-saved-source-audit
          path: artifacts-source/
          if-no-files-found: error
          retention-days: 14
