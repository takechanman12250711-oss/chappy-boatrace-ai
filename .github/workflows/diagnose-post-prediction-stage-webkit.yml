name: Diagnose post-prediction stage in WebKit
# Temporary read-only evidence retrieval, never merge.
on:
  push:
    branches: [verify/escape-v13-saved-20261004]
    paths: [.github/workflows/diagnose-post-prediction-stage-webkit.yml]
permissions:
  contents: read
  actions: read
jobs:
  observed-public-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Read the existing publication and official result only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir evidence
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const root='https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY;
          const report={checkedAt:new Date().toISOString(),readOnly:true,pages:[],workflows:[],errors:[]};
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'};
          async function api(path){const r=await fetch(root+path,{headers,signal:AbortSignal.timeout(20000)});if(!r.ok)throw Error(path+': '+r.status);return r.json();}
          async function main(){
            for(const [name,url]of [['official-result','https://www.boatrace.jp/owpc/pc/race/raceresult?hd=20261004&jcd=23&rno=3'],['published-note','https://note.com/great_robin3243/n/n500c84aedec6']]){
              try{const r=await fetch(url,{signal:AbortSignal.timeout(30000)}),b=Buffer.from(await r.arrayBuffer());fs.writeFileSync('evidence/'+name+'.html',b);report.pages.push({name,url,finalUrl:r.url,status:r.status,contentType:r.headers.get('content-type'),bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')});}catch(e){report.errors.push({name,error:e.message});}
            }
            for(const file of ['live-note.yml','collect-predictions.yml','note-github-ui-transport.yml']){
              try{const d=await api('/actions/workflows/'+file+'/runs?branch=main&per_page=20');report.workflows.push({file,runs:d.workflow_runs.filter(r=>r.event!=='pull_request').slice(0,5).map(r=>({id:r.id,name:r.name,status:r.status,conclusion:r.conclusion,sha:r.head_sha,event:r.event,createdAt:r.created_at,updatedAt:r.updated_at}))});}catch(e){report.errors.push({file,error:e.message});}
            }
            try{report.main=(await api('/commits/main')).sha; const d=await api('/contents/data/note-drafts/20261004?ref='+report.main); report.sourceFiles=d.map(x=>({path:x.path,sha:x.sha,size:x.size}));}catch(e){report.errors.push({sourceFiles:e.message});}
            fs.writeFileSync('evidence/public-evidence.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report));
          }
          main().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: escape-v13-public-evidence-20261004
          path: evidence/
          if-no-files-found: error
          retention-days: 14
