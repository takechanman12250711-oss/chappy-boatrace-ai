name: Diagnose post-prediction stage in WebKit

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-post-prediction-stage-webkit.yml"
      - "scripts/diagnose-post-prediction-stage-webkit.mjs"
      - "index.html"
      - "style.css"
      - "js/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/chappy-post-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chappy-post-http.log
          exit 1

      - name: Isolate practical selection
        id: local_select
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts-post/local-select
          timeout --signal=TERM --kill-after=5s 90s \
            env \
              APP_URL=http://127.0.0.1:4173/ \
              EXPECTED_RUNTIME=20260825-display-layout1 \
              RACE_URL='https://chappy-boatrace-api.vercel.app/api/race?jcd=01&rno=10&date=20260825' \
              DIAG_OUTPUT=artifacts-post/local-select \
            node scripts/diagnose-post-prediction-stage-webkit.mjs select \
            > artifacts-post/local-select/process.log 2>&1
          status=$?
          echo "$status" > artifacts-post/local-select/exit-status.txt
          echo "exit_status=$status" | tee -a artifacts-post/local-select/process.log
          cat artifacts-post/local-select/process.log
          pkill -9 MiniBrowser || true
          pkill -9 WebKitNetworkProcess || true
          exit "$status"

      - name: Isolate renderAll locally
        id: local_render
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts-post/local-render
          timeout --signal=TERM --kill-after=5s 90s \
            env \
              APP_URL=http://127.0.0.1:4173/ \
              EXPECTED_RUNTIME=20260825-display-layout1 \
              RACE_URL='https://chappy-boatrace-api.vercel.app/api/race?jcd=01&rno=10&date=20260825' \
              DIAG_OUTPUT=artifacts-post/local-render \
            node scripts/diagnose-post-prediction-stage-webkit.mjs render \
            > artifacts-post/local-render/process.log 2>&1
          status=$?
          echo "$status" > artifacts-post/local-render/exit-status.txt
          echo "exit_status=$status" | tee -a artifacts-post/local-render/process.log
          cat artifacts-post/local-render/process.log
          pkill -9 MiniBrowser || true
          pkill -9 WebKitNetworkProcess || true
          exit "$status"

      - name: Isolate renderAll in production
        id: production_render
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p artifacts-post/production-render
          timeout --signal=TERM --kill-after=5s 90s \
            env \
              APP_URL=https://takechanman12250711-oss.github.io/chappy-boatrace-ai/ \
              EXPECTED_RUNTIME=20260825-display-layout1 \
              RACE_URL='https://chappy-boatrace-api.vercel.app/api/race?jcd=01&rno=10&date=20260825' \
              DIAG_OUTPUT=artifacts-post/production-render \
            node scripts/diagnose-post-prediction-stage-webkit.mjs render \
            > artifacts-post/production-render/process.log 2>&1
          status=$?
          echo "$status" > artifacts-post/production-render/exit-status.txt
          echo "exit_status=$status" | tee -a artifacts-post/production-render/process.log
          cat artifacts-post/production-render/process.log
          pkill -9 MiniBrowser || true
          pkill -9 WebKitNetworkProcess || true
          exit "$status"

      - name: Enforce post-prediction diagnostics
        if: always()
        shell: bash
        env:
          CHECK_PRODUCTION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const required = [
            {
              dir: "artifacts-post/local-select",
              report: "select-progress.json",
              marks: ["practical-select-finished"]
            },
            {
              dir: "artifacts-post/local-render",
              report: "render-progress.json",
              marks: [
                "render-all-finished",
                "post-render-responsive-finished",
                "render-screenshot-finished"
              ],
              screenshot: "render-result.png"
            }
          ];
          if (process.env.CHECK_PRODUCTION === "true") {
            required.push({
              dir: "artifacts-post/production-render",
              report: "render-progress.json",
              marks: [
                "render-all-finished",
                "post-render-responsive-finished",
                "render-screenshot-finished"
              ],
              screenshot: "render-result.png"
            });
          }
          const failures = [];
          for (const check of required) {
            const file = `${check.dir}/${check.report}`;
            if (!fs.existsSync(file)) {
              failures.push(`${file}: missing report`);
              continue;
            }
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            const marks = new Set((report.marks || []).map(row => row.name));
            for (const mark of check.marks) {
              if (!marks.has(mark)) {
                failures.push(`${file}: missing ${mark}; error=${report.error?.message || "none"}`);
              }
            }
            if (report.error) {
              failures.push(`${file}: ${report.error.message || "diagnostic error"}`);
            }
            const exitFile = `${check.dir}/exit-status.txt`;
            const exitStatus = fs.existsSync(exitFile)
              ? fs.readFileSync(exitFile, "utf8").trim()
              : "missing";
            if (exitStatus !== "0") {
              failures.push(`${exitFile}: expected 0, got ${exitStatus}`);
            }
            if (
              check.screenshot &&
              !fs.existsSync(`${check.dir}/${check.screenshot}`)
            ) {
              failures.push(`${check.dir}/${check.screenshot}: missing screenshot`);
            }
          }
          if (failures.length) {
            console.error(failures.join("\n"));
            process.exit(1);
          }
          console.log("All post-prediction WebKit stages completed.");
          NODE

      - name: Upload post-prediction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-prediction-webkit-diagnostics
          path: artifacts-post
          if-no-files-found: error
          retention-days: 7
