name: Refresh local water branch report
on:
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
permissions:
  contents: write
concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh local water diagnostics
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-local-water-branch-report.js
          node scripts/prepare-daily-prediction-git-save.js --all
      - name: Save report
        run: |
          git add data/stats/local-water-branch-report.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh local water branch report"
          git pull --rebase origin main
          git push origin main
