name: Audit post-312 generation gaps
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-post312-generation-gaps.js'
      - 'scripts/tmp-audit-scenario-complete-candidates.js'
      - 'scripts/tmp-audit-main-attacker-retention.js'
      - 'scripts/tmp-audit-second-missing-roles.js'
      - 'scripts/tmp-audit-pickup-to-second.js'
      - 'scripts/tmp-audit-pickup-second-grid.js'
      - 'scripts/tmp-audit-pickup-second-oos.js'
      - '.github/workflows/tmp-post312-generation-gap-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit remaining misses after candidate90
        run: node scripts/tmp-audit-post312-generation-gaps.js
      - name: Audit scenario-complete candidate recovery
        run: node scripts/tmp-audit-scenario-complete-candidates.js
      - name: Audit main-attacker retention
        run: node scripts/tmp-audit-main-attacker-retention.js
      - name: Audit missing second-place role sources
        run: node scripts/tmp-audit-second-missing-roles.js
      - name: Audit pickup candidates promoted to second
        run: node scripts/tmp-audit-pickup-to-second.js
      - name: Audit pickup-to-second threshold robustness
        run: node scripts/tmp-audit-pickup-second-grid.js
      - name: Audit fixed pickup-to-second 84/78 out-of-time
        run: node scripts/tmp-audit-pickup-second-oos.js
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: post312-generation-gap-audit
          path: tmp-analysis-output/*.json
          if-no-files-found: error
