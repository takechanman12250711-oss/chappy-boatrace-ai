name: Audit post-312 generation gaps
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-both-missing-roles.js'
      - '.github/workflows/tmp-post312-generation-gap-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit both-missing role sources
        run: node scripts/tmp-audit-both-missing-roles.js
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: post312-both-missing-audit
          path: tmp-analysis-output/both-missing-roles.json
          if-no-files-found: error
