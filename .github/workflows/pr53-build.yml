name: Build PR53 Local Water Theory V2

on:
  push:
    branches:
      - agent/strengthen-local-water-theory-v2
    paths:
      - .github/workflows/pr53-build.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: agent/strengthen-local-water-theory-v2
          fetch-depth: 0

      - name: Patch local and water theory
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          core_path = Path('js/ai-core.js')
          core = core_path.read_text(encoding='utf-8')

          core = core.replace(
              'const CORE_VERSION = "ai-core-v4.3.0-racer-skill-theory";',
              'const CORE_VERSION = "ai-core-v4.4.0-local-water-theory-v2";'
          )

          start = core.index('  function buildLocalTheory(')
          end = core.index('  function newEnvironmentTheoryGrade', start)

          replacement = r'''  function buildLocalTheory(
    entries,
    analyses,
    data,
    raceScenarios
  ) {
    const sourceEntries = Array.isArray(entries) ? entries : [];
    const sourceAnalyses = Array.isArray(analyses) ? analyses : [];
    const mainScenario = raceScenarios?.mainScenario || null;
    const venueFeature = getVenueFeature(data);
    const wind = normalizeWindDirection(data);
    const surface = getWaterSurfaceContext(data);
    const windSpeed = getOptionalWeatherNumber(
      data,
      ["windSpeed", "wind", "wind_velocity"]
    );
    const waveHeight = getOptionalWeatherNumber(
      data,
      ["waveHeight", "wave", "wave_height"]
    );
    const entryByBoat = new Map(
      sourceEntries.map((boat) => [getBoatNo(boat), boat])
    );
    const firstCandidates = new Set(
      (mainScenario?.outcome?.firstCandidates || [])
        .map((boat) => Number(boat?.boatNo || boat || 0))
        .filter(Boolean)
    );
    const secondCandidates = new Set(
      (mainScenario?.outcome?.secondCandidates || [])
        .map((boat) => Number(boat?.boatNo || boat || 0))
        .filter(Boolean)
    );
    const thirdCandidates = new Set(
      (mainScenario?.outcome?.thirdCandidates || [])
        .map((boat) => Number(boat?.boatNo || boat || 0))
        .filter(Boolean)
    );
    const blockedBoats = new Set(
      (mainScenario?.blockedBoats || raceScenarios?.blockedBoats || [])
        .map((boatNo) => Number(boatNo))
        .filter(Boolean)
    );

    function optionalNumber(...values) {
      const value = values.find(
        (item) =>
          item !== null &&
          item !== undefined &&
          item !== "" &&
          Number.isFinite(Number(item))
      );
      return value === undefined ? null : Number(value);
    }

    function courseVenueScore(course) {
      if (course === 1) return venueFeature.inPower;
      if (course === 2) return venueFeature.sashi;
      if (course === 3) return venueFeature.makuri;
      if (course === 4) {
        return Math.max(venueFeature.kado, venueFeature.makuriSashi);
      }
      if (course === 5) return venueFeature.makuriSashi;
      return venueFeature.outside;
    }

    function windCourseScore(course) {
      if (windSpeed === null || !wind.isKnown) return null;

      const table = {
        calm: [20, 18, 16, 14, 12, 10],
        head: [14, 12, 20, 19, 15, 12],
        tail: [19, 20, 14, 12, 10, 8],
        cross: [16, 15, 15, 14, 12, 10]
      };
      const base = table[wind.type]?.[course - 1] ?? 0;
      const speedFactor =
        windSpeed >= 6 ? 1
          : windSpeed >= 4 ? 0.9
            : windSpeed > 2 ? 0.8
              : 0.7;

      return clamp(round(base * speedFactor), 0, 20);
    }

    function waveSurfaceScore(course) {
      if (waveHeight === null) return null;

      const courseScore = courseVenueScore(course);
      const roughMix =
        waveHeight >= 6 ? 0.70
          : waveHeight >= 4 ? 0.55
            : waveHeight >= 2 ? 0.30
              : 0.10;
      const base =
        courseScore * (1 - roughMix) +
        venueFeature.roughWater * roughMix;

      return clamp(round(base * 0.15), 0, 15);
    }

    const rows = sourceAnalyses.map((analysis) => {
      const boatNo = Number(analysis?.boatNo || 0);
      const entry = entryByBoat.get(boatNo) || {};
      const course = getAttackTheoryCourse(entry, boatNo);
      const localWinRate = optionalNumber(
        entry.localWinRate,
        entry.localRate,
        entry.local?.winRate
      );
      const local2Rate = optionalNumber(
        entry.local2Rate,
        entry.localTwoRate,
        entry.local?.twoRate
      );
      const local3Rate = optionalNumber(
        entry.local3Rate,
        entry.localThreeRate,
        entry.local?.threeRate
      );
      const localStarts = optionalNumber(
        entry.localStarts,
        entry.localRaces,
        entry.localRaceCount,
        entry.local?.starts,
        entry.local?.races
      );
      const hasLocalEvidence =
        localWinRate !== null &&
        (local2Rate !== null || local3Rate !== null);
      const hasReliableLocalSample =
        localStarts !== null && localStarts >= 12;
      const isHighReliability =
        localStarts !== null && localStarts >= 30;
      const isFirstCandidate = firstCandidates.has(boatNo);
      const isSecondCandidate = secondCandidates.has(boatNo);
      const isThirdCandidate = thirdCandidates.has(boatNo);
      const isScenarioCandidate =
        isFirstCandidate || isSecondCandidate || isThirdCandidate;
      const isBlocked = blockedBoats.has(boatNo);

      let role = "展開外";
      if (isFirstCandidate) {
        role = course === 1
          ? "逃げ"
          : course === 2
            ? "差し"
            : "攻め";
      } else if (isSecondCandidate) {
        role = "残し";
      } else if (isThirdCandidate) {
        role = "拾い";
      }

      const venueCourse = clamp(
        round(courseVenueScore(course) * 0.30),
        0,
        30
      );
      const windCourseValue = windCourseScore(course);
      const waveSurfaceValue = waveSurfaceScore(course);

      let localResults = 0;
      if (localWinRate !== null) {
        localResults += clamp(round((localWinRate - 3.5) * 2.4), 0, 9);
      }
      if (local2Rate !== null) {
        localResults += clamp(round((local2Rate - 20) * 0.16), 0, 5);
      }
      if (local3Rate !== null) {
        localResults += clamp(round((local3Rate - 35) * 0.16), 0, 6);
      }
      localResults = clamp(localResults, 0, 20);

      const reliability =
        localStarts === null ? 0
          : localStarts >= 30 ? 10
            : localStarts >= 20 ? 8
              : localStarts >= 12 ? 6
                : localStarts >= 6 ? 3
                  : 0;
      const tideTime =
        surface.isTidal && surface.hasLiveTide ? 5 : null;

      const components = [
        { key: "venueCourse", value: venueCourse, max: 30, available: true },
        { key: "windCourse", value: windCourseValue || 0, max: 20, available: windCourseValue !== null },
        { key: "waveSurface", value: waveSurfaceValue || 0, max: 15, available: waveSurfaceValue !== null },
        { key: "localResults", value: localResults, max: 20, available: hasLocalEvidence },
        { key: "reliability", value: reliability, max: 10, available: localStarts !== null },
        { key: "tideTime", value: tideTime || 0, max: 5, available: tideTime !== null }
      ];
      const available = components.filter((item) => item.available);
      const availablePoints = available.reduce((sum, item) => sum + item.max, 0);
      const earnedPoints = available.reduce((sum, item) => sum + item.value, 0);
      const score = availablePoints > 0
        ? round(clamp(earnedPoints / availablePoints * 100, 0, 100))
        : 0;
      const grade = localTheoryGrade(score);
      const hasConditionEvidence =
        windCourseValue !== null || waveSurfaceValue !== null;
      const isFormal =
        Boolean(mainScenario) &&
        hasLocalEvidence &&
        hasReliableLocalSample &&
        hasConditionEvidence;
      const isAdopted =
        isFormal &&
        isScenarioCandidate &&
        !isBlocked &&
        score >= 65;

      let status = "不成立";
      if (!isFormal && isScenarioCandidate) status = "暫定";
      else if (isBlocked) status = "展開除外";
      else if (isAdopted) status = "正式採用";
      else if (score >= 55) status = "参考";
      else status = "適性不足・根拠不足";

      const reasons = [
        `場傾向・進入${venueCourse}/30`,
        windCourseValue === null
          ? "風向・風速は未取得"
          : `風向・風速${windCourseValue}/20`,
        waveSurfaceValue === null
          ? "波高は未取得"
          : `波・荒水面${waveSurfaceValue}/15`,
        hasLocalEvidence
          ? `当地成績${localResults}/20`
          : "当地成績は不足",
        localStarts === null
          ? "当地出走数は未取得"
          : `当地出走信頼度${reliability}/10（${localStarts}走）`,
        tideTime === null
          ? "潮汐は加点対象外または未取得"
          : `潮汐・時間帯${tideTime}/5`
      ];
      if (!hasReliableLocalSample) {
        reasons.push("当地12走未満のため正式採用しない");
      }
      if (!hasConditionEvidence) {
        reasons.push("風・波の実測根拠不足のため暫定");
      }
      if (!isScenarioCandidate) {
        reasons.push("最有力展開の1〜3着候補と不一致");
      }
      if (isBlocked) reasons.push("最有力展開で飛び候補");

      return {
        boatNo,
        playerName: analysis?.playerName || getPlayerName(entry),
        course,
        role,
        score,
        grade,
        status,
        isFormal,
        isAdopted,
        isBlocked,
        isScenarioCandidate,
        isFirstCandidate,
        isSecondCandidate,
        isThirdCandidate,
        hasLocalEvidence,
        hasConditionEvidence,
        hasReliableLocalSample,
        isHighReliability,
        localWinRate,
        local2Rate,
        local3Rate,
        localStarts,
        windSpeed,
        waveHeight,
        windType: wind.type,
        windLabel: wind.label,
        waterType: surface.waterType,
        tideLevel: surface.tideLevel,
        tideFlow: surface.tideFlow,
        availablePoints,
        earnedPoints,
        scenarioType: mainScenario?.type || "",
        scenarioLabel: mainScenario?.label || "",
        components: {
          venueCourse,
          windCourse: windCourseValue,
          waveSurface: waveSurfaceValue,
          localResults,
          reliability,
          tideTime
        },
        reason: reasons.join(" / ")
      };
    });

    const ranking = rows.sort(
      (a, b) =>
        Number(b.isAdopted) - Number(a.isAdopted) ||
        b.score - a.score ||
        a.course - b.course
    );

    return {
      venueName: surface.venueName,
      waterType: surface.waterType,
      wind,
      windSpeed,
      waveHeight,
      tideLevel: surface.tideLevel,
      tideFlow: surface.tideFlow,
      ranking,
      roles: rows,
      isFormal:
        Boolean(mainScenario) &&
        rows.some((boat) => boat.isFormal),
      adoptedBoats: ranking
        .filter((boat) => boat.isAdopted)
        .map((boat) => boat.boatNo),
      scenarioType: mainScenario?.type || "",
      scenarioLabel: mainScenario?.label || "",
      weightPolicy: "既存local枠内・追加加点なし",
      source: "ai-core-local-water-theory-v2"
    };
  }

'''
          core = core[:start] + replacement + core[end:]
          core_path.write_text(core, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace(
              'js/ai-core.js?v=20260723-skill1',
              'js/ai-core.js?v=20260723-localwater2'
          )
          index_path.write_text(index, encoding='utf-8')

          test_path = Path('tools/test-local-water-theory-v2.js')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(r'''"use strict";

const assert = require("assert");
global.window = {};
require("../js/ai-core.js");

const core = global.window.ChappyAICore;
assert(core, "ChappyAICore must load");
assert.strictEqual(
  global.window.ChappyAICoreVersion,
  "ai-core-v4.4.0-local-water-theory-v2"
);

function entries(localStarts = 30) {
  return [1, 2, 3, 4, 5, 6].map((boatNo) => ({
    boatNo,
    course: boatNo,
    playerName: `選手${boatNo}`,
    localWinRate: boatNo === 1 ? 7.2 : 5.8,
    local2Rate: boatNo === 1 ? 52 : 38,
    local3Rate: boatNo === 1 ? 72 : 58,
    localStarts,
    nationalWinRate: 5.5,
    exhibitionTime: 6.80 + boatNo * 0.01,
    lapTime: 37.0 + boatNo * 0.02
  }));
}

function analyses() {
  return [1, 2, 3, 4, 5, 6].map((boatNo) => ({
    boatNo,
    playerName: `選手${boatNo}`,
    indexes: { national: 60, local: 60 },
    roleScores: { road: 60 }
  }));
}

function scenarios() {
  return {
    mainScenario: {
      type: "escape",
      label: "1逃げ",
      outcome: {
        firstCandidates: [1],
        secondCandidates: [2],
        thirdCandidates: [3, 4]
      },
      blockedBoats: []
    },
    blockedBoats: []
  };
}

const omura = core.buildLocalTheory(
  entries(30),
  analyses(),
  {
    stadiumCode: "24",
    stadiumName: "大村",
    weather: {
      windSpeed: 1,
      windDirection: "弱風",
      waveHeight: 1,
      tideLevel: 150,
      tideFlow: "上げ"
    }
  },
  scenarios()
);
assert.strictEqual(omura.source, "ai-core-local-water-theory-v2");
assert.strictEqual(omura.weightPolicy, "既存local枠内・追加加点なし");
assert(omura.roles.find((row) => row.boatNo === 1).score >
       omura.roles.find((row) => row.boatNo === 6).score,
       "大村の弱風では内コースを上位にする");
assert.strictEqual(omura.roles.find((row) => row.boatNo === 1).isFormal, true);

const wakamatsu = core.buildLocalTheory(
  entries(30),
  analyses(),
  {
    stadiumCode: "20",
    stadiumName: "若松",
    weather: {
      windSpeed: 6,
      windDirection: "向かい風",
      waveHeight: 6,
      tideLevel: 110,
      tideFlow: "下げ"
    }
  },
  scenarios()
);
const waka3 = wakamatsu.roles.find((row) => row.boatNo === 3);
const waka6 = wakamatsu.roles.find((row) => row.boatNo === 6);
assert(waka3.components.windCourse > waka6.components.windCourse,
       "向かい風ではセンター攻め適性を優先する");
assert(waka6.components.waveSurface >= 0,
       "荒水面補正を独立計算する");

const lowSample = core.buildLocalTheory(
  entries(8),
  analyses(),
  {
    stadiumCode: "17",
    stadiumName: "宮島",
    weather: {
      windSpeed: 4,
      windDirection: "横風",
      waveHeight: 3,
      tideLevel: 90,
      tideFlow: "上げ"
    }
  },
  scenarios()
);
assert.strictEqual(
  lowSample.roles.find((row) => row.boatNo === 1).isFormal,
  false,
  "12走未満は正式採用しない"
);

const missingWeather = core.buildLocalTheory(
  entries(30),
  analyses(),
  { stadiumCode: "22", stadiumName: "福岡", weather: {} },
  scenarios()
);
const missingRow = missingWeather.roles.find((row) => row.boatNo === 1);
assert.strictEqual(missingRow.hasConditionEvidence, false);
assert.strictEqual(missingRow.isFormal, false);
assert(missingRow.availablePoints < 100,
       "未取得項目を仮の50点で埋めない");

console.log("Local/Water Theory V2 tests passed");
''', encoding='utf-8')

          workflow_path = Path('.github/workflows/pr53-build.yml')
          workflow_path.unlink()
          PY

      - name: Check JavaScript syntax
        run: |
          node --check js/ai-core.js
          node --check tools/test-local-water-theory-v2.js

      - name: Run dedicated tests
        run: node tools/test-local-water-theory-v2.js

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ai-core.js index.html tools/test-local-water-theory-v2.js .github/workflows/pr53-build.yml
          git commit -m "Strengthen local and water theory v2"
          git push origin HEAD:agent/strengthen-local-water-theory-v2
