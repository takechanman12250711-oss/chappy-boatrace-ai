name: Note Browser Draft Contract

on:
  pull_request:
    paths:
      - 'scripts/note-browser-draft-contract.js'
      - 'scripts/test-note-browser-draft-contract.js'
      - '.github/workflows/note-browser-draft-contract.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-note-browser-draft-contract.js
