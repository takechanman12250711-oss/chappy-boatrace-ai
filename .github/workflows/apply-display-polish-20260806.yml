name: Apply display polish 20260806

on:
  push:
    branches:
      - agent/display-polish-20260806

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/display-polish-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply display polish
        run: node scripts/apply-display-polish-20260806.js
      - name: Validate
        run: |
          node --check js/render.js
          node --check js/flow-role-label-fix.js
          grep -q 'render-ui-v3.7.0-display-polish' js/render.js
          grep -q 'ensure all six boat evaluation tabs' js/render.js
          grep -q '通常は5～7点、独立して成立する展開がある場合のみ最大10点' js/render.js
          grep -q 'fourAttack: "4カド攻め"' js/flow-role-label-fix.js
          grep -q 'twoSashi: "2コース差し"' js/flow-role-label-fix.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/render.js
          git commit -m "実戦厳選説明と6艇タブ表示を仕上げる"
          git pull --rebase origin agent/display-polish-20260806
          git push origin HEAD:agent/display-polish-20260806
