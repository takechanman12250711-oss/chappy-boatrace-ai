name: Install reference information tags

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/install-reference-tags.yml"
      - "scripts/install-reference-tags.js"
      - "scripts/test-reference-tags.js"
      - "js/reference-tags.js"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and install
        run: |
          node --check js/reference-tags.js
          node scripts/test-reference-tags.js
          node scripts/install-reference-tags.js

      - name: Save integration
        run: |
          git add index.html

          if git diff --cached --quiet; then
            echo "接続済みのため変更はありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Connect reference information tags"
          git pull --rebase origin main
          git push origin main
