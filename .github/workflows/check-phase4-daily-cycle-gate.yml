name: Check Phase4 daily cycle gate
on:
  pull_request:
    paths:
      - "scripts/build-phase4-daily-cycle-gate.js"
      - "scripts/build-phase4-historical-cycle-proof.js"
      - "scripts/test-phase4-daily-cycle-gate.js"
      - ".github/workflows/check-phase4-daily-cycle-gate.yml"
      - ".github/workflows/collect-predictions.yml"
      - ".github/workflows/collect-results.yml"
      - "scripts/collect-predictions.js"
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node --check scripts/build-phase4-daily-cycle-gate.js
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-result-review.js
          node scripts/test-phase4-daily-cycle-gate.js
          node scripts/build-phase4-daily-cycle-gate.js
