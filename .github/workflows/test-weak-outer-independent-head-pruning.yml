name: Check weak outer independent-head pruning
on:
  pull_request:
    branches: [main]
    paths:
      - 'js/ai-core.js'
      - 'js/boat-identity.js'
      - 'js/evaluated-scenario-candidates.js'
      - 'js/prediction.js'
      - 'js/practical-selection.js'
      - 'data/predictions/202607*.json'
      - 'data/predictions/2026080*.json'
      - 'data/predictions/2026081?.json'
      - 'scripts/test-outer-independent-prune-regression.js'
      - '.github/workflows/test-weak-outer-independent-head-pruning.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-outer-independent-prune-regression.js
