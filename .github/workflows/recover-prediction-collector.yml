name: Recover automatic prediction collector

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recover-prediction-collector.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Minimal preflight
        run: |
          node --check scripts/collect-predictions.js
          node --check api/schedule.js
          node --check api/_schedule-parser.js
          node scripts/test-schedule-parser.js
          node scripts/check-charter.js
      - name: Collect predictions
        env:
          PREDICT_DATE: "20260807"
        run: |
          node scripts/collect-predictions.js
          node scripts/build-scenario-ai-v6-snapshots.js
          node scripts/build-prediction-index.js
          node scripts/build-prediction-summaries.js
      - name: Save recovery output
        if: always()
        run: |
          mkdir -p data/stats
          node - <<'NODE'
          const fs=require('node:fs');
          const path='data/predictions/20260807.json';
          fs.writeFileSync('data/stats/collector-recovery-20260807.json', JSON.stringify({
            generatedAt:new Date().toISOString(),
            predictionFileExists:fs.existsSync(path),
            predictionBytes:fs.existsSync(path)?fs.statSync(path).size:0
          }, null, 2)+'\n');
          NODE
          git add data/predictions data/stats data/notes 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover automatic race prediction collection"
          git pull --rebase origin main
          git push origin main
