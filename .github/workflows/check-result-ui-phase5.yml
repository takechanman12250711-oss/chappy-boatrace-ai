name: Check result UI phase5

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "css/home-dashboard-v2.css"
      - "js/app-runtime-loader.js"
      - "js/home-dashboard-v2.js"
      - "js/auto-stats.js"
      - "js/stats.js"
      - "js/result-ui-phase5.js"
      - "js/stats-runtime-loader.js"
      - "scripts/test-result-ui-phase5.js"
      - "scripts/test-stats-mobile-webkit.mjs"
      - ".github/workflows/check-result-ui-phase5.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify result UI phase5
        run: |
          node --check js/result-ui-phase5.js
          node --check js/stats-runtime-loader.js
          node scripts/test-result-ui-phase5.js
          node --check scripts/test-stats-mobile-webkit.mjs

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/chappy-stats-mobile.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chappy-stats-mobile.log
          exit 1
      - name: Verify saved stats in mobile WebKit
        env:
          APP_URL: http://127.0.0.1:4173/
          STATS_UI_ARTIFACT_DIR: artifacts/stats-mobile
        run: |
          timeout --signal=TERM --kill-after=5s 180s \
            node scripts/test-stats-mobile-webkit.mjs
      - name: Upload mobile stats screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-mobile-webkit
          path: artifacts/stats-mobile/
          if-no-files-found: warn
          retention-days: 7
      - name: Show static server log
        if: always()
        run: cat /tmp/chappy-stats-mobile.log || true
