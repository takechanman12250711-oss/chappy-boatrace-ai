name: Check result UI phase5

on:
  pull_request:
    paths:
      - "index.html"
      - "style.css"
      - "css/home-dashboard-v2.css"
      - "js/app-runtime-loader.js"
      - "js/home-dashboard-v2.js"
      - "js/auto-stats.js"
      - "js/stats.js"
      - "js/result-ui-phase5.js"
      - "js/stats-runtime-loader.js"
      - "scripts/test-result-ui-phase5.js"
      - "scripts/test-stats-mobile-webkit.mjs"
      - ".github/workflows/check-result-ui-phase5.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Determine saved result dates
        id: saved-results-dates
        run: |
          result_date=$(TZ=Asia/Tokyo date +%F)
          echo "today=$(date -d "$result_date" +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "tomorrow=$(date -d "$result_date +1 day" +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          # Non-cone patterns exclude large daily prediction and result archives.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /js/
            /css/
            /config/
            /data/predictions/index-manifest.json
            /data/predictions/index-shards/
            /data/predictions/summaries/
            /data/predictions/improvement-review.json
            /data/stats/race-review-progress.json
            /data/stats/candidate24-report.json
            /data/stats/outer-attack-ticket-central-report-v1.json
            /data/analysis/reference-tag-effectiveness.json
            /data/results/${{ steps.saved-results-dates.outputs.today }}.json
            /data/results/${{ steps.saved-results-dates.outputs.tomorrow }}.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify result UI phase5
        run: |
          node --check js/result-ui-phase5.js
          node --check js/stats-runtime-loader.js
          node scripts/test-result-ui-phase5.js
          node --check scripts/test-stats-mobile-webkit.mjs

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Start local static server
        run: |
          python3 -m http.server 4173 > /tmp/chappy-stats-mobile.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chappy-stats-mobile.log
          exit 1
      - name: Verify saved stats in mobile WebKit
        env:
          APP_URL: http://127.0.0.1:4173/
          STATS_UI_ARTIFACT_DIR: artifacts/stats-mobile
        run: |
          timeout --signal=TERM --kill-after=5s 180s \
            node scripts/test-stats-mobile-webkit.mjs
      - name: Upload mobile stats screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stats-mobile-webkit
          path: artifacts/stats-mobile/
          if-no-files-found: warn
          retention-days: 7
      - name: Show static server log
        if: always()
        run: cat /tmp/chappy-stats-mobile.log || true
