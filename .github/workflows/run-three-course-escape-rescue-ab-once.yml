name: Run three-course escape rescue A/B once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/run-three-course-escape-rescue-ab-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: analysis/three-course-escape-rescue-ab-20260823
    steps:
      - name: Checkout analysis branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all

      - name: Build A/B report
        run: |
          node --check scripts/build-three-course-escape-rescue-ab.js
          node scripts/build-three-course-escape-rescue-ab.js
          git diff --check

      - name: Commit report and remove one-time workflow
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/three-course-escape-rescue-ab-report.json
          git rm .github/workflows/run-three-course-escape-rescue-ab-once.yml
          git commit -m "Build three-course escape rescue A/B report"
          git push origin "HEAD:${TARGET_BRANCH}"
