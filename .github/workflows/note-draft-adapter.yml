name: Note Draft Adapter

on:
  pull_request:
    paths:
      - 'scripts/note-draft-adapter.js'
      - 'scripts/test-note-draft-adapter.js'
      - 'scripts/run-note-draft-adapter-tests.js'
      - 'docs/note-draft-adapter.md'
      - '.github/workflows/note-draft-adapter.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/run-note-draft-adapter-tests.js
