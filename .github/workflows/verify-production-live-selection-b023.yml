name: Verify production live selection b023

on:
  pull_request:
    paths:
      - ".github/workflows/verify-production-live-selection-b023.yml"
      - "scripts/verify-production-live-selection-b023.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for GitHub Pages to serve merged main
        env:
          APP_URL: https://takechanman12250711-oss.github.io/chappy-boatrace-ai/
        run: |
          for attempt in $(seq 1 24); do
            html="$(curl --fail --silent --show-error \
              "${APP_URL}?verify=b023-${GITHUB_RUN_ID}-${attempt}" || true)"
            if printf '%s' "$html" | grep -q \
              'js/live-race-selection-terminal-guard.js?v=20260825-live-selection-terminal2'; then
              echo "GitHub Pages is serving merged main"
              exit 0
            fi
            echo "Pages not updated yet: attempt ${attempt}/24"
            sleep 15
          done
          echo "GitHub Pages did not expose merged main within 6 minutes"
          exit 1

      - name: Check verifier syntax
        run: node --check scripts/verify-production-live-selection-b023.mjs

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Verify production in iPhone WebKit
        env:
          APP_URL: https://takechanman12250711-oss.github.io/chappy-boatrace-ai/
          RACE_PLACE: 桐生
          RACE_NO: "1"
          EXPECTED_DATE: "20260825"
          TIMEOUT_MS: "150000"
        run: node scripts/verify-production-live-selection-b023.mjs

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-live-selection-b023
          path: production-live-selection-b023.png
          if-no-files-found: warn
          retention-days: 7
