name: Check head miss internal candidate audit
on:
  pull_request:
    paths:
      - 'scripts/analyze-head-miss-internal-candidate-audit.js'
      - '.github/workflows/check-head-miss-internal-candidate-audit.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-head-miss-internal-candidate-audit.js
      - run: node scripts/analyze-head-miss-internal-candidate-audit.js
