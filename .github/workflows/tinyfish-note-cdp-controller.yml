name: TinyFish Note CDP Controller

on:
  pull_request:
    paths:
      - 'scripts/tinyfish-note-cdp-controller.js'
      - 'scripts/test-tinyfish-note-cdp-controller.js'
      - 'scripts/tinyfish-note-profile-orchestrator.js'
      - 'scripts/test-tinyfish-note-profile-orchestrator.js'
      - '.github/workflows/tinyfish-note-cdp-controller.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-tinyfish-note-cdp-controller.js
      - run: node scripts/test-tinyfish-note-profile-orchestrator.js
