name: Check scenario AI v6 rollout

on:
  pull_request:
    paths:
      - "data/config/scenario-ai-v6-rollout.json"
      - "scripts/build-scenario-ai-v6-rollout-status.js"
      - "scripts/test-scenario-ai-v6-rollout-status.js"
      - ".github/workflows/check-scenario-ai-v6-rollout.yml"
      - ".github/workflows/collect-results.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify scenario AI v6 rollout
        run: |
          node --check scripts/build-scenario-ai-v6-rollout-status.js
          node scripts/test-scenario-ai-v6-rollout-status.js
