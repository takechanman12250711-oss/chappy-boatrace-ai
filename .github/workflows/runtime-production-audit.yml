name: Runtime production audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "scripts/audit-runtime-production.js"
      - ".github/workflows/runtime-production-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    if: github.head_ref == 'agent/runtime-production-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run runtime and production audit
        run: node scripts/audit-runtime-production.js
      - name: Commit audit report
        run: |
          git add runtime-production-audit-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "実操作・API・保存データ監査結果を保存"
          git push origin HEAD:${{ github.head_ref }}
