name: Run new-head prospective shadow

on:
  pull_request:
    paths:
      - 'scripts/forward-research-input-projection.cjs'
      - 'scripts/report-input-projection.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'scripts/analyze-ticket-expansion-payout-v2.cjs'
      - 'scripts/run-new-head-prospective-shadow.cjs'
      - '.github/workflows/run-new-head-prospective-shadow.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 15 * * *'
  push:
    branches:
      - main
      - analysis/new-head-prospective-shadow
    paths:
      - 'scripts/forward-research-input-projection.cjs'
      - 'scripts/report-input-projection.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - 'scripts/analyze-ticket-expansion-payout-v2.cjs'
      - 'scripts/run-new-head-prospective-shadow.cjs'
      - '.github/workflows/run-new-head-prospective-shadow.yml'

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run prospective shadow
        run: node scripts/run-new-head-prospective-shadow.cjs > new-head-prospective-shadow-output.json
      - name: Upload shadow output
        uses: actions/upload-artifact@v4
        with:
          name: new-head-prospective-shadow
          path: new-head-prospective-shadow-output.json
