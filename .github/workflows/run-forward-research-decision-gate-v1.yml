name: Run forward research decision gate v1

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *'
  pull_request:
    paths:
      - 'scripts/evaluate-forward-research-decision-gate-v1.cjs'
      - 'scripts/build-forward-research-scoreboard-v1.cjs'
      - '.github/workflows/run-forward-research-decision-gate-v1.yml'
      - 'data/predictions/202609*.json'

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Evaluate precommitted forward research gate
        run: node scripts/evaluate-forward-research-decision-gate-v1.cjs > forward-research-decision-gate-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('forward-research-decision-gate-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.commonSettledRaceCount < 50 && r.status !== 'collecting') process.exit(1);
          console.log(JSON.stringify({commonSettledRaceCount:r.commonSettledRaceCount,reachedGate:r.reachedGate,status:r.status,thresholds:r.thresholds,recommendation:r.recommendation},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: forward-research-decision-gate-v1
          path: forward-research-decision-gate-v1.json
          retention-days: 90
