name: Check four to one head miss
on:
  pull_request:
    paths:
      - 'scripts/analyze-four-to-one-head-miss.js'
      - '.github/workflows/check-four-to-one-head-miss.yml'
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-four-to-one-head-miss.js
      - run: node scripts/analyze-four-to-one-head-miss.js
