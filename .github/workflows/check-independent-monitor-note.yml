name: Check independent monitor note source
on:
  pull_request:
    paths:
      - "scripts/note-article-series*"
      - "scripts/save-independent-monitor-note.js"
      - "scripts/independent-monitor-decision*"
      - "scripts/audit-independent-monitor-decisions.cjs"
      - "scripts/note-independent-monitor-fixture.js"
      - 'scripts/note-independent-monitor-source*'
      - 'scripts/note-publication-source.js'
      - '.github/workflows/check-independent-monitor-note.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            js
            config
            assets/note
            data/note-publish
            data/note-drafts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test unchanged originals and existing publication protections
        run: |
          node --test scripts/independent-monitor-decision.test.cjs
          node scripts/note-independent-monitor-source.test.js
          node scripts/note-publication-source.test.js
          node --test scripts/note-article-series.test.js
          node scripts/note-github-ui-transport.test.js
          node scripts/note-cover-template.test.js
          node scripts/note-editor-content.test.js

