name: Compact prediction index once 20260808

on:
  push:
    branches:
      - chappy/compact-index-growth-20260808
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappy/compact-index-growth-20260808
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify compactor
        run: |
          node --check scripts/compact-prediction-index.js
          node scripts/test-compact-prediction-index.js
      - name: Compact current index
        run: |
          node scripts/compact-prediction-index.js
          node scripts/test-load-performance.js
      - name: Save compacted index
        run: |
          git add data/predictions/index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Compact prediction index growth"
          git pull --rebase origin chappy/compact-index-growth-20260808
          git push origin HEAD:chappy/compact-index-growth-20260808
