name: Check restored fixed5 pair 4-1 conditional A/B

on:
  pull_request:
    paths:
      - 'scripts/ab-fixed5-pair-41-conditional-restored.js'
      - '.github/workflows/check-fixed5-pair-41-conditional-restored-ab.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/ab-fixed5-pair-41-conditional-restored.js
      - run: node scripts/ab-fixed5-pair-41-conditional-restored.js
      - name: Validate restored conditional A/B artifact
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const assert = require("node:assert/strict");
          const report = JSON.parse(
            fs.readFileSync(
              "fixed5-pair-41-conditional-restored-ab.json",
              "utf8"
            )
          );
          assert.deepEqual(report.thresholds, {
            st: -0.1810457516339869,
            ex: -5.056633986928102,
            flow: -9.793202614379082,
            attack: -0.7529084967320272,
            hold: -10.837777777777777,
            pickup: -3.392287581699347,
          });
          assert.equal(report.allChecksPassed, true);
          assert.equal(report.holdoutStart, "20260812");
          assert.deepEqual(report.expectedSourceParity, {
            discovery: {
              allSettledFixed5: 867,
              eligibleCurrentShape: 829,
              basePortfolioHits: 212,
            },
            holdout: {
              allSettledFixed5: 799,
              eligibleCurrentShape: 758,
              basePortfolioHits: 196,
            },
          });
          for (const period of Object.values(report.periods)) {
            assert.ok(Object.values(period.checks).every(Boolean));
          }
          assert.deepEqual(Object.keys(report.variants), ["4/6", "5/6", "6/6"]);
          const expectedCandidates = [];
          for (const [variantName, result] of Object.entries(report.variants)) {
            assert.equal(typeof result.stablePositive, "boolean");
            for (const [periodName, current] of Object.entries({
              discovery: result.discovery,
              holdout: result.holdout,
            })) {
              for (const value of [
                current.evaluable,
                current.triggered,
                current.changed,
                current.baseHits,
                current.bHits,
                current.hitDelta,
                current.basePayout,
                current.bPayout,
                current.payoutDelta,
                current.improved,
                current.harmed,
                current.improvedPayout,
                current.harmedPayout,
              ]) {
                assert.equal(Number.isFinite(value), true);
              }
              assert.equal(current.changed, current.triggered);
              assert.equal(
                current.triggered,
                current.improved +
                  current.harmed +
                  current.neutralHit +
                  current.neutralMiss
              );
              assert.equal(
                current.hitDelta,
                current.improved - current.harmed
              );
              assert.equal(
                current.payoutDelta,
                current.improvedPayout - current.harmedPayout
              );
              assert.equal(
                current.sampleGatePassed,
                current.triggered >= (periodName === "discovery" ? 30 : 20)
              );
              assert.equal(
                current.portfolioB.hits - current.portfolioA.hits,
                current.hitDelta
              );
              assert.equal(
                current.portfolioB.payoutSum - current.portfolioA.payoutSum,
                current.payoutDelta
              );
            }
            const expectedStable =
              result.discovery.sampleGatePassed &&
              result.holdout.sampleGatePassed &&
              result.discovery.hitDelta > 0 &&
              result.holdout.hitDelta > 0 &&
              result.discovery.payoutDelta >= 0 &&
              result.holdout.payoutDelta >= 0;
            assert.equal(result.stablePositive, expectedStable);
            if (expectedStable) expectedCandidates.push(variantName);
          }
          assert.deepEqual(report.adoptionCandidates, expectedCandidates);
          for (const periodName of ["discovery", "holdout"]) {
            assert.ok(
              report.variants["4/6"][periodName].triggered >=
                report.variants["5/6"][periodName].triggered
            );
            assert.ok(
              report.variants["5/6"][periodName].triggered >=
                report.variants["6/6"][periodName].triggered
            );
          }
          assert.equal(
            report.eligibleUnderHistoricalAdoptionGate,
            report.allChecksPassed && report.adoptionCandidates.length > 0
          );
          assert.equal(
            report.selectedCandidate,
            report.allChecksPassed
              ? report.adoptionCandidates[0] || null
              : null
          );
          assert.equal(report.notes.productionChanged, false);
          assert.equal(report.notes.oddsUsed, false);
          assert.equal(report.notes.fixed5Maintained, true);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixed5-pair-41-conditional-restored-ab
          path: fixed5-pair-41-conditional-restored-ab.json
          if-no-files-found: error
