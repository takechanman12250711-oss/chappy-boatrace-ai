name: Apply note role conflict scope

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-note-role-conflict-scope.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-note-role-conflict-scope
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply focused patch
        run: node scripts/apply-note-role-conflict-scope.js

      - name: Check and test
        run: |
          node --check js/note-generator.js
          node scripts/test-note-role-conflict-scope.js
          node scripts/test-note-copy-cleanup.js
          node scripts/test-theory-integration.js
          node scripts/check-charter.js

      - name: Keep validated source and test only
        run: |
          rm scripts/apply-note-role-conflict-scope.js
          rm .github/workflows/apply-note-role-conflict-scope.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/note-generator.js scripts/test-note-role-conflict-scope.js scripts/apply-note-role-conflict-scope.js .github/workflows/apply-note-role-conflict-scope.yml
          git commit -m "note役割重複判定を同一展開内に限定"
          git push origin HEAD:main

# trigger validated one-time application v2
