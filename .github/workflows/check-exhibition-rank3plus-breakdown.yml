name: Check exhibition rank3plus breakdown

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-exhibition-rank3plus-breakdown.js"
      - "scripts/build-exhibition-foot-branch-report.js"
      - "scripts/test-breakdown-writer-contract.js"
      - "scripts/restore-daily-prediction-source.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/check-exhibition-rank3plus-breakdown.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-exhibition-rank3plus-breakdown.js"
      - "scripts/build-exhibition-foot-branch-report.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - "data/results/*.json"
      - ".github/workflows/check-exhibition-rank3plus-breakdown.yml"
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  breakdown:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore canonical prediction sources
        if: github.event_name != 'pull_request'
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Verify exhibition rank3plus breakdown
        run: |
          node --check scripts/build-exhibition-rank3plus-breakdown.js
          node scripts/test-breakdown-writer-contract.js
      - name: Build read-only real diagnostics
        if: github.event_name != 'pull_request'
        run: |
          node scripts/build-exhibition-rank3plus-breakdown.js
          git diff --check
