name: Note Browserbase Draft Save

on:
  workflow_dispatch:
    inputs:
      bundle_path:
        description: 'Repository path to a saved note draft bundle JSON'
        required: true
        type: string

permissions:
  contents: read

jobs:
  save-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      BROWSERBASE_PROJECT_ID: ${{ secrets.BROWSERBASE_PROJECT_ID }}
      BROWSERBASE_CONTEXT_ID: ${{ secrets.BROWSERBASE_CONTEXT_ID }}
      X_LOGIN_ID: ${{ secrets.X_LOGIN_ID }}
      X_PASSWORD: ${{ secrets.X_PASSWORD }}
      NOTE_DRAFT_BUNDLE_PATH: ${{ inputs.bundle_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CDP client
        run: npm install --no-save playwright-core@1.55.0
      - name: Verify draft saver
        run: node scripts/note-browserbase-draft-save.test.js
      - name: Save note draft only
        run: node scripts/note-browserbase-draft-save.js "$NOTE_DRAFT_BUNDLE_PATH"
