name: Check scenario AI v6 adoption review

on:
  pull_request:
    paths:
      - "scripts/build-scenario-ai-v6-adoption-review.js"
      - "scripts/test-scenario-ai-v6-adoption-review.js"
      - ".github/workflows/check-scenario-ai-v6-adoption-review.yml"
      - ".github/workflows/collect-results.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify scenario AI v6 adoption review
        run: |
          node --check scripts/build-scenario-ai-v6-adoption-review.js
          node scripts/test-scenario-ai-v6-adoption-review.js
          node scripts/check-charter.js
