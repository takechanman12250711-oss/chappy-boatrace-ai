name: Check outer attack forward validation
on:
  pull_request:
    paths:
      - 'scripts/analyze-outer-attack-forward-validation.cjs'
      - 'tests/outer-attack-forward-validation.test.cjs'
      - '.github/workflows/check-outer-attack-forward-validation.yml'
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/outer-attack-forward-validation.test.cjs
      - run: node scripts/analyze-outer-attack-forward-validation.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
