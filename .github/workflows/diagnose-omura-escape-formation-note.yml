name: Diagnose Omura escape formation and note alignment
on:
  push:
    branches: [diagnosis/omura-escape-formation-note-20261003]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build read-only diagnosis
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const input=require('./scripts/analysis-input-contract');
          const ledger=require('./data/stats/continuous-performance-ledger.json');
          const source=require('./scripts/eight-ticket-promotion-report-source.cjs');
          const helpers=require('./scripts/build-continuous-performance-ledger.cjs');
          const rows=ledger.rows.slice(-100), keys=new Set(rows.map(x=>x.raceKey));
          const canonical=new Map();
          for(const date of [...new Set(rows.map(x=>x.raceKey.slice(0,8)))]) {
            const d=source.readDay(process.cwd(),date).data;
            for(const r of input.mergePredictionSources(d.predictions,d.verificationPredictions)) canonical.set(input.raceKey(r),r);
          }
          function tickets(p){return helpers.practicalTickets(p.prediction||p).map(x=>typeof x==='string'?x:x.ticket)}
          function sig(ts){return [...ts].sort().join('|')}
          function heads(ts){return [...new Set(ts.map(t=>t[0]))].sort().join('')}
          function formationLike(ts){
            const groups={}; for(const t of ts){const [a,b,c]=t.split('-');(groups[a+'-'+b]??=[]).push(c)}
            return Object.values(groups).some(v=>new Set(v).size>=3);
          }
          const details=rows.map(r=>{const p=canonical.get(r.raceKey); const ts=p?tickets(p):[]; const pred=p?.prediction||p||{};
            const scenarios=pred.raceScenarios||pred.scenarios||pred.evaluatedScenarios||{};
            return {raceKey:r.raceKey,jcd:r.raceKey.split('-')[1],actual:r.actualTicket,hit:r.hit,tickets:ts,signature:sig(ts),heads:heads(ts),
              allHead1:ts.length>0&&ts.every(t=>t[0]==='1'),formationLike:formationLike(ts),
              strongEscape:pred.practicalSelection?.strongEscapeTrim||pred.practicalSelection?.strongEscapeTrimPlan||null,
              mainScenario:scenarios.mainScenario||null};
          });
          function stats(xs){
            const counts={}; xs.forEach(x=>counts[x.signature]=(counts[x.signature]||0)+1);
            const repeated=Object.values(counts).filter(n=>n>1).reduce((a,n)=>a+n,0);
            const head1=xs.filter(x=>x.allHead1), form=xs.filter(x=>x.formationLike);
            return {races:xs.length,hits:xs.filter(x=>x.hit).length,allHead1Races:head1.length,allHead1Rate:xs.length?+(100*head1.length/xs.length).toFixed(1):0,
              formationLikeRaces:form.length,formationLikeRate:xs.length?+(100*form.length/xs.length).toFixed(1):0,
              exactRepeatedSignatureRaces:repeated,exactRepeatedSignatureRate:xs.length?+(100*repeated/xs.length).toFixed(1):0,
              uniqueTicketSets:Object.keys(counts).length,topRepeated:Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10)};
          }
          const omura=details.filter(x=>x.jcd==='24');
          const out={generatedAt:new Date().toISOString(),productionChanged:false,automaticApplication:false,
            population:{rolling100:stats(details),omura:stats(omura)},
            omuraDetails:omura,
            definitions:{allHead1:'every saved practical ticket starts with boat 1',formationLike:'at least one fixed 1st-2nd prefix has 3+ saved third-place boats',exactRepeatedSignature:'identical unordered saved practical-ticket set appears in 2+ races'},
            notePolicyAudit:{status:'POLICY_ONLY_NO_PUBLISH_CHANGE',required:'note must use the same saved pre-race scenario/tickets; formation expansion must not be counted as scenario-reading success'},
            caveat:'This measures saved-ticket sameness in the frozen rolling100 only. It does not prove causation or authorize a production/note logic change.'};
          fs.mkdirSync('tmp-diagnosis',{recursive:true});fs.writeFileSync('tmp-diagnosis/omura-escape-formation-note.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out.population));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: omura-escape-formation-note
          path: tmp-diagnosis/omura-escape-formation-note.json
          if-no-files-found: error
