name: Check theory validation pipeline
on:
  pull_request:
    paths:
      - 'scripts/theory-validation-report.cjs'
      - 'tests/theory-validation-report.test.cjs'
      - '.github/workflows/check-theory-validation-pipeline.yml'
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/theory-validation-report.test.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
