name: Run third-place rank8 goodscore forward v1
on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
  pull_request:
    paths:
      - 'scripts/audit-third-place-rank8-goodscore-forward-v1.cjs'
      - '.github/workflows/run-third-place-rank8-goodscore-forward-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run preregistered forward audit
        run: node scripts/audit-third-place-rank8-goodscore-forward-v1.cjs > third-place-rank8-goodscore-forward-v1.json
      - name: Validate frozen research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('third-place-rank8-goodscore-forward-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.frozenRule.rank!==8||r.frozenRule.prefixMustExistInBaseline7!==true) process.exit(1);
          console.log(JSON.stringify({settled:r.settledRaceCountAfterActivation,eligible:r.eligibleAddedTickets,rescues:r.rescueCount,roi:r.roiPercent,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: third-place-rank8-goodscore-forward-v1
          path: third-place-rank8-goodscore-forward-v1.json
          retention-days: 90
