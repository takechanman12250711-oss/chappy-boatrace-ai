name: Run role ticket special trigger v1

on:
  workflow_dispatch:
  schedule:
    - cron: '45 15 * * *'
  pull_request:
    paths:
      - 'scripts/analyze-role-ticket-special-trigger-v1.cjs'
      - '.github/workflows/run-role-ticket-special-trigger-v1.yml'
      - 'data/predictions/202609*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run special trigger audit
        run: node scripts/analyze-role-ticket-special-trigger-v1.cjs > role-ticket-special-trigger-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('role-ticket-special-trigger-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({eligibleSettledRaceCount:r.eligibleSettledRaceCount,triggers:r.triggers,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: role-ticket-special-trigger-v1
          path: role-ticket-special-trigger-v1.json
          retention-days: 90
