name: Check theory evaluation engine

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Apply approved scenario-specific safety patch
        run: node scripts/tmp-apply-scenario-specific-safety.js
      - name: Validate production path
        run: |
          node --check js/ai-core.js
          node scripts/test-scenario-specific-safety-hold.js
          node scripts/test-scenario-formations.js
          node scripts/check-charter.js
      - name: Commit production patch when needed
        run: |
          if git diff --quiet -- js/ai-core.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ai-core.js
          git commit -m "Use scenario-specific hold pickup for safety heads"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
