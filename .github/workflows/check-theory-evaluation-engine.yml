name: Check theory evaluation engine

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Update safety odds regression
        run: node scripts/tmp-fix-safety-odds-regression.js
      - name: Validate scenario-specific safety production path
        run: |
          node --check js/ai-core.js
          node scripts/test-scenario-specific-safety-hold.js
          node scripts/test-ai-core-formations.js
          node scripts/test-scenario-formations.js
          node scripts/check-charter.js
      - name: Commit regression update when needed
        run: |
          if git diff --quiet -- scripts/test-ai-core-formations.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/test-ai-core-formations.js
          git commit -m "Make safety odds regression follow generated cover"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
