name: Check theory evaluation engine

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate theory evaluation engine
        run: |
          node --check js/theory-evaluation-engine.js
          node --check scripts/build-theory-evaluations.js
          node --check scripts/test-theory-evaluation-engine.js
          node scripts/test-theory-evaluation-engine.js
          node scripts/check-charter.js
      - name: Audit post-308 remaining misses
        run: node scripts/tmp-audit-post308-misses.js
      - name: Locate exact tickets outside basic five
        run: node scripts/tmp-audit-post308-exact-location.js
      - name: Measure actual practical selection
        run: node scripts/tmp-audit-post308-practical-selection.js
      - name: Classify practical selection gap
        run: node scripts/tmp-audit-post308-selection-gap.js
      - name: Simulate structured candidate-only promotion
        run: node scripts/tmp-audit-candidate-only-promotion.js
