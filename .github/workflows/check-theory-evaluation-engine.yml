name: Check theory evaluation engine

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/theory-evaluation-engine-phase1]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate theory evaluation engine
        run: |
          node --check js/theory-evaluation-engine.js
          node --check scripts/build-theory-evaluations.js
          node --check scripts/test-theory-evaluation-engine.js
          node scripts/test-theory-evaluation-engine.js
          node scripts/check-charter.js
      - name: Temporary post-305 head miss audit
        run: node scripts/tmp-audit-post305-head-misses.js
      - name: Temporary outside-head rule search
        run: node scripts/tmp-search-outside-head-rules.js
      - name: Temporary second 2-sashi rule search
        run: node scripts/tmp-search-second-sashi-rule.js
      - name: Temporary head-miss ticket coverage audit
        run: node scripts/tmp-audit-head-miss-ticket-coverage.js
      - name: Temporary safety head/combination audit
        run: node scripts/tmp-audit-safety-head-combination.js
      - name: Temporary safety diversification comparison
        run: node scripts/tmp-compare-safety-diversification.js
