name: Update practical priority report once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/update-practical-priority-report-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: chore/archive-idempotency-ci-20260823
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild canonical practical priority report
        run: |
          node scripts/build-practical-priority-shadow-report.js
          node scripts/test-practical-priority-shadow-report.js
          node scripts/test-practical-priority-shadow-artifact.js
          git diff --check

      - name: Commit report and remove one-time workflow
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/practical-priority-shadow-report.json
          git rm .github/workflows/update-practical-priority-report-once.yml
          git commit -m "Refresh practical priority shadow report from canonical records"
          git push origin "HEAD:${TARGET_BRANCH}"
