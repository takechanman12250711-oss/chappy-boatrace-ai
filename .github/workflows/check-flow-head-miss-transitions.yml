name: Check flow head miss transitions
on:
  pull_request:
    paths:
      - 'scripts/analyze-flow-head-miss-transitions.js'
      - '.github/workflows/check-flow-head-miss-transitions.yml'
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-flow-head-miss-transitions.js
      - run: node scripts/analyze-flow-head-miss-transitions.js
