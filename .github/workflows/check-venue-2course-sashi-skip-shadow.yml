name: Check venue 2course sashi prospective shadow

on:
  pull_request:
    paths:
      - "scripts/build-race-flow-2course-sashi-skip-ab-report.js"
      - "scripts/test-race-flow-2course-sashi-skip-ab-report.js"
      - "scripts/build-venue-2course-sashi-skip-shadow.js"
      - "scripts/test-venue-2course-sashi-skip-shadow.js"
      - "scripts/test-race-flow-ab-workflow-concurrency.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/check-venue-2course-sashi-skip-shadow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify fixed venue prospective shadow
        run: |
          node --check scripts/build-race-flow-2course-sashi-skip-ab-report.js
          node scripts/test-race-flow-2course-sashi-skip-ab-report.js
          node --check scripts/build-venue-2course-sashi-skip-shadow.js
          node scripts/test-venue-2course-sashi-skip-shadow.js
          node scripts/test-race-flow-ab-workflow-concurrency.js
      - name: Build real-data shadow artifact
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-venue-2course-sashi-skip-shadow.js
          node - <<'NODE'
          const report = require("./data/stats/venue-2course-sashi-skip-shadow.json");
          if (report.version !== "venue-race-flow-2course-sashi-skip-ab-v1-prospective") throw new Error("場別2差しshadowの版が違います");
          if (report.baseRuleVersion !== "race-flow-2course-sashi-skip-ab-v1-prospective") throw new Error("固定済み基準ルールを再利用していません");
          if (report.preregistration?.cutoffSelectedAtInclusive !== "2026-09-21T00:00:00.000Z") throw new Error("将来holdoutの開始時刻が違います");
          if (report.preregistration?.oldRecordsBackfilled !== false || report.preregistration?.discoveryRowsUsableForValidation !== false) throw new Error("発見期間の再利用を禁止できていません");
          if (report.productionChanged !== false || report.automaticProductionChange !== false || report.usableForPrediction !== false) throw new Error("本番安全フラグ異常");
          if ((report.byVenue || []).map(row => row.jcd).join(",") !== "01,18") throw new Error("対象場が桐生・徳山に固定されていません");
          if (report.interpretation?.automaticApplication !== false || report.interpretation?.automaticPhase8Handoff !== false) throw new Error("自動採用が禁止されていません");
          NODE
          node scripts/check-charter.js
      - uses: actions/upload-artifact@v4
        with:
          name: venue-2course-sashi-prospective-shadow
          path: data/stats/venue-2course-sashi-skip-shadow.json
          if-no-files-found: error
