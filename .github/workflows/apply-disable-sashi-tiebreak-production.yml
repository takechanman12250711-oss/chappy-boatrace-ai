name: Apply disable sashi tiebreak production
on:
  pull_request:
    paths:
      - 'scripts/apply-disable-sashi-tiebreak-production.js'
      - '.github/workflows/apply-disable-sashi-tiebreak-production.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/apply-disable-sashi-tiebreak-production.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/ai-core.js scripts/build-sashi-core-post-adoption-monitor.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: disable sashi skill tiebreak after post-adoption loss'
          git push
