name: Build continuous performance ledger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-continuous-performance-ledger.yml
      - scripts/build-continuous-performance-ledger.cjs
      - scripts/persist-continuous-performance-ledger.cjs
      - tests/continuous-performance-ledger.test.cjs
      - tests/continuous-ledger-persistence.test.cjs
  workflow_run:
    workflows:
      - Collect official race results
      - Collect automatic race predictions
    types: [completed]
permissions:
  contents: write
concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Collect automatic race predictions' && 'eight-ticket-capture-report' || 'continuous-performance-ledger' }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.name == 'Collect official race results' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 20
      - run: node tests/continuous-performance-ledger.test.cjs
      - name: Persist ledger from current main
        run: node scripts/persist-continuous-performance-ledger.cjs
      - name: Build separate eight-ticket promotion shadow report
        id: shadow_report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -f data/stats/eight-ticket-promotion-shadow-report.json
          node scripts/build-eight-ticket-promotion-shadow-report.cjs
      - name: Preserve separate eight-ticket shadow report
        if: ${{ !cancelled() && steps.shadow_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eight-ticket-promotion-shadow-report
          path: data/stats/eight-ticket-promotion-shadow-report.json
          if-no-files-found: error

      - name: Build separate C exhibition comparison
        id: c_report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -f data/stats/eight-ticket-exhibition-shadow-report.json
          node scripts/build-eight-ticket-exhibition-shadow-report.cjs
      - name: Preserve separate C exhibition comparison
        if: ${{ !cancelled() && steps.c_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eight-ticket-exhibition-shadow-report
          path: data/stats/eight-ticket-exhibition-shadow-report.json
          if-no-files-found: error

  capture-report:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Collect automatic race predictions' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 20
      - name: Refresh shadow progress after prediction collection
        run: node scripts/build-eight-ticket-promotion-shadow-report.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: eight-ticket-promotion-shadow-report
          path: data/stats/eight-ticket-promotion-shadow-report.json
          if-no-files-found: error
      - name: Build separate C exhibition comparison
        id: c_report
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: |
          rm -f data/stats/eight-ticket-exhibition-shadow-report.json
          node scripts/build-eight-ticket-exhibition-shadow-report.cjs
      - name: Preserve separate C exhibition comparison
        if: ${{ !cancelled() && steps.c_report.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: eight-ticket-exhibition-shadow-report
          path: data/stats/eight-ticket-exhibition-shadow-report.json
          if-no-files-found: error
