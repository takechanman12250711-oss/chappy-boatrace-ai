name: Build continuous performance ledger
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-hit-first-practical-report.cjs
      - scripts/hit-first-selection-diagnostics.cjs
      - scripts/eight-ticket-promotion-report-source.cjs
      - scripts/build-race-review-progress.js
      - scripts/build-four-stage-miss-diagnosis.cjs
      - tests/hit-first-practical-report.test.cjs
      - tests/eight-ticket-promotion-report-source.test.cjs
      - .github/workflows/build-continuous-performance-ledger.yml
      - scripts/build-continuous-performance-ledger.cjs
      - scripts/persist-continuous-performance-ledger.cjs
      - tests/continuous-performance-ledger.test.cjs
      - tests/continuous-ledger-persistence.test.cjs
  workflow_run:
    workflows:
      - Collect official race results
    types: [completed]
permissions:
  contents: write
concurrency:
  group: continuous-performance-ledger
  queue: max
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.workflow_run.name == 'Collect official race results' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 20
      - run: node tests/continuous-performance-ledger.test.cjs
      - name: Persist ledger from current main
        id: persist
        run: node scripts/persist-continuous-performance-ledger.cjs
      - name: Use the published ledger and matching inputs for reports
        if: steps.persist.outcome == 'success'
        env:
          REPORT_COMMIT: ${{ steps.persist.outputs.report_commit }}
        run: git checkout --detach "$REPORT_COMMIT"
      - name: Build four-stage miss diagnosis without changing predictions
        id: four_stage
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/build-four-stage-miss-diagnosis.cjs > data/stats/four-stage-miss-diagnosis.json
      - name: Preserve four-stage miss diagnosis
        if: ${{ !cancelled() && steps.four_stage.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: four-stage-miss-diagnosis
          path: data/stats/four-stage-miss-diagnosis.json
          if-no-files-found: error
      - name: Build hit-first report without changing predictions
        id: hit_first
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.node.outcome == 'success' }}
        continue-on-error: true
        run: node scripts/build-hit-first-practical-report.cjs
      - name: Preserve hit-first report including incomplete diagnostics
        if: ${{ !cancelled() && steps.hit_first.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: hit-first-practical-report
          path: data/stats/hit-first-practical-report.json
          if-no-files-found: warn
