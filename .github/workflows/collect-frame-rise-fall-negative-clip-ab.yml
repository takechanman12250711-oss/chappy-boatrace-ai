name: Collect frame rise fall negative clip A/B

on:
  pull_request:
    paths:
      - "scripts/frame-shadow-save-handoff.cjs"
      - "tests/frame-shadow-save-handoff.test.cjs"
      - "scripts/test-phase3-refresh-contract.js"
      - ".github/workflows/collect-frame-rise-fall-shadow-ab.yml"
      - "config/frame-rise-fall-negative-clip-trial.json"
      - "js/frame-rise-fall-negative-clip-shadow.js"
      - "scripts/build-frame-rise-fall-negative-clip-snapshots.js"
      - "scripts/build-frame-rise-fall-negative-clip-result-report.js"
      - "scripts/test-frame-rise-fall-negative-clip-shadow.js"
      - "scripts/test-frame-rise-fall-negative-clip-snapshots.js"
      - "scripts/test-frame-rise-fall-negative-clip-result-report.js"
      - ".github/workflows/collect-frame-rise-fall-negative-clip-ab.yml"
      - "scripts/generated-data-checkpoint.cjs"
      - "tests/generated-data-checkpoint.test.cjs"
  workflow_run:
    workflows:
      - "Collect frame rise fall shadow A/B"
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "対象日（YYYYMMDD・空欄なら本日）"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: negative-clip-compute-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  queue: max
  cancel-in-progress: false

jobs:
  verify-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      capture_allowed: ${{ steps.ready.outputs.allowed }}
      source_sha: ${{ steps.checkpoint.outputs.baseSha }}
      capture_run_id: ${{ steps.checkpoint.outputs.runId }}
      capture_attempt: ${{ steps.checkpoint.outputs.runAttempt }}
      checkpoint_date: ${{ steps.checkpoint.outputs.date }}
      manifest_sha256: ${{ steps.checkpoint.outputs.manifestSha256 }}
      artifact_id: ${{ steps.backup.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate upstream invocation
        id: trigger
        run: node scripts/frame-shadow-save-handoff.cjs admit

      - name: Verify negative clip prospective A/B
        if: steps.trigger.outputs.allowed == 'true'
        run: |
          node tests/frame-shadow-save-handoff.test.cjs
          node scripts/test-phase3-refresh-contract.js
          node --check js/frame-rise-fall-negative-clip-shadow.js
          node --check scripts/build-frame-rise-fall-negative-clip-snapshots.js
          node --check scripts/build-frame-rise-fall-negative-clip-result-report.js
          node scripts/test-frame-rise-fall-negative-clip-shadow.js
          node scripts/test-frame-rise-fall-negative-clip-snapshots.js
          node scripts/test-frame-rise-fall-negative-clip-result-report.js
          node tests/generated-data-checkpoint.test.cjs
          node tests/main-data-writer-concurrency.test.cjs

      - name: Freeze target date
        if: steps.trigger.outputs.allowed == 'true' && github.event_name != 'pull_request'
        id: target
        env:
          PREDICT_DATE: ${{ inputs.date }}
        run: node -e 'const fs=require("node:fs"), api=require("./scripts/daily-prediction-source-archive"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `date=${api.resolveTargetDate()}\n`);'

      - name: Read exact successful frame save receipt
        if: steps.trigger.outputs.mode == 'automatic'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { execFileSync } = require('node:child_process');
            const handoff = require('./scripts/frame-shadow-save-handoff.cjs');
            try {
              const run = context.payload.workflow_run;
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: run.id, per_page: 100
              });
              const artifact = handoff.selectArtifact(artifacts, run);
              const download = await github.rest.actions.downloadArtifact({
                ...context.repo, artifact_id: artifact.id, archive_format: 'zip'
              });
              const bytes = Buffer.from(download.data);
              handoff.verifyArtifact(bytes, artifact);
              const zip = path.join(process.env.RUNNER_TEMP, 'frame-shadow-save.zip');
              fs.writeFileSync(zip, bytes);
              const receipt = execFileSync('unzip', ['-p', zip, handoff.RECEIPT_FILE], { maxBuffer: 1024 * 1024 });
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP, handoff.RECEIPT_FILE), receipt);
              await core.summary.addRaw(`Verified frame save artifact ${artifact.id}, run ${run.id}/${run.run_attempt}.\n`).write();
            } catch (error) {
              await core.summary.addRaw(`Frame save receipt FAILED: ${error.message}\n`).write();
              throw error;
            }

      - name: Verify current source matches completed frame save
        id: ready
        if: steps.trigger.outputs.allowed == 'true' && github.event_name != 'pull_request'
        env:
          PREDICT_DATE: ${{ steps.target.outputs.date }}
        run: node scripts/frame-shadow-save-handoff.cjs ready "$RUNNER_TEMP/frame-shadow-save.json"

      - name: Capture prospective comparison
        id: checkpoint
        if: steps.ready.outputs.allowed == 'true'
        env:
          PREDICT_DATE: ${{ steps.target.outputs.date }}
        run: |
          node scripts/restore-daily-prediction-source.js
          node scripts/build-frame-rise-fall-negative-clip-snapshots.js
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/build-frame-rise-fall-negative-clip-result-report.js
          fi
          node scripts/prepare-daily-prediction-git-save.js
          node scripts/generated-data-checkpoint.cjs pack negative-clip "$RUNNER_TEMP/negative-clip-checkpoint"

      - name: Preserve generated comparison before publication
        if: steps.ready.outputs.allowed == 'true'
        id: backup
        uses: actions/upload-artifact@v4
        with:
          name: negative-clip-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/negative-clip-checkpoint
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

  publish_comparison:
    needs: verify-and-collect
    if: github.event_name != 'pull_request' && needs.verify-and-collect.result == 'success' && needs.verify-and-collect.outputs.capture_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    outputs:
      saved_sha: ${{ steps.save.outputs.savedSha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require uploaded checkpoint identity
        env:
          ARTIFACT_ID: ${{ needs.verify-and-collect.outputs.artifact_id }}
          MANIFEST_SHA256: ${{ needs.verify-and-collect.outputs.manifest_sha256 }}
        run: test -n "$ARTIFACT_ID" && test -n "$MANIFEST_SHA256"
      - name: Download exact generated comparison
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-and-collect.outputs.artifact_id }}
          path: ${{ runner.temp }}/negative-clip-checkpoint
          merge-multiple: true
      - name: Publish preserved comparison without recomputation
        id: save
        env:
          BASE_SHA: ${{ needs.verify-and-collect.outputs.source_sha }}
          CAPTURE_RUN_ID: ${{ needs.verify-and-collect.outputs.capture_run_id }}
          CAPTURE_RUN_ATTEMPT: ${{ needs.verify-and-collect.outputs.capture_attempt }}
          CHECKPOINT_DATE: ${{ needs.verify-and-collect.outputs.checkpoint_date }}
          ARTIFACT_ID: ${{ needs.verify-and-collect.outputs.artifact_id }}
          MANIFEST_SHA256: ${{ needs.verify-and-collect.outputs.manifest_sha256 }}
        run: node scripts/generated-data-checkpoint.cjs publish negative-clip "$RUNNER_TEMP/negative-clip-checkpoint"
