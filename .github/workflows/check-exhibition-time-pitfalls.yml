name: Check exhibition time pitfalls

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-exhibition-time-pitfalls.cjs'
      - 'scripts/test-exhibition-time-pitfalls.cjs'
      - 'scripts/analysis-input-contract.js'
      - '.github/workflows/check-exhibition-time-pitfalls.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-exhibition-time-pitfalls.cjs
