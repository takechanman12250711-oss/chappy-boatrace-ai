name: Check remaining theory observability
on:
  pull_request:
    paths:
      - "scripts/patch-skill-motor-evidence-storage.js"
      - "scripts/build-motor-course-branch-report.js"
      - "scripts/test-finish-skill-motor-course-observability.js"
      - "scripts/test-skill-motor-course-writer-contract.js"
      - ".github/workflows/check-finish-skill-motor-course-observability.yml"
  push:
    branches: [main]
    paths:
      - "scripts/patch-skill-motor-evidence-storage.js"
      - "scripts/build-motor-course-branch-report.js"
      - ".github/workflows/check-finish-skill-motor-course-observability.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify observability
        run: |
          node --check scripts/patch-skill-motor-evidence-storage.js
          node --check scripts/build-motor-course-branch-report.js
          node scripts/test-finish-skill-motor-course-observability.js
          node scripts/test-skill-motor-course-writer-contract.js
          node scripts/patch-skill-motor-evidence-storage.js --check
      - name: Verify storage and build real reports
        if: github.event_name != 'pull_request'
        run: |
          node scripts/patch-skill-motor-evidence-storage.js
          node --check scripts/collect-predictions.js
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-skill-branch-report.js
          node scripts/build-motor-course-branch-report.js
