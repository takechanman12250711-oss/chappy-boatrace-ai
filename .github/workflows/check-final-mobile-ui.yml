name: Check final mobile UI

on:
  pull_request:
    paths:
      - "index.html"
      - "js/final-mobile-ui.js"
      - "css/final-mobile-ui.css"
      - "js/final-mobile-structure11.js"
      - "css/final-mobile-structure11.css"
      - "js/final-ticket-reason-fix.js"
      - "js/result-void-compat.js"
      - "scripts/test-final-mobile-ui-contract.js"
      - "scripts/test-final-mobile-structure-contract.js"
      - "scripts/test-ticket-specific-reasons.js"
      - ".github/workflows/check-final-mobile-ui.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "js/final-mobile-ui.js"
      - "css/final-mobile-ui.css"
      - "js/final-mobile-structure11.js"
      - "css/final-mobile-structure11.css"
      - "js/final-ticket-reason-fix.js"
      - "js/result-void-compat.js"
      - "scripts/test-final-mobile-ui-contract.js"
      - "scripts/test-final-mobile-structure-contract.js"
      - "scripts/test-ticket-specific-reasons.js"
      - ".github/workflows/check-final-mobile-ui.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          node --check js/final-mobile-ui.js
          node --check js/final-mobile-structure11.js
          node --check js/final-ticket-reason-fix.js
          node --check js/result-void-compat.js
          node --check scripts/test-final-mobile-ui-contract.js
          node --check scripts/test-final-mobile-structure-contract.js
          node --check scripts/test-ticket-specific-reasons.js
      - name: Check final mobile UI contract
        run: node scripts/test-final-mobile-ui-contract.js
      - name: Check final mobile structure contract
        run: node scripts/test-final-mobile-structure-contract.js
      - name: Check ticket-specific reasons
        run: node scripts/test-ticket-specific-reasons.js
