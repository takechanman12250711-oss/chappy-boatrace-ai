name: Check analysis winning method contract
on:
  pull_request:
    paths:
      - 'scripts/analysis-input-contract.js'
      - 'tests/analysis-winning-method-contract.test.cjs'
      - '.github/workflows/check-analysis-winning-method-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/analysis-input-contract.js'
      - 'tests/analysis-winning-method-contract.test.cjs'
      - '.github/workflows/check-analysis-winning-method-contract.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/analysis-winning-method-contract.test.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
