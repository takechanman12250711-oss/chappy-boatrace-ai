name: Set up LINE free navigation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/setup-line-menu.yml'
      - 'scripts/setup-line-menu.cjs'
      - 'scripts/render-line-menu.py'
permissions:
  contents: read
concurrency:
  group: line-navigation-menu
  cancel-in-progress: false
jobs:
  setup:
    if: github.repository == 'takechanman12250711-oss/chappy-boatrace-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify menu safeguards
        run: node --test scripts/setup-line-menu.test.cjs
      - name: Prepare Japanese menu image
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install Pillow==11.3.0
          python scripts/render-line-menu.py /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc /tmp/line-menu.png
      - uses: actions/upload-artifact@v4
        with:
          name: line-navigation-preview
          path: /tmp/line-menu.png
          retention-days: 14
      - name: Set and verify default menu without sending messages
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: node scripts/setup-line-menu.cjs
