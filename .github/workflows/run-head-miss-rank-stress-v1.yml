name: Run head miss rank stress v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/stress-head-miss-ranks-8-11-12-v1.cjs'
      - '.github/workflows/run-head-miss-rank-stress-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run head miss rank stress test
        run: node scripts/stress-head-miss-ranks-8-11-12-v1.cjs > head-miss-rank-stress-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('head-miss-rank-stress-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({eligible:r.eligibleHeadMisses,results:r.results},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: head-miss-rank-stress-v1
          path: head-miss-rank-stress-v1.json
          retention-days: 90
