name: Run head miss rank stress v1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/analyze-head-miss-rank-stress-v1.cjs > head-miss-rank-stress-v1.json
      - uses: actions/upload-artifact@v4
        with:
          name: head-miss-rank-stress-v1
          path: head-miss-rank-stress-v1.json
          retention-days: 90
