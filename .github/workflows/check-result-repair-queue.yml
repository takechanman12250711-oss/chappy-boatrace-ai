name: Check bounded result repair queue

on:
  pull_request:
    paths:
      - "config/result-repair-queue.json"
      - "scripts/repair-queued-results.js"
      - "scripts/test-repair-queued-results.js"
      - "scripts/repair-recent-results.js"
      - "scripts/test-repair-recent-results.js"
      - "scripts/collect-results.js"
      - "scripts/test-collect-results.js"
      - "api/result.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/check-result-repair-queue.yml"
  push:
    branches: [main]
    paths:
      - "config/result-repair-queue.json"
      - "scripts/repair-queued-results.js"
      - "scripts/test-repair-queued-results.js"
      - "scripts/repair-recent-results.js"
      - "scripts/test-repair-recent-results.js"
      - "scripts/collect-results.js"
      - "scripts/test-collect-results.js"
      - "api/result.js"
      - ".github/workflows/collect-results.yml"
      - ".github/workflows/check-result-repair-queue.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-result-repair-queue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/check-result-repair-queue.yml
            .github/workflows/collect-results.yml
            api
            config
            js
            scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check scripts/repair-queued-results.js
      - run: node scripts/test-repair-queued-results.js
      - run: node scripts/test-repair-recent-results.js
      - run: node scripts/test-collect-results.js
