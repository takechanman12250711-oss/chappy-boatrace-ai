name: Temporary miss audit
on:
  pull_request:
    paths:
      - "scripts/tmp-audit-miss-types.js"
      - ".github/workflows/tmp-miss-audit.yml"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/tmp-audit-miss-types.js
