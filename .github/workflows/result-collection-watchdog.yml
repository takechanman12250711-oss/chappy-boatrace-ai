name: Watch result collection

on:
  workflow_run:
    workflows:
      - Collect official race results
    branches: [main]
    types: [completed]
  schedule:
    - cron: "45 * * * *" # GitHub-only check for missing runs; no Work polling
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/result-collection-watchdog.yml"
      - "scripts/result-collection-watchdog.js"
  pull_request:
    paths:
      - ".github/workflows/result-collection-watchdog.yml"
      - ".github/workflows/collect-results.yml"
      - "scripts/result-collection-watchdog.js"
      - "scripts/test-result-collection-watchdog.js"

permissions:
  contents: read

concurrency:
  group: chappy-result-watchdog-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/test-result-collection-watchdog.js

  watchdog:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/result-collection-watchdog.js
          sparse-checkout-cone-mode: false
      - name: Check result data and workflow stages
        uses: actions/github-script@v7
        with:
          script: |
            const { runWatchdog } = require('./scripts/result-collection-watchdog.js');
            await runWatchdog({ github, context, core });
