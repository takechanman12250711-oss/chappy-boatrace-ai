name: Watch result collection

on:
  workflow_run:
    workflows:
      - Collect official race results
    branches: [main]
    types: [completed]
  schedule:
    - cron: "47 * * * *" # GitHub-only check for missing runs; changing the cron also re-registers the existing watchdog schedule
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/result-collection-watchdog.yml"
      - "scripts/result-collection-watchdog.js"
  pull_request:
    paths:
      - ".github/workflows/result-collection-watchdog.yml"
      - ".github/workflows/collect-results.yml"
      - "scripts/result-collection-watchdog.js"
      - "scripts/test-result-collection-watchdog.js"

permissions:
  contents: read

concurrency:
  group: chappy-result-watchdog-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  queue: max
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/test-result-collection-watchdog.js

  watchdog:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/result-collection-watchdog.js
          sparse-checkout-cone-mode: false
      - name: Recover a missed final nightly collection
        uses: actions/github-script@v7
        with:
          script: |
            const HOUR = 60 * 60 * 1000;
            const now = new Date();
            const jst = new Date(now.getTime() + 9 * HOUR);
            const hour = jst.getUTCHours();
            // The same collector already has 23:30 and 00:15 JST runs. Between
            // 01:00 and 06:00, recover yesterday only when both scheduled chances
            // have passed and the official-result artifact is still incomplete.
            if (hour < 1 || hour >= 6) {
              core.info('Missed-run recovery is only needed from 01:00 to 05:59 JST.');
              return;
            }
            const target = new Date(jst);
            target.setUTCDate(target.getUTCDate() - 1);
            const date = target.toISOString().slice(0, 10).replaceAll('-', '');
            const { owner, repo } = context.repo;
            let complete = false;
            try {
              const { data } = await github.rest.repos.getContent({
                owner, repo, ref: 'main', path: `data/results/${date}.json`
              });
              const result = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              complete = result.complete === true && Number(result.pendingRaces || 0) === 0 &&
                Number(result.failedRaces || 0) === 0;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (complete) {
              core.info(`${date}: official results are already complete.`);
              return;
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: 'collect-results.yml', branch: 'main', per_page: 20
            });
            const recent = runs.workflow_runs.find(run =>
              Date.parse(run.created_at) >= now.getTime() - 3 * HOUR
            );
            if (recent) {
              core.info(`${date}: collector run ${recent.id} is recent; skip duplicate recovery dispatch.`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'collect-results.yml', ref: 'main', inputs: { date }
            });
            core.warning(`${date}: scheduled collection was missed; dispatched the existing collector once.`);
      - name: Check result data and workflow stages
        uses: actions/github-script@v7
        with:
          script: |
            const { runWatchdog } = require('./scripts/result-collection-watchdog.js');
            await runWatchdog({ github, context, core });
