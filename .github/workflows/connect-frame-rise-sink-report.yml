name: Connect frame rise and sink report

on:
  push:
    branches: [main]
    paths:
      - "scripts/connect-frame-rise-sink-report.js"
      - ".github/workflows/connect-frame-rise-sink-report.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Connect report
        run: node scripts/connect-frame-rise-sink-report.js
      - name: Commit when changed
        run: |
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Connect frame rise and sink report"
          git pull --rebase origin main
          git push origin main
