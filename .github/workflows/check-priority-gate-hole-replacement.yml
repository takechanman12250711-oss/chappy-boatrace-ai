name: Check priority-gate hole replacement

on:
  pull_request:
    branches: [main]
    paths:
      - "js/boat-identity.js"
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/practical-selection.js"
      - "scripts/test-practical-selection.js"
      - "scripts/test-priority-gate-hole-replacement-regression.js"
      - "data/predictions/*.json"
      - ".github/workflows/check-priority-gate-hole-replacement.yml"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax
        run: |
          node --check js/practical-selection.js
          node --check scripts/test-practical-selection.js
          node --check scripts/test-priority-gate-hole-replacement-regression.js
      - name: Verify selector safety conditions
        run: node scripts/test-practical-selection.js
      - name: Verify fixed three-period and holdout results
        run: node scripts/test-priority-gate-hole-replacement-regression.js
