name: Run one-head 3-4 stability v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-one-head-3-4-stability-v1.cjs'
      - '.github/workflows/run-one-head-3-4-stability-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run 1-3-4 stability audit
        run: node scripts/analyze-one-head-3-4-stability-v1.cjs > one-head-3-4-stability-v1.json
      - name: Validate research boundary and report
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('one-head-3-4-stability-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.summary.tickets<=0) process.exit(1);
          console.log(JSON.stringify({summary:r.summary,chronologicalThirds:r.chronologicalThirds,topVenues:Object.entries(r.venueStats).slice(0,12)},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: one-head-3-4-stability-v1
          path: one-head-3-4-stability-v1.json
          retention-days: 90
