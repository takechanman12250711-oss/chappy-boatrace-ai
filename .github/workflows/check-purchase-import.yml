name: Check purchase import

on:
  pull_request:
    branches: [main]
    paths:
      - 'purchase-import.html'
      - 'js/teleboat-history-parser.js'
      - 'js/purchase-import.js'
      - 'scripts/test-purchase-import.cjs'
      - '.github/workflows/check-purchase-import.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-purchase-import.cjs
