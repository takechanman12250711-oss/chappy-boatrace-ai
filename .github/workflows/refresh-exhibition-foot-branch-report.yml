name: Refresh exhibition foot branch report
on:
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify analyzer
        run: |
          node --check scripts/build-exhibition-foot-branch-report.js
          node scripts/test-exhibition-foot-branch-report.js
          node scripts/test-exhibition-foot-writer-contract.js
      - name: Build read-only real diagnostics
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-exhibition-foot-branch-report.js
