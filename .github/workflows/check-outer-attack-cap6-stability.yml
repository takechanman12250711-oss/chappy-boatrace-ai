name: Check outer attack cap6 stability
on:
  pull_request:
    paths: ['scripts/audit-outer-attack-cap6-stability.cjs','tests/outer-attack-cap6-stability.test.cjs','.github/workflows/check-outer-attack-cap6-stability.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/outer-attack-cap6-stability.test.cjs
      - run: node scripts/audit-outer-attack-cap6-stability.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
