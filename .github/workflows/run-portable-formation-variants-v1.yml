name: Run portable formation variants v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-portable-formation-variants-v1.cjs'
      - '.github/workflows/run-portable-formation-variants-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run portable formation variant audit
        run: node scripts/analyze-portable-formation-variants-v1.cjs > portable-formation-variants-v1.json
      - name: Validate research-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('portable-formation-variants-v1.json', 'utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          if (!Array.isArray(r.ranking) || !Array.isArray(r.results) || !r.baseline) process.exit(1);
          console.log(JSON.stringify({
            diagnostics: r.diagnostics,
            sourceCoverage: r.sourceCoverage,
            baseline: r.baseline,
            ranking: r.ranking,
            gates: Object.fromEntries(r.results.map(x => [x.id, x.gate]))
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: portable-formation-variants-v1
          path: portable-formation-variants-v1.json
          retention-days: 90
