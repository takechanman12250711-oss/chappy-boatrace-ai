name: Check manshu forecast ledger

on:
  pull_request:
    paths:
      - "js/manshu-forecast-ledger.js"
      - "js/storage.js"
      - "js/outer-attack-ticket-shadow.js"
      - "js/outer-attack-ticket-settlement.js"
      - "js/frame-rise-fall-replay-preload.js"
      - "index.html"
      - "scripts/test-manshu-forecast-ledger.js"
      - "tests/outer-attack-ticket-storage-integration.test.cjs"
      - "scripts/test-light-manshu-ticket-board.js"
      - "docs/manshu-forecast-ledger-v1.md"
      - ".github/workflows/check-manshu-forecast-ledger.yml"
  push:
    branches:
      - main
    paths:
      - "js/manshu-forecast-ledger.js"
      - "js/storage.js"
      - "js/outer-attack-ticket-shadow.js"
      - "js/outer-attack-ticket-settlement.js"
      - "js/frame-rise-fall-replay-preload.js"
      - "index.html"
      - "scripts/test-manshu-forecast-ledger.js"
      - "tests/outer-attack-ticket-storage-integration.test.cjs"
      - "scripts/test-light-manshu-ticket-board.js"
      - "docs/manshu-forecast-ledger-v1.md"
      - ".github/workflows/check-manshu-forecast-ledger.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /js/
            /scripts/
            /tests/
            /data/stats/local-water-v2-post-adoption-input-cache.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check syntax and complete historical input
        run: |
          node --check js/manshu-forecast-ledger.js
          node --check js/frame-rise-fall-replay-preload.js
          node --check scripts/test-manshu-forecast-ledger.js
          node --check tests/outer-attack-ticket-storage-integration.test.cjs
          test "$(git hash-object data/stats/local-water-v2-post-adoption-input-cache.json)" = "$(git rev-parse HEAD:data/stats/local-water-v2-post-adoption-input-cache.json)"

      - name: Check separate-account forecast ledger
        run: node scripts/test-manshu-forecast-ledger.js

      - name: Check light manshu board with all historical input
        run: node scripts/test-light-manshu-ticket-board.js

      - name: Check outer attack ticket storage integration
        run: node tests/outer-attack-ticket-storage-integration.test.cjs
