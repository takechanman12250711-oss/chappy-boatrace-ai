name: Check outer attack ticket surface
on:
  pull_request:
    paths: ['scripts/analyze-outer-attack-ticket-surface.cjs','tests/outer-attack-ticket-surface.test.cjs','.github/workflows/check-outer-attack-ticket-surface.yml']
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node tests/outer-attack-ticket-surface.test.cjs
      - run: node scripts/analyze-outer-attack-ticket-surface.cjs
      - run: node scripts/check-charter.js
      - run: git diff --exit-code
