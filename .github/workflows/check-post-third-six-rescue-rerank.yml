name: Check post third-six rescue rerank
on:
  pull_request:
    paths:
      - 'scripts/analyze-post-third-six-rescue.js'
      - '.github/workflows/check-post-third-six-rescue-rerank.yml'
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/analyze-post-third-six-rescue.js
      - run: node scripts/analyze-post-third-six-rescue.js
