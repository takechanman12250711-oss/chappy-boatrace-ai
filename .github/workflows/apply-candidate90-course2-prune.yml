name: Apply candidate90 course2 prune

on:
  push:
    branches:
      - fix/candidate90-prune-actual-course2
    paths:
      - .github/workflows/apply-candidate90-course2-prune.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/candidate90-prune-actual-course2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply approved production change
        run: node scripts/apply-candidate90-course2-prune.js
      - name: Verify syntax
        run: node --check js/practical-selection.js
      - name: Commit approved production change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/practical-selection.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: prune actual-course2 candidate90 promotion"
          git push origin HEAD:fix/candidate90-prune-actual-course2
