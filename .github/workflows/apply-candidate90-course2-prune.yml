name: Apply candidate90 course2 prune

on:
  pull_request:
    paths:
      - "scripts/apply-candidate90-course2-prune.js"
      - "scripts/test-candidate90-regression.js"
      - ".github/workflows/apply-candidate90-course2-prune.yml"
  push:
    branches: [main]
    paths:
      - "scripts/apply-candidate90-course2-prune.js"
      - "scripts/test-candidate90-regression.js"
      - ".github/workflows/apply-candidate90-course2-prune.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Apply approved candidate90 course2 prune
        run: node scripts/apply-candidate90-course2-prune.js
      - name: Verify patched selector
        run: |
          node --check js/practical-selection.js
          node scripts/test-candidate90-regression.js
      - name: Persist approved source on main
        if: github.event_name == 'push'
        run: |
          git add js/practical-selection.js
          if git diff --cached --quiet; then
            echo "candidate90 course2 prune already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: prune actual-course2 candidate90 promotion"
          git pull --rebase origin main
          git push origin main
