name: Update very strong escape snapshot
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-update-very-strong-snapshot.js'
      - '.github/workflows/tmp-update-very-strong-snapshot.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-update-very-strong-snapshot.js
      - run: node scripts/test-evaluated-scenario-consistency.js
      - run: node scripts/test-very-strong-escape-trim-regression.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/test-evaluated-scenario-consistency.js
          git diff --cached --quiet || git commit -m "Update evaluated scenario snapshot for very strong escape trim"
          git push
