name: Check note cloud browser contract

on:
  pull_request:
    paths:
      - 'scripts/note-cloud-browser-contract.js'
      - 'scripts/test-note-cloud-browser-contract.js'
      - '.github/workflows/note-cloud-browser-contract.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-note-cloud-browser-contract.js
