name: Apply venue 24 display 20260806

on:
  push:
    branches:
      - fix/venue-24-display-20260806
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/venue-24-display-20260806' || github.ref_name == 'fix/venue-24-display-20260806'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/venue-24-display-20260806
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply 24 venue display
        run: node scripts/apply-venue-24-display-20260806.js
      - name: Validate
        run: |
          node --check js/stats.js
          grep -q 'venue-24-display-20260806' js/stats.js
          grep -q '"蒲郡"' js/stats.js
          grep -q '0R・データなし' js/stats.js
          grep -q '20260806-venue24-1' js/app-runtime-loader.js
          grep -q '20260806-venue24-1' js/stats-runtime-loader.js
          node scripts/test-load-performance.js
          node scripts/check-charter.js
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/stats.js js/app-runtime-loader.js js/stats-runtime-loader.js index.html scripts/test-load-performance.js
          git commit -m "場別成績を24場固定表示にする"
          git pull --rebase origin fix/venue-24-display-20260806
          git push origin HEAD:fix/venue-24-display-20260806
