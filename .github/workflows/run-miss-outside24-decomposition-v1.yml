name: Run miss outside24 decomposition v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-miss-outside24-decomposition-v1.cjs'
      - '.github/workflows/run-miss-outside24-decomposition-v1.yml'
      - 'data/predictions/**'
      - 'data/results/**'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run outside24 miss decomposition
        run: node scripts/analyze-miss-outside24-decomposition-v1.cjs > miss-outside24-decomposition-v1.json
      - name: Validate exclusive decomposition
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('miss-outside24-decomposition-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.invariants.exclusiveCategorySum!==r.outside24MissCount) process.exit(1);
          console.log(JSON.stringify({settled:r.settledRaceCount,baseline7Miss:r.baseline7MissCount,outside24:r.outside24MissCount,categories:r.categories,categoryRates:r.categoryRates,sameThreeBoatsDifferentOrder:r.sameThreeBoatsDifferentOrder},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: miss-outside24-decomposition-v1
          path: miss-outside24-decomposition-v1.json
          retention-days: 90
