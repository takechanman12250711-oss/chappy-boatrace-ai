name: Check fixed5 pair allocation
on:
  pull_request:
    paths:
      - 'scripts/audit-fixed5-pair-allocation.js'
      - '.github/workflows/check-fixed5-pair-allocation.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/audit-fixed5-pair-allocation.js
      - run: node scripts/audit-fixed5-pair-allocation.js