name: Run counter hole pair forward shadow v1

on:
  workflow_dispatch:
  schedule:
    - cron: '30 15 * * *'
  pull_request:
    paths:
      - 'scripts/analyze-counter-hole-pair-forward-shadow-v1.cjs'
      - '.github/workflows/run-counter-hole-pair-forward-shadow-v1.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run frozen counter-hole pair shadow
        run: node scripts/analyze-counter-hole-pair-forward-shadow-v1.cjs > counter-hole-pair-forward-shadow-v1.json
      - name: Validate shadow-only boundary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('counter-hole-pair-forward-shadow-v1.json', 'utf8'));
          if (r.productionChanged !== false || r.automaticApplication !== false || r.usableForPrediction !== false) process.exit(1);
          if (r.freezeAt !== '2026-09-01T05:05:00Z') process.exit(1);
          if (r.rule?.id !== 'counter-hole-pair-9' || r.rule?.maximumTickets !== 9) process.exit(1);
          console.log(JSON.stringify({ freezeAt: r.freezeAt, diagnostics: r.diagnostics, baseline: r.baseline, shadow: r.shadow, deltaVsBaseline: r.deltaVsBaseline, gates: r.gates }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: counter-hole-pair-forward-shadow-v1
          path: counter-hole-pair-forward-shadow-v1.json
          retention-days: 90
