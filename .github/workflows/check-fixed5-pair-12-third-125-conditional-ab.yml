name: Check fixed5 pair 1-2 third 1-2-5 conditional A/B
on:
  pull_request:
    paths:
      - 'scripts/ab-fixed5-pair-12-third-125-conditional.js'
      - '.github/workflows/check-fixed5-pair-12-third-125-conditional-ab.yml'
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/ab-fixed5-pair-12-third-125-conditional.js
      - run: node scripts/ab-fixed5-pair-12-third-125-conditional.js | tee fixed5-pair-12-third-125-conditional-ab.json
      - uses: actions/upload-artifact@v4
        with:
          name: fixed5-pair-12-third-125-conditional-ab
          path: fixed5-pair-12-third-125-conditional-ab.json