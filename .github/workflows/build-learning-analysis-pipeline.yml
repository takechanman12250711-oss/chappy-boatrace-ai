name: Build learning analysis pipeline

on:
  workflow_run:
    workflows: ["Collect official race results"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  queue: max
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify pipeline
        run: |
          node --check scripts/daily-prediction-source-archive.js
          node --check scripts/restore-daily-prediction-source.js
          node --check scripts/prepare-daily-prediction-git-save.js
          node scripts/test-daily-prediction-source-archive.js
          node --check scripts/build-learning-analysis-pipeline.js
          node --check scripts/analyze-reference-tag-effectiveness.js
          node scripts/test-reference-tag-effectiveness.js
          node scripts/test-local-water-theory-tag.js
          node scripts/test-theory-performance-report.js
          node scripts/test-theory-zero-evidence-diagnostics.js
          node scripts/test-theory-improvement-approval-gate.js
          node scripts/test-theory-evidence-coverage-phase7.js
          node scripts/test-theory-evidence-growth-monitor.js
          node scripts/test-profit-priority-ranking.js
          node scripts/test-theory-profit-review-phase8.js
          node scripts/test-theory-improvement-proposal-phase9.js
          node --check js/theory-candidate-branch-analysis-phase9.js
          node --check scripts/build-theory-candidate-branch-analysis-phase9.js
          node scripts/test-theory-candidate-branch-analysis-phase9.js
          node scripts/test-theory-ab-phase10.js
          node scripts/test-theory-adoption-phase5.js
          node scripts/test-learning-pipeline-gate.js
          node scripts/test-phase6-data-audit.js
      - name: Build in fixed order
        run: |
          node scripts/restore-daily-prediction-source.js --all
          node scripts/build-learning-analysis-pipeline.js
      - name: Verify official analysis cohorts
        run: |
          node scripts/test-improvement-proposal-input-contract.js
          node scripts/test-analysis-input-contract.js
          node scripts/test-theory-candidate-branch-analysis-phase9-artifact.js
      - name: Verify generated safety flags
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const files=['improvement-proposal-phase3.json','theory-performance-report.json','theory-evidence-coverage-phase7.json','theory-evidence-growth-monitor.json','theory-adoption-phase5.json','profit-priority-ranking.json','theory-profit-review-phase8.json','theory-improvement-proposal-phase9.json','theory-candidate-branch-analysis-phase9.json','theory-ab-phase10.json','learning-pipeline-gate-phase4.json','phase6-data-audit.json'];
          for(const file of files){
            const p=`data/stats/${file}`;
            if(!fs.existsSync(p)) throw new Error(`${p} が未生成`);
            const data=JSON.parse(fs.readFileSync(p,'utf8'));
            if(data.automaticApplication!==false || data.usableForPrediction!==false) throw new Error(`${p} の安全フラグ異常`);
          }
          const perf=JSON.parse(fs.readFileSync('data/stats/theory-performance-report.json','utf8'));
          if(perf.version!=='3.4.0' || perf.theoryCount!==12) throw new Error('理論別成績が12理論の最新版ではありません');
          const perfInput=perf.analysisInputDiagnostics||{};
          if(!(perfInput.settledJoinCount>0) || perfInput.officialResultCount!==perfInput.settledJoinCount) throw new Error('理論別成績の公式結果結合数異常');
          if(perf.sampleCount!==perfInput.settledJoinCount*perf.theoryCount || perf.byTheory.some(row=>row.raceCount!==perfInput.settledJoinCount)) throw new Error('理論別成績の母集団数異常');
          const improvement=JSON.parse(fs.readFileSync('data/stats/improvement-proposal-phase3.json','utf8'));
          const pipeline=JSON.parse(fs.readFileSync('data/stats/learning-pipeline-gate-phase4.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('data/stats/phase6-data-audit.json','utf8'));
          for(const [name,data] of [['改善提案',improvement],['学習ゲート',pipeline],['Phase6監査',audit]]){
            if(data.analysisInputContract!==perf.analysisInputContract) throw new Error(`${name}の母集団契約異常`);
            if(data.analysisInputDiagnostics?.settledJoinCount!==perfInput.settledJoinCount || data.settledRaceCount!==perfInput.settledJoinCount) throw new Error(`${name}の母集団数異常`);
          }
          const phase7=JSON.parse(fs.readFileSync('data/stats/theory-evidence-coverage-phase7.json','utf8'));
          if(phase7.theoryCount!==12) throw new Error('Phase7の理論数異常');
          const growth=JSON.parse(fs.readFileSync('data/stats/theory-evidence-growth-monitor.json','utf8'));
          if(!perf.analysisInputContract || phase7.analysisInputContract!==perf.analysisInputContract || growth.analysisInputContract!==perf.analysisInputContract) throw new Error('理論証拠成長監視の母集団契約異常');
          if(growth.baselineRaceCount>growth.currentRaceCount) throw new Error('理論証拠成長監視の基準件数異常');
          const phase8=JSON.parse(fs.readFileSync('data/stats/theory-profit-review-phase8.json','utf8'));
          if(phase8.minimumEvidenceCount!==30 || phase8.oneCandidateOnly!==true) throw new Error('Phase8レビュー条件異常');
          const phase9=JSON.parse(fs.readFileSync('data/stats/theory-improvement-proposal-phase9.json','utf8'));
          if(phase9.proposalCount>1 || phase9.automaticApplication!==false || phase9.usableForPrediction!==false) throw new Error('Phase9安全条件異常');
          if(phase8.status==='review-candidate-ready'){
            if(phase8.candidate?.ready!==true) throw new Error('Phase8候補の準備完了状態が欠落しています');
            if(phase9.status!=='proposal-ready' || phase9.proposalCount!==1 || phase9.proposal?.theoryKey!==phase8.candidate.theoryKey) throw new Error('Phase8候補がPhase9提案へ接続されていません');
          }
          const branch=JSON.parse(fs.readFileSync('data/stats/theory-candidate-branch-analysis-phase9.json','utf8'));
          if(branch.candidateCount>1 || branch.automaticApplication!==false || branch.usableForPrediction!==false) throw new Error('Phase9候補枝分析の安全条件異常');
          if(phase9.proposal?.theoryKey==='frame-rise-fall'){
            if(branch.status!=='candidate-ready-for-human-review' || branch.candidateCount!==1) throw new Error('枠別浮沈率の候補枝分析が未準備です');
            if(branch.candidate?.approved!==false || branch.candidate?.shadowImplementationPresent!==false) throw new Error('未承認候補が実装済みとして扱われています');
            if(branch.candidate?.productionPredictionChanged!==false || branch.candidate?.productionTicketSelectionChanged!==false) throw new Error('候補枝分析が本番予想を変更しています');
            if(branch.retrospectiveLimits?.independentHoldout!==false || branch.retrospectiveLimits?.historicalBPerformanceClaimAllowed!==false) throw new Error('84Rを独立holdoutまたはB成績として誤使用しています');
          }
          const phase10=JSON.parse(fs.readFileSync('data/stats/theory-ab-phase10.json','utf8'));
          if(phase10.automaticApplication!==false || phase10.usableForPrediction!==false || phase10.comparison?.automaticWinnerSelection!==false) throw new Error('Phase10安全条件異常');
          if(phase10.readinessChecks?.allPassed!==true && phase10.candidateB!==null) throw new Error('全承認・実装確認前にBが生成されています');
          if(branch.candidateCount===1 && phase10.comparison?.minimumComparableRaces!==branch.candidate?.prospectiveProtocol?.fixedComparableRaces) throw new Error('候補仕様とPhase10の固定比較件数が不一致です');
          if(branch.candidateCount===1 && phase10.readinessChecks?.validCandidateSpecFingerprint!==true) throw new Error('Phase10の候補仕様fingerprint再計算が不一致です');
          if(branch.candidate?.shadowImplementationPresent===false && (phase10.readinessChecks?.shadowImplementationVerifierPresent!==false || phase10.shadowImplementationPresent!==false)) throw new Error('未実装シャドーを実装済みとして扱っています');
          const used=perf.byTheory.filter(row=>row.evaluatedCount>0);
          if(used.some(row=>row.practicalEvaluatedCount!==row.evaluatedCount)) throw new Error('実戦厳選指標の保存漏れ');
          if(used.some(row=>!Object.hasOwn(row,'skipEvaluatedCount')||!Object.hasOwn(row,'skipDecisionAccuracy'))) throw new Error('見送り判断指標の項目欠損');
          if(used.some(row=>row.skipEvaluatedCount===0 && row.skipDecisionAccuracy!==null)) throw new Error('見送り判断の母数0を0%として誤保存');
          if(audit.status!=='healthy' || audit.issueCount!==0) throw new Error(`Phase6監査異常: ${audit.issueCount}`);
          NODE
          node scripts/check-charter.js
      - name: Save pipeline outputs
        run: |
          node scripts/prepare-daily-prediction-git-save.js --all
          git add data/stats data/analysis/reference-tag-effectiveness.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build unified learning analysis pipeline"
          git pull --rebase origin main
          git push origin main
