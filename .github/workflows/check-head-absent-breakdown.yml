name: Check current head absent breakdown

on:
  pull_request:
    paths:
      - 'scripts/analyze-head-absent-breakdown-v1.cjs'
      - 'scripts/analysis-input-contract.js'
      - 'scripts/analyze-ticket-expansion-7-12-18-24.cjs'
      - '.github/workflows/check-head-absent-breakdown.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Run read-only head absent diagnosis
        run: |
          node --check scripts/analyze-head-absent-breakdown-v1.cjs
          node scripts/analyze-head-absent-breakdown-v1.cjs | tee /tmp/head-absent-breakdown-v1.json
          node -e "const r=require('/tmp/head-absent-breakdown-v1.json'); if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1); console.log('head absent diagnosis only: OK')"
          node scripts/check-charter.js
          git diff --check
