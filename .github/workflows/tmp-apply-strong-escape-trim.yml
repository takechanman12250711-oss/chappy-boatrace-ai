name: Validate strong escape trim patch

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/test-strong-escape-trim-regression.js'
      - '.github/workflows/tmp-apply-strong-escape-trim.yml'
      - 'js/practical-selection.js'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check js/practical-selection.js
          node --check scripts/test-strong-escape-trim-regression.js
      - name: Run focused regressions
        run: |
          node scripts/test-practical-selection.js
          node scripts/test-strong-escape-trim-regression.js
