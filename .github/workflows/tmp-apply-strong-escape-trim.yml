name: Apply strong escape trim patch

on:
  push:
    branches:
      - agent/strong-escape-alternate-trim

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/strong-escape-alternate-trim
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply approved production patch
        run: node scripts/tmp-apply-strong-escape-trim.js
      - name: Check syntax
        run: |
          node --check js/practical-selection.js
          node --check scripts/test-strong-escape-trim-regression.js
      - name: Run focused regressions
        run: |
          node scripts/test-practical-selection.js
          node scripts/test-strong-escape-trim-regression.js
      - name: Commit production patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/practical-selection.js
          if git diff --cached --quiet; then
            echo 'No production patch changes to commit.'
            exit 0
          fi
          git commit -m 'Trim alternate heads for strong escape scenarios'
          git push origin HEAD:agent/strong-escape-alternate-trim
