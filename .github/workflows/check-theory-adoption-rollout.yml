name: Check theory adoption rollout

on:
  pull_request:
    paths:
      - "js/theory-adoption-rollout.js"
      - "data/config/theory-adoption-rollout.json"
      - "scripts/test-theory-adoption-rollout.js"
      - ".github/workflows/check-theory-adoption-rollout.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify staged rollout safeguards
        run: |
          node --check js/theory-adoption-rollout.js
          node scripts/test-theory-adoption-rollout.js
          node scripts/check-charter.js
