name: Check fixed5 third allocation
on:
  pull_request:
    paths:
      - 'scripts/audit-fixed5-third-allocation.js'
      - '.github/workflows/check-fixed5-third-allocation.yml'
jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/audit-fixed5-third-allocation.js
      - run: node scripts/audit-fixed5-third-allocation.js
