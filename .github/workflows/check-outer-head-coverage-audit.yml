name: Check outer head coverage audit
on:
  pull_request:
    paths:
      - "scripts/build-outer-head-coverage-audit.js"
      - "scripts/test-outer-head-coverage-audit.js"
      - ".github/workflows/check-outer-head-coverage-audit.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-outer-head-coverage-audit.js"
      - "data/stats/local-water-outside-head-miss-structure.json"
      - ".github/workflows/check-outer-head-coverage-audit.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          node --check scripts/build-outer-head-coverage-audit.js
          node scripts/test-outer-head-coverage-audit.js
      - name: Build real audit
        if: github.event_name != 'pull_request'
        run: node scripts/build-outer-head-coverage-audit.js
      - name: Save audit
        if: github.event_name != 'pull_request'
        run: |
          git add data/stats/outer-head-coverage-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update outer head coverage audit"
          git pull --rebase origin main
          git push origin main
