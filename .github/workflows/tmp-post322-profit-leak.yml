name: Audit post-322 ticket position profit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-ticket-position-profit.js'
      - '.github/workflows/tmp-post322-profit-leak.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-ticket-position-profit.js
      - uses: actions/upload-artifact@v4
        with:
          name: post322-ticket-position-profit
          path: tmp-analysis-output/post322-ticket-position-profit.json
