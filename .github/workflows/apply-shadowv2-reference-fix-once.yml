name: Apply Shadow V2 reference fix once
on:
  push:
    branches:
      - fix/improvement-shadowv2-diagnostics
    paths:
      - '.github/workflows/apply-shadowv2-reference-fix-once.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Patch builder through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fix/improvement-shadowv2-diagnostics
        run: |
          node <<'NODE'
          const repo = process.env.REPO;
          const branch = process.env.BRANCH;
          const token = process.env.GH_TOKEN;
          const headers = {Authorization:`Bearer ${token}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'};
          async function api(path, options={}) {
            const response = await fetch(`https://api.github.com/repos/${repo}${path}`, {headers, ...options});
            if (!response.ok) throw new Error(`${options.method||'GET'} ${path}: ${response.status} ${await response.text()}`);
            return response.status === 204 ? null : response.json();
          }
          (async()=>{
            const p = 'scripts/build-improvement-review.js';
            const file = await api(`/contents/${p}?ref=${encodeURIComponent(branch)}`);
            const before = Buffer.from(file.content, 'base64').toString('utf8');
            const oldBlock = `    if (\n      !matched ||\n      !scoreMatches(matched)\n    ) {\n      return null;\n    }\n`;
            const newBlock = `    if (!matched) {\n      return null;\n    }\n`;
            if (before.includes(oldBlock)) {
              const after = before.replace(oldBlock, newBlock);
              await api(`/contents/${p}`, {method:'PUT', body:JSON.stringify({message:'Trust durable Shadow V2 snapshot references',content:Buffer.from(after).toString('base64'),sha:file.sha,branch})});
              console.log('builder patched');
            } else if (before.includes(newBlock)) {
              console.log('builder already patched');
            } else {
              throw new Error('expected builder guard not found');
            }
            const wf = '.github/workflows/apply-shadowv2-reference-fix-once.yml';
            const workflow = await api(`/contents/${wf}?ref=${encodeURIComponent(branch)}`);
            await api(`/contents/${wf}`, {method:'DELETE', body:JSON.stringify({message:'Remove one-time Shadow V2 fix workflow',sha:workflow.sha,branch})});
            console.log('one-time workflow removed');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
