name: Check sashi outer role new holdout
on:
  pull_request:
    paths:
      - 'scripts/audit-sashi-outer-role-new-holdout.js'
      - '.github/workflows/check-sashi-outer-role-new-holdout.yml'
  workflow_dispatch:
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/audit-sashi-outer-role-new-holdout.js
      - run: node scripts/audit-sashi-outer-role-new-holdout.js
