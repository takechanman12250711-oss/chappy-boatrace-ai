name: Verify live race selection terminal once

on:
  push:
    branches:
      - fix/live-selection-terminal-20260825
    paths:
      - ".github/workflows/verify-live-race-selection-terminal-once.yml"
      - "index.html"
      - "js/live-race-selection-terminal-guard.js"
      - "js/prediction-conditions.js"
      - "scripts/test-live-race-selection-terminal-webkit.mjs"
      - "scripts/test-prediction-conditions-missing-series.js"
  pull_request:
    paths:
      - ".github/workflows/verify-live-race-selection-terminal-once.yml"
      - "index.html"
      - "js/live-race-selection-terminal-guard.js"
      - "js/prediction-conditions.js"
      - "scripts/test-live-race-selection-terminal-webkit.mjs"
      - "scripts/test-prediction-conditions-missing-series.js"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Node contracts first
        run: |
          node --check js/live-race-selection-terminal-guard.js
          node --check js/prediction-conditions.js
          node scripts/test-live-race-selection-terminal-guard.js
          node scripts/test-prediction-conditions-missing-series.js

      - name: Install Playwright WebKit
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Start branch static server
        run: |
          python3 -m http.server 4173 > /tmp/chappy-live-selection.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/chappy-live-selection.log
          exit 1

      - name: Verify stale-date flow in iPhone WebKit
        id: webkit
        env:
          APP_URL: http://127.0.0.1:4173/
          RACE_PLACE: 桐生
          RACE_NO: "1"
          EXPECTED_DATE: "20260825"
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 180s \
            node scripts/test-live-race-selection-terminal-webkit.mjs \
            > /tmp/live-selection-webkit.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "webkit_exit_status=$status" >> /tmp/live-selection-webkit.log
          exit 0

      - name: Post compact WebKit result to PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          grep -aE \
            '^\[STARTUP\]|^\[FINAL\]|^\[FATAL\]|^\[PAGEERROR\]|^\[CONSOLE ERROR\]|previous-day|date changed back|selection intent mismatch|prediction remained|prediction error|prediction was not rendered|webkit_exit_status' \
            /tmp/live-selection-webkit.log \
            | tail -n 240 \
            > /tmp/live-selection-filtered.txt || true

          node <<'NODE'
          "use strict";
          const fs = require("node:fs");
          let text = fs.readFileSync(
            "/tmp/live-selection-filtered.txt",
            "utf8"
          );
          if (!text.trim()) text = "No matching WebKit result lines.";
          if (text.length > 45000) {
            text = `${text.slice(0, 45000)}\n...truncated`;
          }
          fs.writeFileSync(
            "/tmp/live-selection-comment.md",
            [
              "## Live selection WebKit compact result",
              "",
              "```text",
              text,
              "```"
            ].join("\n"),
            "utf8"
          );
          NODE

          gh pr comment "$PR_URL" \
            --body-file /tmp/live-selection-comment.md

      - name: Enforce WebKit result
        if: steps.webkit.outputs.status != '0'
        run: |
          cat /tmp/live-selection-webkit.log
          exit "${{ steps.webkit.outputs.status }}"

      - name: Upload WebKit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-race-selection-terminal-webkit
          path: |
            live-race-selection-terminal-webkit.png
            /tmp/live-selection-webkit.log
          if-no-files-found: warn
          retention-days: 7
