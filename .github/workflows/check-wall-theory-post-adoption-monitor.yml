name: Check wall theory post-adoption monitor
on:
  pull_request:
    paths:
      - 'scripts/build-wall-theory-post-adoption-monitor.js'
      - '.github/workflows/check-wall-theory-post-adoption-monitor.yml'
jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/build-wall-theory-post-adoption-monitor.js
      - run: node scripts/build-wall-theory-post-adoption-monitor.js
