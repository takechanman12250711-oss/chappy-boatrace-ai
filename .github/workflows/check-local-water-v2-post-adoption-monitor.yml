name: Check Local Water V2 post-adoption monitor

on:
  pull_request:
    branches: [main]
    paths:
      - "js/local-water-v2-tiebreak.js"
      - "scripts/monitor-local-water-v2-post-adoption.js"
      - "scripts/restore-daily-prediction-source.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-local-water-v2-post-adoption-monitor.yml"
  push:
    branches: [main]
    paths:
      - "js/local-water-v2-tiebreak.js"
      - "scripts/monitor-local-water-v2-post-adoption.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - ".github/workflows/check-local-water-v2-post-adoption-monitor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Validate Local Water V2 post-adoption monitor
        run: |
          node --check scripts/monitor-local-water-v2-post-adoption.js
          node scripts/monitor-local-water-v2-post-adoption.js
          git diff --check
      - name: Persist refreshed monitor report
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/local-water-v2-post-adoption-monitor.json
          if git diff --cached --quiet; then
            echo "monitor report unchanged"
            exit 0
          fi
          git commit -m "Refresh Local Water V2 post-adoption monitor"
          git push origin HEAD:main
