name: Check video escape filter

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/video-escape-filter.cjs'
      - 'scripts/build-video-escape-backtest.cjs'
      - 'scripts/test-video-escape-filter.cjs'
      - '.github/workflows/check-video-escape-filter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-video-escape-filter.cjs
