name: Apply source archive idempotency bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-current-cache-test-alignment.yml"

permissions:
  contents: write

concurrency:
  group: source-archive-idempotency-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/source-archive-idempotency-20260823
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preserve original workflow and reset target branch
        run: |
          git show HEAD^:.github/workflows/prepare-current-cache-test-alignment.yml \
            > "$RUNNER_TEMP/prepare-current-cache-test-alignment.yml"
          git switch -C "${TARGET_BRANCH}"

      - name: Apply idempotent archive reuse
        run: |
          python3 <<'PY'
          from pathlib import Path

          archive_path = Path("scripts/daily-prediction-source-archive.js")
          source = archive_path.read_text(encoding="utf-8")

          old_return = '''  return {
            date: targetDate,
            status: "archived",
            sourcePath,'''
          new_return = '''  return {
            date: targetDate,
            status: "archived",
            reused: false,
            sourcePath,'''
          if source.count(old_return) != 1:
              raise SystemExit("archive return marker is not unique")
          source = source.replace(old_return, new_return, 1)

          marker = '''  const archive = zlib.gzipSync(
'''
          reuse = '''  const sourceFingerprint = sha256(raw);
          if (
            fs.existsSync(archivePath) &&
            fs.existsSync(metadataPath)
          ) {
            try {
              const existingMetadata =
                validateMetadata(
                  JSON.parse(
                    fs.readFileSync(
                      metadataPath,
                      "utf8"
                    )
                  ),
                  targetDate
                );
              const existingArchive =
                fs.readFileSync(archivePath);
              if (
                Number(existingMetadata.sourceBytes) ===
                  raw.length &&
                existingMetadata.sourceSha256 ===
                  sourceFingerprint &&
                Number(existingMetadata.archiveBytes) ===
                  existingArchive.length &&
                existingMetadata.archiveSha256 ===
                  sha256(existingArchive)
              ) {
                return {
                  date: targetDate,
                  status: "archived",
                  reused: true,
                  sourcePath,
                  archivePath,
                  metadataPath,
                  sourceBytes: raw.length,
                  archiveBytes:
                    existingArchive.length,
                  metadata: existingMetadata
                };
              }
            } catch {
              // The valid raw source can rebuild stale or broken archive files.
            }
          }

'''
          if source.count(marker) != 1:
              raise SystemExit("compression marker is not unique")
          source = source.replace(marker, reuse + marker, 1)
          archive_path.write_text(source, encoding="utf-8")
          PY

      - name: Add focused idempotency regression
        run: |
          cat > scripts/test-daily-prediction-source-archive-idempotency.js <<'JS'
          "use strict";

          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const zlib = require("node:zlib");
          const archiveApi = require(
            "./daily-prediction-source-archive"
          );

          const root = fs.mkdtempSync(
            path.join(
              os.tmpdir(),
              "chappy-archive-idempotency-"
            )
          );

          try {
            const date = "20260823";
            const sourcePath =
              archiveApi.sourcePathFor(root, date);
            fs.mkdirSync(
              path.dirname(sourcePath),
              { recursive: true }
            );

            const firstPayload = {
              schemaVersion: 3,
              date,
              updatedAt:
                "2026-08-23T08:00:00.000Z",
              evidence: "展開".repeat(3000)
            };
            const firstRaw =
              `${JSON.stringify(firstPayload)}\n`;
            fs.writeFileSync(
              sourcePath,
              firstRaw,
              "utf8"
            );

            const first =
              archiveApi.archivePredictionSource({
                rootDirectory: root,
                date,
                rawSaveLimitBytes: 1024,
                generatedAt:
                  "2026-08-23T08:01:00.000Z"
              });
            assert.equal(first.status, "archived");
            assert.equal(first.reused, false);

            const archivePath =
              archiveApi.archivePathFor(
                root,
                date
              );
            const metadataPath =
              archiveApi.metadataPathFor(
                root,
                date
              );
            const firstArchive =
              fs.readFileSync(archivePath);
            const firstMetadata =
              fs.readFileSync(
                metadataPath,
                "utf8"
              );

            const second =
              archiveApi.archivePredictionSource({
                rootDirectory: root,
                date,
                rawSaveLimitBytes: 1024,
                generatedAt:
                  "2099-01-01T00:00:00.000Z"
              });
            assert.equal(second.status, "archived");
            assert.equal(second.reused, true);
            assert.deepEqual(
              fs.readFileSync(archivePath),
              firstArchive
            );
            assert.equal(
              fs.readFileSync(
                metadataPath,
                "utf8"
              ),
              firstMetadata,
              "same source must not rewrite generatedAt"
            );

            const changedPayload = {
              ...firstPayload,
              updatedAt:
                "2026-08-23T08:30:00.000Z",
              extra: "残し・拾い"
            };
            const changedRaw =
              `${JSON.stringify(changedPayload)}\n`;
            fs.writeFileSync(
              sourcePath,
              changedRaw,
              "utf8"
            );
            const changed =
              archiveApi.archivePredictionSource({
                rootDirectory: root,
                date,
                rawSaveLimitBytes: 1024,
                generatedAt:
                  "2026-08-23T08:31:00.000Z"
              });
            assert.equal(changed.reused, false);
            assert.equal(
              zlib.gunzipSync(
                fs.readFileSync(archivePath)
              ).toString("utf8"),
              changedRaw
            );
            const changedMetadata = JSON.parse(
              fs.readFileSync(
                metadataPath,
                "utf8"
              )
            );
            assert.equal(
              changedMetadata.generatedAt,
              "2026-08-23T08:31:00.000Z"
            );

            fs.writeFileSync(
              archivePath,
              Buffer.from("broken archive")
            );
            const repaired =
              archiveApi.archivePredictionSource({
                rootDirectory: root,
                date,
                rawSaveLimitBytes: 1024,
                generatedAt:
                  "2026-08-23T08:32:00.000Z"
              });
            assert.equal(repaired.reused, false);
            assert.equal(
              zlib.gunzipSync(
                fs.readFileSync(archivePath)
              ).toString("utf8"),
              changedRaw,
              "broken archive must be rebuilt"
            );
          } finally {
            fs.rmSync(
              root,
              {
                recursive: true,
                force: true
              }
            );
          }

          console.log(
            "daily prediction source archive idempotency: ok"
          );
          JS

      - name: Restore original workflow
        run: |
          cp "$RUNNER_TEMP/prepare-current-cache-test-alignment.yml" \
            .github/workflows/prepare-current-cache-test-alignment.yml

      - name: Validate focused regression
        run: |
          node --check scripts/daily-prediction-source-archive.js
          node --check scripts/test-daily-prediction-source-archive-idempotency.js
          node scripts/test-daily-prediction-source-archive-idempotency.js
          node scripts/test-daily-prediction-source-archive.js
          node scripts/test-post-save-source-restore-order.js
          git diff --check

      - name: Commit implementation and restored workflow
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/daily-prediction-source-archive.js
          git add scripts/test-daily-prediction-source-archive-idempotency.js
          git add .github/workflows/prepare-current-cache-test-alignment.yml
          git commit -m "Reuse unchanged daily prediction source archives"
          git push --force origin "HEAD:${TARGET_BRANCH}"
