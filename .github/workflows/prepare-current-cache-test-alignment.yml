name: Apply source archive idempotency bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/prepare-current-cache-test-alignment.yml"

permissions:
  contents: write

concurrency:
  group: source-archive-idempotency-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/source-archive-idempotency-20260823
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preserve original workflow and reset target branch
        run: |
          git show HEAD^:.github/workflows/prepare-current-cache-test-alignment.yml \
            > "$RUNNER_TEMP/prepare-current-cache-test-alignment.yml"
          git switch -C "${TARGET_BRANCH}"

      - name: Apply implementation and focused test
        run: python3 .github/source-archive-idempotency-bootstrap.py

      - name: Restore original workflow and remove bootstrap
        run: |
          cp "$RUNNER_TEMP/prepare-current-cache-test-alignment.yml" \
            .github/workflows/prepare-current-cache-test-alignment.yml
          git rm .github/source-archive-idempotency-bootstrap.py

      - name: Validate focused regression
        run: |
          node --check scripts/daily-prediction-source-archive.js
          node --check scripts/test-daily-prediction-source-archive-idempotency.js
          node scripts/test-daily-prediction-source-archive-idempotency.js
          node scripts/test-daily-prediction-source-archive.js
          node scripts/test-post-save-source-restore-order.js
          git diff --check

      - name: Commit implementation and restored workflow
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/daily-prediction-source-archive.js
          git add scripts/test-daily-prediction-source-archive-idempotency.js
          git add .github/workflows/prepare-current-cache-test-alignment.yml
          git commit -m "Reuse unchanged daily prediction source archives"
          git push --force origin "HEAD:${TARGET_BRANCH}"
