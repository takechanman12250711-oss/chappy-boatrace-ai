name: Build boat data site
# ボートデータ帳（boatdata/）：朝に全レースの公式出走表を集めて、見どころ・モーター順位・
# 24場の特徴を data/site/ に保存する。予想・買い目・チャッピーの保存データは変更しない。
on:
  workflow_dispatch:
  schedule:
    - cron: "23 23 * * *" # 08:23 JST
    - cron: "43 2 * * *"  # 11:43 JST（朝に取れなかったレースの取り直し）
  push:
    branches: [main]
    paths:
      - .github/workflows/build-boat-data-site.yml
      - scripts/data-site/**
      - tests/data-site.test.cjs
permissions:
  contents: write
concurrency:
  group: boat-data-site
  queue: max
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: chappy-main-data-writers
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/data-site.test.cjs
      - name: Today's race cards, lookout and motor ranking
        id: day
        continue-on-error: true
        run: node scripts/data-site/persist.cjs day
      - name: 24 venues (last 3 years of official results)
        run: node scripts/data-site/persist.cjs venues
      - name: Report a failed day collection
        if: steps.day.outcome == 'failure'
        run: |
          echo "::error::Today's race cards could not be collected"
          exit 1
