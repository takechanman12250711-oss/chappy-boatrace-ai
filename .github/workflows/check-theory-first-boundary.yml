name: Check theory-first boundary

on:
  pull_request:
    paths:
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/render.js"
      - "js/odds-insights.js"
      - "scripts/test-theory-first-boundary.js"
      - ".github/workflows/check-theory-first-boundary.yml"
  push:
    branches:
      - main
    paths:
      - "js/ai-core.js"
      - "js/prediction.js"
      - "js/render.js"
      - "js/odds-insights.js"
      - "scripts/test-theory-first-boundary.js"
      - ".github/workflows/check-theory-first-boundary.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check js/ai-core.js
      - run: node --check scripts/test-theory-first-boundary.js
      - run: node scripts/test-theory-first-boundary.js
