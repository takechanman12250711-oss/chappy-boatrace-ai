name: Check scenario likelihood v5 A/B

on:
  pull_request:
    paths:
      - "js/scenario-likelihood-v5-ab.js"
      - "scripts/collect-predictions.js"
      - "scripts/test-scenario-likelihood-v5-ab.js"
      - "scripts/test-v5-shadow-remains-data-only.js"
      - "scripts/test-v5-rejected-but-collecting.js"
      - "scripts/test-v5-collection-restored.js"
      - "scripts/test-upgrade-collection-policy-all.js"
      - "scripts/test-upgrade-collection-state.js"
      - "scripts/test-upgrade-collection-main-principle.js"
      - "scripts/test-upgrade-collection-mode.js"
      - "scripts/test-upgrade-collection-contract.js"
      - "scripts/test-upgrade-collection-final-doc.js"
      - "scripts/test-upgrade-collection-systems-doc.js"
      - "config/upgrade-collection-policy.json"
      - "config/upgrade-collection-policy-version.json"
      - "config/upgrade-collection-systems.json"
      - "config/upgrade-collection-mode.json"
      - "config/upgrade-collection-contract.json"
      - "config/upgrade-data-retention.json"
      - "config/upgrade-collection-owner-intent.json"
      - "config/candidate-decision-scope.json"
      - "config/scenario-likelihood-v5-decision.json"
      - "config/scenario-likelihood-v5-decision-history.json"
      - "docs/upgrade-collection-policy.md"
      - "docs/upgrade-system-flow.md"
      - "docs/upgrade-collection-summary.md"
      - "docs/upgrade-collection-do-not-stop.md"
      - "docs/upgrade-collection-checklist.md"
      - "docs/upgrade-collection-state.md"
      - "docs/upgrade-collection-final.md"
      - "docs/upgrade-collection-systems.md"
      - "docs/decisions/README.md"
      - "docs/decisions/scenario-likelihood-v5-20260815.md"
      - ".github/workflows/scenario-likelihood-v5-ab.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify A/B shadow comparison
        run: |
          node --check js/scenario-likelihood-v5-ab.js
          node --check scripts/collect-predictions.js
          node scripts/test-scenario-likelihood-v5-ab.js
          node scripts/test-scenario-likelihood-v5-storage.js
          node scripts/test-v5-shadow-remains-data-only.js
          node scripts/test-v5-rejected-but-collecting.js
          node scripts/test-v5-collection-restored.js
          node scripts/test-upgrade-collection-policy-all.js
          node scripts/test-upgrade-collection-state.js
          node scripts/test-upgrade-collection-main-principle.js
          node scripts/test-upgrade-collection-mode.js
          node scripts/test-upgrade-collection-contract.js
          node scripts/test-upgrade-collection-final-doc.js
          node scripts/test-upgrade-collection-systems-doc.js
          node scripts/test-upgrade-collection-policy-doc.js
          node scripts/test-v5-decision-history.js
          node scripts/test-v5-upgrade-collection-regression.js
          node scripts/test-v5-decision-doc.js
          node scripts/test-v5-collection-not-closed.js
          node scripts/test-decision-lifecycle-contract.js
          node scripts/test-collect-upgrade-systems-contract.js
          node scripts/test-upgrade-system-flow.js
          node scripts/test-no-upgrade-system-auto-application.js
          node scripts/test-upgrade-collection-policy-version.js
          node scripts/test-upgrade-collection-config-consistency.js
          node scripts/test-upgrade-collection-summary.js
          node scripts/test-upgrade-collection-final-contract.js
          node scripts/test-upgrade-collection-do-not-stop.js
          node scripts/test-upgrade-collection-no-stop-composite.js
          node scripts/test-upgrade-collection-checklist.js
          node scripts/check-charter.js
