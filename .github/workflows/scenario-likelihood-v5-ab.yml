name: Check scenario likelihood v5 A/B

on:
  pull_request:
    paths:
      - "js/scenario-likelihood-v5-ab.js"
      - "scripts/collect-predictions.js"
      - "scripts/test-scenario-likelihood-v5-ab.js"
      - "scripts/test-upgrade-collection-policy.js"
      - "scripts/test-upgrade-collection-policy-doc.js"
      - "scripts/test-v5-decision-is-history-only.js"
      - "scripts/test-v5-decision-history.js"
      - "scripts/test-v5-upgrade-collection-regression.js"
      - "scripts/test-v5-decision-doc.js"
      - "scripts/test-v5-collection-not-closed.js"
      - "scripts/test-upgrade-collection-systems.js"
      - "scripts/test-decision-lifecycle-contract.js"
      - "scripts/test-collect-upgrade-systems-contract.js"
      - "config/upgrade-collection-policy.json"
      - "config/upgrade-collection-systems.json"
      - "config/scenario-likelihood-v5-decision.json"
      - "config/scenario-likelihood-v5-decision-history.json"
      - "docs/upgrade-collection-policy.md"
      - "docs/decisions/README.md"
      - "docs/decisions/scenario-likelihood-v5-20260815.md"
      - ".github/workflows/scenario-likelihood-v5-ab.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify A/B shadow comparison
        run: |
          node --check js/scenario-likelihood-v5-ab.js
          node --check scripts/collect-predictions.js
          node scripts/test-scenario-likelihood-v5-ab.js
          node scripts/test-scenario-likelihood-v5-storage.js
          node scripts/test-upgrade-collection-policy.js
          node scripts/test-upgrade-collection-policy-doc.js
          node scripts/test-v5-decision-is-history-only.js
          node scripts/test-v5-decision-history.js
          node scripts/test-v5-upgrade-collection-regression.js
          node scripts/test-v5-decision-doc.js
          node scripts/test-v5-collection-not-closed.js
          node scripts/test-upgrade-collection-systems.js
          node scripts/test-decision-lifecycle-contract.js
          node scripts/test-collect-upgrade-systems-contract.js
          node scripts/check-charter.js
