name: Check note korogashi draft
on:
  pull_request:
    paths:
      - 'scripts/note-korogashi*'
      - 'scripts/note-marketing-content.js'
      - 'scripts/note-marketing-reports.js'
      - 'scripts/note-exhibition.js'
      - 'scripts/note-marketing-store.js'
      - 'scripts/update-note-marketing.js'
      - 'config/note-korogashi.json'
      - '.github/workflows/update-note-marketing.yml'
      - '.github/workflows/check-note-korogashi.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/note-korogashi*'
      - 'config/note-korogashi.json'
      - '.github/workflows/check-note-korogashi.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            js
            config
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test scripts/note-korogashi*.test.cjs
