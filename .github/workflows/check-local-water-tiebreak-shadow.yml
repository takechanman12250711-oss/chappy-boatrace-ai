name: Check local water tiebreak shadow monitor
on:
  pull_request:
    paths:
      - 'scripts/build-local-water-tiebreak-shadow-monitor.js'
      - '.github/workflows/check-local-water-tiebreak-shadow.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'
jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/restore-daily-prediction-source.js --all
      - run: node --check scripts/build-local-water-tiebreak-shadow-monitor.js
      - run: node scripts/build-local-water-tiebreak-shadow-monitor.js
