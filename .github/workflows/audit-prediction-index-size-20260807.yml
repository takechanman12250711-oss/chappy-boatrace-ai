name: Audit prediction index size 20260807

on:
  push:
    branches:
      - chappy/verification-index-field-audit-20260807
    paths:
      - "scripts/audit-prediction-index-size.js"
      - ".github/workflows/audit-prediction-index-size-20260807.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappy/verification-index-field-audit-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit prediction index size
        run: |
          node --check scripts/audit-prediction-index-size.js
          node scripts/audit-prediction-index-size.js > data/stats/prediction-index-size-audit-20260807.json
      - name: Save audit report
        run: |
          git add data/stats/prediction-index-size-audit-20260807.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record verification prediction size audit"
          git pull --rebase origin chappy/verification-index-field-audit-20260807
          git push origin HEAD:chappy/verification-index-field-audit-20260807
