name: Check weak theory cause breakdown

on:
  pull_request:
    paths:
      - "scripts/build-weak-theory-cause-breakdown.cjs"
      - "tests/build-weak-theory-cause-breakdown.test.cjs"
      - ".github/workflows/check-weak-theory-cause-breakdown.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/build-weak-theory-cause-breakdown.cjs
      - run: node tests/build-weak-theory-cause-breakdown.test.cjs
      - name: Print real-data breakdown
        run: node scripts/build-weak-theory-cause-breakdown.cjs
      - run: node scripts/check-charter.js
