name: Check scenario AI v6 stop decision

on:
  pull_request:
    paths:
      - "js/scenario-ai-v6-stop-decision.js"
      - "scripts/build-scenario-ai-v6-stop-decision.js"
      - "scripts/test-scenario-ai-v6-stop-decision.js"
      - ".github/workflows/check-scenario-ai-v6-stop-decision.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify scenario AI v6 stop decision
        run: |
          node --check js/scenario-ai-v6-stop-decision.js
          node --check scripts/build-scenario-ai-v6-stop-decision.js
          node scripts/test-scenario-ai-v6-stop-decision.js
