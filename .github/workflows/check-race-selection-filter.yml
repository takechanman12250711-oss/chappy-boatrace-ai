name: Check race selection filter

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/race-selection-filter.cjs'
      - 'scripts/build-race-selection-backtest.cjs'
      - 'scripts/test-race-selection-filter.cjs'
      - 'scripts/analysis-input-contract.js'
      - '.github/workflows/check-race-selection-filter.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/test-race-selection-filter.cjs
