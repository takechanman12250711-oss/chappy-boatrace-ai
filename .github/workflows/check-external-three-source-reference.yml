name: Check external three-source reference contract

on:
  pull_request:
    paths:
      - "docs/external-reference-three-source-v1.md"
      - "scripts/external-reference-three-source.cjs"
      - "scripts/test-external-reference-three-source.cjs"
      - ".github/workflows/check-external-three-source-reference.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify safe external reference contract
        run: |
          node --check scripts/external-reference-three-source.cjs
          node --test scripts/test-external-reference-three-source.cjs
          node scripts/check-charter.js
