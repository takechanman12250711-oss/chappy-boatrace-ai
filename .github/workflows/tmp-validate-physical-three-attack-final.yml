name: Validate physical three-attack promotion final
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-validate-physical-three-attack-promotion.js'
      - '.github/workflows/tmp-validate-physical-three-attack-final.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Final 867-race counterfactual
        run: node scripts/tmp-validate-physical-three-attack-promotion.js
      - name: Candidate-90 regression
        id: candidate90
        continue-on-error: true
        run: node scripts/test-candidate90-regression.js
      - name: Strong-escape trimming regression
        id: strongescape
        continue-on-error: true
        run: node scripts/test-strong-escape-trim-regression.js
      - name: Evaluated scenario consistency
        id: scenario
        continue-on-error: true
        run: node scripts/test-evaluated-scenario-consistency.js
      - name: Theory integration
        id: theory
        continue-on-error: true
        run: node scripts/test-theory-integration.js
      - name: Regression status summary
        if: always()
        run: |
          echo "candidate90=${{ steps.candidate90.outcome }}"
          echo "strongescape=${{ steps.strongescape.outcome }}"
          echo "scenario=${{ steps.scenario.outcome }}"
          echo "theory=${{ steps.theory.outcome }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physical-three-attack-final-validation
          path: tmp-analysis-output/physical-three-final-validation.json
