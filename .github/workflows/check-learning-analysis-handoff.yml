name: Check learning analysis handoff

on:
  pull_request:
    paths:
      - "js/theory-profit-review-phase8.js"
      - "js/theory-improvement-proposal-phase9.js"
      - "js/theory-candidate-branch-analysis-phase9.js"
      - "js/theory-ab-phase10.js"
      - "js/theory-ab-phase10-approval.js"
      - "js/frame-rise-fall-shadow-off.js"
      - "js/frame-rise-fall-shadow-off-verifier.js"
      - "config/theory-ab-phase10-approval.json"
      - "scripts/build-theory-profit-review-phase8.js"
      - "scripts/build-theory-improvement-proposal-phase9.js"
      - "scripts/build-theory-candidate-branch-analysis-phase9.js"
      - "scripts/build-theory-ab-phase10.js"
      - "scripts/test-theory-profit-review-phase8.js"
      - "scripts/test-theory-improvement-proposal-phase9.js"
      - "scripts/test-theory-candidate-branch-analysis-phase9.js"
      - "scripts/test-theory-candidate-branch-analysis-phase9-artifact.js"
      - "scripts/test-theory-ab-phase10.js"
      - "scripts/test-theory-ab-phase10-approval.js"
      - "scripts/test-frame-rise-fall-shadow-off.js"
      - "scripts/build-learning-analysis-pipeline.js"
      - "scripts/daily-prediction-source-archive.js"
      - "scripts/restore-daily-prediction-source.js"
      - "scripts/build-phase3-learning-handoff.js"
      - "scripts/test-phase3-learning-handoff.js"
      - "scripts/test-phase3-refresh-contract.js"
      - "config/phase3-candidate-policy-review.json"
      - "data/stats/phase3-learning-handoff.json"
      - "data/stats/theory-candidate-branch-analysis-phase9.json"
      - ".github/workflows/check-learning-analysis-handoff.yml"
      - ".github/workflows/build-learning-analysis-pipeline.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Verify Phase8 to Phase10 handoff
        run: |
          node --check js/theory-profit-review-phase8.js
          node --check js/theory-improvement-proposal-phase9.js
          node --check js/theory-candidate-branch-analysis-phase9.js
          node --check js/theory-ab-phase10.js
          node --check js/theory-ab-phase10-approval.js
          node --check js/frame-rise-fall-shadow-off.js
          node --check js/frame-rise-fall-shadow-off-verifier.js
          node --check scripts/build-theory-profit-review-phase8.js
          node --check scripts/build-theory-improvement-proposal-phase9.js
          node --check scripts/build-theory-candidate-branch-analysis-phase9.js
          node --check scripts/build-theory-ab-phase10.js
          node --check scripts/build-phase3-learning-handoff.js
          node scripts/test-theory-profit-review-phase8.js
          node scripts/test-theory-improvement-proposal-phase9.js
          node scripts/test-theory-candidate-branch-analysis-phase9.js
          node scripts/test-frame-rise-fall-shadow-off.js
          node scripts/test-theory-ab-phase10.js
          node scripts/test-phase3-learning-handoff.js
          node scripts/test-phase3-refresh-contract.js
          node scripts/build-theory-profit-review-phase8.js
          node scripts/build-theory-improvement-proposal-phase9.js
          node scripts/build-theory-candidate-branch-analysis-phase9.js
          node scripts/test-theory-candidate-branch-analysis-phase9-artifact.js
          cp data/stats/theory-candidate-branch-analysis-phase9.json /tmp/phase9-candidate.json
          node scripts/build-theory-candidate-branch-analysis-phase9.js
          cmp /tmp/phase9-candidate.json data/stats/theory-candidate-branch-analysis-phase9.json
          node scripts/test-theory-ab-phase10-approval.js
          node scripts/build-theory-ab-phase10.js
          node - <<'NODE'
          const fs=require('node:fs');
          const phase8=JSON.parse(fs.readFileSync('data/stats/theory-profit-review-phase8.json','utf8'));
          const phase9=JSON.parse(fs.readFileSync('data/stats/theory-improvement-proposal-phase9.json','utf8'));
          const branch=JSON.parse(fs.readFileSync('data/stats/theory-candidate-branch-analysis-phase9.json','utf8'));
          const phase10=JSON.parse(fs.readFileSync('data/stats/theory-ab-phase10.json','utf8'));
          const approval=JSON.parse(fs.readFileSync('config/theory-ab-phase10-approval.json','utf8'));
          if(phase8.status==='review-candidate-ready'){
            if(phase8.candidate?.ready!==true) throw new Error('Phase8候補の準備完了状態が欠落しています');
            if(phase9.status!=='proposal-ready' || phase9.proposalCount!==1 || phase9.proposal?.theoryKey!==phase8.candidate.theoryKey) throw new Error('Phase8候補がPhase9提案へ接続されていません');
          }
          if(phase9.proposalCount===1 && phase9.proposal?.approved!==false) throw new Error('Phase9生成物は承認状態を直接埋め込まない');
          if(phase9.automaticApplication!==false || phase9.usableForPrediction!==false) throw new Error('Phase9の安全条件異常');
          if(branch.candidateCount>1 || branch.automaticApplication!==false || branch.usableForPrediction!==false) throw new Error('Phase9候補枝分析の安全条件異常');
          if(phase9.proposal?.theoryKey==='frame-rise-fall'){
            if(branch.status!=='candidate-ready-for-human-review' || branch.candidateCount!==1) throw new Error('枠別浮沈率の候補枝分析が未準備です');
            if(branch.candidate?.approved!==false) throw new Error('Phase9候補生成物は承認状態を直接埋め込まない');
            if(branch.retrospectiveLimits?.independentHoldout!==false || branch.retrospectiveLimits?.historicalBPerformanceClaimAllowed!==false) throw new Error('過去データを独立holdoutまたはB成績として誤使用しています');
            if(phase10.readinessChecks?.shadowImplementationVerifierPresent!==true) throw new Error('枠別浮沈OFFシャドーverifierがPhase10へ接続されていません');
            if(phase10.readinessChecks?.shadowImplementationVerified!==true || phase10.shadowImplementationPresent!==true) throw new Error('候補仕様とshadow実装の照合に失敗しています');
            if(phase10.readinessChecks?.implementationCandidateSpecMatches!==true) throw new Error('shadow実装がPhase9候補仕様と一致しません');
          }
          if(approval.approved===true){
            if(phase10.status!=='ready-for-shadow-ab') throw new Error('承認済みPhase10がshadow A/B開始可能になっていません');
            if(phase10.readinessChecks?.approvalApplied!==true || phase10.readinessChecks?.allPassed!==true) throw new Error('承認fingerprintまたはcutoff固定が不成立です');
            if(!phase10.candidateB) throw new Error('承認済みcandidateBが生成されていません');
          }
          if(phase10.readinessChecks?.allPassed!==true && phase10.candidateB!==null) throw new Error('全承認・cutoff固定前にBが生成されています');
          if(branch.candidateCount===1 && phase10.comparison?.minimumComparableRaces!==branch.candidate?.prospectiveProtocol?.fixedComparableRaces) throw new Error('候補仕様とPhase10の固定比較件数が不一致です');
          if(phase10.automaticApplication!==false || phase10.usableForPrediction!==false) throw new Error('Phase10の安全条件異常');
          NODE
          node scripts/check-charter.js
