name: Scan formula builder static source

on:
  push:
    branches:
      - fix/live-selection-terminal-20260825
    paths:
      - ".github/workflows/scan-formula-builder-static.yml"
      - "scripts/scan-formula-builder-static.js"
  pull_request:
    paths:
      - ".github/workflows/scan-formula-builder-static.yml"
      - "scripts/scan-formula-builder-static.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/scan-formula-builder-static.js
