name: Recompact recovered index 20260807

on:
  push:
    branches:
      - chappy/recover-results-20260807
    paths:
      - ".github/workflows/recompact-recovered-index-20260807.yml"

permissions:
  contents: write

jobs:
  recompact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chappy/recover-results-20260807
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Recompact and verify
        run: |
          node scripts/test-compact-prediction-index.js
          node scripts/compact-prediction-index.js
          node scripts/test-load-performance.js
          wc -c data/predictions/index.json
      - name: Save compacted index
        run: |
          git add data/predictions/index.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recompact recovered prediction index"
          git pull --rebase origin chappy/recover-results-20260807
          git push origin HEAD:chappy/recover-results-20260807
