name: Check Claude Codex review bridge

on:
  pull_request:
    paths:
      - scripts/claude-codex-review.cjs
      - tests/claude-codex-review.test.cjs
      - scripts/ai-staff-handoff.cjs
      - tests/ai-staff-handoff.test.cjs
      - scripts/check-ai-staff.cjs
      - scripts/check-note-skills.js
      - .claude/agents/**
      - .agents/skills/chappy-ai-staff/**
      - .claude/skills/chappy-ai-staff/**
      - docs/ai-staff-operations.md
      - docs/ai-staff-autonomous.md
      - docs/ai-staff-claude-cloud-task.md
      - docs/ai-staff-claude-cloud-prompt.txt
      - docs/ai-staff-chappy-handoff-prompt.txt
      - staff.html
      - .agents/skills/claude-codex-review/**
      - .claude/skills/claude-codex-review/**
      - docs/claude-codex-development.md
      - docs/claude-codex-auto-handoff.md
      - docs/claude-codex-first-check.md
      - AGENTS.md
      - .github/workflows/check-claude-codex-review.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/claude-codex-review.cjs
            scripts/check-ai-staff.cjs
            scripts/check-note-skills.js
            tests/claude-codex-review.test.cjs
            scripts/ai-staff-handoff.cjs
            tests/ai-staff-handoff.test.cjs
            .agents/skills/
            .claude/skills/
            .claude/agents/
            docs/ai-staff-operations.md
            staff.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the handoff without model calls
        run: |
          node --check scripts/claude-codex-review.cjs
          node --test tests/claude-codex-review.test.cjs
          node --check scripts/ai-staff-handoff.cjs
          node --test tests/ai-staff-handoff.test.cjs
          cmp .agents/skills/claude-codex-review/SKILL.md .claude/skills/claude-codex-review/SKILL.md
      - name: Check AI staff profiles and shared instructions without model calls
        run: |
          node scripts/check-ai-staff.cjs
          node scripts/check-note-skills.js
