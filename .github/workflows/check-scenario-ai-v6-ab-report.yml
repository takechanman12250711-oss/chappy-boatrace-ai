name: Check scenario AI v6 A/B report

on:
  pull_request:
    paths:
      - "js/scenario-ai-v6-shadow.js"
      - "js/scenario-ai-v6-shadow-ab.js"
      - "scripts/build-scenario-ai-v6-ab-report.js"
      - "scripts/test-scenario-ai-v6-ab-report.js"
      - ".github/workflows/check-scenario-ai-v6-ab-report.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify scenario AI v6 A/B report
        run: |
          node --check scripts/build-scenario-ai-v6-ab-report.js
          node scripts/test-scenario-ai-v6-ab-report.js
