name: Run pre-race theory outcomes v1

on:
  workflow_dispatch:
  schedule:
    - cron: '40 15 * * *'
  pull_request:
    paths:
      - 'scripts/analyze-prerace-theory-outcomes-v1.cjs'
      - '.github/workflows/run-prerace-theory-outcomes-v1.yml'
      - 'data/predictions/202609*.json'
      - 'data/results/202609*.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run theory outcome audit
        run: node scripts/analyze-prerace-theory-outcomes-v1.cjs > prerace-theory-outcomes-v1.json
      - name: Validate forward research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('prerace-theory-outcomes-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          console.log(JSON.stringify({eligibleSettledRaceCount:r.eligibleSettledRaceCount,completeSignalRate:r.completeSignalRate,metrics:r.metrics,gates:r.gates},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: prerace-theory-outcomes-v1
          path: prerace-theory-outcomes-v1.json
          retention-days: 90
