name: Audit post320 two-head profit
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-two-head-profit.js'
      - '.github/workflows/tmp-post320-two-head-profit-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/tmp-audit-two-head-profit.js
      - run: node scripts/tmp-audit-two-head-profit.js
