name: Check development approval card

on:
  pull_request:
    branches: [main]
    paths:
      - index.html
      - js/development-approval.js
      - css/development-approval.css
      - scripts/test-development-approval.cjs
      - .github/workflows/check-development-approval.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /js/development-approval.js
            /css/development-approval.css
            /scripts/test-development-approval.cjs
            /.github/workflows/check-development-approval.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check js/development-approval.js
      - run: node --test scripts/test-development-approval.cjs
