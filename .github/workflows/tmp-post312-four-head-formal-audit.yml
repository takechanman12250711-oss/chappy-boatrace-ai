name: Audit post-312 four-head qualification
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tmp-audit-four-head-qualification.js'
      - 'scripts/tmp-simulate-four-head-main-promotion.js'
      - '.github/workflows/tmp-post312-four-head-formal-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-four-head-qualification.js
      - run: node scripts/tmp-simulate-four-head-main-promotion.js
      - uses: actions/upload-artifact@v4
        with:
          name: post312-four-head-formal-audit
          path: tmp-analysis-output/*.json
          if-no-files-found: error
