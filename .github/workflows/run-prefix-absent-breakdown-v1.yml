name: Run prefix absent breakdown v1
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/analyze-prefix-absent-breakdown-v1.cjs'
      - '.github/workflows/run-prefix-absent-breakdown-v1.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run prefix absent breakdown
        run: node scripts/analyze-prefix-absent-breakdown-v1.cjs > prefix-absent-breakdown-v1.json
      - name: Validate research boundary
        run: |
          node - <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync('prefix-absent-breakdown-v1.json','utf8'));
          if(r.productionChanged!==false||r.automaticApplication!==false||r.usableForPrediction!==false) process.exit(1);
          if(r.targetPrefixAbsentCount<=0) process.exit(1);
          console.log(JSON.stringify({target:r.targetPrefixAbsentCount,topPrefixes:r.topExactPrefixes.slice(0,12),winnerLane:r.winnerLane,secondLane:r.secondLane,relative:r.secondRelativeToWinner,signals:r.signals},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: prefix-absent-breakdown-v1
          path: prefix-absent-breakdown-v1.json
          retention-days: 90
