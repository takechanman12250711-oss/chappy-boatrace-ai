name: Check wall-established breakdown

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/build-wall-established-breakdown.js"
      - "scripts/build-wall-boat-branch-profit-report.js"
      - "scripts/restore-daily-prediction-source.js"
      - ".github/workflows/check-wall-established-breakdown.yml"
  push:
    branches: [main]
    paths:
      - "scripts/build-wall-established-breakdown.js"
      - "scripts/build-wall-boat-branch-profit-report.js"
      - "data/predictions/*.json"
      - "data/predictions/*.json.gz"
      - "data/results/*.json"
      - ".github/workflows/check-wall-established-breakdown.yml"
  workflow_run:
    workflows:
      - "Collect automatic race predictions"
      - "Collect official race results"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chappy-main-data-writers
  cancel-in-progress: false

jobs:
  breakdown:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore canonical prediction sources
        run: node scripts/restore-daily-prediction-source.js --all
      - name: Build wall-established breakdown
        run: |
          node --check scripts/build-wall-established-breakdown.js
          node scripts/build-wall-established-breakdown.js
          git diff --check
      - name: Persist wall-established breakdown
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "Chappy BoatRace AI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats/wall-established-breakdown.json
          if git diff --cached --quiet; then
            echo "wall-established breakdown unchanged"
            exit 0
          fi
          git commit -m "Refresh wall-established weakness breakdown"
          git pull --rebase origin main
          git push origin HEAD:main
