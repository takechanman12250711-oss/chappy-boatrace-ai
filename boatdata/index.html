<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f2a44"/>
<meta name="description" content="ボートレースのデータ帳。全レースの出走表・荒れそうなレース・モーター順位・24場の特徴を毎朝更新。買い目・予想は出しません。"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="データ帳"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<title>ボートデータ帳</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#14212f;--sub:#5d6b7a;--line:#e1e6ec;--brand:#0f2a44;--brand2:#1d5f8a;
  --rough:#c2410c;--roughbg:#fff1e6;--mixed:#7a6a00;--mixedbg:#fbf6dc;--solid:#16707a;--solidbg:#e3f4f4;
  --b1:#ffffff;--b2:#1b1b1b;--b3:#d7263d;--b4:#1e5bd8;--b5:#f2c500;--b6:#1f9d55;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
a{color:inherit}
header.top{background:var(--brand);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header.top h1{font-size:19px;margin:0;letter-spacing:.04em}
header.top h1 small{display:block;font-size:11px;font-weight:500;opacity:.75;letter-spacing:.02em}
header.top .date{font-size:13px;opacity:.9;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:4px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
h2{font-size:16px;margin:0 0 10px}
h3{font-size:14px;margin:14px 0 6px}
.note{font-size:12.5px;color:var(--sub);margin:8px 0 0}
.muted{color:var(--sub)}
.notice{background:#fff8e1;border:1px solid #f1df9c;border-radius:10px;padding:10px 12px;font-size:13px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.venue{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.venue b{font-size:17px}
.venue .t{font-size:11.5px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grade{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:2px;background:#e9eef4;color:var(--brand)}
.grade.SG,.grade.PG1{background:#b8860b;color:#fff}.grade.G1{background:#a3243b;color:#fff}.grade.G2{background:#6b3fa0;color:#fff}.grade.G3{background:#1d5f8a;color:#fff}
.counts{margin-top:4px;display:flex;gap:6px;font-size:11.5px}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.rough{background:var(--roughbg);color:var(--rough)}.pill.mixed{background:var(--mixedbg);color:var(--mixed)}.pill.solid{background:var(--solidbg);color:var(--solid)}
.list a.row{display:flex;gap:10px;align-items:flex-start;text-decoration:none;padding:9px 0;border-top:1px solid var(--line)}
.list a.row:first-child{border-top:0}
.row .where{min-width:76px;font-weight:700}
.row .where small{display:block;font-weight:400;color:var(--sub);font-size:11.5px}
.row .why{font-size:13px;color:var(--ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px;text-decoration:none;color:var(--ink);font-family:inherit;min-width:44px;text-align:center}
.tabs a.on,.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tabs a i{display:block;height:3px;border-radius:2px;margin-top:3px}
.tabs a i.rough{background:var(--rough)}.tabs a i.mixed{background:#d4b400}.tabs a i.solid{background:var(--solid)}
.entry{display:grid;grid-template-columns:34px 1fr auto;gap:8px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.entry:first-of-type{border-top:0}
.waku{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;border:1px solid #c9d1da}
.w1{background:var(--b1);color:#111}.w2{background:var(--b2);color:#fff;border-color:#000}.w3{background:var(--b3);color:#fff;border-color:var(--b3)}.w4{background:var(--b4);color:#fff;border-color:var(--b4)}.w5{background:var(--b5);color:#111;border-color:#d8b000}.w6{background:var(--b6);color:#fff;border-color:var(--b6)}
.who b{font-size:15.5px}
.who small{display:block;color:var(--sub);font-size:12px}
.cls{display:inline-block;font-size:11px;font-weight:800;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px}
.cls.A1{background:#a3243b;color:#fff}.cls.A2{background:#e7a0ad;color:#5a0f1e}.cls.B1{background:#dce5ef;color:#1d3a57}.cls.B2{background:#eef1f5;color:#5d6b7a}
.nums{display:grid;grid-template-columns:repeat(3,auto);gap:0 12px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.nums span{display:block;font-size:10.5px;color:var(--sub)}
.nums .hi{color:var(--rough);font-weight:800}
.nums .lo{color:var(--brand2)}
.lookout{border-radius:12px;padding:10px 12px;margin:0 0 10px}
.lookout.rough{background:var(--roughbg)}.lookout.mixed{background:var(--mixedbg)}.lookout.solid{background:var(--solidbg)}
.lookout ul{margin:6px 0 0;padding-left:18px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--sub);font-weight:600}
td.l{text-align:left;white-space:normal}
.bar{height:8px;background:#e9edf2;border-radius:4px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:10px;padding:8px 10px}
.kpi small{display:block;font-size:11px;color:var(--sub)}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.courses{display:grid;grid-template-columns:24px 1fr 46px;gap:5px 8px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.courses .bar{height:12px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:5}
nav.bottom a{flex:1;text-align:center;text-decoration:none;font-size:11px;color:var(--sub);padding:2px 0}
nav.bottom a b{display:block;font-size:18px;line-height:1.2}
nav.bottom a.on{color:var(--brand);font-weight:700}
.vs{font-size:12px;color:var(--sub)}
.big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mark{font-weight:800}.mark.ok{color:var(--solid)}.mark.ng{color:var(--sub)}
.back{display:inline-block;margin:10px 0 0;font-size:14px;color:var(--brand2);text-decoration:none}
footer{text-align:center;color:var(--sub);font-size:11.5px;padding:8px 16px 20px}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>ボートデータ帳<small>数字で読む、今日の水面。</small></h1><span class="date" id="dateLabel"></span></div></header>
<main id="app"><p class="muted" style="margin-top:16px">読み込んでいます…</p></main>
<footer>買い目・予想は出していません。公式の公開データをもとに毎朝自動で更新しています。<br/>舟券の購入は20歳になってから。無理のない範囲で楽しみましょう。</footer>
<nav class="bottom" aria-label="ページ">
<a href="#/" data-nav="home"><b>⌂</b>ホーム</a>
<a href="#/races" data-nav="races"><b>▤</b>出走表</a>
<a href="#/motor" data-nav="motor"><b>⚙</b>モーター</a>
<a href="#/venues" data-nav="venues"><b>◎</b>24場</a>
<a href="#/check" data-nav="check"><b>✓</b>答え合わせ</a>
</nav>
<script>
(function(){
  "use strict";
  var DATA = "../data/site/";
  var LABEL = { rough: "荒れそう", mixed: "混戦", solid: "堅そう" };
  var state = { day: null, venues: null, checks: null, today: "" };
  var app = document.getElementById("app");

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
  function n1(v){ return v == null || v === "" || isNaN(v) ? "-" : Number(v).toFixed(2); }
  function p1(v){ return v == null ? "-" : Number(v).toFixed(1) + "%"; }
  function md(d){ d = String(d || ""); return Number(d.slice(4,6)) + "/" + Number(d.slice(6,8)); }
  function jst(offsetDays){
    var t = new Date(Date.now() + 9 * 3600 * 1000 - (offsetDays || 0) * 86400 * 1000);
    return t.toISOString().slice(0,10).replace(/-/g, "");
  }
  function getJSON(url){ return fetch(url, { cache: "no-cache" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function loadDay(back){
    var d = jst(back);
    return getJSON(DATA + "days/" + d + ".json").catch(function(){ return back < 3 ? loadDay(back + 1) : null; });
  }
  function venueStat(jcd){ return state.venues && state.venues.venues.filter(function(v){ return v.jcd === jcd; })[0]; }
  function pill(label){ return label ? '<span class="pill ' + label + '">' + LABEL[label] + '</span>' : ""; }
  function gradeBadge(g){ return g ? '<span class="grade ' + esc(g) + '">' + esc(g) + '</span>' : ""; }
  function session(v){ return v.session && v.session.day ? v.session.day + "日目" : ""; }

  function staleNotice(){
    if (!state.day) return '<div class="notice">今日の出走表はまだ届いていません（毎朝8時半ごろに更新）。</div>';
    if (state.day.date !== state.today) return '<div class="notice">今日の分はまだ準備中です。' + md(state.day.date) + ' の出走表を表示しています。</div>';
    return "";
  }

  // ---------- ホーム ----------
  function home(){
    var d = state.day, html = staleNotice();
    if (!d) { app.innerHTML = html + venuesBlock(); return; }
    var all = [];
    d.venues.forEach(function(v){ v.races.forEach(function(r){ if (r.lookout) all.push({ v: v, r: r }); }); });
    var rough = all.filter(function(x){ return x.r.lookout.label === "rough"; }).sort(function(a,b){ return b.r.lookout.score - a.r.lookout.score; }).slice(0, 6);
    var solid = all.filter(function(x){ return x.r.lookout.label === "solid"; }).sort(function(a,b){ return a.r.lookout.score - b.r.lookout.score; }).slice(0, 6);
    html += '<section class="card"><h2>今日の開催 ' + d.venues.length + '場</h2><div class="grid">' +
      d.venues.map(function(v){
        var c = { rough: 0, solid: 0 };
        v.races.forEach(function(r){ if (r.lookout && c[r.lookout.label] != null) c[r.lookout.label]++; });
        return '<a class="venue" href="#/v/' + v.jcd + '"><b>' + esc(v.place) + '</b>' + gradeBadge(v.grade) +
          '<span class="t">' + esc([session(v), v.title].filter(Boolean).join("・")) + '</span>' +
          '<div class="counts"><span class="pill rough">荒 ' + c.rough + '</span><span class="pill solid">堅 ' + c.solid + '</span></div></a>';
      }).join("") + '</div></section>';
    function list(items, title, lead){
      return '<section class="card"><h2>' + title + '</h2><p class="note" style="margin:-4px 0 6px">' + lead + '</p><div class="list">' +
        (items.length ? items.map(function(x){
          return '<a class="row" href="#/v/' + x.v.jcd + '/' + x.r.raceNo + '"><span class="where">' + esc(x.v.place) + ' ' + x.r.raceNo + 'R<small>' + esc(x.r.deadline || "") + ' 締切</small></span>' +
            '<span class="why">' + pill(x.r.lookout.label) + ' ' + esc(x.r.lookout.reasons.join("、") || "") + '</span></a>';
        }).join("") : '<p class="muted">該当なし</p>') + '</div></section>';
    }
    html += list(rough, "🌊 今日の荒れそうなレース", "出走表の数字から「荒れそう」と出た上位です。");
    html += list(solid, "⚓ 今日の堅そうなレース", "インの選手が抜けていて、堅く決まりやすい形です。");
    html += checkSummary(true);
    app.innerHTML = html;
  }

  // ---------- 場・出走表 ----------
  function racesIndex(){
    var d = state.day;
    if (!d) { app.innerHTML = staleNotice(); return; }
    app.innerHTML = staleNotice() + '<section class="card"><h2>出走表を見る場をえらぶ</h2><div class="grid">' +
      d.venues.map(function(v){ return '<a class="venue" href="#/v/' + v.jcd + '"><b>' + esc(v.place) + '</b>' + gradeBadge(v.grade) + '<span class="t">' + esc(v.title || "") + '</span></a>'; }).join("") +
      '</div></section>';
  }
  function entryRow(b, race){
    var best = function(key){ var vals = race.boats.map(function(x){ return x[key]; }).filter(function(x){ return x != null; }); return vals.length ? Math.max.apply(null, vals) : null; };
    var worst = function(key){ var vals = race.boats.map(function(x){ return x[key]; }).filter(function(x){ return x != null; }); return vals.length ? Math.min.apply(null, vals) : null; };
    function cell(key, label, fmt){
      var v = b[key], cls = v != null && v === best(key) ? "hi" : v != null && v === worst(key) ? "lo" : "";
      return '<div><span>' + label + '</span><b class="' + cls + '">' + (fmt ? fmt(v) : v == null ? "-" : v) + '</b></div>';
    }
    var fl = (b.f ? "F" + b.f + " " : "") + (b.l ? "L" + b.l : "");
    return '<div class="entry"><div class="waku w' + b.boat + '">' + b.boat + '</div>' +
      '<div class="who"><span class="cls ' + esc(b.cls) + '">' + esc(b.cls || "-") + '</span><b>' + esc(b.name) + '</b>' +
      '<small>' + esc([b.branch, b.age ? b.age + "歳" : "", "平均ST " + (b.avgST != null ? Number(b.avgST).toFixed(2) : "-"), fl].filter(Boolean).join("・")) + '</small></div>' +
      '<div class="nums">' + cell("nw", "全国勝率", n1) + cell("lw", "当地勝率", n1) + cell("m2", "M2連率" + (b.motorNo ? "(" + b.motorNo + ")" : ""), function(v){ return v == null ? "-" : Number(v).toFixed(1); }) + '</div></div>';
  }
  function venuePage(jcd, rno){
    var d = state.day;
    var v = d && d.venues.filter(function(x){ return x.jcd === jcd; })[0];
    var vs = venueStat(jcd);
    if (!v) { app.innerHTML = staleNotice() + '<p>この場は今日は開催していません。</p>' + (vs ? venueDetail(vs) : ""); return; }
    var race = v.races.filter(function(r){ return r.raceNo === rno; })[0] || v.races.filter(function(r){ return r.boats.length; })[0] || v.races[0];
    var html = staleNotice() + '<section class="card"><h2>' + esc(v.place) + gradeBadge(v.grade) + ' <span class="muted" style="font-size:13px;font-weight:400">' + esc([session(v), v.title].filter(Boolean).join("・")) + '</span></h2>' +
      (vs ? '<div class="kpis"><div class="kpi"><small>イン1着率</small><b>' + p1(vs.inWinRate) + '</b></div><div class="kpi"><small>荒れ率</small><b>' + p1(vs.roughRate) + '</b></div><div class="kpi"><small>万舟率</small><b>' + p1(vs.manshuRate) + '</b></div></div><p class="note">過去3年の' + esc(v.place) + '。<a href="#/venue/' + jcd + '">場の特徴をくわしく →</a></p>' : "") +
      '</section>';
    html += '<nav class="tabs" aria-label="レース">' + v.races.map(function(r){
      return '<a href="#/v/' + jcd + '/' + r.raceNo + '" class="' + (r === race ? "on" : "") + '">' + r.raceNo + 'R' + (r.lookout ? '<i class="' + r.lookout.label + '"></i>' : '<i></i>') + '</a>';
    }).join("") + '</nav>';
    html += '<section class="card"><h2>' + race.raceNo + 'R ' + esc(race.title || "") + ' <span class="muted" style="font-size:13px;font-weight:400">' + esc(race.deadline ? race.deadline + " 締切" : "") + '</span></h2>';
    if (!race.boats.length) html += '<p class="muted">このレースの出走表は取得できませんでした。</p>';
    else {
      if (race.lookout) html += '<div class="lookout ' + race.lookout.label + '">' + pill(race.lookout.label) + ' <span class="muted" style="font-size:12px">荒れやすさ ' + race.lookout.score + '</span>' +
        (race.lookout.reasons.length ? '<ul>' + race.lookout.reasons.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul>' : "") + '</div>';
      html += race.boats.map(function(b){ return entryRow(b, race); }).join("");
      html += '<p class="note">赤い数字はそのレースでいちばん高い値、青はいちばん低い値。M2連率はモーター2連率（カッコ内はモーター番号）。進入・展示・チルトは朝の時点では入っていません。</p>';
    }
    html += '</section>';
    html += motorTable(v, 10, "この場のモーター上位10");
    app.innerHTML = html;
  }

  // ---------- モーター ----------
  function motorTable(v, limit, title){
    if (!v.motors || !v.motors.length) return "";
    var rows = limit ? v.motors.slice(0, limit) : v.motors;
    return '<section class="card"><h2>' + esc(title) + '</h2><div style="overflow-x:auto"><table><thead><tr><th>順位</th><th>モーター</th><th>2連率</th><th>3連率</th><th>今日の選手</th></tr></thead><tbody>' +
      rows.map(function(m){
        var who = m.races.map(function(r){ return r.raceNo + "R " + r.boat + "号艇 " + r.name; }).join("<br/>");
        return '<tr><td>' + m.rank + '</td><td>' + m.motorNo + '号機</td><td>' + (m.m2 != null ? Number(m.m2).toFixed(1) + "%" : "-") + '</td><td>' + (m.m3 != null ? Number(m.m3).toFixed(1) + "%" : "-") + '</td><td class="l">' + esc(who).replace(/&lt;br\/&gt;/g, "<br/>") + '</td></tr>';
      }).join("") + '</tbody></table></div><p class="note">今日この場で使われるモーターだけを、公式の2連率の高い順に並べています。</p></section>';
  }
  function motorPage(jcd){
    var d = state.day;
    if (!d) { app.innerHTML = staleNotice(); return; }
    var v = d.venues.filter(function(x){ return x.jcd === jcd; })[0] || d.venues[0];
    app.innerHTML = staleNotice() + '<section class="card"><h2>⚙ モーター順位</h2><nav class="tabs">' +
      d.venues.map(function(x){ return '<a href="#/motor/' + x.jcd + '" class="' + (x === v ? "on" : "") + '">' + esc(x.place) + '</a>'; }).join("") +
      '</nav></section>' + motorTable(v, 0, v.place + "（" + v.motors.length + "基）");
  }

  // ---------- 24場 ----------
  function venuesBlock(){
    var V = state.venues;
    if (!V) return "";
    var list = V.venues.slice().sort(function(a,b){ return b.inWinRate - a.inWinRate; });
    return '<section class="card"><h2>◎ 24場の特徴</h2><p class="note" style="margin:-4px 0 8px">' + md(V.period.from) + '〜' + md(V.period.to) + '（過去3年・' + V.all.races.toLocaleString("ja-JP") + 'レース）。全場平均：イン1着 ' + p1(V.all.inWinRate) + '・荒れ率 ' + p1(V.all.roughRate) + '・万舟 ' + p1(V.all.manshuRate) + '</p>' +
      '<div style="overflow-x:auto"><table><thead><tr><th>場</th><th>イン1着</th><th></th><th>荒れ率</th><th>万舟</th></tr></thead><tbody>' +
      list.map(function(v){
        return '<tr><td><a href="#/venue/' + v.jcd + '">' + esc(v.place) + '</a> <span class="muted" style="font-size:11px">' + esc(v.water) + '</span></td><td>' + p1(v.inWinRate) + '</td><td style="width:30%"><div class="bar"><i style="width:' + v.inWinRate + '%"></i></div></td><td>' + p1(v.roughRate) + '</td><td>' + p1(v.manshuRate) + '</td></tr>';
      }).join("") + '</tbody></table></div><p class="note">荒れ率＝3連単5,000円以上、万舟＝10,000円以上。場名をタップすると、コース別の1着率と決まり手が見られます。</p></section>';
  }
  function venueDetail(v){
    var A = state.venues.all;
    var trend = v.recentInWinRate != null ? (v.recentInWinRate - v.inWinRate) : null;
    return '<section class="card"><h2>' + esc(v.place) + ' <span class="muted" style="font-size:13px;font-weight:400">' + esc(v.water) + '・過去3年 ' + v.races.toLocaleString("ja-JP") + 'R</span></h2>' +
      '<div class="kpis"><div class="kpi"><small>イン1着率</small><b>' + p1(v.inWinRate) + '</b></div><div class="kpi"><small>荒れ率</small><b>' + p1(v.roughRate) + '</b></div><div class="kpi"><small>3連単の中央値</small><b>' + (v.medianPayout ? v.medianPayout.toLocaleString("ja-JP") + "円" : "-") + '</b></div></div>' +
      (trend != null ? '<p class="note">直近90日のイン1着率は ' + p1(v.recentInWinRate) + '（' + (trend >= 0 ? "+" : "") + trend.toFixed(1) + 'ポイント）。</p>' : "") +
      '<h3>コース別の1着率</h3><div class="courses">' + v.courseWinRates.map(function(r, i){
        return '<span class="waku w' + (i + 1) + '" style="width:24px;height:24px;font-size:13px">' + (i + 1) + '</span><div class="bar"><i style="width:' + Math.min(100, r) + '%"></i></div><span>' + p1(r) + '</span>';
      }).join("") + '</div><p class="note">全場平均：' + A.courseWinRates.map(function(r, i){ return (i + 1) + "コース " + p1(r); }).join("・") + '</p>' +
      '<h3>1着の決まり手</h3><table><tbody>' + v.methods.map(function(m){
        var avg = A.methods.filter(function(x){ return x.method === m.method; })[0];
        return '<tr><td>' + esc(m.method) + '</td><td style="width:45%"><div class="bar"><i style="width:' + m.share + '%"></i></div></td><td>' + p1(m.share) + '</td><td class="muted">平均 ' + p1(avg && avg.share) + '</td></tr>';
      }).join("") + '</tbody></table></section>';
  }
  function venuesPage(jcd){
    if (!state.venues) { app.innerHTML = '<p>24場のデータを準備中です。</p>'; return; }
    var v = jcd && venueStat(jcd);
    app.innerHTML = v ? '<a class="back" href="#/venues">← 24場の一覧へ</a>' + venueDetail(v) + (state.day && state.day.venues.some(function(x){ return x.jcd === jcd; }) ? '<p><a class="back" href="#/v/' + jcd + '">今日の' + esc(v.place) + 'の出走表へ →</a></p>' : "") : venuesBlock();
  }


  // ---------- 答え合わせ ----------
  function checkBoxes(c){
    return '<div class="grid" style="grid-template-columns:1fr 1fr">' +
      '<div class="kpi"><small>「荒れそう」と見た ' + c.rough.races + ' 本</small><span class="big">' + p1(c.rough.rate) + '</span> が荒れた<div class="vs">ふだんは ' + p1(c.baseRoughRate) + '</div></div>' +
      '<div class="kpi"><small>「堅そう」と見た ' + c.solid.races + ' 本</small><span class="big">' + p1(c.solid.rate) + '</span> が堅く決着<div class="vs">ふだんは ' + p1(c.baseSolidRate) + '</div></div></div>';
  }
  function checkSummary(onHome){
    var C = state.checks;
    var lead = '「荒れそう」は3連単が5,000円以上になりやすい形、「堅そう」はその逆です。朝に保存した見立てを、夜に公式の払戻で採点しています（外れも全部数えます）。';
    if (!C) return '<section class="card"><h2>✓ 答え合わせ</h2><p class="note" style="margin:0">' + lead + '最初の答え合わせは、出走表がそろった日の夜に出ます。参考までに、同じ式をチャッピーの1,742レースで試したときは、「荒れる」と見たレースの41%が荒れました（ふだんは30%）。</p></section>';
    var L = C.days[0];
    return '<section class="card"><h2>✓ ' + (onHome ? md(L.date) + 'の答え合わせ' : 'これまでの答え合わせ') + '</h2>' +
      checkBoxes(onHome ? L : C.cumulative) +
      '<p class="note">' + (onHome ? 'これまでの合計：「荒れそう」' + p1(C.cumulative.rough.rate) + '・「堅そう」' + p1(C.cumulative.solid.rate) + '（' + C.cumulative.races.toLocaleString("ja-JP") + 'レース）。<a href="#/check">くわしく →</a>' : lead + '荒れそうと見ても、半分以上は荒れません。あくまで目安です。') + '</p></section>';
  }
  function checkPage(){
    var C = state.checks;
    if (!C) { app.innerHTML = checkSummary(false); return; }
    var html = checkSummary(false);
    html += '<section class="card"><h2>日ごとの答え合わせ</h2><div style="overflow-x:auto"><table><thead><tr><th>日付</th><th>荒れそう</th><th>当たり</th><th>堅そう</th><th>当たり</th></tr></thead><tbody>' +
      C.days.slice(0, 30).map(function(d){ return '<tr><td>' + md(d.date) + '</td><td>' + d.rough.races + '本</td><td>' + p1(d.rough.rate) + '</td><td>' + d.solid.races + '本</td><td>' + p1(d.solid.rate) + '</td></tr>'; }).join("") +
      '</tbody></table></div></section>';
    var L = C.latest;
    if (L) {
      var rows = L.races.filter(function(r){ return r.correct !== null; }).sort(function(a, b){ return a.jcd.localeCompare(b.jcd) || a.raceNo - b.raceNo; });
      html += '<section class="card"><h2>' + md(L.date) + ' のレースごとの結果</h2><div style="overflow-x:auto"><table><thead><tr><th>レース</th><th>見立て</th><th>3連単</th><th>払戻</th><th></th></tr></thead><tbody>' +
        rows.map(function(r){ return '<tr><td>' + esc(r.place) + ' ' + r.raceNo + 'R</td><td>' + pill(r.label) + '</td><td>' + esc(r.combination) + '</td><td>' + r.payout.toLocaleString("ja-JP") + '円</td><td class="mark ' + (r.correct ? "ok" : "ng") + '">' + (r.correct ? "◯" : "×") + '</td></tr>'; }).join("") +
        '</tbody></table></div><p class="note">「混戦」と見たレースは、どちらとも言っていないので採点に入れていません。</p></section>';
    }
    app.innerHTML = html;
  }

  // ---------- 画面の切り替え ----------
  function route(){
    var h = location.hash.replace(/^#\/?/, "").split("/");
    var nav = "home";
    if (h[0] === "v") { nav = "races"; venuePage(h[1], Number(h[2]) || 0); }
    else if (h[0] === "races") { nav = "races"; racesIndex(); }
    else if (h[0] === "motor") { nav = "motor"; motorPage(h[1]); }
    else if (h[0] === "venues" || h[0] === "venue") { nav = "venues"; venuesPage(h[1]); }
    else if (h[0] === "check") { nav = "check"; checkPage(); }
    else home();
    document.querySelectorAll("[data-nav]").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-nav") === nav); });
    window.scrollTo(0, 0);
  }
  state.today = jst(0);
  document.getElementById("dateLabel").textContent = md(state.today) + "（" + "日月火水木金土"[new Date(Date.now() + 9 * 3600 * 1000).getUTCDay()] + "）";
  Promise.all([loadDay(0), getJSON(DATA + "venues.json").catch(function(){ return null; }), getJSON(DATA + "checks.json").catch(function(){ return null; })]).then(function(res){
    state.day = res[0]; state.venues = res[1]; state.checks = res[2];
    window.addEventListener("hashchange", route);
    route();
  });
})();
</script>
</body>
</html>
